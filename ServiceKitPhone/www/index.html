<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#071017">
<title>ServiceKit Phone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">
<div id="app">
  <header class="top">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 22l6-11 3.5 6 2.5-3.5L24 22"/></svg></span>
    <span class="title">ServiceKit</span>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">nincs kapcsolat</span></span>
    <button class="icon-btn" id="langBtn" type="button"></button>
  </header>

  <main id="main">
    <section class="view" id="view-connect"></section>
    <section class="view" id="view-control"></section>
    <section class="view" id="view-cmd"></section>
    <section class="view" id="view-help"></section>
    <section class="view" id="view-deploy"></section>
  </main>

  <nav class="tabs" id="tabs"></nav>
  <div class="toast" id="toast"></div>
  <div class="sheet" id="sheet"></div>
</div>
<script src="data/sugo.js"></script>
<script src="data/commands.js"></script>
<script src="data/playbooks.js"></script>
<script src="cmdview.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }</script>
</body>
</html>
