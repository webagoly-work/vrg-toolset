<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'">
<title>VRG Irányítópult</title>
<link rel="stylesheet" href="../../shared/melyviz.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--mv-bg); color: var(--mv-text); }
  body { display: flex; flex-direction: column; font: 13px var(--mv-sans, sans-serif); }
  [data-role="wbar"] { display: flex; align-items: stretch; flex: 0 0 30px; height: 30px; -webkit-app-region: drag; user-select: none; border-bottom: 1px solid var(--mv-line); }
  [data-role="wbar"] .wt { padding: 0 12px; display: flex; align-items: center; font: 11px var(--mv-mono); letter-spacing: .14em; color: var(--mv-dim); text-transform: uppercase; }
  [data-role="wbar"] .sp { flex: 1; }
  [data-role="wbar"] button { -webkit-app-region: no-drag; background: none; border: 0; border-left: 1px solid var(--mv-line); color: var(--mv-dim); width: 42px; cursor: pointer; }
  [data-role="wbar"] button:hover { background: var(--mv-raised); color: var(--mv-text); }
  #root { flex: 1 1 0; min-height: 0; display: flex; }
  .split { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; }
  .split[data-dir="h"] { flex-direction: row; }
  .split[data-dir="v"] { flex-direction: column; }
  .cell { min-width: 0; min-height: 0; display: flex; }
  .cell > * { flex: 1 1 0; min-width: 0; min-height: 0; }
  [data-role="handle"] { flex: 0 0 5px; background: var(--mv-line); touch-action: none; }
  .split[data-dir="h"] > [data-role="handle"] { cursor: col-resize; }
  .split[data-dir="v"] > [data-role="handle"] { cursor: row-resize; }
  [data-role="group"] { display: flex; flex-direction: column; border: 1px solid var(--mv-line); }
  [data-role="group"][data-focus="1"] { border-color: var(--mv-accent); }
  [data-role="tabs"] { display: flex; flex: 0 0 auto; align-items: stretch; border-bottom: 1px solid var(--mv-line); }
  [data-role="tabs"] .tab { display: flex; align-items: stretch; border-right: 1px solid var(--mv-line); }
  [data-role="tabs"] .tab[data-active="1"] { background: var(--mv-raised); }
  [data-role="tabs"] button { background: none; border: 0; color: var(--mv-dim); padding: 4px 8px; cursor: pointer; font: inherit; }
  [data-role="tabs"] .tab[data-active="1"] button.t { color: var(--mv-text); }
  [data-role="tabs"] .sp { flex: 1; }
  [data-role="tabs"] .drophint { display: none; padding: 4px 8px; color: var(--mv-faint); }
  body[data-dragging="1"] [data-role="tabs"] .drophint { display: block; }
  [data-role="body"] { position: relative; flex: 1 1 0; min-height: 0; overflow: auto; }
  [data-role="body"] [data-pane] { height: 100%; box-sizing: border-box; }
  [data-pane][hidden] { display: none; }
  [data-pane][data-kind="empty"] { padding: 12px; }
  [data-pane][data-kind="empty"] button { display: block; margin: 4px 0; cursor: pointer; }
</style>
</head>
<body>
<header data-role="wbar" id="wbar">
  <div class="wt">VRG Irányítópult</div>
  <div class="sp"></div>
  <button data-w="min" title="Kis méret / Minimize">&#8211;</button>
  <button data-w="max" title="Nagy méret / Maximize">&#9633;</button>
  <button data-w="close" class="x" title="Bezár / Close">&#10005;</button>
</header>
<main id="root" data-role="root"></main>
<script src="../shell/lib/layout.js"></script>
<script src="panes/empty.js"></script>
<script src="layout.js"></script>
<script src="frame.js"></script>
</body>
</html>
