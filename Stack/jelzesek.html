<!doctype html>
<html lang="hu" class="vk" data-vk-theme="melyviz" data-vk-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRG Jelzéstábla</title>
<!-- Jelzéstábla (signal board): the J layer's page (S14's "a trouble map", lib/meta.js). One column per pillar, the
     worst first; in each, its signals red, amber, info, each with the one thing that clears it. A column for the signals
     tied to no pillar; a strip of the ones that went away in the last 14 days. Selecting a card lights what it warns on
     every other open Stack page (lib/live.js), and the Viewer's ⚠ lights all of them. Data: out/signals-data.js
     (lib/signalboard.js, every build). Works from file:// and serve.js. -->
<link rel="stylesheet" href="../shared/melyviz.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/fonts/fonts.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/base.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/density.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/theme-melyviz.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/theme-light.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/components/base.css">
<style>
  :root { --bg: var(--vk-bg, #0a141c); --s1: var(--vk-surface-1, #121c24); --s2: var(--vk-surface-2, #17232c);
    --ln: var(--vk-line, rgba(232,240,246,.15)); --ln2: var(--vk-line-strong, rgba(232,240,246,.34));
    --tx: var(--vk-text, #e8f0f6); --mu: var(--vk-text-muted, #a6afb7); --fa: var(--vk-text-faint, #6f7880);
    --acc: var(--vk-accent, #93d3e6); --ok: var(--vk-ok, #8bcca1);
    --red: var(--vk-error, #e88f8f); --amber: var(--vk-warn, #e3be7b); --info: var(--vk-accent, #93d3e6);
    --mono: var(--vk-font-mono, Consolas, monospace); --sans: var(--vk-font-sans, "Segoe UI", system-ui, sans-serif); --voice: var(--vk-font-voice, Bahnschrift, sans-serif); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--tx); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--ln); }
  h1 { font: 600 17px var(--voice); letter-spacing: .08em; text-transform: uppercase; margin: 0; }
  h1 i { font: italic 400 12px var(--sans); letter-spacing: 0; text-transform: none; color: var(--mu); margin-left: 6px; }
  .sp { flex: 1; }
  header button, header select, header input { font: 12px var(--mono); background: var(--s1); color: var(--mu); border: 1px solid var(--ln); padding: 5px 9px; min-height: 30px; cursor: pointer; }
  header input { cursor: text; width: 200px; color: var(--tx); font-family: var(--sans); }
  header button[aria-pressed="true"] { color: var(--tx); border-color: var(--ln2); background: var(--s2); }
  .sev { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }
  .sev.red { background: var(--red); } .sev.amber { background: var(--amber); } .sev.info { background: var(--info); }
  #sum { font: 12px var(--mono); color: var(--mu); }
  main { flex: 1; display: flex; min-height: 0; }
  #cols { flex: 1; overflow: auto; display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; }
  .col { flex: 0 0 280px; background: var(--s1); border: 1px solid var(--ln); border-top: 3px solid var(--ln2); }
  .col.red { border-top-color: var(--red); } .col.amber { border-top-color: var(--amber); } .col.info { border-top-color: var(--info); }
  .col h2 { margin: 0; padding: 8px 10px 6px; font: 600 13px var(--voice); letter-spacing: .04em; cursor: pointer; }
  .col h2 small { display: block; font: 11px var(--mono); color: var(--fa); letter-spacing: 0; margin-top: 2px; }
  .col h2 b { font: 11px var(--mono); margin-right: 6px; }
  .card { margin: 0 8px 8px; padding: 7px 9px 7px 10px; background: var(--s2); border-left: 3px solid var(--ln2); cursor: pointer; }
  .card.red { border-left-color: var(--red); } .card.amber { border-left-color: var(--amber); } .card.info { border-left-color: var(--info); }
  .card .k { font: 11px var(--mono); color: var(--fa); text-transform: uppercase; letter-spacing: .06em; }
  .card .t { font-size: 13px; margin: 2px 0; overflow-wrap: anywhere; }
  .card .a { font: 12px var(--mono); color: var(--mu); overflow-wrap: anywhere; }
  .card .a::before { content: '→ '; color: var(--fa); }
  .card .e { font-size: 12px; color: var(--fa); margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .card[aria-selected="true"] { outline: 1px solid var(--acc); background: color-mix(in srgb, var(--acc) 10%, var(--s2)); }
  aside { flex: 0 0 340px; border-left: 1px solid var(--ln); overflow: auto; padding: 12px 16px; background: var(--s1); }
  aside h3 { font: 600 12px var(--voice); letter-spacing: .1em; text-transform: uppercase; color: var(--mu); margin: 14px 0 6px; }
  aside .t { font-size: 15px; margin: 4px 0 8px; overflow-wrap: anywhere; }
  aside .act { font: 13px var(--mono); background: var(--s2); padding: 8px 10px; border-left: 3px solid var(--ok); overflow-wrap: anywhere; }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside li { padding: 4px 0; border-bottom: 1px solid var(--ln); font-size: 13px; overflow-wrap: anywhere; }
  aside li code, .mono { font: 11px var(--mono); color: var(--fa); }
  #cleared li { color: var(--mu); }
  .empty { color: var(--fa); padding: 20px; }
  @media (max-width: 760px) {
    header { padding: 8px 16px; } header input { width: 100%; }
    main { flex-direction: column; overflow: auto; }
    #cols { flex-direction: column; overflow: visible; padding: 12px 16px; }
    .col { flex: none; width: 100%; }
    aside { flex: none; border-left: 0; border-top: 1px solid var(--ln); }
  }
</style>
</head>
<body>
<header>
  <h1>Jelzéstábla<i>signals · J</i></h1>
  <span id="sum"></span>
  <span class="sp"></span>
  <button data-sev="red" aria-pressed="true"><span class="sev red"></span>piros</button>
  <button data-sev="amber" aria-pressed="true"><span class="sev amber"></span>sárga</button>
  <button data-sev="info" aria-pressed="true"><span class="sev info"></span>info</button>
  <select id="kind" aria-label="fajta · kind"><option value="">minden fajta · every kind</option></select>
  <input id="q" type="search" placeholder="keresés · search" aria-label="keresés · search">
</header>
<main>
  <div id="cols" role="list"></div>
  <aside id="side">
    <div id="detail"><p class="empty">Válassz egy jelzést: látod, mire mutat, és mi szünteti meg.<br><i>Pick a signal: what it warns, and what clears it.</i></p></div>
    <h3>Elmúlt 14 nap · cleared lately</h3>
    <ul id="cleared"></ul>
  </aside>
</main>
<script src="out/signals-data.js"></script>
<script src="lib/live.js"></script>
<script>
(function () {
  const D = window.SIGNALS;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  if (!D) { $('cols').innerHTML = '<p class="empty">Nincs adat: futtasd a <code>node stack.js build</code>-et. · No data yet: run node stack.js build.</p>'; return; }
  const F = { sev: new Set(['red', 'amber', 'info']), kind: '', q: '', sel: '' };
  const S = D.signals.map(([id, kind, sev, title, brief, about, pillars, since]) => ({ id, kind, sev, title, brief, about, pillars, since }));
  const byId = new Map(S.map(s => [s.id, s]));
  const K = D.kinds || {};
  const kname = k => (K[k] && K[k].hu) || k;
  // the action: the signal's own brief where the kind says so (own), else the kind's; the rest of a brief is evidence
  const act = s => ((K[s.kind] || {}).own && s.brief) || (K[s.kind] || {}).act || s.brief || '';
  const evid = s => ((K[s.kind] || {}).own ? '' : s.brief || '');
  const c = D.counts;
  $('sum').textContent = `${c.total} jelzés · ${c.red} piros · ${c.amber} sárga · ${c.info} info · ${c.pillars} pillér`;
  for (const k of Object.keys(K).sort((a, b) => kname(a).localeCompare(kname(b), 'hu'))) $('kind').insertAdjacentHTML('beforeend', `<option value="${esc(k)}">${esc(kname(k))} · ${esc(K[k].en)}</option>`);

  const show = s => F.sev.has(s.sev) && (!F.kind || s.kind === F.kind) && (!F.q || (s.title + ' ' + s.brief + ' ' + s.kind).toLowerCase().includes(F.q));
  function render() {
    const html = [];
    for (const p of D.pillars) {
      const list = p.signals.map(i => S[i]).filter(show);
      if (!list.length) continue;
      const n = { red: 0, amber: 0, info: 0 }; for (const s of list) n[s.sev]++;
      const worst = n.red ? 'red' : n.amber ? 'amber' : 'info';
      html.push(`<section class="col ${worst}" role="listitem" data-pillar="${esc(p.id)}"><h2 data-pillar="${esc(p.id)}">${p.id ? esc(p.name) : 'Pillér nélkül · no pillar'}<small>${n.red ? `<b style="color:var(--red)">${n.red}</b>` : ''}${n.amber ? `<b style="color:var(--amber)">${n.amber}</b>` : ''}${n.info ? `<b style="color:var(--info)">${n.info}</b>` : ''}${esc(p.area || '')}</small></h2>`
        + list.map(s => `<div class="card ${s.sev}" tabindex="0" data-sig="${esc(s.id)}" aria-selected="${s.id === F.sel}"><div class="k">${esc(kname(s.kind))}${s.since ? ' · ' + esc(s.since) : ''}</div><div class="t">${esc(s.title)}</div><div class="a">${esc(act(s))}</div>${evid(s) ? `<div class="e">${esc(evid(s))}</div>` : ''}</div>`).join('')
        + `</section>`);
    }
    $('cols').innerHTML = html.join('') || '<p class="empty">Nincs jelzés ezekkel a szűrőkkel. · No signals with these filters.</p>';
  }
  function detail() {
    const s = byId.get(F.sel);
    if (!s) return;
    const k = K[s.kind] || {};
    const about = (s.about || []).map(id => { const a = (D.about || {})[id] || []; return `<li>${esc(a[2] || id)} <code>${esc(a[0] || '')} · ${esc(a[1] || '')}</code></li>`; }).join('');
    $('detail').innerHTML = `<div class="k mono"><span class="sev ${esc(s.sev)}"></span>${esc(kname(s.kind))} · ${esc(k.en || s.kind)}${s.since ? ' · since ' + esc(s.since) : ''}</div>
      <div class="t">${esc(s.title)}</div>
      <h3>Mi szünteti meg · what clears it</h3><div class="act">${esc(act(s))}</div>${evid(s) ? `<h3>Bizonyíték · evidence</h3><p class="mono">${esc(evid(s))}</p>` : ''}
      <h3>Mire mutat · what it warns</h3><ul>${about || '<li class="mono">—</li>'}</ul>
      <p class="mono">${esc(s.id)}</p>`;
  }
  function select(id, quiet) {
    F.sel = byId.has(id) ? id : '';
    for (const el of document.querySelectorAll('.card')) el.setAttribute('aria-selected', String(el.dataset.sig === F.sel));
    detail();
    if (!quiet && window.StackLive) { const s = byId.get(F.sel); StackLive.selected(s ? [s.id, ...(s.about || [])] : []); }
    if (F.sel) history.replaceState(null, '', '#sel=' + encodeURIComponent(F.sel));
  }
  $('cleared').innerHTML = (D.cleared || []).map(([id, kind, title, day]) => `<li>${esc(title)} <code>${esc(kname(kind))} · ${esc(day)}</code></li>`).join('') || '<li class="mono">— semmi · nothing yet</li>';

  for (const b of document.querySelectorAll('header [data-sev]')) b.onclick = () => { const v = b.dataset.sev; F.sev.has(v) ? F.sev.delete(v) : F.sev.add(v); b.setAttribute('aria-pressed', String(F.sev.has(v))); render(); };
  $('kind').onchange = e => { F.kind = e.target.value; render(); };
  $('q').oninput = e => { F.q = e.target.value.trim().toLowerCase(); render(); };
  $('cols').onclick = e => {
    const card = e.target.closest('.card'); if (card) return select(card.dataset.sig);
    const h = e.target.closest('h2[data-pillar]'); if (h && h.dataset.pillar && window.StackLive) StackLive.selected(['E:' + h.dataset.pillar]);
  };
  $('cols').onkeydown = e => { const card = e.target.closest('.card'); if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(card.dataset.sig); } };
  render();
  const h0 = new URLSearchParams(location.hash.slice(1)).get('sel'); if (h0 && byId.has(h0)) select(h0, true);

  // the page contract (S7, lib/live.js): a card lights when the string holds the signal or what it warns; a column, its pillar
  if (window.StackLive) StackLive.contract({
    layer: 'J', data: D,
    items: () => {
      const out = [];
      for (const el of document.querySelectorAll('.card[data-sig]')) { const s = byId.get(el.dataset.sig); if (s) out.push([el, [s.id, ...(s.about || [])]]); }
      for (const el of document.querySelectorAll('section.col[data-pillar]')) if (el.dataset.pillar) out.push([el, ['E:' + el.dataset.pillar]]);
      return out;
    },
    select: id => { id = String(id || ''); if (byId.has(id)) return select(id, true); const s = S.find(x => (x.about || []).includes(id)); if (s) select(s.id, true); },
    getSelection: () => (F.sel ? [F.sel] : []),
  });
})();
</script>
</body>
</html>
