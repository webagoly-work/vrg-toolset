<!doctype html>
<html lang="hu" class="vk" data-vk-theme="melyviz" data-vk-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRG Vezérlőterem</title>
<!-- Vezérlőterem (Control Room): the A layer of the VRG Stack in its own order (2026-11-09, STK-P11…).
     The Council as a flow with lanes (Alapító → Bernard → the seats → contractors → workers), each node one click
     from its tools, briefs, memory and links (side panel); one start anatomy per GO codephrase (what a session
     reads, what is herded from it, what is stale); the briefs (tools/brief-state.js --check), memory freshness,
     a module map of every A kind, the GO codephrases, the schedules and usage per day (layer U).
     Visual language borrowed from the Kit Gyár proposal (Varler_Workflow_Kit/PROPOSAL_kit-gyar_2026-11-06.html).
     Data: out/control-data.js (lib/control.js, written on every `stack.js build`). Works from file:// and serve.js. -->
<link rel="stylesheet" href="../shared/melyviz.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/fonts/fonts.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/base.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/density.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/theme-melyviz.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/tokens/theme-light.css">
<link rel="stylesheet" href="../shared/vrg-ui-kit/components/base.css">
<style>
  /* fallbacks so the page still reads if the kit is not reachable */
  :root { --bg: var(--vk-bg, #0a141c); --s1: var(--vk-surface-1, #121c24); --s2: var(--vk-surface-2, #17232c); --s3: var(--vk-surface-3, #1d2a33);
    --ln: var(--vk-line, rgba(232,240,246,.15)); --ln2: var(--vk-line-strong, rgba(232,240,246,.34));
    --tx: var(--vk-text, #e8f0f6); --mu: var(--vk-text-muted, #a6afb7); --fa: var(--vk-text-faint, #6f7880);
    --acc: var(--vk-accent, #93d3e6); --warm: var(--vk-activity, #e8a873); --ok: var(--vk-ok, #8bcca1); --warn: var(--vk-warn, #e3be7b);
    --crit: var(--vk-crit, #e4877d); --info: var(--vk-info, #9db8e8); --idea: var(--vk-idea, #b4a7e6);
    --acc-soft: color-mix(in srgb, var(--acc) 14%, transparent); --warm-soft: color-mix(in srgb, var(--warm) 15%, transparent);
    --ok-soft: color-mix(in srgb, var(--ok) 14%, transparent); --warn-soft: color-mix(in srgb, var(--warn) 15%, transparent);
    --crit-soft: color-mix(in srgb, var(--crit) 14%, transparent);
    --mono: var(--vk-font-mono, Consolas, monospace); --sans: var(--vk-font-sans, "Segoe UI", system-ui, sans-serif); --voice: var(--vk-font-voice, Bahnschrift, sans-serif);
    --cut: 7px; --panel-w: 380px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--tx); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--ln); }
  h1 { font: 600 17px var(--voice); letter-spacing: .08em; text-transform: uppercase; margin: 0; }
  h1 i { font: italic 400 12px var(--sans); letter-spacing: 0; text-transform: none; color: var(--mu); margin-left: 6px; }
  .sp { flex: 1; }
  header button, header a.b { font: 12px var(--mono); background: var(--s1); color: var(--mu); border: 1px solid var(--ln); padding: 5px 9px; text-decoration: none; min-height: 28px; cursor: pointer; }
  header button:hover, header a.b:hover { color: var(--tx); border-color: var(--acc); }
  #stat { font: 12px var(--mono); color: var(--mu); }
  .shell { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); min-height: 0; }
  #main { overflow: auto; min-height: 0; min-width: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 70px; display: flex; flex-direction: column; gap: 40px; }
  nav.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 14px var(--voice); }
  nav.toc a { color: var(--mu); text-decoration: none; border-bottom: 1px solid var(--ln); }
  nav.toc a:hover, nav.toc a:focus-visible { color: var(--acc); border-color: var(--acc); }
  .sec { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .sec-head { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--ln2); padding-top: 14px; }
  .eyebrow { font: 12px var(--voice); text-transform: uppercase; letter-spacing: .14em; color: var(--acc); }
  h2 { font: 600 24px/1.15 var(--voice); margin: 0; letter-spacing: .01em; }
  h2 .en, h3 .en { display: block; font: italic 400 13px var(--sans); color: var(--fa); letter-spacing: 0; margin-top: 2px; }
  h3 { font: 600 17px var(--voice); margin: 0; }
  h4 { font: 600 13px var(--voice); letter-spacing: .04em; margin: 0; }
  p { margin: 0; max-width: 78ch; }
  .dim { color: var(--mu); } .faint { color: var(--fa); } .mono { font-family: var(--mono); font-size: 12px; }
  a { color: var(--acc); }
  .cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
  .box { background: var(--s1); border: 1px solid var(--ln); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  button.pick { all: unset; cursor: pointer; }
  button.pick:focus-visible, .node:focus-visible, .row:focus-visible, .tile:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  /* marks: every state has a glyph and a word, never colour alone */
  .mk { display: inline-flex; align-items: center; gap: 3px; font: 11px/1.2 var(--mono); padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
  .mk.stale { color: var(--warn); background: var(--warn-soft); }
  .mk.broken { color: var(--crit); background: var(--crit-soft); }
  .mk.quiet { color: var(--fa); border-style: dashed; }
  .mk.unlinked { color: var(--crit); }
  .mk.old { color: var(--warm); }
  .mk.ok { color: var(--ok); }
  .mk.vacant { color: var(--fa); border-style: dotted; }
  .mk.info { color: var(--info); }
  .marks { display: flex; flex-wrap: wrap; gap: 4px; }

  /* overview tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { all: unset; box-sizing: border-box; cursor: pointer; background: var(--s1); border: 1px solid var(--ln); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile:hover { border-color: var(--acc); }
  .tile b { font: 600 26px/1.1 var(--voice); font-variant-numeric: tabular-nums; }
  .tile small { font-size: 12px; color: var(--mu); }
  .tile .mk { align-self: flex-start; margin-top: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--mu); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .shp { display: inline-block; width: 14px; height: 14px; flex: none; }
  .shp.end { background: var(--tx); }
  .shp.stop { background: var(--warm); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .shp.auto { border: 2px solid var(--acc); border-radius: 50%; }
  .shp.work { border: 2px dashed var(--ok); border-radius: 3px; }

  /* flow graph with lanes */
  .flowbox { position: relative; border: 1px solid var(--ln); background: var(--s1); }
  .flow { position: relative; display: grid; grid-template-columns: 150px 175px repeat(3, minmax(170px, 1fr)); min-width: 960px; }
  .lane { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 10px 14px; border-right: 1px solid var(--ln); min-width: 0; }
  .lane:last-child { border-right: 0; }
  .lane:nth-child(even) { background: color-mix(in srgb, var(--tx) 2.5%, transparent); }
  .lane-h { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mu); padding: 10px 0 6px; border-bottom: 1px solid var(--ln); position: sticky; top: 0; }
  .lane-h small { display: block; font: italic 11px var(--sans); text-transform: none; letter-spacing: 0; color: var(--fa); }
  .lane.mid { justify-content: flex-start; }
  .node { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 8px; align-items: center; padding: 7px 8px; background: var(--bg); border: 1px solid var(--ln); min-width: 0; }
  .node:hover { border-color: var(--acc); }
  .node.sel { border-color: var(--acc); box-shadow: inset 3px 0 0 var(--acc); }
  .node.dimmed { opacity: .35; }
  .node .shape { width: 30px; height: 30px; display: grid; place-items: center; font: 700 12px var(--voice); }
  .node.k-end .shape { background: var(--tx); color: var(--bg); }
  .node.k-stop .shape { background: var(--warm); color: var(--bg); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .node.k-auto .shape { border: 2px solid var(--acc); border-radius: 50%; color: var(--acc); }
  .node.k-work .shape { border: 2px dashed var(--ok); border-radius: 4px; color: var(--ok); width: 26px; height: 26px; margin-left: 2px; }
  .node.vacant { border-style: dashed; background: transparent; }
  .node.vacant .shape { background: none; border: 1.5px dotted var(--fa); color: var(--fa); clip-path: none; }
  .node .nm { font: 600 14px/1.15 var(--voice); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .ti { font-size: 11.5px; color: var(--mu); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .marks { grid-column: 1 / -1; }
  .node .meta { grid-column: 1 / -1; font: 11px var(--mono); color: var(--fa); }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  .wire { fill: none; stroke: var(--ln2); stroke-width: 1.3; }
  .wire.vac { stroke-dasharray: 3 4; }
  .wire.on { stroke: var(--acc); stroke-width: 2; }
  .wire.off { opacity: .25; }
  .flow-note { font-size: 12.5px; color: var(--mu); }

  /* stop anatomy (one start, from a GO codephrase) */
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--ln2); }
  .seg button { all: unset; cursor: pointer; padding: 6px 11px; font: 13px var(--voice); color: var(--mu); border-right: 1px solid var(--ln); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--acc-soft); color: var(--tx); box-shadow: inset 0 -2px 0 var(--acc); }
  .seg button:focus-visible { outline: 2px solid var(--acc); }
  .stopcard { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); border: 1px solid var(--ln2); background: var(--s1); }
  .stopcard .main { padding: 16px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--ln); min-width: 0; }
  .stopcard .herd { padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--s2); min-width: 0; }
  .qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .qn { font: 13px var(--voice); color: var(--warm); border: 1px solid var(--warm); padding: 1px 7px; }
  .chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chain .c { font-size: 12.5px; padding: 4px 9px; border: 1px solid var(--ln2); }
  .chain .c.go { border-color: var(--warm); color: var(--warm); }
  .chain .c.br { border-color: var(--acc); color: var(--acc); }
  .chain .c.st { border-color: var(--warn); color: var(--warn); border-style: dashed; }
  .chain i { color: var(--fa); font-style: normal; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 10px; border: 1px solid var(--ln); font-size: 13.5px; }
  .opt:hover { border-color: var(--acc); }
  .opt.rec { border-color: var(--acc); background: var(--acc-soft); }
  .opt .imp { font: 11.5px var(--mono); color: var(--mu); white-space: nowrap; }
  .hbtn { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border: 1px solid var(--ln2); font-size: 13.5px; }
  .hbtn:hover { border-color: var(--acc); }
  .hbtn small { color: var(--fa); font-size: 12px; text-align: right; }
  .gapbox { grid-column: 1 / -1; border-top: 1px solid var(--ln); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--warn-soft); }
  .gapbox.clean { background: var(--ok-soft); }
  .gaprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font-size: 13.5px; align-items: baseline; }
  .gaprow .imp { font: 11.5px var(--mono); color: var(--warn); white-space: nowrap; }

  /* tables / rows */
  .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; padding: 5px 6px; border-bottom: 1px solid var(--ln); min-width: 0; }
  .row:hover { background: var(--acc-soft); }
  .row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .row .r { font: 11px var(--mono); color: var(--mu); white-space: nowrap; }
  .row .sub { grid-column: 1 / -1; font-size: 11.5px; color: var(--fa); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .checkline { font: 12px var(--mono); color: var(--mu); border-left: 3px solid var(--acc); padding: 4px 10px; background: var(--acc-soft); overflow-wrap: anywhere; }

  /* memory freshness */
  .mem { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--ln); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; font: inherit; text-align: left; width: 100%; }
  .mem:hover { background: var(--acc-soft); }
  .mem:focus-visible { outline: 2px solid var(--acc); }
  .age { position: relative; height: 12px; background: var(--s2); }
  .age i { position: absolute; inset: 0 auto 0 0; background: var(--ok); }
  .age.mid i { background: var(--warn); } .age.old i { background: var(--warm); } .age.unknown i { background: var(--fa); }
  .age b { position: absolute; right: 3px; top: -1px; font: 10px/14px var(--mono); color: var(--tx); }
  .mem .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .mem .t small { color: var(--fa); font: 11px var(--mono); margin-left: 6px; }
  .memlist { max-height: 520px; overflow: auto; border: 1px solid var(--ln); background: var(--s1); }

  /* module map */
  .mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .mod { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--ln); border-top: 3px solid var(--acc); background: var(--s1); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .mod:hover { border-color: var(--acc); }
  .mod:focus-visible { outline: 2px solid var(--acc); }
  .mod b { font: 600 22px var(--voice); }
  .mod .h { font: 600 14px var(--voice); }
  .mod .u { height: 6px; background: var(--s2); position: relative; }
  .mod .u i { position: absolute; inset: 0 auto 0 0; background: var(--acc); }
  .mod small { font-size: 12px; color: var(--mu); }

  /* GO cards */
  .gos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .gocard { all: unset; box-sizing: border-box; cursor: pointer; background: var(--s1); border: 1px solid var(--ln); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .gocard:hover { border-color: var(--warm); }
  .gocard:focus-visible { outline: 2px solid var(--acc); }
  .gocard .code { font: 600 18px var(--voice); color: var(--warm); }
  .gocard .ti { font-size: 12.5px; color: var(--mu); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gocard .meta { font: 11px var(--mono); color: var(--fa); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { all: unset; cursor: pointer; font: 11.5px var(--mono); border: 1px solid var(--ln2); padding: 2px 7px; color: var(--mu); }
  .chip:hover { border-color: var(--acc); color: var(--tx); }

  /* usage strip */
  .usage svg { display: block; width: 100%; height: auto; }
  .ubar { fill: var(--acc); cursor: pointer; }
  .ubar:hover, .ubar.sel { fill: var(--warm); }
  .uempty { fill: url(#hatch); }
  .uax { font: 10px var(--mono); fill: var(--mu); }
  .ugrid { stroke: var(--ln); }
  .unrec { font: 10px var(--mono); fill: var(--fa); }

  /* side panel */
  aside { border-left: 1px solid var(--ln); padding: 12px 14px 30px; overflow: auto; min-height: 0; min-width: 0; background: var(--bg); }
  aside h2 { font-size: 19px; overflow-wrap: anywhere; }
  aside h3 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--mu); margin: 14px 0 4px; border-bottom: 1px solid var(--ln); padding-bottom: 2px; }
  aside p { margin: 0 0 6px; overflow-wrap: anywhere; font-size: 13px; }
  .kick { font: 11px var(--mono); color: var(--mu); text-transform: uppercase; letter-spacing: .06em; }
  .kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 2px 8px; font-size: 12.5px; margin-top: 6px; }
  .kv > span:nth-child(odd) { color: var(--mu); } .kv > span:nth-child(even) { overflow-wrap: anywhere; }
  .tl { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 2px; font-size: 12.5px; color: var(--tx); text-decoration: none; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font-family: inherit; }
  .tl:hover { background: var(--acc-soft); }
  .tl .c { font: 11px var(--mono); color: var(--mu); } .tl .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tl .r { font: 11px var(--mono); color: var(--mu); white-space: nowrap; }
  .tl.alike .t { font-style: italic; color: var(--mu); }
  .tool { display: inline-flex; gap: 4px; align-items: baseline; font: 11.5px var(--mono); border: 1px solid var(--ln2); padding: 2px 7px; }
  .tool small { color: var(--fa); font: 10px var(--sans); }
  .tool.w { border-color: var(--warm); } .tool.x { border-color: var(--crit); } .tool.n { border-color: var(--info); } .tool.a { border-color: var(--idea); }
  #pclose { display: none; float: right; font: 13px var(--mono); background: var(--s1); color: var(--tx); border: 1px solid var(--ln2); padding: 4px 10px; cursor: pointer; }
  .hint { color: var(--mu); font-size: 12.5px; }
  .empty { padding: 24px; color: var(--mu); }

  @media (prefers-reduced-motion: no-preference) { .node, .wire, .tile, .mod, .gocard { transition: opacity .18s ease, border-color .15s ease, stroke .15s ease; } }
  @media (max-width: 1100px) { .cols3 { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    body { overflow-x: hidden; overflow-y: auto; height: auto; min-height: 100%; }
    header { padding: 8px 12px; } h1 i { display: none; } .sp { display: none; }
    .shell { display: block; }
    #main { overflow: visible; }
    .wrap { padding: 14px 16px 60px; gap: 32px; }
    .stopcard { grid-template-columns: 1fr; } .stopcard .main { border-right: 0; border-bottom: 1px solid var(--ln); }
    aside { position: fixed; left: 0; right: 0; bottom: 0; max-height: 72vh; border-left: 0; border-top: 2px solid var(--acc); z-index: 20; box-shadow: 0 -8px 24px rgba(0,0,0,.35); display: none; }
    aside.open { display: block; }
    #pclose { display: inline-block; }
    .mem { grid-template-columns: 74px minmax(0, 1fr); } .mem .marks { grid-column: 2; }
  }
</style>
</head>
<body>
<header>
  <h1>Vezérlőterem<i>VRG Stack · A réteg · ügynöki gerinc · control room</i></h1>
  <span class="sp"></span>
  <button id="bTheme" title="Téma: auto → sötét → világos">◐ Téma</button>
  <a class="b" href="layers.html" title="Rétegek · a teljes verem">Rétegek</a>
  <a class="b" href="connectome.html" title="Konnektóm">Konnektóm</a>
  <a class="b" href="replay.html" title="Visszajátszás">Visszajátszás</a>
  <span id="stat"></span>
</header>
<div class="shell">
  <div id="main"><div class="wrap" id="wrap"></div></div>
  <aside id="panel" aria-live="polite" aria-label="Részletek"></aside>
</div>
<script src="out/control-data.js"></script>
<script>
'use strict';
(function () {
  const D = window.CONTROL;
  const $ = s => document.querySelector(s);
  const wrap = $('#wrap'), panel = $('#panel');
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* file:// or private */ } } };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  html.push(sec('memoria', '5 · Memória', 'Mennyire friss a memória', 'Memory freshness: every note by age, with its links; a note with no vertical link is suspicious',
    `A sáv a jegyzet kora (frontmatter <span class="mono">modified</span>, ennek híján a fájl ideje): ≤ ${TH.midMemory} nap friss, ≤ ${TH.oldMemory} nap érett, fölötte régi. A „függ.” a többi rétegbe (F, I, Q, L, R, C, G) vezető kapcsok száma; ha nulla, a jegyzet vagy semmiről sem szól, ami a veremben van, vagy elavult.`,
    `<div class="seg" role="group" aria-label="Szűrő" id="memSeg"><button data-mf="" aria-pressed="true">Mind (${D.memory.length})</button><button data-mf="unlinked" aria-pressed="false">⌀ Gyanús (${C.unlinkedMemory})</button><button data-mf="old" aria-pressed="false">⏳ Régi (${C.oldMemory})</button><button data-mf="fresh" aria-pressed="false">Friss (${D.memory.filter(m => m.fresh === 'fresh').length})</button></div>
     <div class="memlist" id="memList">${D.memory.map(memRow).join('')}</div>`));

  const maxN = Math.max(...D.modules.map(m => m.n));
  html.push(sec('modulok', '6 · Modultérkép', 'Miből áll az ügynöki gerinc', 'Module map: every kind of node in the A layer, how much of it runs use, and what has no vertical link',

    `<div class="mods">${D.modules.map(m => `<button class="mod" data-k="mod:${esc(m.kind)}"><span class="h">${esc(m.hu)}</span><b>${m.n}</b>
      <span class="u" title="${m.used} / ${m.n} használt"><i style="width:${Math.round(100 * m.used / m.n)}%"></i></span>
      <small>${m.used} használt futásban</small>${m.unlinked ? mark('unlinked', m.unlinked + ' kapocs nélkül') : ''}${m.stale ? mark('stale', m.stale + ' átvett') : ''}</button>`).join('')}</div>`));

  html.push(sec('go', '7 · GO kódszavak', 'Kódszavak', 'GO codephrases: the live ones from CLAUDE.md, the archived ones from docs/go-archive',
    'Az „említés” a többi rétegből (munkamenet, commit, dokumentum, memória) erre a kódszóra mutató kapcsok száma.',

  const DOW = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];

  html.push(sec('hasznalat', '9 · Használat naponta', 'Tokenek és futások naponta', `Usage per day (layer U, the recorded sessions), last ${D.usage.length} days; each step counts on the day it ran`,

  /* ---------- flow wires ---------- */
  const flow = $('#flow'), wires = $('#wires');
  const edges = [];

  const canCall = a => !a.vacant && (a.allTools || a.tools.includes('Agent') || a.tools.includes('Task'));
  for (const a of D.agents.filter(x => x.role === 'seat' && canCall(x))) for (const b of D.agents.filter(x => x.role === 'contractor' || x.role === 'worker')) if (!/Serves Bernard/i.test(b.desc || '')) edges.push([a.id, b.id]);

  const NS = 'http://www.w3.org/2000/svg';
  let selNode = '';
  function drawWires() {

    const el = id => flow.querySelector(`[data-node="${CSS.escape(id)}"]`);

      const x1 = ra.right - box.left, y1 = ra.top + ra.height / 2 - box.top, x2 = rb.left - box.left, y2 = rb.top + rb.height / 2 - box.top;
      const mx = (x1 + x2) / 2;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      const on = selNode && (a === selNode || b === selNode);
      p.setAttribute('class', 'wire' + (vac ? ' vac' : '') + (on ? ' on' : selNode ? ' off' : ''));

    }

  document.addEventListener('click', e => {
    const s = e.target.closest('[data-stop]'); if (s) { showStop(s.dataset.stop); open('jump:inditas'); return; }
    const t = e.target.closest('[data-k]'); if (!t) return;
    e.preventDefault(); open(t.dataset.k);
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') { panel.classList.remove('open'); selNode = ''; markFlow(); } });

  const hk = /#sel=([^&]+)/.exec(location.hash);
  if (hk) open(decodeURIComponent(hk[1]), { noHash: true });
  else panel.innerHTML = `<div class="kick">Részletek</div><h2>Válassz egy elemet</h2><p class="dim">Egy ügynök, brief, memória-jegyzet, kódszó, modul, nap vagy ütemezés: itt nyílik meg, a kapcsaival együtt. Link egy elemre: <span class="mono">control.html#sel=agent:arnold</span>.</p>
    <h3>Mit jelölnek a jelek</h3><div class="marks" style="flex-direction:column;align-items:flex-start;gap:6px">${['stale', 'broken', 'quiet', 'never', 'unlinked', 'old', 'vacant'].map(f => mark(f)).join('')}</div>`;
})();
</script>
</body>
</html>
