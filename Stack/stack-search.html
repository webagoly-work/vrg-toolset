<!doctype html>
<html lang="hu" class="mv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRG Rétegverem</title>
<!-- v1, function only (the look is redone in the design session). Data: out/stack-data.js (node build.js). -->
<link rel="stylesheet" href="../../Planner_VRG_U100/shared/melyviz.css">
<style>
  :root { --bg: var(--mv-bg, #0b141b); --panel: var(--mv-panel, #111d26); --line: var(--mv-line, #22323e); --text: var(--mv-text, #dfe9ee);
    --dim: var(--mv-dim, #9fb2bd); --faint: var(--mv-faint, #6b808c); --acc: var(--mv-accent, #6fc3df); --warm: var(--mv-warm, #e3be7b); --warn: var(--mv-warn, #e4877d);
    --mono: var(--mv-mono, ui-monospace, Consolas, monospace); --sans: var(--mv-sans, system-ui, Segoe UI, sans-serif); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { font: 600 16px var(--mono); margin: 0; letter-spacing: .06em; text-transform: uppercase; }
  #q { flex: 1 1 320px; min-width: 0; padding: 8px 10px; background: var(--panel); color: var(--text); border: 1px solid var(--line); font: 15px var(--sans); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 11px var(--mono); padding: 3px 8px; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; }
  .chip.on { color: var(--text); border-color: var(--acc); }
  .tabs button { font: 12px var(--mono); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 4px 6px; cursor: pointer; }
  .tabs button.on { color: var(--text); border-color: var(--acc); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 0; min-height: calc(100vh - 60px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  #left { padding: 12px 18px; overflow: auto; }
  #card { border-left: 1px solid var(--line); padding: 14px 16px; background: var(--panel); overflow: auto; max-height: calc(100vh - 60px); position: sticky; top: 60px; }
  .row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; border-top: 1px solid var(--line); padding: 8px 0; }
  .row .lh { font: 11px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
  .row .lh b { display: block; color: var(--dim); font-size: 12px; }
  .hits { display: flex; flex-wrap: wrap; gap: 6px; }
  .hit { text-align: left; max-width: 340px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); color: var(--text); cursor: pointer; font: 13px var(--sans); }
  .hit:hover, .hit.sel { border-color: var(--acc); }
  .hit small { display: block; color: var(--faint); font: 10.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit.lit { border-color: var(--warm); }
  .k { font: 11px var(--mono); color: var(--faint); }
  #card h2 { font-size: 16px; margin: 4px 0 6px; }
  #card .brief { color: var(--dim); }
  #card .grp { margin-top: 12px; }
  #card .grp h3 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 0 0 4px; }
  #card .nb { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 3px 0; cursor: pointer; font: 13px var(--sans); }
  #card .nb:hover { color: var(--acc); }
  #card .nb .rel { font: 10.5px var(--mono); color: var(--faint); display: inline-block; min-width: 74px; }
  .btn { font: 12px var(--mono); padding: 5px 9px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--acc); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border-top: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { font: 11px var(--mono); color: var(--faint); text-transform: uppercase; }
  .st-exists { color: #8fd18f; } .st-partial { color: var(--warm); } .st-missing { color: var(--warn); } .st-n\/a { color: var(--faint); }
  .empty { color: var(--faint); padding: 20px 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--acc); padding: 8px 14px; display: none; }
</style>
</head>
<body>
<header>
  <h1>Rétegverem</h1>
  <input id="q" type="search" placeholder="Keresés minden rétegben… (pl. planner views, gömb, HUB-Q3, 5ee8b1e)" autofocus>
  <div class="tabs"><button data-tab="search" class="on">Keresés</button><button data-tab="layers">Rétegek</button><button data-tab="pillars">Oszlopok</button></div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <section id="left"></section>
  <aside id="card"><div class="empty">Válassz egy csomópontot: a kártya a rétegek közötti kapcsolatait mutatja.</div></aside>
</main>
<div class="toast" id="toast"></div>
<script src="out/stack-data.js"></script>
<script>
'use strict';
const S = window.STACK;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const ORDER = 'FIQLARCGE'.split('');
const LN = Object.fromEntries(S.layers.map(m => [m.code, m])); LN.E = { code: 'E', hu: 'Oszlop', en: 'Pillar' };
const byId = new Map(S.nodes.map(n => [n.id, n]));
for (const e of S.entities) byId.set('E:' + e.id, { id: 'E:' + e.id, layer: 'E', kind: 'pillar', title: e.name, brief: 'Ugyanaz a dolog minden rétegben: ' + Object.entries(e.per).map(([l, c]) => l + ' ' + c).join(', '), state: e.members.length + ' csomópont', t: '', deg: {} });
const nb = new Map();
for (const [a, b, rel, v] of S.edges) for (const [x, y, d] of [[a, b, '→'], [b, a, '←']]) { if (!nb.has(x)) nb.set(x, []); nb.get(x).push({ id: y, rel, v, d }); }
const IDX = [...byId.values()].map(n => ({ n, t: fold(n.title + ' ' + n.id), b: fold((n.brief || '') + ' ' + (n.kind || '') + ' ' + (n.state || '')) }));

let tab = 'search', sel = null, on = new Set(ORDER);
try { const saved = JSON.parse(localStorage.getItem('vrg.stack.layers') || 'null'); if (Array.isArray(saved)) on = new Set(saved); } catch {}

function chips() {
  $('#chips').innerHTML = ORDER.map(c => `<button class="chip ${on.has(c) ? 'on' : ''}" data-l="${c}" title="${esc(LN[c].en)}">${c} ${esc(LN[c].hu)}</button>`).join('');
}
function search(q) {
  const words = fold(q).split(/[^a-z0-9]+/).filter(w => w.length > 1);
  if (!words.length) return [];
  const out = [];
  for (const x of IDX) {
    if (!on.has(x.n.layer)) continue;
    let hit = 0, s = 0;
    for (const w of words) {
      const rt = new RegExp('(^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (rt.test(x.t)) { hit++; s += 3; } else if (x.t.includes(w)) { hit++; s += 2; } else if (x.b.includes(w)) { hit++; s += 1; }
    }
    if (hit) out.push({ n: x.n, hit, s: s + Math.min(2, ((x.n.deg && x.n.deg.v) || 0) / 30) });
  }
  return out.sort((a, b) => b.hit - a.hit || b.s - a.s).slice(0, 160);
}
function hitBtn(n, lit) {
  return `<button class="hit ${sel === n.id ? 'sel' : ''} ${lit ? 'lit' : ''}" data-id="${esc(n.id)}">${esc(n.title)}<small>${esc(n.id)}${n.state ? ' · ' + esc(n.state) : ''}${n.t ? ' · ' + esc(n.t) : ''}</small></button>`;
}
function renderSearch() {
  const q = $('#q').value.trim();
  if (!q) { $('#left').innerHTML = `<div class="empty">Írj be egy szót. A találatok rétegenként, fentről lefelé jelennek meg — a kiválasztott csomópont kapcsolatai sárgán világítanak a többi rétegben.</div>` + stats(); return; }
  const res = search(q);
  const lit = new Set(sel ? (nb.get(sel) || []).map(x => x.id) : []);
  const rows = ORDER.filter(c => on.has(c)).map(c => {
    const here = res.filter(r => r.n.layer === c); if (!here.length) return '';
    return `<div class="row"><div class="lh"><b>${c} · ${esc(LN[c].hu)}</b>${here.length} találat</div><div class="hits">${here.slice(0, 24).map(r => hitBtn(r.n, lit.has(r.n.id))).join('')}</div></div>`;
  }).join('');
  $('#left').innerHTML = rows || `<div class="empty">Nincs találat erre: „${esc(q)}”. Rövidebb szó? Kikapcsolt réteg?</div>`;
}
function stats() {
  const cnt = {}; for (const n of S.nodes) cnt[n.layer] = (cnt[n.layer] || 0) + 1;
  const v = S.edges.filter(e => e[3] === 1).length;
  return `<p class="k">${S.nodes.length} csomópont · ${S.edges.length} kapcsolat (${v} függőleges) · ${S.entities.length} oszlop · készült ${esc(S.generated.slice(0, 16).replace('T', ' '))}</p>`;
}
function renderLayers() {
  $('#left').innerHTML = `<p class="k">Felülről lefelé. Minden rétegnek saját rendje van, és egy saját oldala (ha van), ahol az ember látja.</p>
  <table><tr><th>Réteg</th><th>Mi van benne</th><th>Rend</th><th>Oldal</th></tr>${S.layers.map(m => `<tr><td><b>${m.code} · ${esc(m.hu)}</b><br><span class="k">${esc(m.en)} · ${S.nodes.filter(n => n.layer === m.code).length || '—'}</span></td><td>${esc(m.is)}</td><td class="k">${esc(m.order)}</td><td><span class="st-${esc(m.page.state)}">${esc(m.page.state)}</span> — ${esc(m.page.name)}${m.page.want ? `<br><span class="k">kellene: ${esc(m.page.want)}</span>` : ''}</td></tr>`).join('')}</table>` + stats();
}
function renderPillars() {
  $('#left').innerHTML = `<p class="k">Oszlop = ugyanaz a valós dolog (program, módszer) minden rétegben. Kattints: a kártya rétegenként mutatja a tagjait.</p>
  <table><tr><th>Oszlop</th>${ORDER.slice(0, 8).map(c => `<th>${c}</th>`).join('')}</tr>${S.entities.map(e => `<tr><td><button class="nb" data-id="E:${esc(e.id)}">${esc(e.name)}</button></td>${ORDER.slice(0, 8).map(c => `<td class="k">${e.per[c] || '·'}</td>`).join('')}</tr>`).join('')}</table>`;
}
function renderCard(id) {
  const n = byId.get(id); if (!n) return;
  sel = id;
  const list = (nb.get(id) || []).filter(x => byId.has(x.id));
  const groups = ORDER.map(c => {
    const here = list.filter((x, i, a) => byId.get(x.id).layer === c && a.findIndex(y => y.id === x.id) === i).sort((a, b) => (a.v === 2) - (b.v === 2)); if (!here.length) return '';
    return `<div class="grp"><h3>${c === n.layer ? '↔' : '↕'} ${esc(LN[c].hu)} (${here.length})</h3>${here.slice(0, 40).map(x => { const m = byId.get(x.id);
      return `<button class="nb" data-id="${esc(m.id)}"><span class="rel">${x.d} ${esc(x.rel)}</span>${esc(m.title)} <span class="k">${esc(m.id)}</span></button>`; }).join('')}${here.length > 40 ? `<span class="k">… még ${here.length - 40}</span>` : ''}</div>`;
  }).join('');
  $('#card').innerHTML = `<div class="k">${esc(n.layer)} · ${esc(LN[n.layer].hu)} · ${esc(n.kind)}</div><h2>${esc(n.title)}</h2>
    <div class="brief">${esc(n.brief || '')}</div>
    <p class="k">${[n.id, n.state, n.t, n.path].filter(Boolean).map(esc).join(' · ')}</p>
    <button class="btn" id="copy" title="Rövid kontextuscsomag: ez a csomópont és a szomszédai, Claude-nak beillesztéshez">Kontextus másolása Claude-nak</button>
    ${groups}`;
  if (tab === 'search') renderSearch();
}
function pack(id) {
  const n = byId.get(id); const lines = [`# VRG Stack context — ${n.id} (${LN[n.layer].en}, ${n.kind})`, `${n.title}${n.state ? ' [' + n.state + ']' : ''}${n.t ? ' ' + n.t : ''}`, n.brief || '', n.path ? 'path: ' + n.path : ''];
  for (const c of ORDER) { const here = (nb.get(id) || []).filter(x => byId.has(x.id) && byId.get(x.id).layer === c && x.v !== 2).slice(0, 8); if (!here.length) continue;
    lines.push(`${c} ${LN[c].en}:`); for (const x of here) { const m = byId.get(x.id); lines.push(`  ${x.rel} ${m.id} ${m.title}${m.state ? ' [' + m.state + ']' : ''}`); } }
  lines.push('More: node H:/VRG/Full/notes/stack/stack.js node <id>');
  return lines.filter(Boolean).join('\n');
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 1800); }
function render() { tab === 'search' ? renderSearch() : tab === 'layers' ? renderLayers() : renderPillars(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-id],[data-l],[data-tab],#copy'); if (!t) return;
  if (t.id === 'copy') { navigator.clipboard.writeText(pack(sel)).then(() => toast('Kimásolva — illeszd be a Claude-üzenetbe'), () => toast('A vágólap nem érhető el')); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === t)); render(); return; }
  if (t.dataset.l) { on.has(t.dataset.l) ? on.delete(t.dataset.l) : on.add(t.dataset.l); try { localStorage.setItem('vrg.stack.layers', JSON.stringify([...on])); } catch {} chips(); render(); return; }
  if (t.dataset.id) { renderCard(t.dataset.id); try { history.replaceState(null, '', '#' + encodeURIComponent(t.dataset.id)); } catch {} }
});
let timer; $('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(renderSearch, 120); if (tab !== 'search') document.querySelector('[data-tab=search]').click(); });
chips(); render();
if (location.hash) { const id = decodeURIComponent(location.hash.slice(1)); if (byId.has(id)) renderCard(id); }
</script>
</body>
</html>
