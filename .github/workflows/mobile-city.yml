# VRG Mobile, WP M5 (Kódváros online, D-7 = A): the city of every pushed branch, built here and published to
# the `city-pages` branch, where the phone's Kódváros online reads it through the GitHub API with its token.
# The city is the repo on GitHub only: this job sees the pushed commit and nothing of anyone's PC.
#
# - push: CodeCity/scan.js on the pushed branch (full history) -> city/<key>/{city.html,city.json,meta.json}.
# - delete: a deleted branch's city is removed.
# Mobile/city/publish-city.js writes with git plumbing (no checkout of city-pages, the source branch is never
# written) and replaces city-pages with one root commit, --force-with-lease on that branch alone; see its header.
name: VRG Mobile (Kódváros online)

on:
  push:
    branches-ignore: [city-pages, mobile-log, solomon-data, stack-pages]
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # one run per branch; a newer push makes an older scan of the same branch pointless
  group: city-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan.js walks the whole history (the replay, the ghosts)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publisher tests
        run: node Mobile/tests/city-publish.js
      - name: three.js into Vendor/ (pinned with its sha512 in vendor-manifest.json)
        if: github.event_name != 'delete'
        run: node tools/fetch-vendor.js three
      - name: Scan the city
        if: github.event_name != 'delete'
        run: node CodeCity/scan.js . --out "$RUNNER_TEMP/city/city.json" --html "$RUNNER_TEMP/city/city.html"
      - name: Publish to city-pages
        if: github.event_name != 'delete'
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node Mobile/city/publish-city.js --branch "$BRANCH" --from "$RUNNER_TEMP/city" --sha "$GITHUB_SHA" --run-url "$RUN_URL" --push
      - name: Remove the deleted branch's city
        if: github.event_name == 'delete'
        env:
          BRANCH: ${{ github.event.ref }}
        run: node Mobile/city/publish-city.js --branch "$BRANCH" --remove --push
