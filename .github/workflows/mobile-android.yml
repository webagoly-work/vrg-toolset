# VRG Mobile: tests + debug APK on every push that touches the app. The cloud sandbox cannot build
# Android (Google's Maven is blocked there), so this is where a cloud session's work becomes an APK.
# Download it from the run page -> Artifacts. Releases for the in-app updater come with WP M9.
name: VRG Mobile (Android)

on:
  push:
    paths: ['Mobile/**', 'Sketcher/**', 'shared/fenyjel/**', '.github/workflows/mobile-android.yml', 'Planner/projects/varler-planner/tools/*relay*.js', 'tools/workflow-seal.js',
      'Map/lib/site-math.js', 'Weather/config/*.json', 'Planner/projects/varler-planner/src/08c*-sketch-*.js', 'Planner/projects/varler-planner/tests/sketch-*.json', 'Planner/projects/varler-planner/tests/spec-11[12]-sketch-*.js']
  pull_request:
    paths: ['Mobile/**', 'Sketcher/**', 'shared/fenyjel/**', '.github/workflows/mobile-android.yml', 'Planner/projects/varler-planner/tools/*relay*.js', 'tools/workflow-seal.js',
      'Map/lib/site-math.js', 'Weather/config/*.json', 'Planner/projects/varler-planner/src/08c*-sketch-*.js', 'Planner/projects/varler-planner/tests/sketch-*.json', 'Planner/projects/varler-planner/tests/spec-11[12]-sketch-*.js']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relay pairing tests (Node)
        working-directory: .
        run: |
          (cd Planner/projects/varler-planner && npm ci --no-audit --no-fund)
          node Mobile/tests/relay-pair.js
          node Mobile/tests/relay-sys.js
          node Mobile/catalogue/icon-gen.js --check
          node shared/fenyjel/tools/kotlin-icons.js --check
          node Mobile/tests/workflow-seal.js
          node Mobile/tests/app-archive.js
          node shared/vrg-ui-kit/test/radar.js
      # F8 (WP M53): the Planner end of the survey (its sketch import and survey panel), built from source so the
      # Sketcher's end-to-end test below opens the Planner as it is now
      - name: Planner sketch import (spec-111, spec-112)
        working-directory: Planner/projects/varler-planner
        run: |
          node build.js
          node tests/spec-111-sketch-import.js
          node tests/spec-112-sketch-survey.js
      - name: VRG Sketcher (field kit, fixture, variants, Desktop page, end to end)
        working-directory: .
        run: node Sketcher/test/run.js
      - name: Tests (pure Kotlin)
        run: ./gradlew --no-daemon :kit-core:test :airdeck-core:test :sketch-core:test :pager-core:test :weather-core:test :tag-core:test
      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vrg-mobile-debug-${{ github.sha }}
          path: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ github.sha }}
          path: Mobile/android/*/build/reports/tests/
          retention-days: 7
