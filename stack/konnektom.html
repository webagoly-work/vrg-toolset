<!-- The VRG Stack as a brain. One neuron = 2 KB on disk (CN-Q1 = A). Data: out/connectome-data.js
     (node stack.js connectome, also written by every stack.js build). Plain WebGL2, no library, works from file://.
     Live: re-reads the data every 60 s; served by serve.js it can also regenerate it (Frissítés) or rebuild the stack. -->
<style>
/* Mélyvíz — the VRG dev-side style (CITY-D26, 2026-10-27), shared by every dev-side app. Spec: docs/city/melyviz.md.
   This file is the source. Apps carry a copy between the markers  melyviz:begin / melyviz:end  that
   tools/melyviz-sync.js writes; `node tools/melyviz-sync.js --check` fails when a copy has drifted.
   Do not edit a copy inside an app — edit this file and sync.

   Tokens are --mv-* so they never collide with an app's own names; an app maps its variables onto them.
   The base layer applies only under html.mv, so adding the block changes nothing until the app opts in.
   M1 ice = the instrument and you (selection, focus, "you are here"); warm = activity (running, heat, recent work).
   M5 smoked glass, 1 px hairlines, square controls, two cut corners, no rounded corners, no drop shadows.
   M6 numbers and readouts mono; titles in the condensed voice; small labels uppercase and tracked. */
:root {
  --mv-bg: #0a141c; --mv-horizon: #11202b;
  --mv-panel: rgba(20, 30, 38, .74); --mv-panel-solid: #121c24; --mv-raised: #17232c;
  --mv-line: rgba(232, 240, 246, .15); --mv-line-strong: rgba(232, 240, 246, .34);
  --mv-text: #e8f0f6; --mv-dim: #a6afb7; --mv-faint: #646d74;
  --mv-accent: #93d3e6; --mv-accent-soft: rgba(147, 211, 230, .14); --mv-accent-glow: rgba(147, 211, 230, .5);
  --mv-warm: #e8a873; --mv-warm-soft: rgba(232, 168, 115, .14);
  --mv-ok: #8bcca1; --mv-warn: #e3be7b; --mv-crit: #e4877d;
  --mv-cut: 6px; --mv-blur: 12px; --mv-glow: 3px;
  --mv-mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --mv-voice: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif;
  --mv-sans: "Segoe UI", system-ui, sans-serif;
}
html.mv.low-glow { --mv-glow: 0px; }

/* ---- base layer (opt-in: html.mv; zero specificity, so any app rule wins) ---- */
:where(html.mv) { color-scheme: dark; }
:where(html.mv) :where(body) { background: var(--mv-bg); color: var(--mv-text); font-family: var(--mv-sans); }
:where(html.mv) :where(:is(h1, h2, h3)) { font-family: var(--mv-voice); font-stretch: 75%; font-weight: 600; letter-spacing: .03em; }
:where(html.mv) :where(:is(code, kbd, pre, samp, .mv-num)) { font-family: var(--mv-mono); }
:where(html.mv) :where(:focus-visible) { outline: 2px solid var(--mv-accent); outline-offset: 2px; }
:where(html.mv) ::selection { background: var(--mv-accent-soft); color: var(--mv-text); }
:where(html.mv) :where(:is(button, input, select, textarea)) { font: inherit; color: var(--mv-text); border-radius: 0; }
:where(html.mv) :where(:is(button, select, input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]), textarea)) {
  background: var(--mv-panel-solid); border: 1px solid var(--mv-line-strong); box-shadow: none; }
:where(html.mv) :where(button) { cursor: pointer; }
:where(html.mv) :where(button:hover:not(:disabled)) { border-color: var(--mv-accent); }
:where(html.mv) :where(:is(input, select, textarea):focus) { border-color: var(--mv-accent); outline: none; box-shadow: 0 0 var(--mv-glow) var(--mv-accent-glow); }
:where(html.mv) :where(:is(input[type=checkbox], input[type=radio], input[type=range])) { accent-color: var(--mv-accent); }
:where(html.mv) :where(input, textarea)::placeholder { color: var(--mv-faint); }
:where(html.mv) :where(:disabled) { opacity: .45; cursor: default; }
:where(html.mv) :where(table) { border-collapse: collapse; }
:where(html.mv) :where(:is(th, td)) { border-color: var(--mv-line); }
:where(html.mv) :where(th) { color: var(--mv-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; }
:where(html.mv) :where(a) { color: var(--mv-accent); }
:where(html.mv) :where(hr) { border: 0; border-top: 1px solid var(--mv-line); }
:where(html.mv) { scrollbar-color: var(--mv-line-strong) transparent; scrollbar-width: thin; }

/* ---- components (usable anywhere) ---- */
.mv-glass {
  border: 1px solid var(--mv-line-strong); border-radius: 0; box-shadow: none;
  -webkit-backdrop-filter: blur(var(--mv-blur)) saturate(1.2); backdrop-filter: blur(var(--mv-blur)) saturate(1.2);
  background: var(--mv-panel); }
.mv-solid { border: 1px solid var(--mv-line-strong); border-radius: 0; box-shadow: none; background: var(--mv-panel-solid); }
/* two cut corners (top left, bottom right) drawn as diagonals; layer on .mv-glass or .mv-solid */
.mv-cut {
  clip-path: polygon(var(--mv-cut) 0, 100% 0, 100% calc(100% - var(--mv-cut)), calc(100% - var(--mv-cut)) 100%, 0 100%, 0 var(--mv-cut));
  background-image:
    linear-gradient(to bottom right, transparent 50%, var(--mv-line-strong) 50%, var(--mv-line-strong) calc(50% + 1.2px), transparent calc(50% + 1.2px)),
    linear-gradient(to top left, transparent 50%, var(--mv-line-strong) 50%, var(--mv-line-strong) calc(50% + 1.2px), transparent calc(50% + 1.2px));
  background-position: left top, right bottom; background-size: var(--mv-cut) var(--mv-cut); background-repeat: no-repeat;
  background-origin: border-box; }
.mv-title { font-family: var(--mv-voice); font-stretch: 75%; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.mv-label { font-family: var(--mv-mono); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; color: var(--mv-dim); }
.mv-btn { background: none; border: 1px solid var(--mv-line-strong); border-radius: 0; color: inherit; font: inherit; padding: 3px 10px; cursor: pointer; }
.mv-btn:hover { border-color: var(--mv-accent); }
.mv-on, .mv-btn.on { border-color: var(--mv-accent); color: var(--mv-accent); background: var(--mv-accent-soft); box-shadow: 0 0 var(--mv-glow) var(--mv-accent-glow); }
.mv-live { color: var(--mv-warm); }
.mv-badge { font: 11px var(--mv-mono); padding: 1px 7px; border: 1px solid var(--mv-line-strong); color: var(--mv-dim); white-space: nowrap; }
.mv-badge.ok { color: var(--mv-ok); border-color: var(--mv-ok); }
.mv-badge.warn { color: var(--mv-warn); border-color: var(--mv-warn); }
.mv-badge.crit { color: var(--mv-crit); border-color: var(--mv-crit); }

/* print stays paper: Mélyvíz is a screen style */
@media print {
  :where(html.mv) { color-scheme: light; }
  :where(html.mv) body { background: #fff; color: #000; }
  .mv-glass, .mv-solid { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
}

</style>
<style>
  :root { --bg: var(--mv-bg, #0a141c); --panel: var(--mv-panel-solid, #121c24); --line: var(--mv-line, rgba(232,240,246,.15)); --text: var(--mv-text, #e8f0f6);
    --dim: var(--mv-dim, #a6afb7); --faint: var(--mv-faint, #646d74); --acc: var(--mv-accent, #93d3e6); --warm: var(--mv-warm, #e8a873); --crit: var(--mv-crit, #e4877d);
    --mono: var(--mv-mono, Consolas, ui-monospace, monospace); --sans: var(--mv-sans, "Segoe UI", system-ui, sans-serif); --voice: var(--mv-voice, Bahnschrift, sans-serif); }
  :root { --faint: #95a0a8; --dim: #c6ced4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); overflow: hidden; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }

  #stale { font: 12px var(--mono); color: var(--warm); }
  .sp { flex: 1; }
  button, select, input[type=search] { font: 12px var(--mono); background: var(--panel); color: var(--dim); border: 1px solid var(--line); padding: 5px 9px; }
  button { cursor: pointer; }
  button.on, button:hover { color: var(--text); border-color: var(--acc); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=search] { width: 200px; color: var(--text); font-family: var(--sans); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
  #stage { position: relative; min-height: 0; }

  #tip b { font-weight: 600; } #tip .m { font: 11px var(--mono); color: var(--faint); }
  #lg { position: absolute; left: 12px; bottom: 12px; max-height: calc(100% - 24px); overflow: auto; background: rgba(10,20,28,.82); border: 1px solid var(--line); padding: 6px 10px; font-size: 12px; max-width: 330px; z-index: 1; }
  #lg summary { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); cursor: pointer; }
  #lg[open] summary { margin-bottom: 6px; }
  #legend .row { display: grid; grid-template-columns: 12px minmax(0,1fr) auto; gap: 7px; align-items: baseline; padding: 1px 0; cursor: pointer; user-select: none; }
  #legend .row.off { opacity: .35; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #legend .n { font: 11px var(--mono); color: var(--faint); }
  #legend i, aside i { color: var(--faint); font-size: 11px; }
  #legend h3, aside h3 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 8px 0 4px; }
  #legend h3:first-child, aside h3:first-child { margin-top: 0; }
  #legend .shell { color: var(--dim); }
  aside { border-left: 1px solid var(--line); padding: 10px 14px; overflow: auto; min-height: 0; }
  #clock { font: 12px var(--mono); color: var(--dim); }
  .run { display: grid; grid-template-columns: 8px minmax(0,1fr); gap: 7px; padding: 2px 4px; cursor: pointer; color: var(--dim); border-left: 2px solid transparent; }
  .run .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .when { font: 11px var(--mono); color: var(--faint); grid-column: 2; }
  .run.now { border-color: var(--warm); color: var(--text); background: rgba(232,168,115,.08); }
  .run .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-top: 5px; }
  .run.now .pip { background: var(--warm); }
  #card .title { font-size: 14px; font-weight: 600; margin: 2px 0 4px; }
  #card .kv { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 2px 8px; font-size: 12px; }
  #card .kv span:nth-child(odd) { color: var(--faint); }
  #card .kv span:nth-child(even) { font-family: var(--mono); overflow-wrap: anywhere; }
  .nb { display: block; padding: 1px 0; color: var(--dim); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nb:hover { color: var(--text); }
  .nb .c { font: 11px var(--mono); color: var(--faint); }

  #msg { font: 12px var(--mono); color: var(--acc); }
  canvas { touch-action: none; }
  header .row2 { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 12px; min-width: 0; }
  #view { position: relative; }

  body.full { overflow: hidden !important; } body.full #bExit { display: block; }

  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  #legend .part { color: var(--text); margin-top: 3px; padding-left: 0; }

    header > * { min-width: 0; } header button, header select { flex-shrink: 0; } #stat { overflow-wrap: anywhere; font-size: 11px; } input[type=search] { flex: 1 1 100%; width: auto; } header { padding: 8px 12px; gap: 6px 6px; } aside { overflow-x: hidden; } #runs { max-width: calc(100vw - 28px); } .sp { display: none; }

</style>

<script>/* neurons.js */
/* VRG Stack: neuron addresses and gate kinds (NC, research/NEURON-CODES.md).
   An axiom neuron is the connector of one 12 / 24 / 48 / 120 / 220 / 400 KB run of a file's 2 KB nodes.
   Its address is 6 characters: 1 gate letter + a 5-character root.
     root  = Crockford base32 (lowercase, no i l o u): 2 chars of hash(file id) = the family, shared by all of a
             file's neurons, + 3 chars of hash("<file id>|<KB>|<index>") = the run;
             stable while the file keeps its id and the run its place; like a short git hash, any unique prefix finds it.
     gate  = what the neuron does with a signal (see GATES). It is derived from the file's facts, so it can change
             when the facts do (a decision gets answered, a pathway parks); the root never does.
   Collisions: the roots are made unique within one build (a clash re-hashes with a salt, in a stable order).
   Plain script: works in the pages (window.NEURONS) and in node (module.exports). */
(function (root) {
  'use strict';
  const AXIOM_KB = [12, 24, 48, 120, 220, 400];
  const B32 = '0123456789abcdefghjkmnpqrstvwxyz';

  // The gate catalogue. in / out: how many vectors come in / go out. w: change of signal strength.
  // Letters avoid the digits' look-alikes and are never 0-9, so the first character always names the gate.
  const GATES = {
    r: { name: 'relay', hu: 'továbbító', in: 1, out: 1, w: 0, rule: '1 → 1: továbbadja a következő címnek · passes the signal to the next address' },
    f: { name: 'fork', hu: 'elágazás', in: 1, out: 2, w: 0, rule: '1 → 2: két párhuzamos címre küldi · sends to two parallel addresses' },
    m: { name: 'merge', hu: 'összefutás', in: 2, out: 1, w: 0, rule: '2+ → 1: több vektort egy címre von össze · merges vectors into one address' },
    g: { name: 'gate', hu: 'kapu', in: 1, out: 1, w: 0, rule: 'megállít, amíg a feltétel nem teljesül (pl. a döntés megvan) · stops the vector until its condition holds' },
    x: { name: 'switch', hu: 'váltó', in: 1, out: 2, w: 0, rule: '1 → egyik a kettőből, állapot szerint · routes to one of two by state' },
    t: { name: 'threshold', hu: 'küszöb', in: 3, out: 1, w: 0, rule: 'k az n-ből: akkor tüzel, ha elég bemenet aktív · fires when k of its n inputs are active' },
    a: { name: 'amplify', hu: 'erősítő', in: 1, out: 1, w: +1, rule: '+1 pont a jelerősséghez · adds one point of signal strength' },
    d: { name: 'damp', hu: 'csillapító', in: 1, out: 1, w: -1, rule: '−1 pont a jelerősségből · removes one point of signal strength' },
    n: { name: 'inhibit', hu: 'gátló', in: 1, out: 1, w: 0, rule: 'a beérkező jel elnémítja a szomszédot (felváltott tudás) · an incoming signal silences its neighbour (superseded knowledge)' },
    h: { name: 'hold', hu: 'tároló', in: 1, out: 1, w: 0, rule: 'megtartja a jelet, amíg ki nem olvassák (memória) · latches the signal until it is read (memory)' },
    c: { name: 'clock', hu: 'ütem', in: 0, out: 1, w: 0, rule: 'magától tüzel, ütemre (futások, ütemezés) · fires on its own rhythm (runs, schedules)' },
    s: { name: 'source', hu: 'forrás', in: 0, out: 1, w: 0, rule: 'innen indul a vektor (session-indítás, brief) · a vector starts here (session start, brief)' },
    e: { name: 'end', hu: 'kimenet', in: 1, out: 0, w: 0, rule: 'itt hagyja el a jel a rendszert (commit, merge) · the signal leaves the system here (commit, merge)' },

  function find(list, q) {

<script>/* touch.js */
/* VRG Stack pages: touch gestures for the 3D canvases (connectome.html, orb.html; VRG Mobile WP M17).

    zoom: f => { cam.dist = Math.max(1.4, Math.min(9, cam.dist * f)); },
    twist: a => { cam.yaw -= a; },
    tilt: dy => { cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch + dy * 0.005)); },
    tap: (x, y) => { const i = pick(x, y); select(i); showTip(i, x, y); clearTimeout(window.__tipT); window.__tipT = setTimeout(() => showTip(-1), 2600); },
    dbl: () => { cam = { yaw: 0.9, pitch: 0.18, dist: 3.7 }; },
    long: (x, y) => { const i = pick(x, y); if (i >= 0) { select(i); $('card').scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
  });
  reload();
  setInterval(() => reload(), 60e3);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
