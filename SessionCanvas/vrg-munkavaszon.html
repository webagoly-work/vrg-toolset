<!doctype html>
<html lang="hu" class="mv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRG Munkavászon</title>
<!--
  VRG Munkavászon (Session Canvas) - a Claude Code work session drawn as it happens. The canvas starts empty
  and a pen draws the session left to right: what Claude says, where it thinks, every tool call as a bar on its
  lane (colour = kind), background jobs and subagents on their own lanes, the task list's progress with an ETA,
  and the token / context curve. Idle stretches fold into a marked gap so a long day still reads.

  Source: Claude Code's own transcript, ~/.claude/projects/<project>/<session>.jsonl (no hooks needed).
    live   node SessionCanvas/serve.js  ->  http://localhost:8810   (START O -> N), tails the newest session
    file   open this page directly and drop a .jsonl on it (the main file plus its subagents/*.jsonl)
    demo   the Demo button replays a made-up session
  Thinking: shown when the transcript holds its text. Current models store it as a signature only, so the page
  draws where and how long Claude thought (duration, thinking tokens) and says the text is not in the log.
  ETAs are estimates: a task's from the mean of the finished tasks, a call's from the median of its own kind.

  Keys: Space play / pause   F fit   L follow   + / - zoom   Home / End   D demo   O open file   Esc close detail
  No library, no CDN: works offline. The model between model:begin / model:end is tested by
  SessionCanvas/test/model.test.js.
-->
<style>
/* melyviz:begin */
/* Mélyvíz — the VRG dev-side style (CITY-D26, 2026-10-27), shared by every dev-side app. Spec: docs/city/melyviz.md.
   This file is the source. Apps carry a copy between the markers  melyviz:begin / melyviz:end  that
   tools/melyviz-sync.js writes; `node tools/melyviz-sync.js --check` fails when a copy has drifted.
   Do not edit a copy inside an app — edit this file and sync.

   Tokens are --mv-* so they never collide with an app's own names; an app maps its variables onto them.
   The base layer applies only under html.mv, so adding the block changes nothing until the app opts in.
   M1 ice = the instrument and you (selection, focus, "you are here"); warm = activity (running, heat, recent work).
   M5 smoked glass, 1 px hairlines, square controls, two cut corners, no rounded corners, no drop shadows.
   M6 numbers and readouts mono; titles in the condensed voice; small labels uppercase and tracked. */
:root {
  --mv-bg: #0a141c; --mv-horizon: #11202b;
  --mv-panel: rgba(20, 30, 38, .74); --mv-panel-solid: #121c24; --mv-raised: #17232c;
  --mv-line: rgba(232, 240, 246, .15); --mv-line-strong: rgba(232, 240, 246, .34);
  --mv-text: #e8f0f6; --mv-dim: #a6afb7; --mv-faint: #646d74;
  --mv-accent: #93d3e6; --mv-accent-soft: rgba(147, 211, 230, .14); --mv-accent-glow: rgba(147, 211, 230, .5);
  --mv-warm: #e8a873; --mv-warm-soft: rgba(232, 168, 115, .14);
  --mv-ok: #8bcca1; --mv-warn: #e3be7b; --mv-crit: #e4877d;
  --mv-cut: 6px; --mv-blur: 12px; --mv-glow: 3px;
  --mv-mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --mv-voice: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif;
  --mv-sans: "Segoe UI", system-ui, sans-serif;
}
html.mv.low-glow { --mv-glow: 0px; }

/* ---- base layer (opt-in: html.mv; zero specificity, so any app rule wins) ---- */
:where(html.mv) { color-scheme: dark; }
:where(html.mv) :where(body) { background: var(--mv-bg); color: var(--mv-text); font-family: var(--mv-sans); }
:where(html.mv) :where(:is(h1, h2, h3)) { font-family: var(--mv-voice); font-stretch: 75%; font-weight: 600; letter-spacing: .03em; }
:where(html.mv) :where(:is(code, kbd, pre, samp, .mv-num)) { font-family: var(--mv-mono); }
:where(html.mv) :where(:focus-visible) { outline: 2px solid var(--mv-accent); outline-offset: 2px; }
:where(html.mv) ::selection { background: var(--mv-accent-soft); color: var(--mv-text); }
:where(html.mv) :where(:is(button, input, select, textarea)) { font: inherit; color: var(--mv-text); border-radius: 0; }
:where(html.mv) :where(:is(button, select, input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]), textarea)) {
  background: var(--mv-panel-solid); border: 1px solid var(--mv-line-strong); box-shadow: none; }
:where(html.mv) :where(button) { cursor: pointer; }
:where(html.mv) :where(button:hover:not(:disabled)) { border-color: var(--mv-accent); }
:where(html.mv) :where(:is(input, select, textarea):focus) { border-color: var(--mv-accent); outline: none; box-shadow: 0 0 var(--mv-glow) var(--mv-accent-glow); }
:where(html.mv) :where(:is(input[type=checkbox], input[type=radio], input[type=range])) { accent-color: var(--mv-accent); }
:where(html.mv) :where(input, textarea)::placeholder { color: var(--mv-faint); }
:where(html.mv) :where(:disabled) { opacity: .45; cursor: default; }
:where(html.mv) :where(table) { border-collapse: collapse; }
:where(html.mv) :where(:is(th, td)) { border-color: var(--mv-line); }
:where(html.mv) :where(th) { color: var(--mv-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; }
:where(html.mv) :where(a) { color: var(--mv-accent); }
:where(html.mv) :where(hr) { border: 0; border-top: 1px solid var(--mv-line); }
:where(html.mv) { scrollbar-color: var(--mv-line-strong) transparent; scrollbar-width: thin; }

/* ---- components (usable anywhere) ---- */
.mv-glass {
  border: 1px solid var(--mv-line-strong); border-radius: 0; box-shadow: none;
  -webkit-backdrop-filter: blur(var(--mv-blur)) saturate(1.2); backdrop-filter: blur(var(--mv-blur)) saturate(1.2);
  background: var(--mv-panel); }
.mv-solid { border: 1px solid var(--mv-line-strong); border-radius: 0; box-shadow: none; background: var(--mv-panel-solid); }
/* two cut corners (top left, bottom right) drawn as diagonals; layer on .mv-glass or .mv-solid */
.mv-cut {
  clip-path: polygon(var(--mv-cut) 0, 100% 0, 100% calc(100% - var(--mv-cut)), calc(100% - var(--mv-cut)) 100%, 0 100%, 0 var(--mv-cut));
  background-image:
    linear-gradient(to bottom right, transparent 50%, var(--mv-line-strong) 50%, var(--mv-line-strong) calc(50% + 1.2px), transparent calc(50% + 1.2px)),
    linear-gradient(to top left, transparent 50%, var(--mv-line-strong) 50%, var(--mv-line-strong) calc(50% + 1.2px), transparent calc(50% + 1.2px));
  background-position: left top, right bottom; background-size: var(--mv-cut) var(--mv-cut); background-repeat: no-repeat;
  background-origin: border-box; }
.mv-title { font-family: var(--mv-voice); font-stretch: 75%; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.mv-label { font-family: var(--mv-mono); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; color: var(--mv-dim); }
.mv-btn { background: none; border: 1px solid var(--mv-line-strong); border-radius: 0; color: inherit; font: inherit; padding: 3px 10px; cursor: pointer; }
.mv-btn:hover { border-color: var(--mv-accent); }
.mv-on, .mv-btn.on { border-color: var(--mv-accent); color: var(--mv-accent); background: var(--mv-accent-soft); box-shadow: 0 0 var(--mv-glow) var(--mv-accent-glow); }
.mv-live { color: var(--mv-warm); }
.mv-badge { font: 11px var(--mv-mono); padding: 1px 7px; border: 1px solid var(--mv-line-strong); color: var(--mv-dim); white-space: nowrap; }
.mv-badge.ok { color: var(--mv-ok); border-color: var(--mv-ok); }
.mv-badge.warn { color: var(--mv-warn); border-color: var(--mv-warn); }
.mv-badge.crit { color: var(--mv-crit); border-color: var(--mv-crit); }

/* print stays paper: Mélyvíz is a screen style */
@media print {
  :where(html.mv) { color-scheme: light; }
  :where(html.mv) body { background: #fff; color: #000; }
  .mv-glass, .mv-solid { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
/* melyviz:end */
:root {
  --c-talk: #e8f0f6; --c-read: #93d3e6; --c-search: #5fa8d3; --c-edit: #e8a873; --c-shell: #e3be7b;
  --c-web: #8bcca1; --c-agent: #b39cf0; --c-mcp: #e59cc8; --c-plan: #c9d77a; --c-other: #8d979f;
  --c-bg: #7fd1c2; --c-err: #e4877d; --c-prompt: #93d3e6; --c-think: #a6afb7;
  --side-w: 340px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: grid; grid-template-rows: auto 1fr auto; background: var(--mv-bg); }
header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--mv-line); min-width: 0; }
.brand { font-family: var(--mv-voice); font-stretch: 75%; font-weight: 600; letter-spacing: .14em; font-size: 15px; color: var(--mv-accent); white-space: nowrap; }
#title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mv-text); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font: 11px var(--mv-mono); color: var(--mv-dim); border: 1px solid var(--mv-line); padding: 2px 6px; white-space: nowrap; }
main { display: grid; grid-template-columns: 1fr var(--side-w); min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% 0%, var(--mv-horizon), var(--mv-bg)); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#cv.drag { cursor: grabbing; }
#empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; color: var(--mv-dim); padding: 24px; pointer-events: none; }
#empty b { font-family: var(--mv-voice); font-stretch: 75%; letter-spacing: .1em; color: var(--mv-text); font-size: 20px; font-weight: 600; }
#empty code { color: var(--mv-accent); }
#empty .row { pointer-events: auto; display: flex; gap: 8px; justify-content: center; }
#stage.over::after { content: ""; position: absolute; inset: 10px; border: 1px dashed var(--mv-accent); pointer-events: none; }
#tip { position: absolute; pointer-events: none; max-width: 420px; padding: 7px 9px; font-size: 12px; line-height: 1.4; display: none; z-index: 3; white-space: pre-wrap; word-break: break-word; }
#tip .k { font: 10.5px var(--mv-mono); color: var(--mv-dim); text-transform: uppercase; letter-spacing: .08em; }
aside { border-left: 1px solid var(--mv-line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--mv-panel-solid); }
aside section { padding: 10px 12px; border-bottom: 1px solid var(--mv-line); }
aside h3 { margin: 0 0 7px; font-size: 11px; color: var(--mv-dim); text-transform: uppercase; letter-spacing: .12em; display: flex; justify-content: space-between; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 12px var(--mv-mono); padding: 3px 8px; border: 1px solid var(--mv-line-strong); }
.pill i { width: 8px; height: 8px; display: inline-block; background: currentColor; }
.pill.live i { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
#activeTask { margin-top: 6px; font-size: 12px; color: var(--mv-warm); min-height: 1em; }
ul, ol { list-style: none; margin: 0; padding: 0; }
#running li { display: grid; grid-template-columns: 9px 1fr auto; gap: 7px; align-items: center; font-size: 12px; padding: 3px 0; }
#running li i { width: 9px; height: 9px; display: block; }
#running .eta { font: 11px var(--mv-mono); color: var(--mv-dim); white-space: nowrap; }
#running .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: 6px; background: var(--mv-raised); border: 1px solid var(--mv-line); position: relative; overflow: hidden; }
.prog i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--c-plan); transition: width .4s; }
.prog b { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(-45deg, transparent 0 3px, rgba(201,215,122,.45) 3px 6px); }
#eta { font: 11.5px var(--mv-mono); color: var(--mv-dim); margin: 5px 0 6px; }
#flowHead { font-size: 12px; margin-bottom: 5px; color: var(--mv-text); }
#flowHead .eta { font: 11px var(--mv-mono); color: var(--mv-dim); }
#flow li { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: baseline; font-size: 12px; padding: 2px 0; }
#flow li .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#flow li .w { font: 10.5px var(--mv-mono); color: var(--mv-dim); white-space: nowrap; }
#flow li.run b { animation: pulse 1.1s ease-in-out infinite; }
#flow li.done { color: var(--mv-dim); }
#feed li.cmd { font-family: var(--mv-mono); font-size: 12px; }
#feed li img, #detail img { display: block; max-width: 100%; max-height: 150px; margin-top: 3px; border: 1px solid var(--mv-line-strong); }
#detail img { max-height: 420px; }
#tip img { display: block; max-width: 320px; max-height: 220px; margin-top: 5px; border: 1px solid var(--mv-line-strong); }
#taskList li { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; font-size: 12px; padding: 2px 0; color: var(--mv-dim); }
#taskList li.in_progress { color: var(--mv-text); }
#taskList li.completed { color: var(--mv-faint); }
#taskList li.completed span { text-decoration: line-through; }
#taskList .d { font: 10.5px var(--mv-mono); color: var(--mv-faint); }
#catBars { display: grid; grid-template-columns: 64px 1fr 34px; gap: 3px 8px; align-items: center; font-size: 11.5px; }
#catBars .bar { height: 7px; }
#catBars .n { font: 11px var(--mv-mono); text-align: right; color: var(--mv-dim); }
#tokStats { font: 11.5px var(--mv-mono); color: var(--mv-dim); margin-top: 8px; line-height: 1.6; }
#feedS { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 0; }
#feed { overflow-y: auto; flex: 1; min-height: 0; margin-right: -8px; padding-right: 8px; }
#feed li { padding: 6px 0 6px 9px; border-left: 2px solid var(--mv-line); margin-bottom: 4px; font-size: 12.5px; line-height: 1.42; cursor: pointer; white-space: pre-wrap; word-break: break-word; }
#feed li:hover { background: var(--mv-accent-soft); }
#feed li .m { display: block; font: 10.5px var(--mv-mono); color: var(--mv-faint); margin-bottom: 2px; white-space: nowrap; }
#feed li.prompt { border-color: var(--c-prompt); color: var(--mv-accent); }
#feed li.say { border-color: var(--c-talk); }
#feed li.think { border-color: var(--c-think); border-left-style: dotted; color: var(--mv-dim); font-style: italic; }
#feed li.hid { padding-top: 2px; padding-bottom: 2px; margin-bottom: 1px; }
#feed li.hid .m { margin: 0; }
#feed li.note { border-color: var(--c-bg); color: var(--mv-dim); }
#feed li.err { border-color: var(--c-err); color: var(--c-err); }
#feed li.image { border-color: var(--c-prompt); color: var(--mv-dim); }
#feed li .more { color: var(--mv-faint); }
#detail { border: 1px solid var(--mv-line-strong); padding: 8px 10px; margin-bottom: 8px; font-size: 12px; max-height: 45%; overflow: auto; background: var(--mv-raised); }
#detail h4 { margin: 0 0 4px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
#detail pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; color: var(--mv-dim); margin: 4px 0; max-height: 220px; overflow: auto; }
#detail .k { font: 10.5px var(--mv-mono); color: var(--mv-faint); text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
footer { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--mv-line); flex-wrap: wrap; font-size: 12px; }
footer .grp { display: flex; align-items: center; gap: 6px; padding-right: 8px; border-right: 1px solid var(--mv-line); }
footer .grp:last-child { border-right: 0; }
footer button, footer select { padding: 3px 8px; font-size: 12px; }
footer button.on { border-color: var(--mv-accent); color: var(--mv-accent); }
#scrub { width: 200px; }
#sessions { max-width: 360px; }
#srcState { font: 11px var(--mv-mono); color: var(--mv-faint); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--mv-dim); }
.legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.legend i { width: 9px; height: 9px; display: inline-block; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; } aside { border-left: 0; border-top: 1px solid var(--mv-line); } .chips { display: none; } }
</style>
</head>
<body>
<header>
  <span class="brand">VRG MUNKAVÁSZON</span>
  <span id="title"></span>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="empty">
      <b data-i="emptyTitle"></b>
      <div data-i="emptyText"></div>
      <div><code>~/.claude/projects/&lt;projekt&gt;/&lt;munkamenet&gt;.jsonl</code></div>
      <div class="row"><button id="emptyDemo" data-i="demo"></button><button id="emptyOpen" data-i="open"></button></div>
    </div>
    <div id="tip" class="mv-solid"></div>
  </div>
  <aside>
    <section>
      <h3><span data-i="now"></span><span id="clock" class="mv-num"></span></h3>
      <span id="state" class="pill"><i></i><span></span></span>
      <div id="activeTask"></div>
      <ul id="running"></ul>
    </section>
    <section id="flowS" hidden>
      <h3><span data-i="flow"></span><span id="flowCount" class="mv-num"></span></h3>
      <div id="flowHead"></div>
      <ul id="flow"></ul>
    </section>
    <section>
      <h3><span data-i="tasks"></span><span id="taskCount" class="mv-num"></span></h3>
      <div class="prog"><b id="taskPart"></b><i id="taskBar"></i></div>
      <div id="eta"></div>
      <ul id="taskList"></ul>
    </section>
    <section>
      <h3><span data-i="stats"></span><span id="callCount" class="mv-num"></span></h3>
      <div id="catBars"></div>
      <div id="tokStats"></div>
    </section>
    <section id="feedS">
      <h3><span data-i="feed"></span><span id="feedCount" class="mv-num"></span></h3>
      <div id="detail" hidden></div>
      <ol id="feed"></ol>
    </section>
  </aside>
</main>
<footer>
  <div class="grp" id="liveGrp" hidden>
    <select id="sessions" title=""></select>
    <label><input type="checkbox" id="followNewest" checked> <span data-i="newest"></span></label>
  </div>
  <div class="grp">
    <button id="openBtn" data-i="open"></button>
    <button id="demoBtn" data-i="demo"></button>
    <input type="file" id="file" accept=".jsonl,.json,.txt" multiple hidden>
    <span id="srcState"></span>
  </div>
  <div class="grp">
    <button id="playBtn" title="Space">▶</button>
    <select id="speed" title=""><option value="1">1×</option><option value="4">4×</option><option value="16" selected>16×</option><option value="64">64×</option><option value="256">256×</option></select>
    <input type="range" id="scrub" min="0" max="1000" value="1000">
    <button id="liveBtn" data-i="live" hidden></button>
  </div>
  <div class="grp">
    <button id="zoomOut" title="-">−</button><button id="zoomIn" title="+">+</button>
    <button id="fitBtn" data-i="fit" title="F"></button>
    <button id="followBtn" data-i="follow" title="L" class="on"></button>
  </div>
  <div class="grp">
    <button id="redactBtn" data-i="redact"></button>
    <button id="langBtn">EN</button>
  </div>
  <div class="legend" id="legend"></div>
</footer>
<script>
/* model:begin */
/* The session model: Claude Code transcript lines (one JSON object per line) folded into what the canvas draws.
   Pure data, no DOM: SessionCanvas/test/model.test.js runs this block in Node. Every question it answers takes
   a time T, so live view, replay and scrubbing are the same code. */
var SCModel = (function () {
  'use strict';
  var CATS = ['read', 'search', 'edit', 'shell', 'web', 'agent', 'mcp', 'plan', 'other'];
  var CAT_OF = {
    Read: 'read', NotebookRead: 'read', LS: 'read',
    Grep: 'search', Glob: 'search', ToolSearch: 'search',
    Edit: 'edit', Write: 'edit', MultiEdit: 'edit', NotebookEdit: 'edit',
    Bash: 'shell', PowerShell: 'shell', BashOutput: 'shell', KillShell: 'shell', KillBash: 'shell', Monitor: 'shell', TaskStop: 'shell', TaskOutput: 'shell',
    WebSearch: 'web', WebFetch: 'web',
    Agent: 'agent', Task: 'agent', Workflow: 'agent', SendMessage: 'agent', ListAgents: 'agent',
    TodoWrite: 'plan', TaskCreate: 'plan', TaskUpdate: 'plan', TaskList: 'plan', TaskGet: 'plan',
    EnterPlanMode: 'plan', ExitPlanMode: 'plan', AskUserQuestion: 'plan',
  };
  function catOf(name) { return /^mcp__/.test(name) ? 'mcp' : CAT_OF[name] || 'other'; }
  var base = function (p) { var a = String(p || '').split(/[\\/]/).filter(Boolean); return a[a.length - 1] || ''; };
  var one = function (s, n) {
    s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); n = n || 80;
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  };
  var clip = function (s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + '\n…' : s; };
  var nl = function (s) { return s ? String(s).split('\n').length : 0; };
  var norm = function (s) { return String(s || '').replace(/\s+/g, ' ').trim(); };

  function label(name, inp) {
    inp = inp || {};
    switch (name) {
      case 'Read': case 'Write': case 'Edit': case 'MultiEdit': case 'NotebookEdit': case 'NotebookRead':
        return base(inp.file_path || inp.notebook_path);
      case 'Bash': case 'PowerShell': return one(inp.description || inp.command, 60);
      case 'Grep': case 'Glob': return one(inp.pattern, 44);
      case 'WebSearch': return one(inp.query, 50);
      case 'WebFetch': try { return new URL(inp.url).host; } catch (e) { return one(inp.url, 40); }

      var a = it.a; title = tr('agent') + ' · ' + esc(a.label); kv(tr('dur'), hhmm(a.t0, true) + ' → ' + hhmm(a.tEnd, true) + ' · ' + dur(a.tEnd - a.t0) + ' · ' + a.n + ' ' + tr('calls')); kv(tr('prompt'), a.prompt);
    } else {
      title = it.kind === 'prompt' ? tr('prompt') + ' #' + it.n : it.kind === 'say' ? tr('say') : tr('note');
      kv(hhmm(it.t, true), it.kind === 'note' && it.note === 'compact' ? tr('compact') : it.text);
    }
    d.innerHTML = '<h4><span>' + title + '</span><button id="closeDetail">×</button></h4>' + rows.join('');
    d.hidden = false;
    $('#closeDetail').onclick = function () { selected = null; d.hidden = true; lastSide = ''; };
  }
  function focusOn(it) {
    selected = it; showDetail(it); lastSide = '';
    if (it && it.t != null && !fitMode) { follow = false; $('#followBtn').classList.remove('on'); camX = Math.max(0, X(it.t) - GUT - (W - GUT) / 2); }
  }

  /* ---------------- sources ---------------- */
  function loadLines(list, label) { // list: [{agent, line}]
    reset('replay'); srcLabel = label;
    list.forEach(function (x) { M.add(x.line, x.agent); });
    if (M.S.t0 == null) { $('#srcState').textContent = '0'; return; }
    T = M.S.t0; playing = true; rebuild();
    $('#liveBtn').hidden = true;
  }
  function readFiles(files) {
    var arr = Array.from(files || []).filter(function (f) { return /\.(jsonl|json|txt)$/i.test(f.name); });
    if (!arr.length) return;
    Promise.all(arr.map(function (f) { return f.text().then(function (s) { return { f: f, s: s }; }); })).then(function (rs) {
      var list = [], main = null;
      rs.forEach(function (r) {
        var lines = r.s.split('\n'), isAgent = /^agent-/.test(r.f.name);
        if (!isAgent) { var first = lines.find(function (l) { return l.trim(); }) || ''; isAgent = /"isSidechain":true/.test(first) && /"agentId"/.test(first); }
        if (!isAgent && !main) main = r.f.name;
        lines.forEach(function (l) { list.push({ agent: isAgent ? r.f.name.replace(/\.jsonl$/, '') : 'root', line: l }); });
      });
      if (es) { es.close(); es = null; }
      loadLines(list, main || arr[0].name);
    });
  }
  function startDemo() { if (es) { es.close(); es = null; } loadLines(SCModel.demo(Date.now()), 'demo'); }

  var isServed = /^https?:$/.test(location.protocol);
  function connect(file) {
    reset('catchup'); srcLabel = 'live'; curSession = file;
    var first = true;
    es = new EventSource('api/stream?f=' + encodeURIComponent(file));
    es.addEventListener('hello', function (ev) { var h = JSON.parse(ev.data); clockOff = h.now - Date.now(); });
    es.onmessage = function (ev) {
      var m = JSON.parse(ev.data);
      if (m.reset) { var keep = curSession; connect(keep); return; }
      (m.lines || []).forEach(function (l) { M.add(l, m.agent || 'root'); });
      if (first && M.S.t0 != null) { first = false; T = M.S.t0; playing = true; }
    };
    es.addEventListener('ready', function () { if (M.S.t0 == null) goLive(); });
    es.onerror = function () { $('#srcState').textContent = '…'; };
  }
  function loadSessions(autoPick) {
    return fetch('api/sessions').then(function (r) { return r.json(); }).then(function (j) {
      sessionsList = j.sessions || [];
      var sel = $('#sessions');
      sel.innerHTML = sessionsList.map(function (s) {
        var d = new Date(s.mtime), when = (d.getMonth() + 1) + '.' + d.getDate() + ' ' + hhmm(s.mtime);
        return '<option value="' + esc(s.file) + '">' + esc(when + ' · ' + (s.account ? s.account + ' · ' : '') + s.project + ' · ' + red(s.title || s.id.slice(0, 8))) + '</option>';
      }).join('');
      if (curSession) sel.value = curSession;
      if (autoPick && sessionsList.length && sessionsList[0].file !== curSession) { sel.value = sessionsList[0].file; connect(sessionsList[0].file); }
    });
  }
  function initLive() {
    if (!isServed) return;
    $('#liveGrp').hidden = false;
    var wantDemo = /[?#&]demo\b/.test(location.search + location.hash);
    if (wantDemo) $('#followNewest').checked = false;
    loadSessions(!wantDemo).catch(function () { $('#liveGrp').hidden = true; $('#srcState').textContent = tr('noServer'); });
    setInterval(function () {
      if (!$('#followNewest').checked || (mode !== 'live' && mode !== 'catchup' && mode !== 'empty')) return;
      loadSessions(true).catch(function () {});
    }, 8000);
  }

  /* ---------------- input ---------------- */
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(function (el) { el.textContent = tr(el.getAttribute('data-i')); });
    $('#langBtn').textContent = lang === 'hu' ? 'EN' : 'HU';
    $('#legend').innerHTML = SCModel.CATS.concat(['bg']).map(function (k) { return '<span><i style="background:' + COL[k] + '"></i>' + tr('lane.' + k) + '</span>'; }).join('') +
      '<span><i style="background:' + COL.err + '"></i>' + tr('err') + '</span>';
    $('#redactBtn').classList.toggle('on', redact);
    lastSide = '';
  }
  function zoom(f, cx) {
    fitMode = false; $('#fitBtn').classList.remove('on');
    cx = cx == null ? W * 0.6 : cx;
    var t = invX(cx + camX);
    pxPerMs = Math.min(2, Math.max(0.00002, pxPerMs * f));
    camX = Math.max(0, X(t) - cx);
    if (follow) { follow = false; $('#followBtn').classList.remove('on'); }
  }
  $('#zoomIn').onclick = function () { zoom(1.5); };
  $('#zoomOut').onclick = function () { zoom(1 / 1.5); };
  $('#fitBtn').onclick = function () { fitMode = !fitMode; this.classList.toggle('on', fitMode); };
  $('#followBtn').onclick = function () { follow = !follow; fitMode = false; $('#fitBtn').classList.remove('on'); this.classList.toggle('on', follow); };
  $('#playBtn').onclick = function () {
    if (mode === 'replay') { if (T >= M.S.tEnd) T = M.S.t0; playing = !playing; follow = true; $('#followBtn').classList.add('on'); }
    else if (mode === 'catchup') goLive();
  };
  $('#scrub').oninput = function () {
    var S = M.S; if (S.t0 == null) return;
    if (mode === 'live' || mode === 'catchup') { mode = 'replay'; $('#liveBtn').hidden = false; }
    playing = false;
    var target = activeSpan(S.tEnd) * this.value / 1000, lo = S.t0, hi = S.tEnd;
    for (var i = 0; i < 40; i++) { var mid = (lo + hi) / 2; if (activeSpan(mid) < target) lo = mid; else hi = mid; }
    T = hi; lastSide = '';
  };
  $('#liveBtn').onclick = function () { if (es) goLive(); };
  $('#openBtn').onclick = $('#emptyOpen').onclick = function () { $('#file').click(); };
  $('#file').onchange = function () { readFiles(this.files); this.value = ''; };
  $('#demoBtn').onclick = $('#emptyDemo').onclick = startDemo;
  $('#redactBtn').onclick = function () { redact = !redact; store.set('redact', redact ? '1' : '0'); applyLang(); if (selected) showDetail(selected); };
  $('#langBtn').onclick = function () { lang = lang === 'hu' ? 'en' : 'hu'; store.set('lang', lang); applyLang(); if (selected) showDetail(selected); };
  $('#sessions').onchange = function () { $('#followNewest').checked = false; connect(this.value); };
  $('#feed').onclick = function (ev) {
    var li = ev.target.closest('li'); if (!li) return;
    var it = M.S.items[Number(li.getAttribute('data-seq'))]; if (it) focusOn(it);
  };
  var stage = $('#stage');
  ['dragenter', 'dragover'].forEach(function (n) { stage.addEventListener(n, function (e) { e.preventDefault(); stage.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (n) { stage.addEventListener(n, function (e) { e.preventDefault(); stage.classList.remove('over'); }); });
  stage.addEventListener('drop', function (e) { readFiles(e.dataTransfer.files); });

  var drag = null;
  cv.addEventListener('mousedown', function (e) { drag = { x: e.clientX, y: e.clientY, cx: camX, cy: camY, moved: false }; cv.classList.add('drag'); });
  window.addEventListener('mouseup', function (e) {
    cv.classList.remove('drag');
    if (drag && !drag.moved) { var h = pick(e); focusOn(h ? h.ref : null); }
    drag = null;
  });
  window.addEventListener('mousemove', function (e) {
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      if (drag.moved) {
        camX = Math.max(0, drag.cx - dx); camY = Math.max(0, drag.cy - dy);
        follow = false; fitMode = false; $('#followBtn').classList.remove('on'); $('#fitBtn').classList.remove('on');
      }
      return;
    }
    if (e.target !== cv) { $('#tip').style.display = 'none'; hover = null; return; }
    var h = pick(e); hover = h ? h.ref : null; tip(e, hover);
  });
  cv.addEventListener('mouseleave', function () { $('#tip').style.display = 'none'; hover = null; });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) { zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left); return; }
    var dx = e.deltaX || (e.shiftKey ? e.deltaY : 0), dy = e.shiftKey ? 0 : e.deltaY;
    if (dx) { camX = Math.max(0, camX + dx); follow = false; fitMode = false; $('#followBtn').classList.remove('on'); }
    if (dy) camY = Math.max(0, camY + dy);
  }, { passive: false });
  function pick(e) {
    var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    for (var i = hits.length - 1; i >= 0; i--) { var h = hits[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; }
    return null;
  }
  function tip(e, it) {
    var el = $('#tip');
    if (!it) { el.style.display = 'none'; return; }
    var S = M.S, k = '', body = '', pic = '';
    if (it.kind === 'image') { k = tr('img') + ' · ' + imgCaption(it) + ' · ' + hhmm(it.t, true); body = it.path || ''; pic = redact ? '' : imgURL(it); }
    else if (it.kind === 'cmdband') { k = (ICON[it.cmd.kind] || '/') + ' ' + it.cmd.name; body = cmdText(it.cmd).slice(0, 900); }
    else if (it.kind === 'grp') { k = '⑂ ' + tr('phase.' + it.g.name); body = grpText(it.g).slice(0, 1200); }
    else if (it.kind === 'call') {
      var d0 = it.tEnd != null && it.tEnd <= T ? it.tEnd - it.t : T - it.t;
      k = it.name + ' · ' + dur(d0) + (it.tEnd == null || it.tEnd > T ? ' · ' + tr('running') : '') + (it.error ? ' · ' + tr('err') : '');
      body = (it.add || it.rem ? '+' + (it.add || 0) + ' −' + (it.rem || 0) + ' ' + tr('lines') + '\n' : '') + (it.input.command || it.input.file_path || it.label || '');
      if (it.bg) body += '\n' + tr('lane.bg') + ': ' + (it.bgEnd && it.bgEnd <= T ? dur(it.bgEnd - it.tEnd) + ' · ' + it.bgStatus : tr('running'));
    } else if (it.kind === 'think') {
      var m = S.msgs.get(it.msg); k = tr('think') + (it.ms ? ' · ' + dur(it.ms) : '') + (m && m.th ? ' · ' + tr('thinkTok', { tok: kfmt(m.th) }) : '');
      body = it.text ? it.text.slice(0, 600) : tr('thinkHidden');
    } else if (it.kind === 'fold') { k = tr('fold', { d: dur(it.f.b - it.f.a) }); body = hhmm(it.f.a, true) + ' → ' + hhmm(it.f.b, true); }
    else if (it.kind === 'agent') { k = tr('agent'); body = it.a.label + '\n' + it.a.n + ' ' + tr('calls'); }
    else { k = (it.kind === 'prompt' ? tr('prompt') + ' #' + it.n : it.kind === 'say' ? tr('say') : tr('note')) + ' · ' + hhmm(it.t, true); body = it.note === 'compact' ? tr('compact') : String(it.text).slice(0, 600); }
    el.innerHTML = '<div class="k">' + esc(k) + '</div>' + esc(red(body)) + (pic ? '<img src="' + esc(pic) + '" alt="">' : '');
    var r = $('#stage').getBoundingClientRect();
    el.style.display = 'block';
    var x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
    if (x + el.offsetWidth > r.width - 8) x = e.clientX - r.left - el.offsetWidth - 10;
    if (y + el.offsetHeight > r.height - 8) y = e.clientY - r.top - el.offsetHeight - 10;
    el.style.left = x + 'px'; el.style.top = y + 'px';
  }
  window.addEventListener('keydown', function (e) {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
    if (e.key === ' ') { e.preventDefault(); $('#playBtn').click(); }
    else if (e.key === 'f' || e.key === 'F') $('#fitBtn').click();
    else if (e.key === 'l' || e.key === 'L') $('#followBtn').click();
    else if (e.key === '+' || e.key === '=') zoom(1.5);
    else if (e.key === '-') zoom(1 / 1.5);
    else if (e.key === 'Home' && M.S.t0 != null) { follow = false; fitMode = false; camX = 0; }
    else if (e.key === 'End') { follow = true; $('#followBtn').classList.add('on'); }
    else if (e.key === 'd' || e.key === 'D') startDemo();
    else if (e.key === 'o' || e.key === 'O') $('#file').click();
    else if (e.key === 'Escape') { selected = null; $('#detail').hidden = true; lastSide = ''; }
  });
  window.addEventListener('resize', resize);

  applyLang(); resize(); initLive();
  if (/[?#&]demo\b/.test(location.search + location.hash)) startDemo();
  requestAnimationFrame(tick);
  window.SC = { model: function () { return M; }, setT: function (t) { T = t; }, pause: function () { playing = false; }, state: function () { return { mode: mode, T: T, pxPerMs: pxPerMs, camX: camX }; } };
})();
</script>
</body>
</html>
