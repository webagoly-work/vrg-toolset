<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1030" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
<title>Varler Workflow Kit — áttekintés</title>
<style>
  svg { --bg:#f7f6f2; --panel:#ffffff; --card:#fbfbfa; --ink:#1d232b; --muted:#5d6773; --line:#d3d8de;
        --a1:#2f6fb0; --a2:#6a4fb3; --a3:#b07216; --a4:#1f8a70; --a5:#b6423a; --a6:#5f6b78;
        --t1:#e7eff8; --t2:#efeaf8; --t3:#f8efe0; --t4:#e3f3ee; --t5:#f8e6e4; --t6:#eceef1; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#14181d; --panel:#1c2229; --card:#232a32; --ink:#e6e9ec; --muted:#9aa5b1; --line:#36404b;
          --a1:#6ea8e6; --a2:#a58ee8; --a3:#e0a64c; --a4:#4fc4a1; --a5:#e77d74; --a6:#9aa5b1;
          --t1:#1d2c3d; --t2:#272240; --t3:#33291a; --t4:#17322b; --t5:#3a2120; --t6:#262d35; }
  }
  .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--line)} .card{fill:var(--card);stroke:var(--line)}
  .ink{fill:var(--ink)} .mut{fill:var(--muted)}
  .ttl{font-size:26px;font-weight:700;fill:var(--ink)} .sub{font-size:14px;fill:var(--ink)}
  .en{font-style:italic;fill:var(--muted)}
  .h{font-size:16px;font-weight:700} .hb{font-size:13px;font-weight:700;fill:var(--ink)}
  .b{font-size:12.5px;fill:var(--ink)} .s{font-size:11.5px;fill:var(--muted)} .m{font-family:Consolas, monospace;font-size:12px}
  .arr{stroke:var(--muted);stroke-width:2;fill:none}
  .c1{fill:var(--a1)} .c2{fill:var(--a2)} .c3{fill:var(--a3)} .c4{fill:var(--a4)} .c5{fill:var(--a5)} .c6{fill:var(--a6)}
  .k1{stroke:var(--a1)} .k2{stroke:var(--a2)} .k3{stroke:var(--a3)} .k4{stroke:var(--a4)} .k5{stroke:var(--a5)} .k6{stroke:var(--a6)}
  .f1{fill:var(--t1)} .f2{fill:var(--t2)} .f3{fill:var(--t3)} .f4{fill:var(--t4)} .f5{fill:var(--t5)} .f6{fill:var(--t6)}
