<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 362" role="img"><title>Q03 who sees what</title><desc>GitHub identity plus the owner-signed list unlock the programs; OneDrive decides folder access itself.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#2C2C2A;stroke:none}
.th{font-size:14px;font-weight:600}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}
.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-red{fill:#FCEBEB;stroke:#A32D2D}
.box{fill:#FFFFFF;stroke:#B4B2A9}.arr{stroke:#5F5E5A;stroke-width:1.2;fill:none}
</style>

<text class="th" x="20" y="28">Q03 — ki lát mit? (A: a GitHub fiók az azonosító)</text>
<g class="c-gray"><rect x="20" y="130" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="92" y="149" text-anchor="middle" dominant-baseline="central">Kapu</text><text class="ts" x="92" y="168" text-anchor="middle" dominant-baseline="central">te megnyitod</text></g>
<g class="c-blue"><rect x="185" y="130" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="257" y="149" text-anchor="middle" dominant-baseline="central">GitHub</text><text class="ts" x="257" y="168" text-anchor="middle" dominant-baseline="central">ki vagy? van jogod?</text></g>
<g class="c-purple"><rect x="350" y="130" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="422" y="149" text-anchor="middle" dominant-baseline="central">Aláírt lista</text><text class="ts" x="422" y="168" text-anchor="middle" dominant-baseline="central">rajta vagy?</text></g>
<g class="c-teal"><rect x="515" y="130" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="587" y="149" text-anchor="middle" dominant-baseline="central">Programok</text><text class="ts" x="587" y="168" text-anchor="middle" dominant-baseline="central">kinyílnak</text></g>
<g class="c-gray"><rect x="20" y="230" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="92" y="249" text-anchor="middle" dominant-baseline="central">Mappa link</text><text class="ts" x="92" y="268" text-anchor="middle" dominant-baseline="central">a Kapuban</text></g>
<g class="c-blue"><rect x="185" y="230" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="257" y="249" text-anchor="middle" dominant-baseline="central">OneDrive</text><text class="ts" x="257" y="268" text-anchor="middle" dominant-baseline="central">belépés + megosztás</text></g>
<g class="c-teal"><rect x="515" y="230" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="587" y="249" text-anchor="middle" dominant-baseline="central">Mappa</text><text class="ts" x="587" y="268" text-anchor="middle" dominant-baseline="central">megnyílik</text></g>
<g class="c-amber"><rect x="350" y="44" width="145" height="56" rx="8" stroke-width="0.5"/><text class="th" x="422" y="63" text-anchor="middle" dominant-baseline="central">Te (tulajdonos)</text><text class="ts" x="422" y="82" text-anchor="middle" dominant-baseline="central">aláírja a listát</text></g>
<line class="arr" x1="165" y1="158" x2="183" y2="158" marker-end="url(#arrow)"/><line class="arr" x1="330" y1="158" x2="348" y2="158" marker-end="url(#arrow)"/><line class="arr" x1="495" y1="158" x2="513" y2="158" marker-end="url(#arrow)"/>
<line class="arr" x1="165" y1="258" x2="183" y2="258" marker-end="url(#arrow)"/><line class="arr" x1="330" y1="258" x2="513" y2="258" marker-end="url(#arrow)"/><line class="arr" x1="422" y1="100" x2="422" y2="128" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="322">Az igazi zár a GitHub és a OneDrive jogosultság — a Kapu ezt mutatja meg.</text>
<text class="ts" x="20" y="344">B: GitHub helyett Google belépés — csak a Kapu segéddel és egy Google beállítással.</text>
</svg>
