<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VRG Készlet</title>
<style>
:root {
  color-scheme: light dark;

  --bg: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #f0efec;
  --surface-3: #e7e5e0;
  --border: #d9d7d1;
  --border-soft: #e8e6e1;
  --text: #1a1a18;
  --text-dim: #6b6862;
  --accent: #b3261e;
  --accent-soft: #fdecea;
  --accent-line: #e8b4b0;
  --ok: #1f7a4d;
  --warn: #8a6100;
  --provisional: #8a6100;
  --sel: #e3edf7;
  --star: #b8860b;

  --radius: 6px;
  --gap: 12px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a;
    --surface: #1f1f23;
    --surface-2: #26262b;
    --surface-3: #2f2f35;
    --border: #3a3a41;
    --border-soft: #2e2e34;
    --text: #e8e6e3;
    --text-dim: #9a968f;
    --accent: #e0655c;
    --accent-soft: #33201e;
    --accent-line: #5a332f;
    --ok: #5cc08c;
    --warn: #d3a43a;
    --provisional: #d3a43a;
    --sel: #23313f;
    --star: #d3a43a;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 14px/1.45 var(--sans);
  background: var(--bg);
  color: var(--text);
}

#app {
  max-width: 1600px;
  margin: 0 auto;
  padding: 16px;
  padding-block: 16px;
}

.spacer { flex: 1 1 auto; }
.muted { color: var(--text-dim); }
.prov { color: var(--provisional); }
.note { font-size: 12px; color: var(--text-dim); margin: 8px 0 0; }
.plain { margin: 0; padding-left: 18px; }
.plain li { margin-bottom: 3px; }

/* ------------------------------------------------------------------ header */
header.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--gap);
  margin-bottom: 14px;
}
header.top h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.badge {
  font: 11px/1 var(--mono);
  color: var(--text-dim);
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: 99px;
  padding: 4px 8px;
}

/* ------------------------------------------------------------------ panels */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
}

button {
  font: 13px var(--sans);
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  cursor: pointer;
}
button:hover { background: var(--surface-3); }
button.ghost { background: transparent; }
button.ghost:hover { background: var(--surface-2); }
button.tiny { padding: 1px 6px; font-size: 12px; line-height: 1.4; }

.controls { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: flex-end; }
.controls label {
  display: flex; flex-direction: column; gap: 3px;
  font-size: 11px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.controls label.grow { flex: 1 1 260px; }
input[type="search"], select {
  font: 13px var(--sans);
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 8px;
  min-width: 150px;
  text-transform: none;
  letter-spacing: normal;
}
.controls label.grow input[type="search"] { width: 100%; }
input:focus-visible, select:focus-visible, button:focus-visible,
th:focus-visible, tr:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

/* -------------------------------------------------------------- statistics */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 8px 10px; }
.stat b { display: block; font-size: 18px; font-weight: 650; }
.stat span { font-size: 11px; color: var(--text-dim); }
.stat.gap b { color: var(--warn); }

/* ---------------------------------------------------------- column picker */
.colpicker {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  max-height: 320px; overflow-y: auto;
}
.colrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.colrow label { font-size: 13px; }
.colrow label.vendor-lbl { color: var(--accent); }

/* -------------------------------------------------------------- category tree */
.tree-panel { padding: 8px; }
.tree { display: flex; flex-wrap: wrap; gap: 5px; }
.treebtn {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-size: 12px; padding: 4px 9px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--border-soft);
}
.treebtn.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
.treebtn.child { margin-left: 2px; background: transparent; border-style: dashed; }
.treebtn.child.on { background: var(--accent-soft); border-style: solid; }
.treebtn .cnt { font: 11px var(--mono); color: var(--text-dim); }
.treebtn.on .cnt { color: var(--accent); }
.treebtn.prov .lbl::after { content: " ~"; font-family: var(--mono); color: var(--provisional); }

/* ------------------------------------------------------------------- table */
.catalog-layout { position: relative; }
.grow-panel { padding: 0; overflow: hidden; }
.table-wrap { position: relative; }
.scroller { max-height: min(62vh, 760px); overflow: auto; }
.empty { padding: 32px; text-align: center; color: var(--text-dim); }

table.catalog { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; table-layout: fixed; }
table.catalog thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  text-align: left;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-dim);
  padding: 7px 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer; user-select: none;
}
table.catalog thead th.num { text-align: right; }
table.catalog thead th.sorted { color: var(--accent); }
table.catalog thead th .arrow { font-size: 9px; }
table.catalog tbody td {
  border-bottom: 1px solid var(--border-soft);
  padding: 0 8px;
  height: 30px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
table.catalog tbody tr { cursor: pointer; }
table.catalog tbody tr:hover td { background: var(--surface-2); }
table.catalog tbody tr.selected td { background: var(--sel); }
table.catalog tbody tr.pad td { padding: 0; border: 0; height: auto; }
td.id, th.id { font-family: var(--mono); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.vendor-col { background: var(--accent-soft); }
table.catalog tbody tr:hover td.vendor-col { background: var(--accent-soft); filter: brightness(0.98); }
td.prov { color: var(--provisional); }

.status { padding: 8px 12px; margin: 0; border-top: 1px solid var(--border-soft); }

/* ------------------------------------------------------------------ drawer */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(460px, 100vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
  display: flex; flex-direction: column;
  z-index: 40;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer-head {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.drawer-title { font-size: 14px; font-weight: 650; margin: 0; flex: 1; line-height: 1.35; }
.drawer-head .close { padding: 2px 8px; }
.drawer-body { overflow-y: auto; padding: 12px 14px 32px; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.chip {
  font-size: 11px; padding: 3px 8px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--text-dim);
}
.chip.mono { font-family: var(--mono); }
.chip.ok { color: var(--ok); }
.chip.prov { color: var(--provisional); border-color: var(--provisional); }

.sect { margin-bottom: 18px; }
.sect h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-dim); margin: 0 0 6px; font-weight: 600;
}
.sect.vendor-sect { border-left: 3px solid var(--accent-line); padding-left: 10px; }
.sect.vendor-empty { background: var(--surface-2); border-radius: var(--radius); padding: 10px; }
.sect.vendor-empty .note { margin: 0; }

dl.kvs { margin: 0; display: grid; grid-template-columns: minmax(120px, 42%) 1fr; gap: 2px 10px; }
dl.kvs dt { font-size: 12px; color: var(--text-dim); }
dl.kvs dd { margin: 0; font-size: 13px; word-break: break-word; }
.kv.prov dd { color: var(--provisional); }

.spark-wrap { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }
.spark-wrap .note { margin: 0; }
.spark-line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.spark-flat { stroke: var(--text-dim); stroke-width: 1; stroke-dasharray: 3 3; }
.spark-dot { fill: var(--accent); }

table.mini { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 4px; }
table.mini th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-dim); font-weight: 600; padding: 3px 5px; border-bottom: 1px solid var(--border);
}
table.mini td { padding: 3px 5px; border-bottom: 1px solid var(--border-soft); }
table.mini td.id { font-family: var(--mono); }
table.mini td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------- user data */
.warn-badge { color: var(--warn); border-color: var(--warn); }
button.fav.on { color: var(--star); border-color: var(--star); }
button.danger { color: var(--accent); }
.ok-note { color: var(--ok); }
.warn-note { color: var(--warn); }
.err-note { color: var(--accent); }
.userdata-panel .stats { margin-top: 10px; }

.sect.user-sect { background: var(--surface-2); border-radius: var(--radius); padding: 10px; }
.userbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.marks { display: flex; gap: 3px; align-items: center; }
.markbtn { padding: 2px 6px; font-size: 14px; line-height: 1; background: transparent; }
.markbtn.on { background: var(--surface); box-shadow: inset 0 0 0 2px currentColor; }
.mark-piros { color: #c0392b; }
.mark-sarga { color: #b8860b; }
.mark-zold { color: #1f7a4d; }
.mark-kek { color: #2a6fb8; }
td.mark-piros, td.mark-sarga, td.mark-zold, td.mark-kek { text-align: center; }

.note-input, .small-input, .wide-input {
  font: 13px var(--sans); color: var(--text);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px 8px;
}
.note-input { width: 100%; resize: vertical; }
.small-input { width: 100px; }
.wide-input { width: 100%; }
.fieldrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.mini-lbl { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
.mini-lbl.grow { flex: 1 1 200px; }
.edited-note { color: var(--ok); }
td.edited { box-shadow: inset 2px 0 0 var(--ok); }
.sr-space { display: block; height: 11px; }

/* -------------------------------------------------------- order lists */
td.cell-interactive { padding: 0 4px; }
.qtycell { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.qtycell .qty {
  min-width: 26px; text-align: right;
  font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-dim);
}
.qtycell.on .qty { color: var(--ok); font-weight: 650; }
.qtycell button { padding: 0 5px; line-height: 1.5; font-size: 13px; background: transparent; border-color: transparent; }
.qtycell button:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border); }
.qtycell button:disabled { opacity: 0.3; cursor: default; }

.lists-panel .totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
.listnote-lbl { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
table.listrows { margin-top: 8px; }
table.listrows td { vertical-align: middle; }
table.listrows tr.missing td { background: var(--accent-soft); }
.qty-input {
  width: 76px; text-align: right;
  font: 13px var(--sans); color: var(--text);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 3px 6px;
  font-variant-numeric: tabular-nums;
}
.line-note {
  width: 100%; min-width: 120px;
  font: 12px var(--sans); color: var(--text);
  background: transparent; border: 1px solid transparent;
  border-bottom-color: var(--border-soft);
  border-radius: 0; padding: 3px 2px;
}
.line-note:focus { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.pack-warn { color: var(--warn); margin-left: 4px; cursor: help; }
.rowlink { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--border); }
.rowlink:hover { color: var(--accent); border-bottom-color: var(--accent); }
.sect.list-sect { background: var(--surface-2); border-radius: var(--radius); padding: 10px; }

/* ------------------------------------------------------------- export */
.export-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.export-cols .colpicker, .export-cols .catorder {
  margin: 0; padding: 10px; border: 1px solid var(--border-soft);
  border-radius: var(--radius); max-height: 280px; overflow-y: auto;
}
.colrow .ord {
  font: 11px var(--mono); color: var(--text-dim);
  min-width: 18px; text-align: right;
}
.controls label.inline { flex-direction: row; align-items: center; gap: 6px; text-transform: none; letter-spacing: normal; font-size: 13px; color: var(--text); }
pre.preview {
  margin: 10px 0 0; padding: 10px;
  background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius);
  font: 11.5px/1.45 var(--mono); color: var(--text);
  max-height: 340px; overflow: auto; white-space: pre; tab-size: 12;
}

/* ------------------------------------------------------- price check */
.pricecheck-panel .stats { margin: 10px 0; }
.pricecheck-panel table.mini { margin-top: 10px; }
.log-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 18px 0 6px; font-weight: 600; }
td.num.up { color: var(--accent); }
td.num.down { color: var(--ok); }
.pricecheck-panel details { margin-top: 10px; font-size: 12px; color: var(--text-dim); }
.pricecheck-panel summary { cursor: pointer; }

/* ------------------------------------------------------------------ QR */
.qr-layout { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; margin-top: 10px; }
.qr-code { background: #fff; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); }
.qr-svg svg { display: block; width: 240px; height: 240px; }
.qr-toobig { width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 13px; }
pre.qr-payload { margin: 0; max-height: 260px; }
.qr-import { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; }
.qr-import .mini-lbl { flex: 1; }
.qr-import textarea { width: 100%; }
@media (max-width: 860px) { .qr-layout { grid-template-columns: 1fr; } .qr-svg svg { width: 200px; height: 200px; } }

/* ------------------------------------------------------------ projects */
table.reqs td { vertical-align: middle; }
table.reqs tr.done-req td { color: var(--ok); }
table.reqs tr.unknown-req td { color: var(--warn); }
.req-items { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.pbar { width: 120px; height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.pbar span { display: block; height: 100%; background: var(--accent); }
.pbar.full span { background: var(--ok); }
.projects-panel .stats { margin: 10px 0; }
.projects-panel dl.kvs { margin-bottom: 10px; }

/* ------------------------------------------------------------- diagram */
.diagram { margin-top: 10px; }
.diagram-levels { display: flex; gap: 5px; margin-bottom: 8px; }
.diagram-canvas { background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 8px; }
svg.floorplan { display: block; width: 100%; max-height: 60vh; }
svg.floorplan .rooms polygon { fill: var(--surface); stroke: var(--border); stroke-width: 40; }
svg.floorplan .openings circle { fill: none; stroke: var(--text-dim); stroke-width: 30; }
svg.floorplan .openings .op-door { stroke: var(--ok); }
svg.floorplan .symbols .sym { fill: var(--text-dim); stroke: none; }
svg.floorplan .symbols .sym .hollow { fill: none; stroke: currentColor; stroke-width: 45; }
svg.floorplan .symbols .ray { stroke: currentColor; stroke-width: 40; }
/* these must out-rank ".symbols .sym" above, or a finished symbol stays grey */
svg.floorplan .symbols .sym.sym-nincs { fill: #9a968f; color: #9a968f; }
svg.floorplan .symbols .sym.sym-reszben { fill: #d3a43a; color: #d3a43a; }
svg.floorplan .symbols .sym.sym-kesz { fill: #1f7a4d; color: #1f7a4d; }
svg.floorplan .symbols .sym.sym-ismeretlen { fill: none; color: #d3a43a; }
svg.floorplan .sym-hi { filter: drop-shadow(0 0 120px currentColor); }
svg.floorplan .sym-hi circle, svg.floorplan .sym-hi rect, svg.floorplan .sym-hi polygon { stroke: var(--accent); stroke-width: 60; }

.diagram-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.legend-row { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border-soft); }
.legend-row.on { border-color: var(--accent); color: var(--accent); }
.legend-row .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend-row .dot.sym-nincs { background: #9a968f; }
.legend-row .dot.sym-reszben { background: #d3a43a; }
.legend-row .dot.sym-kesz { background: #1f7a4d; }
.legend-row .dot.sym-ismeretlen { background: transparent; box-shadow: inset 0 0 0 2px #d3a43a; }
.legend-row .cnt { font: 11px var(--mono); color: var(--text-dim); }
.legend-row .tick { color: var(--ok); }

/* ------------------------------------------------------------- printing */
#print-area { display: none; }
@media print {
  body { background: #fff; color: #000; }
  #app, .drawer { display: none !important; }
  body.printing #print-area { display: block; }
  #print-area h1 { font: 600 14pt/1.3 sans-serif; margin: 0 0 8pt; }
  #print-area pre { font: 8.5pt/1.35 monospace; white-space: pre-wrap; word-break: break-word; }
  @page { margin: 14mm; }
}

/* ------------------------------------------------------------- responsive */
@media (max-width: 860px) {
  .export-cols { grid-template-columns: 1fr; }
  #app { padding: 12px; }
  .controls label { flex: 1 1 100%; }
  .controls label select { width: 100%; }
  .scroller { max-height: 56vh; }
  .drawer { width: 100vw; border-left: 0; }
  dl.kvs { grid-template-columns: 1fr; gap: 0 0; }
  dl.kvs dt { margin-top: 6px; }
}

[hidden] { display: none !important; }

</style>
</head>

  window.VRG = window.VRG || {};
  window.VRG.inventory = {
    version: SCHEMA_VERSION,
    get: id => store.get(id),
    getByLegacy: id => store.getByLegacy(id),
    query: q => store.query(q),
    stats: () => store.stats(),
    categories: () => store.tree,
    userdata: () => userdata.serialize(),
    lists: () => lists.all().map(l => ({ id: l.id, nev: l.nev, sorok: Object.keys(l.sorok).length })),

    on: (type, fn) => bus.on(type, fn)
  };
}

  document.addEventListener('DOMContentLoaded', start);
} else {
  start();
}

    get tree() { return tree; },
    get: id => byId.get(id) || null,
    getByLegacy: id => byLegacy.get(id) || null,

// Minimal event bus. Features talk to core directly, but never to each other —
// they meet here, and app.js is the only place that subscribes across features.

function createBus() {
  const handlers = new Map();

  function on(type, fn) {
    if (!handlers.has(type)) handlers.set(type, new Set());
    handlers.get(type).add(fn);
    return () => off(type, fn);
  }

  function off(type, fn) {
    const set = handlers.get(type);
    if (set) set.delete(fn);
  }

  function emit(type, payload) {
    const set = handlers.get(type);
    if (!set) return 0;
    // copy: a handler may unsubscribe itself while we iterate
    for (const fn of [...set]) fn(payload);
    return set.size;
  }

  function types() {
    return [...handlers.keys()].filter(t => handlers.get(t).size);
  }

  return { on, off, emit, types };
}

};

// Price arithmetic and price-change detection.
//
// Vocabulary, because the sources mix three different prices:
//   listaár        the vendor's own net list price
//   nettó egységár our partner-specific DISCOUNTED net price (what we pay)
//   bruttó         gross; in this dataset always *computed* as net × (1 + VAT)

//                  the webshop and is therefore a real gross price

  return Math.round(net * (1 + (vat == null ? VAT_RATE : vat)));
}

function net(grossValue, vat) {
  if (grossValue == null || grossValue === '') return null;
  return Math.round((grossValue / (1 + (vat == null ? VAT_RATE : vat))) * 100) / 100;
}

  if (!listaar || nettoEgysegar == null) return null;
  return Math.round((1 - nettoEgysegar / listaar) * 1000) / 10;

    netto: a.netto_huf == null ? null : a.netto_huf,
    brutto: a.brutto_huf == null ? gross(a.netto_huf) : a.brutto_huf,
    datum: a.datum || null,
    forras: a.forras || null,

 * Returns null when there is nothing to compare or nothing changed, otherwise
 * the entry to append to the finance log (Phase 7).

  }
  if (previous === current) return null;
  const diff = current - previous;
  return Object.assign({
    regi_brutto: previous,
    uj_brutto: current,
    valtozas_huf: Math.round(diff * 100) / 100,

        kv('Ár ellenőrizve', fmt.date(store.vendors.read(it, 'v_ellenorizve')))

      hist.length ? el('div', { class: 'spark-wrap' }, [

        el('span', { class: 'note', text: hist.length === 1 ? '1 megfigyelés' : hist.length + ' megfigyelés' })

// Shared presentational bits.

const { el } = __req("ui/dom.js");

const NS = 'http://www.w3.org/2000/svg';

function svg(tag, attrs) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v != null) node.setAttribute(k, String(v));
  }
  return node;
}

/**
 * Price sparkline. Deliberately blunt: a flat line for a single observation,
 * and nothing at all for none, so it can never imply a trend that is not there.
 */
function sparkline(values, opts) {
  const w = (opts && opts.width) || 180;
  const h = (opts && opts.height) || 34;
  const pad = 3;
  if (!values || values.length === 0) return null;

  const root = svg('svg', {
    width: w, height: h, viewBox: `0 0 ${w} ${h}`, class: 'spark',
    role: 'img', 'aria-label': 'Ár alakulása'
  });

  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = max - min || 1;
  const x = i => pad + (values.length === 1 ? (w - 2 * pad) / 2 : (i / (values.length - 1)) * (w - 2 * pad));
  const y = v => h - pad - ((v - min) / span) * (h - 2 * pad);

  if (values.length === 1) {
    root.appendChild(svg('line', { x1: pad, y1: h / 2, x2: w - pad, y2: h / 2, class: 'spark-flat' }));
  } else {
    root.appendChild(svg('polyline', {
      points: values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '),
      class: 'spark-line'
    }));
  }
  values.forEach((v, i) => {
    root.appendChild(svg('circle', {
      cx: x(i).toFixed(1), cy: (values.length === 1 ? h / 2 : y(v)).toFixed(1), r: 2.5,
      class: 'spark-dot'
    }));
  });
  return root;
}

function kv(label, value, cls) {
  return el('div', { class: 'kv' + (cls ? ' ' + cls : '') }, [
    el('dt', { text: label }),
    el('dd', { class: value == null || value === '' || value === '—' ? 'muted' : null, text: value == null || value === '' ? '—' : String(value) })
  ]);
}

function section(title, children, cls) {
  return el('section', { class: 'sect' + (cls ? ' ' + cls : '') }, [
    el('h3', { text: title }),
    ...[].concat(children).filter(Boolean)
  ]);
}

function chip(text, cls) {
  return el('span', { class: 'chip' + (cls ? ' ' + cls : ''), text });
}


Object.assign(exports, { sparkline, kv, section, chip, svg });
};

__defs["features/userdata/panel.js"] = function (exports, __req) {
// "Saját adatok" panel: what is stored, and how to move it between copies.
//
// The promise this panel has to keep: export here, import into a fresh copy of
// the HTML, and you are exactly where you left off.

const { el, clear } = __req("ui/dom.js");
const { sanitize, USERDATA_VERSION } = __req("core/userdata.js");

function stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

function createUserDataPanel(opts) {
  const { store, userdata, storage, onImported, onReset } = opts;

  const summary = el('div', { class: 'stats' });
  const message = el('p', { class: 'note' });
  const fileInput = el('input', {
    type: 'file', accept: 'application/json,.json', hidden: true,
    onchange: e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; }
  });

  function say(text, kind) {
    message.textContent = text;
    message.className = 'note' + (kind ? ' ' + kind : '');
  }

  function refresh() {
    const s = userdata.stats();
    const st = store.stats();
    clear(summary);
    const box = (v, l, cls) => summary.appendChild(el('div', { class: 'stat' + (cls ? ' ' + cls : '') }, [
      el('b', { text: String(v) }), el('span', { text: l })
    ]));
    box(s.tetelek, 'tétel saját adattal');
    box(s.kedvencek, 'kedvenc');
    box(s.megjegyzessel, 'megjegyzés');
    box(s.jelolessel, 'jelölés');
    box(s.felulirt_mezok, 'saját mezőérték');
    box(st.tomeggel, 'tömeg kitöltve');
  }

  function download() {
    const doc = userdata.serialize();
    const json = JSON.stringify(doc, null, 1);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: `vrg-sajat-adatok-${stamp()}.json` });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    say(`Mentve: ${Object.keys(doc.items).length} tétel saját adata (séma ${USERDATA_VERSION}).`, 'ok-note');
  }

  function readFile(file) {
    const reader = new FileReader();
    reader.onerror = () => say('A fájlt nem sikerült beolvasni.', 'err-note');
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (e) {
        return say('A fájl nem érvényes JSON.', 'err-note');
      }
      let result;
      try {
        result = sanitize(parsed, id => !!store.get(id));
      } catch (e) {
        return say('Importálás sikertelen: ' + e.message, 'err-note');
      }
      const count = Object.keys(result.doc.items).length;
      if (!confirm(`Importálás: ${count} tétel saját adata.\n\nEz felülírja a jelenlegi saját adataidat ezen a gépen. Folytatod?`)) {
        return say('Importálás megszakítva.', null);
      }
      userdata.replace(result.doc);
      onImported(result.doc);
      refresh();
      say([`Importálva: ${count} tétel.`].concat(result.warnings).join(' '),
        result.warnings.length ? 'warn-note' : 'ok-note');
    };
    reader.readAsText(file);
  }

  function reset() {
    if (!confirm('Minden saját adat törlése ezen a gépen: megjegyzések, kedvencek, jelölések, saját mezőértékek.\n\nExportáltad már? Ez nem vonható vissza.')) return;
    userdata.reset();
    storage.clearAll();
    onReset();
    refresh();
    say('Saját adatok törölve ezen a gépen.', 'warn-note');
  }

  const root = el('div', { class: 'panel userdata-panel', hidden: true }, [
    el('div', { class: 'controls' }, [
      el('button', { type: 'button', onclick: download, text: '⭳ Saját adatok mentése fájlba' }),
      el('button', { type: 'button', onclick: () => fileInput.click(), text: '⭱ Saját adatok betöltése' }),
      el('div', { class: 'spacer' }),
      el('button', { type: 'button', class: 'ghost danger', onclick: reset, text: 'Törlés ezen a gépen' })
    ]),
    summary,
    message,
    el('p', {
      class: 'note',
      text: storage.available
        ? 'A saját adataid ebben a böngészőben tárolódnak, ezen a gépen. Másik gépre vagy a HTML új példányába a mentett fájllal viszed át őket — a katalógus adatai külön élnek, adatfrissítéskor a saját adataid megmaradnak.'
        : 'FIGYELEM: ez a böngésző nem engedi a helyi tárolást, ezért a saját adataid csak addig élnek, amíg nyitva van az oldal. Munka végén mentsd ki őket fájlba.'
    }),
    fileInput
  ]);

  refresh();
  return { root, refresh, toggle: () => { root.hidden = !root.hidden; if (!root.hidden) refresh(); return !root.hidden; } };
}


Object.assign(exports, { createUserDataPanel });
};

__defs["features/lists/panel.js"] = function (exports, __req) {
// Order-list panel: the active list, its lines, and what it costs.
//
// A list stores ids and quantities only, so everything shown here is resolved
// live against the catalogue and the selected vendor. Switch vendor and the
// same list re-prices itself.

const { el, clear, option } = __req("ui/dom.js");
const fmt = __req("core/format.js");

function createListPanel(opts) {
  const { store, lists, onChange, onPick } = opts;

  const picker = el('select', {
    id: 'l-active',
    onchange: e => { lists.setActive(e.target.value || null); render(); onChange(); }
  });
  const listNote = el('input', {
    type: 'text', class: 'wide-input', placeholder: 'Megjegyzés a listához…',
    oninput: e => lists.setListNote(lists.activeId(), e.target.value)
  });
  const body = el('div');
  const totalsBar = el('div', { class: 'totals' });

  function ask(message, fallback) {
    const v = prompt(message, fallback || '');
    return v == null ? null : v.trim();
  }

  const buttons = el('div', { class: 'controls' }, [
    el('label', { for: 'l-active' }, ['Aktív lista', picker]),
    el('button', {
      type: 'button', text: '+ Új lista',
      onclick: () => { const n = ask('Új lista neve:'); if (n !== null) { lists.create(n); render(); onChange(); } }
    }),
    el('button', {
      type: 'button', class: 'ghost', text: 'Átnevezés',
      onclick: () => {
        const l = lists.active(); if (!l) return;
        const n = ask('Lista új neve:', l.nev);
        if (n) { lists.rename(l.id, n); render(); onChange(); }
      }
    }),
    el('button', {
      type: 'button', class: 'ghost', text: 'Másolat',
      onclick: () => { const l = lists.active(); if (l) { lists.duplicate(l.id); render(); onChange(); } }
    }),
    el('button', {
      type: 'button', class: 'ghost', text: 'Összefésülés…',
      onclick: () => mergeDialog()
    }),
    el('div', { class: 'spacer' }),
    el('button', {
      type: 'button', class: 'ghost', text: 'Sorok törlése',
      onclick: () => {
        const l = lists.active(); if (!l) return;
        if (confirm(`"${l.nev}" összes sorának törlése?`)) { lists.clearLines(l.id); render(); onChange(); }
      }
    }),
    el('button', {
      type: 'button', class: 'ghost danger', text: 'Lista törlése',
      onclick: () => {
        const l = lists.active(); if (!l) return;
        if (confirm(`"${l.nev}" lista törlése véglegesen?`)) { lists.remove(l.id); render(); onChange(); }
      }
    })
  ]);

  function mergeDialog() {
    const target = lists.active();
    if (!target) return;
    const others = lists.all().filter(l => l.id !== target.id);
    if (!others.length) return alert('Nincs másik lista, amivel össze lehetne fésülni.');
    const names = others.map((l, i) => `${i + 1}. ${l.nev} (${Object.keys(l.sorok).length} sor)`).join('\n');
    const pick = prompt(`Melyik listát fésüljem bele a(z) "${target.nev}" listába?\n\n${names}\n\nÍrd be a sorszámot:`);
    const idx = Number(pick) - 1;
    if (!Number.isInteger(idx) || idx < 0 || idx >= others.length) return;
    const r = lists.merge(target.id, others[idx].id);
    render(); onChange();
    alert(`Kész: ${r.added} új sor, ${r.summed} sornál a mennyiségek összeadódtak.`);
  }

  function renderPicker() {
    const ls = lists.all();
    clear(picker);
    if (!ls.length) {
      picker.appendChild(option('', 'nincs lista', true));
      return;
    }
    for (const l of ls) {
      picker.appendChild(option(l.id, `${l.nev} — ${Object.keys(l.sorok).length} sor`, l.id === lists.activeId()));
    }
  }

  function renderTotals(t) {
    clear(totalsBar);
    const vendor = store.vendors.selectedVendor();
    const box = (v, label, cls) => totalsBar.appendChild(el('div', { class: 'stat' + (cls ? ' ' + cls : '') }, [
      el('b', { text: v }), el('span', { text: label })
    ]));
    box(String(t.sorok), 'sor');
    box(fmt.num(t.osszes_mennyiseg), 'összes mennyiség');
    box(fmt.huf(t.netto), vendor ? `nettó — ${vendor.nev}` : 'nettó (becsült árakkal)');
    box(fmt.huf(t.brutto), 'bruttó (27% ÁFA)');
    if (t.ar_nelkul) box(String(t.ar_nelkul), 'sor ár nélkül', 'gap');
    if (t.csomag_figyelmeztetes) box(String(t.csomag_figyelmeztetes), 'kiszerelés-eltérés', 'gap');
    if (t.hianyzo_tetel) box(String(t.hianyzo_tetel), 'ismeretlen tétel', 'gap');
  }

  function renderRows() {
    const l = lists.active();
    clear(body);
    if (!l) {
      body.appendChild(el('p', { class: 'note', text: 'Még nincs lista. Hozz létre egyet, aztán a katalógus „Lista” oszlopában a + gombbal vehetsz fel tételeket.' }));
      return;
    }
    listNote.value = l.megjegyzes || '';
    const rows = lists.rows(l.id);
    if (!rows.length) {
      body.appendChild(el('p', { class: 'note', text: 'Ez a lista üres. A katalógus „Lista” oszlopában a + gombbal vehetsz fel tételeket.' }));
      return;
    }

    const vendorOn = !!store.vendors.selectedId();
    const head = ['', 'Megnevezés', 'Mennyiség', 'Egységár', 'Sor összesen', 'Megjegyzés', ''];
    body.appendChild(el('table', { class: 'mini listrows' }, [
      el('thead', {}, [el('tr', {}, head.map((h, i) =>
        el('th', { class: i === 2 || i === 3 || i === 4 ? 'num' : null, text: h })))]),
      el('tbody', {}, rows.map(r => rowNode(r, l, vendorOn)))
    ]));
  }

  function rowNode(r, l, vendorOn) {
    if (r.hianyzo) {
      return el('tr', { class: 'missing' }, [
        el('td', { class: 'id', text: r.vrg_id }),
        el('td', { colspan: '4', class: 'warn-note', text: 'Ez a tétel nincs a mostani katalógusban — a sor megmaradt, de nem árazható.' }),
        el('td'),
        el('td', {}, [removeBtn(r, l)])
      ]);
    }

    const qtyInput = el('input', {
      type: 'number', min: '0', step: 'any', class: 'qty-input',
      onchange: e => { lists.setQty(r.vrg_id, e.target.value, l.id); render(); onChange(); }
    });
    qtyInput.value = String(r.mennyiseg);

    const noteInput = el('input', {
      type: 'text', class: 'line-note', placeholder: '—',
      oninput: e => lists.setLineNote(r.vrg_id, e.target.value, l.id)
    });
    noteInput.value = r.megjegyzes;

    const packWarn = !r.csomag_ok
      ? el('span', {
        class: 'pack-warn',
        title: `A beszállító kiszerelése ${r.csomag_mennyiseg} ${r.item.egyseg || 'db'} — ${r.mennyiseg} nem egész csomag.`,
        text: '⚠'
      })
      : null;

    return el('tr', {}, [
      el('td', { class: 'id', text: r.vrg_id }),
      el('td', {}, [
        el('a', {
          href: '#', class: 'rowlink',
          onclick: e => { e.preventDefault(); onPick(r.vrg_id); },
          text: r.item.megnevezes
        })
      ]),
      el('td', { class: 'num' }, [qtyInput, ' ', r.item.egyseg || '', packWarn]),
      el('td', { class: 'num' + (r.egysegar_forras === 'becsles' ? ' muted' : ''), title: r.egysegar_forras === 'becsles' ? 'Becsült ár — nincs kiválasztva beszállító, vagy nincs beszállítói ára' : null, text: fmt.huf(r.egysegar) }),
      el('td', { class: 'num', text: fmt.huf(r.sor_netto) }),
      el('td', {}, [noteInput]),
      el('td', {}, [removeBtn(r, l)])
    ]);
  }

  function removeBtn(r, l) {
    return el('button', {
      type: 'button', class: 'tiny ghost', text: '✕', title: 'Sor törlése',
      onclick: () => { lists.setQty(r.vrg_id, 0, l.id); render(); onChange(); }
    });
  }

  function render() {
    renderPicker();
    renderRows();
    renderTotals(lists.totals());
  }

  const root = el('div', { class: 'panel lists-panel', hidden: true }, [
    buttons,
    el('label', { class: 'mini-lbl listnote-lbl' }, ['Lista megjegyzés', listNote]),
    totalsBar,
    body
  ]);

  render();
  return {
    root, render,
    toggle: () => { root.hidden = !root.hidden; if (!root.hidden) render(); return !root.hidden; },
    show: () => { root.hidden = false; render(); }
  };
}


Object.assign(exports, { createListPanel });
};

__defs["features/export/panel.js"] = function (exports, __req) {
// Export panel: pick a profile, see exactly what it will produce, then save,
// copy or print it.
//
// The preview is the point. An export you cannot see before sending is an
// export you will get wrong once and not notice.

const { el, clear, option } = __req("ui/dom.js");
const exporters = __req("core/io/exporters.js");
const { parseListCsv } = __req("core/io/importers.js");
const categories = __req("core/categories.js");
const fmt = __req("core/format.js");
const { catalogFields, listFields, visibleFields, pick } = __req("features/export/fields.js");

const FORMAT_LABEL = {
  csv: 'CSV (Excel)', tsv: 'TSV (tabulátor)', txt: 'Kétrétegű szöveg (ember + AI)',
  json: 'JSON', rendeles: 'Rendelés szövege a beszállítónak'
};

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

function createExportPanel(opts) {
  const { store, lists, profiles, catalogColumns, onImported, onProfileChange } = opts;
  const ctx = { vendors: store.vendors };

  const CATALOG = catalogFields(catalogColumns);
  const LIST = listFields();
  const fieldsFor = target => (target === 'lista' ? LIST : CATALOG);

  let currentId = null;

  const profileSelect = el('select', {
    id: 'x-profile',
    onchange: e => { currentId = e.target.value; render(); announce(); }
  });

  function announce() {
    if (onProfileChange && currentId) onProfileChange(currentId);
  }
  const message = el('p', { class: 'note' });
  const preview = el('pre', { class: 'preview' });
  const summary = el('p', { class: 'note' });
  const fieldBox = el('div', { class: 'colpicker' });
  const catOrderBox = el('div', { class: 'catorder' });
  const importInput = el('input', {
    type: 'file', accept: '.csv,.tsv,.txt,text/csv', hidden: true,
    onchange: e => { const f = e.target.files[0]; if (f) importList(f); e.target.value = ''; }
  });

  function say(text, kind) {
    message.textContent = text || '';
    message.className = 'note' + (kind ? ' ' + kind : '');
  }

  function current() {
    const p = currentId ? profiles.get(currentId) : null;
    return p || profiles.all()[0] || null;
  }

  // ------------------------------------------------------------ building
  function rowsFor(profile) {
    if (profile.target === 'lista') {
      const rows = lists.rows();
      return order(rows, r => (r.item ? categories.key(r.item) : '(hiányzó tétel)'), profile);
    }
    const items = store.query({ sort: 'nev' });
    return order(items, it => categories.key(it), profile);
  }

  function order(rows, keyOf, profile) {
    const ordered = exporters.orderByCategory(rows, keyOf, profile.categoryOrder);
    if (profile.groupByCategory) return ordered;
    // no grouping asked for: keep a stable, meaningful order instead
    return rows.slice();
  }

  function build(profile) {
    const fields = pick(fieldsFor(profile.target), profile.columns, ctx);
    const rows = rowsFor(profile);
    const keyOf = profile.target === 'lista'
      ? r => (r.item ? categories.key(r.item) : '(hiányzó tétel)')
      : it => categories.key(it);
    const groupBy = profile.groupByCategory ? keyOf : null;
    const vendor = store.vendors.selectedVendor();

    if (profile.format === 'rendeles') {
      if (profile.target !== 'lista') throw new Error('A rendelés-formátum csak listához használható.');
      if (!vendor) throw new Error('Válassz beszállítót — rendelést nem lehet címzett nélkül kiírni.');
      const l = lists.active();
      const orderRows = lists.rows().filter(r => r.item).map(r => ({
        cikkszam: store.vendors.read(r.item, 'v_cikkszam'),
        mennyiseg: r.mennyiseg,
        egyseg: r.item.egyseg,
        megnevezes: r.item.megnevezes,
        megjegyzes: r.megjegyzes
      }));
      return {
        text: exporters.vendorOrder({
          rows: orderRows, vendor, listName: l && l.nev, note: l && l.megjegyzes, totals: lists.totals()
        }),
        ext: 'txt', rowCount: orderRows.length
      };
    }

    if (profile.format === 'json') {
      const payload = rows.map(r => {
        const o = {};
        for (const f of fields) o[f.id] = f.exportValue ? f.exportValue(r, ctx) : f.get(r, ctx);
        return o;
      });
      return { text: exporters.json({ payload }), ext: 'json', rowCount: rows.length };
    }

    if (profile.format === 'txt') {
      const l = profile.target === 'lista' ? lists.active() : null;
      return {
        text: exporters.dualText({
          title: profile.target === 'lista'
            ? `VRG RENDELÉSI LISTA — ${(l && l.nev) || 'névtelen'}`
            : 'VRG KÉSZLET-ADATBÁZIS — TÉTELLISTA',
          meta: {
            schema: profile.target === 'lista' ? 'vrg-order-list' : 'vrg-inventory',
            schema_version: store.doc.schema_version,
            generated: new Date().toISOString().slice(0, 10),
            currency: 'HUF',
            vat_rate: '0.27',
            vendor: vendor ? vendor.id : 'none'
          },
          preamble: vendor
            ? [`Árak: ${vendor.nev} nettó egységárai.`, 'A bruttó értékek 27% ÁFA-val számított becslések.']
            : ['Semleges nézet: beszállítói adat nélkül, becsült árakkal.',
              'A bruttó értékek 27% ÁFA-val számított becslések.'],
          aiNotes: [
            '@note  A list line owns only vrg_id and mennyiseg; names and prices are',
            '@note  resolved from the catalogue at export time and may change later.'
          ],
          rows, columns: fields, ctx, groupBy
        }),
        ext: 'txt', rowCount: rows.length
      };
    }

    const text = exporters.csv({
      rows, columns: fields, ctx,
      dialect: profile.format === 'tsv' ? 'tsv' : profile.dialect,
      header: profile.header,
      groupBy
    });
    return { text, ext: profile.format === 'tsv' ? 'tsv' : 'csv', rowCount: rows.length };
  }

  function safeBuild(profile) {
    try {
      const r = build(profile);
      say('');
      return r;
    } catch (e) {
      say(e.message, 'err-note');
      return null;
    }
  }

  // ------------------------------------------------------------- actions
  function download() {
    const p = current(); if (!p) return;

// Export formats.
//
// Everything here is a pure function from data to a string, so an export can
// be unit-tested without a browser and re-imported by importers.js. The
// exporters take column descriptors as an argument rather than importing the

  'standard': { sep: ',', decimal: '.', bom: false, eol: '\n' },
  'tsv': { sep: '\t', decimal: '.', bom: false, eol: '\n' }

  const d = DIALECTS[name];

 * Categories the user has not ranked keep their Hungarian alphabetical order
 * after the ranked ones, so an incomplete order never hides anything.

    if (ra !== rb) return ra - rb;
    if (ka !== kb) return ka.localeCompare(kb, 'hu');

  L.push('');
  if (o.totals) {
    L.push(`Sorok: ${o.totals.sorok}   Nettó összesen: ${o.totals.netto} Ft   Bruttó: ${o.totals.brutto} Ft`);

// ----------------------------------------------------------- dual-layer text
const RULE = '='.repeat(78);
const THIN = '-'.repeat(78);

/**
 * The format the whole project is built around: a human-readable block, then
 * an `@`-tagged machine block carrying the schema and the same data as TSV, so
 * one text file is enough for a person *or* an agent to rebuild from.
 */

  L.push(title);

  if (metaLine) L.push(metaLine);
  L.push(RULE);
  L.push('');

  if ((o.preamble || []).length) L.push('');

      const g = groupBy(row);
      if (g !== lastGroup) {
        lastGroup = g;
        L.push(THIN);
        L.push(g.toUpperCase());
        L.push(THIN);
      }
    }
    const parts = columns.map(c => {
      const s = c.show ? c.show(row, ctx) : c.get(row, ctx);
      return s == null || s === '' ? null : `${c.label}: ${s}`;
    }).filter(Boolean);
    L.push('  ' + parts.join('  |  '));
  }

  L.push('');
  L.push(RULE);
  L.push('AI-CONTEXT BLOCK — MACHINE READABLE. Everything below this line is');
  L.push('written for an AI agent / importer, not for a human reader.');
  L.push(RULE);
  L.push('');
  for (const [k, v] of Object.entries(meta || {})) L.push('@' + k.padEnd(18) + ' ' + v);
  L.push('@row_count         ' + rows.length);
  L.push('@encoding          UTF-8, LF line endings');
  L.push('@decimal_separator "." inside this block');
  L.push('');

  if ((aiNotes || []).length) L.push('');

  L.push('@data_tsv  columns: ' + tcols.map(c => c.id).join('\t'));
  for (const row of rows) {
    L.push(tcols.map(c => {
      const v = c.exportValue ? c.exportValue(row, ctx) : c.get(row, ctx);
      return v == null ? '' : String(v).replace(/[\t\r\n]/g, ' ');
    }).join('\t'));

  L.push('@end_data_tsv');
  L.push('');
  return L.join('\n');
}

// Price check: compare what the vendor's site says today with what we last
// recorded, and turn the difference into events.
//
// Two rules shape this module:
//
//   1. A check never touches the price we negotiated. `netto_egysegar_huf`
//      comes from an order document; only `aktualis_brutto_ar_huf` (the shelf
//      price), `keszlet_db` and `ar_ellenorizve` are refreshed.
//   2. A reading that did not change is still a reading. It updates
//      `ar_ellenorizve` so you can tell "checked, unchanged" from "never
//      checked" — but it produces no log entry, because nothing happened.

const CHECK_SCHEMA = 'vrg-price-check';

 * than trusted — this file comes from a helper script or a colleague.
 */

  const o = opts || {};
  if (!input || typeof input !== 'object') throw new Error('A fájl nem érvényes JSON objektum.');
  if (input.schema !== CHECK_SCHEMA) {
    throw new Error(`Nem árellenőrzés-fájl (schema: ${JSON.stringify(input.schema)}).`);
  }
  const vendor = String(input.vendor || '');
  if (!vendor) throw new Error('A fájl nem mondja meg, melyik beszállítóról szól.');
  if (o.knownVendor && !o.knownVendor(vendor)) {
    throw new Error(`Ismeretlen beszállító a fájlban: ${vendor}`);
  }

  const warnings = [];
  const rows = Array.isArray(input.tetelek) ? input.tetelek : [];
  const seen = new Set();
  const clean = [];
  for (const r of rows) {
    if (!r || typeof r !== 'object') continue;
    const id = String(r.vrg_id || '');
    if (!/^VRG-\d{4,}$/.test(id)) { warnings.push('Érvénytelen azonosító, kihagyva: ' + JSON.stringify(r.vrg_id)); continue; }
    if (o.knownId && !o.knownId(id)) { warnings.push(`${id}: nincs ilyen tétel a katalógusban.`); continue; }
    if (seen.has(id)) { warnings.push(`${id}: többször szerepel, az elsőt használom.`); continue; }
    seen.add(id);

 * review before anything is written — a price update you cannot inspect first
 * is one you will accept wrongly once and not notice.
 */
function planCheck(check, store) {

  const valtozasok = [];
  const valtozatlan = [];
  const ujak = [];
  const kihagyva = [];

  for (const row of check.tetelek) {
    const item = store.get(row.vrg_id);
    if (!item || !item.vendors || !item.vendors[vendor]) {
      kihagyva.push({ vrg_id: row.vrg_id, ok: 'ez a beszállító nem viszi a tételt' });
      continue;
    }
    if (row.brutto_ar_huf == null) {
      kihagyva.push({ vrg_id: row.vrg_id, ok: 'a fájl nem tartalmaz árat' });
      continue;
    }

      megnevezes: item.megnevezes,
      regi_brutto: regi == null ? null : Number(regi),
      uj_brutto: row.brutto_ar_huf,
      keszlet: row.keszlet,
      url: row.url || (item.vendors[vendor].termek_link || '')
    };

// What goes inside a QR code.
//
// Two payloads, because they serve two different readers:
//
//   compact  ids + quantities only. Re-importable by this app, meaningless to
//            a human. ~350 lines fit in one code, so a realistic order list
//            never needs splitting.
//   text     the list as a person would read it. Fits ~40 lines. This is the
//            one worth scanning with a phone's own camera, because the camera
//            shows you the text and lets you share it straight into a message.
//
// The compact format is deliberately plain ASCII with no compression: a QR
// encoder packs alphanumerics far better than it packs base64 of a deflate
// stream, so "compressing" it would make the code BIGGER. Measured, not assumed.

const SEP = '|';

  const m = /^VRG-(\d{4,})$/.exec(String(vrgId || ''));
  return m ? m[1] : String(vrgId || '');
}

function longId(short) {
  return /^\d{4,}$/.test(short) ? 'VRG-' + short : String(short);

function shortQty(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return '0';
  return Number.isInteger(v) ? String(v) : String(Math.round(v * 1000) / 1000);

 * encodeList({ nev, sorok:[{vrg_id, mennyiseg}] }) -> "VRGL1|Hetényi|0098:7,0004:1"
 * The list name is included because a list without a name arrives as a puzzle.

  // gap where it was
  const nev = String((list && list.nev) || '').replace(/[|,]/g, ' ').replace(/\s+/g, ' ').trim();

    .filter(r => r && r.vrg_id && Number(r.mennyiseg) > 0)
    .map(r => shortId(r.vrg_id) + ':' + shortQty(r.mennyiseg));

 * Read a compact payload back. Returns { nev, sorok, warnings } and never
 * throws on a malformed row — it reports it, because a payload that arrived by
 * camera or clipboard has had every chance to be mangled.

// A project: a job, the requirements imported from its Planner drawing, and
// the order list that answers them.
//
// The project owns a list rather than duplicating it, so every list feature —
// quantities, notes, totals, export, QR — works on a project's list unchanged.

let counter = 0;
function newId() {
  counter += 1;
  return 'pr' + Date.now().toString(36) + counter.toString(36);
}

  const { userdata, lists } = opts;

  const doc = () => userdata.doc;
  const all = () => Object.values(doc().projects || {})
    .sort((a, b) => a.nev.localeCompare(b.nev, 'hu'));

  const get = id => (doc().projects || {})[id] || null;
  const activeId = () => doc().activeProject;
  const active = () => get(activeId());

  function create(fields) {
    return userdata.mutate(d => {
      const id = newId();
      const f = fields || {};
      d.projects[id] = {
        id,
        nev: String(f.nev || '').trim() || 'Új projekt',
        cim: String(f.cim || ''),
        datum: String(f.datum || new Date().toISOString().slice(0, 10)),
        megjegyzes: String(f.megjegyzes || ''),
        listaId: f.listaId || null,
        terv: f.terv || null
      };
      d.activeProject = id;
      return d.projects[id];
    });
  }

  function setActive(id) {
    if (id !== null && !get(id)) return false;
    userdata.mutate(d => { d.activeProject = id; });
    return true;
  }

  function update(id, patch) {
    if (!get(id)) return false;
    userdata.mutate(d => {
      const p = d.projects[id];
      for (const k of ['nev', 'cim', 'datum', 'megjegyzes']) {
        if (patch[k] !== undefined) p[k] = String(patch[k]);
      }
      if (patch.terv !== undefined) p.terv = patch.terv;
      if (patch.listaId !== undefined) p.listaId = patch.listaId;
    });
    return true;
  }

  function remove(id, alsoList) {
    const p = get(id);
    if (!p) return false;
    const listId = p.listaId;
    userdata.mutate(d => {
      delete d.projects[id];
      if (d.activeProject === id) d.activeProject = Object.keys(d.projects)[0] || null;
    });
    if (alsoList && listId) lists.remove(listId);
    return true;
  }

  /** Every project needs somewhere to put items; make one on demand. */
  function ensureList(id) {
    const p = get(id);
    if (!p) return null;
    if (p.listaId && lists.get(p.listaId)) return lists.get(p.listaId);
    const l = lists.create(p.nev);
    update(id, { listaId: l.id });
    return l;
  }

  /** The project's list, made active so every other panel follows along. */
  function focus(id) {
    const p = get(id);
    if (!p) return null;
    setActive(id);
    const l = ensureList(id);
    if (l) lists.setActive(l.id);
    return l;
  }

  function rows(id) {
    const p = get(id || activeId());
    if (!p || !p.listaId) return [];
    return lists.rows(p.listaId);

    const ps = all();
    return {
      projektek: ps.length,
      tervvel: ps.filter(p => p.terv && p.terv.igenyek && p.terv.igenyek.length).length

// Projects panel: import a Planner drawing, see what it needs, and watch the
// list fill up against it.
//
// The progress bars are the point. A plan says "36 sockets"; this says how
// many of those 36 you have actually chosen a product for.

const { el, clear, option } = __req("ui/dom.js");
const fmt = __req("core/format.js");
const pi = __req("core/plannerimport.js");
const { createDiagram } = __req("features/projects/diagram.js");

function createProjectPanel(opts) {
  const { store, lists, projects, onChanged, onPickCategory } = opts;
  const diagram = createDiagram({ onPickCategory });

  const message = el('p', { class: 'note' });
  const body = el('div');
  const fileInput = el('input', {
    type: 'file', accept: '.json,.vplan,application/json', hidden: true,
    onchange: e => { const f = e.target.files[0]; if (f) importPlan(f); e.target.value = ''; }
  });

  function say(text, kind) {
    message.textContent = text || '';
    message.className = 'note' + (kind ? ' ' + kind : '');
  }

  const picker = el('select', {
    id: 'pr-active',
    onchange: e => { projects.focus(e.target.value); onChanged(); render(); }
  });

  // ------------------------------------------------------------- import
  function importPlan(file) {
    const reader = new FileReader();
    reader.onerror = () => say('A fájlt nem sikerült beolvasni.', 'err-note');
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch (e) { return say('A fájl nem érvényes JSON.', 'err-note'); }

      let plan;
      try { plan = pi.parsePlan(parsed); }
      catch (e) { return say('Importálás sikertelen: ' + e.message, 'err-note'); }

      const p = projects.create({
        nev: plan.projekt.megnevezes || plan.nev,
        cim: plan.projekt.cim,
        datum: (plan.mentve || '').slice(0, 10),
        terv: { forras: plan.forras, nev: plan.nev, mentve: plan.mentve, igenyek: plan.igenyek, rajz: plan.rajz }
      });
      projects.focus(p.id);
      onChanged();
      render();
      say([`Importálva: „${plan.nev}” — ${plan.osszegzes.eszkoz} eszköz, ` +
        `${plan.osszegzes.nyomvonal_fm} fm nyomvonal, ${plan.igenyek.length} igény.`]
        .concat(plan.warnings).join(' '),
        plan.warnings.length ? 'warn-note' : 'ok-note');
    };
    reader.readAsText(file);
  }

  // ----------------------------------------------------------- autofill
  function autofill() {
    const p = projects.active();
    if (!p || !p.terv) return;
    const l = projects.ensureList(p.id);
    const prog = pi.progress(p.terv, lists.rows(l.id));
    const plan = pi.autofillPlan(prog, store);

    if (!plan.javaslatok.length) {
      return say('Nincs mit kitölteni: ' +
        (plan.nincs.length ? plan.nincs.map(n => n.igeny.cimke + ' — ' + n.ok).join('; ')
          : 'minden igény teljesítve.'),
        plan.nincs.length ? 'warn-note' : 'ok-note');
    }

    const preview = plan.javaslatok
      .map(j => `${j.igeny.cimke}: ${j.mennyiseg} ${j.igeny.egyseg} → ${j.item.megnevezes} (${j.miert})`)
      .join('\n');
    if (!confirm(`Kitöltöm ezeket?\n\n${preview}\n\nA mennyiségek hozzáadódnak a listához.`)) {
      return say('Kitöltés megszakítva.');
    }
    for (const j of plan.javaslatok) lists.add(j.item.vrg_id, j.mennyiseg, l.id);
    onChanged();
    render();
    say(`Kitöltve: ${plan.javaslatok.length} igény.` +
      (plan.nincs.length ? ` ${plan.nincs.length} igényhez nincs megfelelő tétel a katalógusban.` : ''),
      plan.nincs.length ? 'warn-note' : 'ok-note');
  }

  function renderPicker() {

    for (const p of ps) picker.appendChild(option(p.id, p.nev, p.id === projects.activeId()));
  }

      el('span', { style: `width:${pct}%` })
    ]);
  }

  function render() {
    renderPicker();
    clear(body);
    const p = projects.active();
    if (!p) {
      body.appendChild(el('p', {
        class: 'note',
        text: 'Még nincs projekt. Importálj egy Planner mentést (.vplan.json) — a rajzból kiolvasom, ' +
          'miből mennyi kell, és innentől látod, mennyi van már kiválasztva.'
      }));
      return;
    }

    const l = p.listaId ? lists.get(p.listaId) : null;
    body.appendChild(el('dl', { class: 'kvs' }, [
      el('dt', { text: 'Cím' }), el('dd', { class: p.cim ? null : 'muted', text: p.cim || '—' }),
      el('dt', { text: 'Terv' }), el('dd', { text: p.terv ? `${p.terv.nev} (${(p.terv.mentve || '').slice(0, 10)})` : '—' }),
      el('dt', { text: 'Lista' }), el('dd', { text: l ? `${l.nev} — ${Object.keys(l.sorok).length} sor` : '—' })
    ]));

    if (!p.terv || !p.terv.igenyek.length) {
      body.appendChild(el('p', { class: 'note', text: 'Ehhez a projekthez nincs importált terv.' }));
      return;
    }

    const prog = pi.progress(p.terv, projects.rows(p.id));
    body.appendChild(el('div', { class: 'stats' }, [
      ['b', `${prog.kesz}/${prog.osszes}`, 'igény teljesítve'],
      ['b', prog.hianyzo_fajta, 'fajta hiányzik'],
      ['b', prog.ismeretlen, 'besorolatlan fajta']
    ].map(([, v, lab], i) => el('div', { class: 'stat' + (i === 1 && prog.hianyzo_fajta ? ' gap' : '') }, [
      el('b', { text: String(v) }), el('span', { text: lab })
    ]))));

    body.appendChild(el('table', { class: 'mini reqs' }, [
      el('thead', {}, [el('tr', {}, ['Mi kell', 'Kell', 'Van', 'Hiányzik', 'Haladás']
        .map((h, i) => el('th', { class: i >= 1 && i <= 3 ? 'num' : null, text: h })))]),
      el('tbody', {}, prog.sorok.map(r => el('tr', { class: r.ismeretlen ? 'unknown-req' : (r.kesz ? 'done-req' : null) }, [
        el('td', {}, [
          el('span', { text: r.cimke }),
          r.ismeretlen ? el('span', { class: 'pack-warn', title: 'A Planner ezt a fajtát nem tudom kategóriához kötni.', text: ' ⚠' }) : null,
          r.tetelek.length ? el('div', { class: 'req-items', text: r.tetelek.map(t => `${t.mennyiseg}× ${t.megnevezes}`).join(' · ') }) : null
        ].filter(Boolean)),
        el('td', { class: 'num', text: fmt.num(r.mennyiseg) + ' ' + r.egyseg }),
        el('td', { class: 'num', text: fmt.num(r.van) }),
        el('td', { class: 'num' + (r.hianyzik ? ' up' : ' down'), text: r.hianyzik ? fmt.num(r.hianyzik) : '✓' }),
        el('td', {}, [bar(r.van, r.mennyiseg)])
      ])))
    ]));

    // the diagram is rendered from the same progress object the table used
    if (p.terv.rajz) {
      body.appendChild(el('h3', { class: 'log-head', text: 'Alaprajz' }));
      body.appendChild(diagram.root);
      diagram.render(p.terv.rajz, prog);
    }

    if (prog.ismeretlen) {
      body.appendChild(el('p', {
        class: 'note warn-note',
        text: 'A ⚠ jelölt fajtákat a Planner tervéből nem tudom kategóriához kötni, ezért nem is tudom ' +
          'automatikusan kitölteni — de itt maradnak, hogy ne vesszenek el.'
      }));
    }
  }

  const root = el('div', { class: 'panel projects-panel', hidden: true }, [
    el('div', { class: 'controls' }, [
      el('label', { for: 'pr-active' }, ['Projekt', picker]),
      el('button', { type: 'button', onclick: () => fileInput.click(), text: '⭱ Planner terv importálása' }),
      el('button', {
        type: 'button', onclick: autofill, text: '✦ Hiányzók kitöltése kedvencekből'
      }),
      el('div', { class: 'spacer' }),
      el('button', {
        type: 'button', class: 'ghost', text: 'Lista megnyitása',
        onclick: () => { const p = projects.active(); if (p) { projects.focus(p.id); onChanged(); render(); } }
      }),
      el('button', {
        type: 'button', class: 'ghost danger', text: 'Projekt törlése',
        onclick: () => {
          const p = projects.active(); if (!p) return;
          if (!confirm(`„${p.nev}” projekt törlése? A listája megmarad.`)) return;
          projects.remove(p.id, false); onChanged(); render();
        }
      })
    ]),
    message,
    body,
    fileInput
  ]);

  render();
  return {
    root, render,
    highlight: cats => { diagram.highlight(cats); if (!root.hidden) render(); },
    diagram,
    toggle: () => { root.hidden = !root.hidden; if (!root.hidden) render(); return !root.hidden; }
  };
}


Object.assign(exports, { createProjectPanel });
};

__defs["core/plannerimport.js"] = function (exports, __req) {
// Read a Planner project export (.vplan.json) and turn it into requirements.
//
// The Planner draws devices and cable runs; it does not know product numbers.
// So what arrives here is "36 sockets, 15 switches, 1.9 m of conduit" — counts
// per *kind of thing*, which the catalogue then answers with actual items.
//
// Two rules keep this honest:
//   * A device type this file does not recognise is REPORTED, never dropped.
//     A plan that quietly loses a third of its sockets is worse than one that
//     refuses to import.
//   * Nothing is invented. A socket needs a frame and a box in real life, but
//     the plan does not say so, so the import does not claim it does.

const PLAN_FORMAT = 'varler-planner';

/** Planner device type -> the catalogue categories that can answer it. */
const DEVICE_RULES = [
  { kulcs: 'socket', cimke: 'Csatlakozóaljzat', egyseg: 'db', kategoriak: ['Csatlakozóaljzatok'] },
  { kulcs: 'switch', cimke: 'Kapcsoló', egyseg: 'db', kategoriak: ['Kapcsolók', 'Dimmerek'] },
  { kulcs: 'light', cimke: 'Lámpatest', egyseg: 'db', kategoriak: ['Reflektorok és lámpatestek', 'Fényforrások'] },
  // These two must not share a category. If they do, one box on the list ticks
  // off both requirements and the progress reads as twice the material it is.
  { kulcs: 'junction', cimke: 'Kötődoboz', egyseg: 'db', kategoriak: ['Falon kívüli dobozok és fedelek'] },
  { kulcs: 'box', cimke: 'Szerelvénydoboz', egyseg: 'db', kategoriak: ['Süllyesztett kötődobozok és fedelek'] }
];

/** Planner path build type -> categories, for the metres of run. */
const BUILD_RULES = [
  { kulcs: 'sull_gege', cimke: 'Gégecső (süllyesztett)', egyseg: 'fm', kategoriak: ['Gégecsövek'] },
  { kulcs: 'fk_gege', cimke: 'Gégecső (falon kívüli)', egyseg: 'fm', kategoriak: ['Gégecsövek'] },
  { kulcs: 'sull_mu2', cimke: 'Műanyag védőcső', egyseg: 'fm', kategoriak: ['Műanyag védőcsövek'] },
  { kulcs: 'csatorna', cimke: 'Kábelcsatorna', egyseg: 'fm', kategoriak: ['Műanyag kábelcsatornák'] },
  {
    kulcs: 'kv_custom', cimke: 'Vezetékezés', egyseg: 'fm',
    kategoriak: [
      'Erősáramú vezetékek, kábelek < 1 kV rögzített elhelyezés',
      'Erősáramú vezetékek, kábelek < 1 kV flexibilis elhelyezés'
    ]
  }
];

const ruleFor = (rules, key) => rules.find(r => r.kulcs === key) || null;
const round2 = n => Math.round(n * 100) / 100;

/** 3-D length of a path section, in millimetres. */
function segLength(a, b) {
  const dx = (b.x || 0) - (a.x || 0);
  const dy = (b.y || 0) - (a.y || 0);
  const dh = (b.h || 0) - (a.h || 0);
  return Math.sqrt(dx * dx + dy * dy + dh * dh);
}

/**
 * Just enough geometry to draw a rough plan: room outlines, door/window marks
 * and device positions, in millimetres. No walls, no 3-D, no styling — this is
 * an orientation aid, not a copy of the Planner's canvas.
 */
function extractDrawing(data) {
  const floors = Array.isArray(data.floors) ? data.floors : [];
  const devices = Array.isArray(data.devices) ? data.devices : [];
  const openings = Array.isArray(data.openings) ? data.openings : [];

  const szintek = [...new Set([
    ...floors.map(f => f && f.level), ...devices.map(d => d && d.level)
  ].filter(Boolean))];

  const helyisegek = floors
    .filter(f => f && Array.isArray(f.poly) && f.poly.length >= 3)
    .map(f => ({
      szint: String(f.level || ''),
      pontok: f.poly.filter(p => Array.isArray(p) && p.length >= 2).map(p => [Number(p[0]) || 0, Number(p[1]) || 0])
    }));

  const eszkozok = devices
    .filter(d => d && Number.isFinite(Number(d.x)) && Number.isFinite(Number(d.y)))
    .map(d => ({
      szint: String(d.level || ''),
      tipus: String(d.type || ''),
      x: Number(d.x), y: Number(d.y),
      ref: String(d.ref || '')
    }));

  const nyilasok = openings
    .filter(o => o && Number.isFinite(Number(o.x)) && Number.isFinite(Number(o.y)))
    .map(o => ({ szint: String(o.level || ''), tipus: String(o.type || ''), x: Number(o.x), y: Number(o.y) }));

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const see = (x, y) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  };
  for (const h of helyisegek) for (const p of h.pontok) see(p[0], p[1]);
  for (const e of eszkozok) see(e.x, e.y);
  const hasGeometry = Number.isFinite(minX) && Number.isFinite(minY);

  return {
    szintek,
    helyisegek,
    eszkozok,
    nyilasok,
    hatar: hasGeometry ? { minX, maxX, minY, maxY } : null
  };
}

/**
 * parsePlan(json) -> { nev, mentve, projekt, rajz, igenyek, ismeretlen, osszegzes }
 * Throws only when the file is not a Planner export at all.
 */
function parsePlan(input) {
  if (!input || typeof input !== 'object') throw new Error('A fájl nem érvényes JSON objektum.');
  if (input.format !== PLAN_FORMAT) {
    throw new Error(`Nem Planner mentés (format: ${JSON.stringify(input.format)}).`);
  }
  const project = input.project || {};
  const data = project.data || {};
  const bp = (project.state && project.state.bp) || {};

  const warnings = [];
  const ismeretlen = [];

  // ------------------------------------------------------------ devices
  const devices = Array.isArray(data.devices) ? data.devices : [];
  const byType = new Map();
  for (const d of devices) {
    const t = String((d && d.type) || '').trim() || '(nincs típus)';
    byType.set(t, (byType.get(t) || 0) + 1);
  }

  const igenyek = [];
  for (const [type, count] of byType) {
    const rule = ruleFor(DEVICE_RULES, type);
    if (!rule) {
      ismeretlen.push({ kulcs: type, darab: count, mibol: 'eszköz' });
      igenyek.push({
        kulcs: 'dev:' + type, cimke: type, egyseg: 'db',
        mennyiseg: count, kategoriak: [], ismeretlen: true
      });
      continue;
    }
    igenyek.push({
      kulcs: 'dev:' + type, cimke: rule.cimke, egyseg: rule.egyseg,
      mennyiseg: count, kategoriak: rule.kategoriak.slice(), ismeretlen: false
    });
  }

  // -------------------------------------------------------------- paths
  const paths = Array.isArray(data.paths) ? data.paths : [];
  const byBuild = new Map();
  for (const p of paths) {
    const nodes = Array.isArray(p && p.nodes) ? p.nodes : [];
    const sections = Array.isArray(p && p.sections) ? p.sections : [];
    for (let i = 0; i < sections.length; i++) {
      const a = nodes[i], b = nodes[i + 1];
      if (!a || !b) continue;
      const build = String((sections[i] && sections[i].build) || '').trim() || '(nincs kivitel)';
      byBuild.set(build, (byBuild.get(build) || 0) + segLength(a, b));
    }
  }
  for (const [build, mm] of byBuild) {
    const metres = round2(mm / 1000);
    if (metres <= 0) continue;
    const rule = ruleFor(BUILD_RULES, build);
    if (!rule) {
      ismeretlen.push({ kulcs: build, darab: metres, mibol: 'nyomvonal' });
      igenyek.push({
        kulcs: 'path:' + build, cimke: build, egyseg: 'fm',
        mennyiseg: metres, kategoriak: [], ismeretlen: true
      });
      continue;
    }
    igenyek.push({
      kulcs: 'path:' + build, cimke: rule.cimke, egyseg: rule.egyseg,
      mennyiseg: metres, kategoriak: rule.kategoriak.slice(), ismeretlen: false
    });
  }

  // Two kinds that are answered by the SAME categories are one shopping
  // requirement: flush conduit and surface conduit are both conduit, and
  // leaving them separate would let one purchase tick off both — progress
  // would then read as twice the material actually on the list.
  const merged = [];
  const bySignature = new Map();
  for (const ig of igenyek) {
    if (ig.ismeretlen || !ig.kategoriak.length) { merged.push(ig); continue; }
    const sig = ig.kategoriak.slice().sort().join('');
    const prev = bySignature.get(sig);
    if (!prev) {
      bySignature.set(sig, ig);
      merged.push(ig);
      continue;
    }
    prev.mennyiseg = round2(prev.mennyiseg + ig.mennyiseg);
    prev.kulcs += '+' + ig.kulcs;
    if (!prev.cimke.includes(ig.cimke)) prev.cimke += ' + ' + ig.cimke;
  }
  igenyek.length = 0;
  igenyek.push(...merged);
  igenyek.sort((a, b) => b.mennyiseg - a.mennyiseg);

  if (ismeretlen.length) {
    warnings.push(`${ismeretlen.length} ismeretlen fajta a tervben — ezek igényként megjelennek, ` +
      'de kategória nélkül, mert nem tudom, mivel kellene kielégíteni őket.');
  }
  if (!igenyek.length) warnings.push('A terv nem tartalmaz eszközt vagy nyomvonalat.');

  return {
    forras: PLAN_FORMAT,
    nev: String(input.name || 'Névtelen terv'),
    mentve: String(input.saved || ''),
    rajz: extractDrawing(data),
    projekt: {
      megnevezes: String(bp.proj || ''),
      cim: String(bp.addr || ''),
      keszitette: String(bp.by || '')
    },
    igenyek, ismeretlen, warnings,
    osszegzes: {
      eszkoz: devices.length,
      nyomvonal_fm: round2([...byBuild.values()].reduce((a, v) => a + v, 0) / 1000),
      helyiseg: Array.isArray(data.floors) ? data.floors.length : 0,
      jegyzet: Array.isArray(data.notes) ? data.notes.length : 0
    }
  };
}

/** Does this catalogue item answer that requirement? */
function itemAnswers(item, igeny) {
  if (!igeny.kategoriak || !igeny.kategoriak.length) return false;
  const al = (item.kategoria && item.kategoria.al) ||
    (item.kategoria_javaslat && item.kategoria_javaslat.al) || '';
  return igeny.kategoriak.includes(al);
}

/**
 * How far the list has got against the plan. `van` counts only quantities of
 * items whose category answers the requirement, so putting a cable on the list
 * does not tick off a socket.
 */
function progress(terv, rows) {
  const out = (terv.igenyek || []).map(igeny => {
    let van = 0;
    const tetelek = [];
    for (const r of rows) {
      if (!r.item || !itemAnswers(r.item, igeny)) continue;
      van += r.mennyiseg;
      tetelek.push({ vrg_id: r.vrg_id, megnevezes: r.item.megnevezes, mennyiseg: r.mennyiseg });
    }
    van = round2(van);
    return Object.assign({}, igeny, {
      van,
      hianyzik: round2(Math.max(0, igeny.mennyiseg - van)),
      tobblet: round2(Math.max(0, van - igeny.mennyiseg)),
      kesz: van >= igeny.mennyiseg,
      tetelek
    });
  });
  const teljesitheto = out.filter(i => !i.ismeretlen);
  return {
    sorok: out,
    kesz: teljesitheto.filter(i => i.kesz).length,
    osszes: teljesitheto.length,
    ismeretlen: out.filter(i => i.ismeretlen).length,
    hianyzo_fajta: teljesitheto.filter(i => !i.kesz).length
  };
}

/**
 * Pick what to autofill each open requirement with: a favourite in that
 * category, else the item ordered most often. Returns a plan, never applies it
 * — the same review-before-write rule as the price check.
 */
function autofillPlan(prog, store) {
  const javaslatok = [];
  const nincs = [];
  for (const igeny of prog.sorok) {
    if (igeny.kesz || igeny.ismeretlen) continue;
    const jeloltek = store.items.filter(it => itemAnswers(it, igeny));
    if (!jeloltek.length) { nincs.push({ igeny, ok: 'nincs ilyen kategóriájú tétel a katalógusban' }); continue; }

    const kedvencek = jeloltek.filter(it => it.user && it.user.kedvenc);
    const pool = kedvencek.length ? kedvencek : jeloltek;
    pool.sort((a, b) =>
      (b.felhasznalas.rendelesek_szama - a.felhasznalas.rendelesek_szama) ||
      a.megnevezes.localeCompare(b.megnevezes, 'hu'));
    javaslatok.push({
      igeny,
      item: pool[0],
      mennyiseg: igeny.hianyzik,
      miert: kedvencek.length ? 'kedvenc' : 'leggyakrabban rendelt',
      valaszthato: pool.length
    });
  }
  return { javaslatok, nincs };
}


Object.assign(exports, { PLAN_FORMAT, DEVICE_RULES, BUILD_RULES, extractDrawing, parsePlan, itemAnswers, progress, autofillPlan, segLength });
};

// The floor diagram view.
//
// Every colour here comes from buildDiagram(), which is a pure function of the
// geometry and the progress — so the drawing cannot say "done" while the list
// says otherwise. There is no diagram state to keep in sync.

const { el, clear } = __req("ui/dom.js");
const { svg } = __req("ui/components.js");
