<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1360" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Courier New', monospace">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16202e" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#8b98a5"/>
    </marker>
    <style>
      .lbl{fill:#e6edf3;font-size:13px}.lblsm{fill:#aeb9c4;font-size:11px}
      .tag{fill:#5b7a99;font-size:10.5px;letter-spacing:.8px}
      .live{stroke:#f5a623}.neu{stroke:#5b7a99}.trav{stroke:#2dd4bf}.ctrl{stroke:#d946ef}.en{stroke:#4ade80}
      .man{stroke:#9fb0c0}
      .w{fill:none;stroke-width:2.4}.node{fill:#0a0e14;stroke-width:2}
      .title{fill:#2dd4bf;font-size:20px;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1120" height="1360" fill="#0a0e14"/><rect width="1120" height="1360" fill="url(#grid)"/>
  <text x="48" y="48" fill="#e6edf3" font-size="25" letter-spacing="2">BRIDGE · SMART PEER SWITCH — MULTI / CROSS / END</text>
  <text x="48" y="72" class="tag">EVERY MANUAL POINT AND EVERY RF UNIT IS AN EQUAL PEER TOGGLE · ALL RF UNITS ALWAYS POWERED</text>
  <line x1="48" y1="88" x2="1072" y2="88" stroke="#2dd4bf" stroke-width="1" opacity="0.5"/>

  <!-- =============== MULTI =============== -->
  <rect x="40" y="110" width="1040" height="396" rx="10" fill="#0f141c" stroke="#1f2c3b" stroke-width="1.5"/>
  <text x="64" y="146" class="title">PEER SWITCH — MULTI</text>
  <text x="64" y="168" class="tag">MANY MANUAL POINTS (106 + 107 CROSSES) + RF ADDED AS ONE MORE CROSS (107)</text>
  <g>
    <!-- L + S1 106 -->
    <circle class="node live" cx="110" cy="300" r="5"/><line class="w live" x1="110" y1="300" x2="180" y2="300"/>
    <circle class="node trav" cx="180" cy="300" r="3.5"/><circle class="node trav" cx="258" cy="272" r="3.5"/><circle class="node trav" cx="258" cy="328" r="3.5"/>
    <line class="w live" x1="180" y1="300" x2="252" y2="274"/><text x="150" y="356" class="lblsm">S1·106</text>
    <line class="w trav" x1="258" y1="272" x2="330" y2="272"/><line class="w trav" x1="258" y1="328" x2="330" y2="328"/>
    <!-- S2 107 manual cross -->
    <rect x="330" y="260" width="130" height="80" rx="6" fill="#0a0e14" stroke="#9fb0c0" stroke-width="1.8"/>
    <circle class="node trav" cx="330" cy="272" r="3.5"/><circle class="node trav" cx="330" cy="328" r="3.5"/><circle class="node trav" cx="460" cy="272" r="3.5"/><circle class="node trav" cx="460" cy="328" r="3.5"/>
    <line class="w trav" x1="330" y1="272" x2="460" y2="272"/><line class="w trav" x1="330" y1="328" x2="460" y2="328"/>
    <line x1="330" y1="272" x2="460" y2="328" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <line x1="330" y1="328" x2="460" y2="272" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <line class="w man" x1="395" y1="260" x2="395" y2="248"/><text x="395" y="356" text-anchor="middle" class="lblsm">S2·107 manual</text>
    <line class="w trav" x1="460" y1="272" x2="530" y2="272"/><line class="w trav" x1="460" y1="328" x2="530" y2="328"/>
    <!-- RF 107 cross -->
    <rect x="530" y="260" width="130" height="80" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="2"/>
    <circle class="node trav" cx="530" cy="272" r="3.5"/><circle class="node trav" cx="530" cy="328" r="3.5"/><circle class="node trav" cx="660" cy="272" r="3.5"/><circle class="node trav" cx="660" cy="328" r="3.5"/>
    <line class="w trav" x1="530" y1="272" x2="660" y2="272"/><line class="w trav" x1="530" y1="328" x2="660" y2="328"/>
    <line x1="530" y1="272" x2="660" y2="328" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <line x1="530" y1="328" x2="660" y2="272" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <text x="595" y="254" text-anchor="middle" class="tag" fill="#d946ef">RF·107</text>
    <line class="w trav" x1="660" y1="272" x2="730" y2="272"/><line class="w trav" x1="660" y1="328" x2="730" y2="328"/>
    <!-- S3 106 -->
    <circle class="node trav" cx="730" cy="272" r="3.5"/><circle class="node trav" cx="730" cy="328" r="3.5"/><circle class="node trav" cx="808" cy="300" r="3.5"/>
    <line class="w trav" x1="730" y1="272" x2="804" y2="298"/><text x="770" y="356" class="lblsm">S3·106</text>
    <line class="w trav" x1="808" y1="300" x2="858" y2="300"/>
    <circle cx="882" cy="300" r="18" fill="#0a0e14" stroke="#f5a623" stroke-width="2.2"/>
    <line x1="869" y1="287" x2="895" y2="313" stroke="#f5a623" stroke-width="1.8"/><line x1="895" y1="287" x2="869" y2="313" stroke="#f5a623" stroke-width="1.8"/>
    <line class="w neu" x1="900" y1="300" x2="960" y2="300"/><circle class="node neu" cx="960" cy="300" r="5"/><text x="970" y="304" class="tag">N</text>
    <!-- coil + driver -->
    <line class="w ctrl" x1="595" y1="340" x2="595" y2="392"/>
    <rect x="510" y="392" width="170" height="34" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="1.6"/>
    <text x="595" y="414" text-anchor="middle" class="tag" fill="#d946ef">RF / ESP32 cross driver</text>
    <line class="w en" x1="410" y1="409" x2="508" y2="409" marker-end="url(#arrow)"/><text x="408" y="399" text-anchor="end" class="tag" fill="#4ade80">Shadow tap · ALWAYS POWERED</text>
  </g>
  <text x="64" y="462" class="lbl">• <tspan fill="#2dd4bf">S1, S2, S3 and the RF cross are all equal peers</tspan> — flip any one to toggle the lamp.</text>
  <text x="64" y="484" class="lbl">• <tspan fill="#f5a623">Fail-safe:</tspan> the RF cross rests straight → the manual multi-point group keeps working.</text>

  <!-- =============== CROSS =============== -->
  <rect x="40" y="526" width="1040" height="396" rx="10" fill="#0f141c" stroke="#1f2c3b" stroke-width="1.5"/>
  <text x="64" y="562" class="title">PEER SWITCH — CROSS</text>
  <text x="64" y="584" class="tag">ONE MANUAL SWITCH + SEVERAL INDEPENDENT WIRELESS SYSTEMS, EACH WIRED AS A CROSS</text>
  <g>
    <circle class="node live" cx="110" cy="716" r="5"/><line class="w live" x1="110" y1="716" x2="180" y2="716"/>
    <circle class="node trav" cx="180" cy="716" r="3.5"/><circle class="node trav" cx="258" cy="688" r="3.5"/><circle class="node trav" cx="258" cy="744" r="3.5"/>
    <line class="w live" x1="180" y1="716" x2="252" y2="690"/><text x="150" y="772" class="lblsm">S1·106 manual</text>
    <line class="w trav" x1="258" y1="688" x2="330" y2="688"/><line class="w trav" x1="258" y1="744" x2="330" y2="744"/>
    <!-- RF-A cross -->
    <rect x="330" y="676" width="120" height="80" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="2"/>
    <circle class="node trav" cx="330" cy="688" r="3.5"/><circle class="node trav" cx="330" cy="744" r="3.5"/><circle class="node trav" cx="450" cy="688" r="3.5"/><circle class="node trav" cx="450" cy="744" r="3.5"/>
    <line class="w trav" x1="330" y1="688" x2="450" y2="688"/><line class="w trav" x1="330" y1="744" x2="450" y2="744"/>
    <line x1="330" y1="688" x2="450" y2="744" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <line x1="330" y1="744" x2="450" y2="688" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <text x="390" y="670" text-anchor="middle" class="tag" fill="#d946ef">RF-A·107</text>
    <line class="w trav" x1="450" y1="688" x2="520" y2="688"/><line class="w trav" x1="450" y1="744" x2="520" y2="744"/>
    <!-- RF-B cross -->
    <rect x="520" y="676" width="120" height="80" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="2"/>
    <circle class="node trav" cx="520" cy="688" r="3.5"/><circle class="node trav" cx="520" cy="744" r="3.5"/><circle class="node trav" cx="640" cy="688" r="3.5"/><circle class="node trav" cx="640" cy="744" r="3.5"/>
    <line class="w trav" x1="520" y1="688" x2="640" y2="688"/><line class="w trav" x1="520" y1="744" x2="640" y2="744"/>
    <line x1="520" y1="688" x2="640" y2="744" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <line x1="520" y1="744" x2="640" y2="688" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <text x="580" y="670" text-anchor="middle" class="tag" fill="#d946ef">RF-B·107</text>
    <line class="w trav" x1="640" y1="688" x2="710" y2="688"/><line class="w trav" x1="640" y1="744" x2="710" y2="744"/>
    <!-- RF-C end changeover -->
    <rect x="710" y="676" width="120" height="80" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="2"/>
    <circle class="node trav" cx="710" cy="688" r="3.5"/><circle class="node trav" cx="710" cy="744" r="3.5"/><circle class="node trav" cx="830" cy="716" r="3.5"/>
    <line class="w trav" x1="710" y1="688" x2="830" y2="716"/>
    <line x1="710" y1="744" x2="830" y2="716" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <text x="770" y="670" text-anchor="middle" class="tag" fill="#d946ef">RF-C·106 end</text>
    <line class="w trav" x1="830" y1="716" x2="876" y2="716"/>
    <circle cx="900" cy="716" r="18" fill="#0a0e14" stroke="#f5a623" stroke-width="2.2"/>
    <line x1="887" y1="703" x2="913" y2="729" stroke="#f5a623" stroke-width="1.8"/><line x1="913" y1="703" x2="887" y2="729" stroke="#f5a623" stroke-width="1.8"/>
    <line class="w neu" x1="918" y1="716" x2="970" y2="716"/><circle class="node neu" cx="970" cy="716" r="5"/><text x="980" y="720" class="tag">N</text>
    <!-- shared shadow rail -->
    <line class="w ctrl" x1="390" y1="756" x2="390" y2="800"/><line class="w ctrl" x1="580" y1="756" x2="580" y2="800"/><line class="w ctrl" x1="770" y1="756" x2="770" y2="800"/>
    <line class="w en" x1="330" y1="800" x2="830" y2="800"/>
    <text x="330" y="822" class="tag" fill="#4ade80">Shadow tap — ALL WIRELESS UNITS ALWAYS POWERED</text>
  </g>
  <text x="64" y="878" class="lbl">• One physical switch + <tspan fill="#d946ef">N independent wireless peers</tspan> (e.g. HA-RF, Zigbee, presence) — each toggles co-equally.</text>
  <text x="64" y="900" class="lbl">• <tspan fill="#f5a623">Fail-safe:</tspan> any wireless unit losing power rests straight; control survives via the rest + the manual switch.</text>

  <!-- =============== END =============== -->
  <rect x="40" y="942" width="1040" height="396" rx="10" fill="#0f141c" stroke="#1f2c3b" stroke-width="1.5"/>
  <text x="64" y="978" class="title">PEER SWITCH — END</text>
  <text x="64" y="1000" class="tag">MANUAL GROUP + RF AS THE TERMINAL CHANGEOVER (106) NEAREST THE LAMP</text>
  <g>
    <circle class="node live" cx="110" cy="1132" r="5"/><line class="w live" x1="110" y1="1132" x2="180" y2="1132"/>
    <circle class="node trav" cx="180" cy="1132" r="3.5"/><circle class="node trav" cx="258" cy="1104" r="3.5"/><circle class="node trav" cx="258" cy="1160" r="3.5"/>
    <line class="w live" x1="180" y1="1132" x2="252" y2="1106"/><text x="150" y="1188" class="lblsm">S1·106</text>
    <line class="w trav" x1="258" y1="1104" x2="330" y2="1104"/><line class="w trav" x1="258" y1="1160" x2="330" y2="1160"/>
    <!-- S2 107 manual cross -->
    <rect x="330" y="1092" width="130" height="80" rx="6" fill="#0a0e14" stroke="#9fb0c0" stroke-width="1.8"/>
    <circle class="node trav" cx="330" cy="1104" r="3.5"/><circle class="node trav" cx="330" cy="1160" r="3.5"/><circle class="node trav" cx="460" cy="1104" r="3.5"/><circle class="node trav" cx="460" cy="1160" r="3.5"/>
    <line class="w trav" x1="330" y1="1104" x2="460" y2="1104"/><line class="w trav" x1="330" y1="1160" x2="460" y2="1160"/>
    <line x1="330" y1="1104" x2="460" y2="1160" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <line x1="330" y1="1160" x2="460" y2="1104" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <line class="w man" x1="395" y1="1092" x2="395" y2="1080"/><text x="395" y="1188" text-anchor="middle" class="lblsm">S2·107 manual</text>
    <line class="w trav" x1="460" y1="1104" x2="560" y2="1104"/><line class="w trav" x1="460" y1="1160" x2="560" y2="1160"/>
    <!-- RF 106 end, at luminaire -->
    <rect x="560" y="1092" width="130" height="80" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="2"/>
    <circle class="node trav" cx="560" cy="1104" r="3.5"/><circle class="node trav" cx="560" cy="1160" r="3.5"/><circle class="node trav" cx="690" cy="1132" r="3.5"/>
    <line class="w trav" x1="560" y1="1104" x2="690" y2="1132"/>
    <line x1="560" y1="1160" x2="690" y2="1132" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
    <text x="625" y="1086" text-anchor="middle" class="tag" fill="#d946ef">RF·106 END</text>
    <text x="560" y="1086" text-anchor="start" class="tag">A</text>
    <line class="w trav" x1="690" y1="1132" x2="746" y2="1132"/>
    <circle cx="770" cy="1132" r="18" fill="#0a0e14" stroke="#f5a623" stroke-width="2.2"/>
    <line x1="757" y1="1119" x2="783" y2="1145" stroke="#f5a623" stroke-width="1.8"/><line x1="783" y1="1119" x2="757" y2="1145" stroke="#f5a623" stroke-width="1.8"/>
    <text x="770" y="1186" text-anchor="middle" class="tag">LAMP</text>
    <line class="w neu" x1="788" y1="1132" x2="850" y2="1132"/><circle class="node neu" cx="850" cy="1132" r="5"/><text x="860" y="1136" class="tag">N</text>
    <text x="690" y="1112" class="tag" fill="#aeb9c4">↳ at luminaire / ceiling rose · meters lamp power</text>
    <!-- coil + driver -->
    <line class="w ctrl" x1="625" y1="1172" x2="625" y2="1212"/>
    <rect x="540" y="1212" width="180" height="34" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="1.6"/>
    <text x="630" y="1234" text-anchor="middle" class="tag" fill="#d946ef">RF / ESP32 end-changeover</text>
    <line class="w en" x1="438" y1="1229" x2="538" y2="1229" marker-end="url(#arrow)"/><text x="436" y="1219" text-anchor="end" class="tag" fill="#4ade80">Shadow tap · ALWAYS POWERED</text>
  </g>
  <text x="64" y="1292" class="lbl">• Manual group (S1·106 + S2·107) + <tspan fill="#d946ef">RF as the terminal changeover</tspan> nearest the lamp. All peers.</text>
  <text x="64" y="1314" class="lbl">• RF unit lives at the fixture — directly handles the lamp feed &amp; can meter power. <tspan fill="#f5a623">Fail-safe:</tspan> rests N.C., manual controls.</text>
</svg>
