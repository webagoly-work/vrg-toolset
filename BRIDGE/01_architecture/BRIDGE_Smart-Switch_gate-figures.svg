<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1060" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Courier New', monospace">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16202e" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#8b98a5"/>
    </marker>
    <style>
      .lbl{fill:#e6edf3;font-size:13px}.lblsm{fill:#aeb9c4;font-size:11px}
      .tag{fill:#5b7a99;font-size:10.5px;letter-spacing:.8px}
      .live{stroke:#f5a623}.neu{stroke:#5b7a99}.trav{stroke:#2dd4bf}.ctrl{stroke:#d946ef}.en{stroke:#4ade80}
      .w{fill:none;stroke-width:2.4}.node{fill:#0a0e14;stroke-width:2}
      .title{fill:#2dd4bf;font-size:20px;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1120" height="1060" fill="#0a0e14"/><rect width="1120" height="1060" fill="url(#grid)"/>
  <text x="48" y="48" fill="#e6edf3" font-size="25" letter-spacing="2">BRIDGE · SMART GATE SWITCH</text>
  <text x="48" y="72" class="tag">A MANUAL SWITCH GOVERNS WHETHER RF HAS ANY AUTHORITY · OFF GUARANTEES A DEFINED FALLBACK</text>
  <line x1="48" y1="88" x2="1072" y2="88" stroke="#2dd4bf" stroke-width="1" opacity="0.5"/>

  <!-- =============== GATE SWITCH (sockets) =============== -->
  <rect x="40" y="110" width="1040" height="466" rx="10" fill="#0f141c" stroke="#1f2c3b" stroke-width="1.5"/>
  <text x="64" y="146" class="title">GATE SWITCH — power sockets</text>
  <text x="64" y="168" class="tag">OFF → RF DISABLED BUT SOCKET STAYS LIVE · ON → SOCKET FED VIA RF RELAY</text>
  <g>
    <!-- L bus -->
    <text x="92" y="296" class="tag">L</text>
    <circle class="node live" cx="110" cy="300" r="5"/>
    <line class="w live" x1="110" y1="250" x2="110" y2="441"/>
    <!-- top: RF relay path -->
    <line class="w live" x1="110" y1="250" x2="250" y2="250"/>
    <rect x="250" y="232" width="130" height="46" rx="6" fill="#0a0e14" stroke="#d946ef" stroke-width="2"/>
    <circle class="node live" cx="250" cy="255" r="3.5"/><circle class="node live" cx="380" cy="255" r="3.5"/>
    <line class="w live" x1="250" y1="255" x2="376" y2="248"/>
    <text x="315" y="226" text-anchor="middle" class="tag" fill="#d946ef">RF RELAY (N.C.)</text>
    <line class="w live" x1="380" y1="255" x2="440" y2="255"/>
    <circle class="node live" cx="440" cy="255" r="3.5"/><text x="430" y="240" text-anchor="end" class="tag" fill="#d946ef">RF live</text>
    <!-- bottom: bypass -->
    <line class="w live" x1="110" y1="360" x2="440" y2="360"/>
    <circle class="node live" cx="440" cy="360" r="3.5"/><text x="300" y="380" class="tag" fill="#f5a623">bypass = direct L</text>
    <!-- GATE pole A changeover -->
    <circle class="node neu" cx="530" cy="308" r="4"/>
    <line class="w live" x1="530" y1="308" x2="446" y2="257"/>          <!-- ON: to RF live -->
    <line x1="530" y1="308" x2="446" y2="358" stroke="#f5a623" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.5"/> <!-- OFF: to bypass -->
    <text x="548" y="246" class="tag" fill="#aeb9c4">GATE pole A — socket source</text>
    <!-- socket -->
    <line class="w live" x1="530" y1="308" x2="612" y2="308"/>
    <rect x="612" y="280" width="104" height="58" rx="8" fill="#0a0e14" stroke="#e6edf3" stroke-width="1.8"/>
    <circle cx="650" cy="309" r="5" fill="none" stroke="#aeb9c4" stroke-width="1.6"/><circle cx="678" cy="309" r="5" fill="none" stroke="#aeb9c4" stroke-width="1.6"/>
    <text x="664" y="356" text-anchor="middle" class="lblsm">SOCKET</text>
    <line class="w neu" x1="664" y1="338" x2="664" y2="392"/><circle class="node neu" cx="664" cy="392" r="5"/><text x="676" y="396" class="tag">N</text>
    <!-- RF unit + pole B -->
    <rect x="250" y="420" width="180" height="44" rx="7" fill="#0a0e14" stroke="#d946ef" stroke-width="1.8"/>
    <text x="340" y="440" text-anchor="middle" class="lblsm" fill="#d946ef">RF / ESP32</text>
    <text x="340" y="457" text-anchor="middle" class="tag">powered via Pole B</text>
    <line class="w ctrl" x1="340" y1="420" x2="340" y2="278" stroke-dasharray="5 4"/>
    <text x="350" y="300" class="tag" fill="#d946ef">drives coil</text>
    <!-- pole B -->
    <circle class="node en" cx="170" cy="441" r="3.5"/><circle class="node en" cx="248" cy="441" r="3.5"/>
    <line class="w en" x1="110" y1="441" x2="170" y2="441"/>
    <line class="w en" x1="170" y1="441" x2="244" y2="434"/>
    <line class="w en" x1="248" y1="441" x2="250" y2="441"/>
    <text x="120" y="475" class="tag" fill="#4ade80">GATE pole B — RF power (ganged with A)</text>
  </g>
  <text x="64" y="512" class="lbl">• <tspan fill="#2dd4bf">Gate ON (shown):</tspan> socket fed via the RF relay, RF unit powered → RF controls the socket.</text>
  <text x="64" y="534" class="lbl">• <tspan fill="#f5a623">Gate OFF:</tspan> blade → bypass (direct L) → socket stays LIVE; Pole B opens → RF depowered &amp; disabled.</text>
  <text x="64" y="556" class="lbl">• Manual-first: the user can always force the socket to plain-live; <tspan fill="#f5a623">RF can never hold a socket off against the gate.</tspan></text>

  <!-- =============== SMART CUT SWITCH =============== -->
  <rect x="40" y="596" width="1040" height="434" rx="10" fill="#0f141c" stroke="#1f2c3b" stroke-width="1.5"/>
  <text x="64" y="632" class="title">SMART CUT SWITCH — manual-only fallback</text>
  <text x="64" y="654" class="tag">A PEER SINGLE + ONE EXTRA SWITCH THAT CUTS POWER TO THE WIRELESS PARTS ONLY</text>
  <g>
    <circle class="node live" cx="110" cy="800" r="5"/><line class="w live" x1="110" y1="800" x2="180" y2="800"/>
    <circle class="node trav" cx="180" cy="800" r="4"/><circle class="node trav" cx="258" cy="772" r="4"/><circle class="node trav" cx="258" cy="828" r="4"/>
    <line class="w live" x1="180" y1="800" x2="252" y2="774"/><text x="150" y="858" class="lblsm">S1·106</text>
    <line class="w trav" x1="258" y1="772" x2="480" y2="772"/><line class="w trav" x1="258" y1="828" x2="480" y2="828"/>
    <rect x="480" y="746" width="170" height="108" rx="8" fill="#0a0e14" stroke="#d946ef" stroke-width="2"/>
    <text x="565" y="740" text-anchor="middle" class="tag" fill="#d946ef">RF RELAY · SPDT CHANGEOVER</text>
    <circle class="node trav" cx="480" cy="772" r="4"/><circle class="node trav" cx="480" cy="828" r="4"/><circle class="node trav" cx="650" cy="800" r="4"/>
    <line class="w trav" x1="480" y1="772" x2="650" y2="800"/>
    <line x1="480" y1="828" x2="650" y2="800" stroke="#2dd4bf" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.45"/>
    <text x="470" y="776" text-anchor="end" class="tag">A</text><text x="470" y="832" text-anchor="end" class="tag">B</text>
    <line class="w trav" x1="650" y1="800" x2="724" y2="800"/>
    <circle cx="748" cy="800" r="20" fill="#0a0e14" stroke="#f5a623" stroke-width="2.4"/>
    <line x1="734" y1="786" x2="762" y2="814" stroke="#f5a623" stroke-width="2"/><line x1="762" y1="786" x2="734" y2="814" stroke="#f5a623" stroke-width="2"/>
    <text x="748" y="852" text-anchor="middle" class="lblsm">LAMP</text>
    <line class="w neu" x1="768" y1="800" x2="850" y2="800"/><circle class="node neu" cx="850" cy="800" r="5"/><text x="860" y="804" class="tag">N</text>
    <!-- coil + RF unit -->
    <line class="w ctrl" x1="565" y1="854" x2="565" y2="896"/>
    <rect x="465" y="896" width="200" height="46" rx="8" fill="#0a0e14" stroke="#d946ef" stroke-width="1.8"/>
    <text x="565" y="918" text-anchor="middle" class="lblsm" fill="#d946ef">RF / ESP32</text>
    <text x="565" y="935" text-anchor="middle" class="tag">wireless elements</text>
    <!-- CUT switch in the shadow-tap feed -->
    <circle class="node en" cx="362" cy="919" r="4"/><circle class="node en" cx="440" cy="919" r="4"/>
    <line class="w en" x1="300" y1="919" x2="362" y2="919"/>
    <line class="w en" x1="362" y1="919" x2="436" y2="912"/>
    <line class="w en" x1="440" y1="919" x2="465" y2="919"/>
    <circle class="node en" cx="300" cy="919" r="4"/>
    <text x="300" y="958" class="tag" fill="#4ade80">Shadow tap</text>
    <text x="401" y="958" text-anchor="middle" class="lblsm" fill="#4ade80">CUT</text>
    <text x="401" y="894" text-anchor="middle" class="tag">mounted under the Peer switch</text>
  </g>
  <text x="64" y="988" class="lbl">• CUT is an SPST in the feed to the <tspan fill="#d946ef">wireless parts only</tspan> (RF coil + ESP), taken from the Shadow tap.</text>
  <text x="64" y="1010" class="lbl">• <tspan fill="#f5a623">CUT OPEN → wireless dead → relay rests N.C. (A→lamp) → S1 controls the lamp alone (manual-only).</tspan></text>
</svg>
