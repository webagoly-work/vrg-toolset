<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1140" width="2000" height="1140" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif"><title>P33 · T2 — CHANNEL lanes</title><rect width="2000" height="1140" fill="#fff"/><text x="40" y="48" font-size="26" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">P33 · T2 — CHANNEL lanes</tspan></text><text x="40" y="74" font-size="14" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="40" dy="0">One lane per run, the six conduits as parallel tracks in their fixed order. Lengths are not yet measured: stations mark what happens, not where.   P33-BUILD-001 r1 · 2026-10-06</tspan></text><rect x="40" y="130" width="250" height="860" rx="12" fill="#e0e7ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="56" y="162" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="56" dy="0">JOINERY · R03</tspan></text><text x="56" y="186" font-size="12.5" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="56" dy="0">RBX03 (upper) over BASE</tspan><tspan x="56" dy="15.625"> </tspan><tspan x="56" dy="15.625">CH-0 — BASE → RBX03 is an</tspan><tspan x="56" dy="15.625">open tray inside the joinery,</tspan><tspan x="56" dy="15.625">not a conduit (§3.1).</tspan><tspan x="56" dy="15.625"> </tspan><tspan x="56" dy="15.625">Every run below leaves the</tspan><tspan x="56" dy="15.625">joinery carrying one box's</tspan><tspan x="56" dy="15.625">cables only — so no conduit</tspan><tspan x="56" dy="15.625">in this house is shared by</tspan><tspan x="56" dy="15.625">two boxes.</tspan></text><rect x="300" y="184" width="1330" height="158" rx="10" fill="#f8fafc" stroke="#e4e7eb"/><text x="316" y="206" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="316" dy="0">CH-6</tspan></text><text x="380" y="206" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="380" dy="0">→ RBX06 · RB-H · R06</tspan></text><text x="1615" y="206" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="end" font-style="italic"><tspan x="1615" dy="0">C2 continues through RBX06's pass-through to the AV position</tspan></text><line x1="290" y1="230" x2="1160" y2="230" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="290" y1="241" x2="1160" y2="241" stroke="#db2777" stroke-width="5" stroke-linecap="round"/><line x1="290" y1="252" x2="1160" y2="252" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><line x1="290" y1="263" x2="1160" y2="263" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><line x1="290" y1="274" x2="1160" y2="274" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/><line x1="290" y1="285" x2="1160" y2="285" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/><rect x="421" y="218" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="430" y="319" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="430" dy="0">leave joinery</tspan></text><rect x="631" y="218" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="640" y="319" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="640" dy="0">masonry spine</tspan><tspan x="640" dy="14.375">penetration</tspan></text><rect x="891" y="218" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="900" y="319" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="900" dy="0">≤ 2 bends:</tspan><tspan x="900" dy="14.375">no pull point</tspan><tspan x="900" dy="14.375">(reasoned)</tspan></text><rect x="1151" y="218" width="18" height="79" rx="9" fill="#fff" stroke="#1d4ed8" stroke-width="3.5"/><text x="1160" y="319" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle"><tspan x="1160" dy="0">RBX06</tspan></text><rect x="300" y="404" width="1330" height="158" rx="10" fill="#f8fafc" stroke="#e4e7eb"/><text x="316" y="426" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="316" dy="0">CH-8</tspan></text><text x="380" y="426" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="380" dy="0">→ RBX08 · RB-E/W · R08</tspan></text><text x="1615" y="426" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="end" font-style="italic"><tspan x="1615" dy="0">spur: C1 · C3 · C4 + C4b — the bathroom keeps the assured bus</tspan></text><line x1="290" y1="450" x2="1160" y2="450" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="300" y1="461" x2="1160" y2="461" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="2 6"/><line x1="290" y1="472" x2="1160" y2="472" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><line x1="290" y1="483" x2="1160" y2="483" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><line x1="290" y1="494" x2="1160" y2="494" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/><line x1="300" y1="505" x2="1160" y2="505" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="2 6"/><rect x="421" y="438" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="430" y="539" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="430" dy="0">leave joinery</tspan></text><rect x="751" y="438" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="760" y="539" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="760" dy="0">pull point —</tspan><tspan x="760" dy="14.375">per route (open:</tspan><tspan x="760" dy="14.375">RBX08's wall)</tspan></text><rect x="1151" y="438" width="18" height="79" rx="9" fill="#fff" stroke="#1d4ed8" stroke-width="3.5"/><text x="1160" y="539" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle"><tspan x="1160" dy="0">RBX08</tspan></text><rect x="300" y="634" width="1330" height="158" rx="10" fill="#f8fafc" stroke="#e4e7eb"/><text x="316" y="656" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="316" dy="0">CH-9</tspan></text><text x="380" y="656" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="380" dy="0">→ RBX09 · RB-M · R09 (upper)</tspan></text><text x="1615" y="656" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="end" font-style="italic"><tspan x="1615" dy="0">conduits now, cables pulled with the upper floor</tspan></text><line x1="290" y1="680" x2="1160" y2="680" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="1160" y1="680" x2="1420" y2="680" stroke="#2563eb" stroke-width="5" stroke-dasharray="8 7" stroke-linecap="round" opacity=".6"/><line x1="290" y1="691" x2="1160" y2="691" stroke="#db2777" stroke-width="5" stroke-linecap="round"/><line x1="1160" y1="691" x2="1420" y2="691" stroke="#db2777" stroke-width="5" stroke-dasharray="8 7" stroke-linecap="round" opacity=".6"/><line x1="290" y1="702" x2="1160" y2="702" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><line x1="1160" y1="702" x2="1420" y2="702" stroke="#16a34a" stroke-width="5" stroke-dasharray="8 7" stroke-linecap="round" opacity=".6"/><line x1="290" y1="713" x2="1160" y2="713" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><line x1="1160" y1="713" x2="1420" y2="713" stroke="#94a3b8" stroke-width="5" stroke-dasharray="8 7" stroke-linecap="round" opacity=".6"/><line x1="290" y1="724" x2="1160" y2="724" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/><line x1="1160" y1="724" x2="1420" y2="724" stroke="#0f766e" stroke-width="5" stroke-dasharray="8 7" stroke-linecap="round" opacity=".6"/><line x1="290" y1="735" x2="1160" y2="735" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/><line x1="1160" y1="735" x2="1420" y2="735" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="8 7" stroke-linecap="round" opacity=".6"/><rect x="421" y="668" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="430" y="769" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="430" dy="0">leave joinery</tspan></text><rect x="601" y="668" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="610" y="769" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="610" dy="0">along R03</tspan><tspan x="610" dy="14.375">south wall</tspan></text><rect x="781" y="668" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="790" y="769" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="790" dy="0">PP at riser foot</tspan><tspan x="790" dy="14.375">(3rd bend)</tspan></text><rect x="951" y="668" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="960" y="769" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="960" dy="0">V1 sleeves</tspan><tspan x="960" dy="14.375">through slab</tspan><tspan x="960" dy="14.375">fire-stopped</tspan></text><rect x="1151" y="668" width="18" height="79" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="1160" y="769" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="1160" dy="0">inspection box</tspan><tspan x="1160" dy="14.375">— capped</tspan><tspan x="1160" dy="14.375">draw cords</tspan></text><rect x="1411" y="668" width="18" height="79" rx="9" fill="#fff" stroke="#1d4ed8" stroke-width="3.5"/><text x="1420" y="769" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle"><tspan x="1420" dy="0">RBX09</tspan><tspan x="1420" dy="14.375">upper renovation</tspan></text><path d="M1160,713 C1220,713 1220,905 1280,905 L1420,905" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="8 7"/><rect x="1411" y="893" width="18" height="24" rx="9" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><text x="1340" y="892" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="1340" dy="0">CH-9s</tspan></text><text x="1440" y="910" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1440" dy="0">R13 tároló — C4 spare (K16)</tspan></text><rect x="1660" y="130" width="310" height="860" rx="12" fill="#fff" stroke="#9aa5b1"/><text x="1680" y="162" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1680" dy="0">The bundle — fixed order</tspan></text><text x="1680" y="182" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1680" dy="0">left → right, looking away from BASE</tspan></text><line x1="1680" y1="220" x2="1730" y2="220" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><text x="1742" y="225" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1742" dy="0">C1 · DATA · M25</tspan></text><text x="1742" y="245" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1742" dy="0">2 × Cat6A U/FTP</tspan></text><line x1="1680" y1="294" x2="1730" y2="294" stroke="#db2777" stroke-width="6" stroke-linecap="round"/><text x="1742" y="299" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1742" dy="0">C2 · MEDIA · M40</tspan></text><text x="1742" y="319" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1742" dy="0">HDMI AOC + Cat6A</tspan></text><line x1="1680" y1="368" x2="1730" y2="368" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/><text x="1742" y="373" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1742" dy="0">C3 · CTRL · M20</tspan></text><text x="1742" y="393" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1742" dy="0">Cat6A S/FTP · BRIDGE_LINK</tspan></text><line x1="1680" y1="442" x2="1730" y2="442" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/><text x="1742" y="447" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1742" dy="0">C4 · SPARE · M25</tspan></text><text x="1742" y="467" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1742" dy="0">empty + draw cord</tspan></text><line x1="1680" y1="516" x2="1730" y2="516" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/><text x="1742" y="521" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1742" dy="0">C4b · BUS B · M20</tspan></text><text x="1742" y="541" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1742" dy="0">assured 24 V pair (K25)</tspan></text><line x1="1680" y1="590" x2="1730" y2="590" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/><text x="1742" y="595" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1742" dy="0">C5 · KNX · M20</tspan></text><text x="1742" y="615" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1742" dy="0">installed empty (B10)</tspan></text><text x="1680" y="690" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1680" dy="0">Day-one fill, reasoned on typical</tspan><tspan x="1680" dy="15">conduit bores (limit 40 %):</tspan><tspan x="1680" dy="15">C1  2 × Cat6A in M25   ≈ 32 %</tspan><tspan x="1680" dy="15">C2  AOC + Cat6A in M40 ≈ 10 %</tspan><tspan x="1680" dy="15">      (the plug is the limit, §5.2)</tspan><tspan x="1680" dy="15">C3  1 × Cat6A in M20   ≈ 27 %</tspan><tspan x="1680" dy="15">C4b 24 V pair in M20   ≈ 27 %</tspan><tspan x="1680" dy="15"> </tspan><tspan x="1680" dy="15">Rules on every run (STD-001 §3.3):</tspan><tspan x="1680" dy="15">≤ two 90° bends between pull points</tspan><tspan x="1680" dy="15">bend radius ≥ 8 × OD — sweeps only</tspan><tspan x="1680" dy="15">draw cord in every conduit</tspan><tspan x="1680" dy="15">both ends labelled P33-R&lt;nn>-C&lt;n></tspan></text><rect x="40" y="1020" width="1930" height="106" rx="8" fill="#f5f7fa" stroke="#9aa5b1"/><line x1="60" y1="1054" x2="106" y2="1054" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text x="122" y="1059" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="122" dy="0">conduit with day-one cable</tspan></text><line x1="703.3333333333334" y1="1054" x2="749.3333333333334" y2="1054" stroke="#2563eb" stroke-width="5" stroke-dasharray="8 7" opacity=".6"/><text x="765.3333333333334" y="1059" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="765.3333333333334" dy="0">conduit in, cable later</tspan></text><line x1="1346.6666666666667" y1="1054" x2="1392.6666666666667" y2="1054" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="2 6"/><text x="1408.6666666666667" y="1059" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1408.6666666666667" dy="0">not in this run (RB-E spur)</tspan></text><rect x="74" y="1078" width="18" height="28" rx="9" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="122" y="1097" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="122" dy="0">station — penetration, pull point, sleeve</tspan></text><rect x="717.3333333333334" y="1078" width="18" height="28" rx="9" fill="#fff" stroke="#1d4ed8" stroke-width="3.5"/><text x="765.3333333333334" y="1097" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="765.3333333333334" dy="0">RoomBox — the run terminates</tspan></text></svg>