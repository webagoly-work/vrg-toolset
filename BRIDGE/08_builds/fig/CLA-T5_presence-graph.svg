<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1220" width="2000" height="1220" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif"><title>CLA · T5 — Presence zone graph</title><rect width="2000" height="1220" fill="#fff"/><text x="40" y="48" font-size="26" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">CLA · T5 — Presence zone graph</tspan></text><text x="40" y="74" font-size="14" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="40" dy="0">Rooms as zones, portals as edges, depth from the entrance left to right. Tiers per STD-003 §2.2 and the outline's two-anchor rule.   CLA-BUILD-001 r1 · 2026-10-06</tspan></text><defs><marker id="a1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect x="20" y="120" width="1570" height="480" rx="12" fill="#f8fafc"/><text x="36" y="146" font-size="13" font-weight="700" fill="#52606d" text-anchor="start"><tspan x="36" dy="0">GROUND FLOOR</tspan></text><rect x="20" y="640" width="1570" height="420" rx="12" fill="#f8fafc" stroke="#9aa5b1" stroke-dasharray="6 5"/><text x="36" y="666" font-size="13" font-weight="700" fill="#52606d" text-anchor="start"><tspan x="36" dy="0">UPPER FLOOR — provisioned now, instrumented with the upper renovation</tspan></text><rect x="40" y="330" width="130" height="64" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.8"/><text x="52" y="354" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="52" dy="0">OUTSIDE</tspan></text><text x="52" y="376" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="52" dy="0">stairwell of the block</tspan></text><rect x="230" y="318" width="190" height="88" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="242" y="342" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="242" dy="0">R01 előszoba</tspan></text><text x="242" y="364" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="242" dy="0">hall · grace 3 min</tspan><tspan x="242" dy="15">mmWave · cabinet + ISP here</tspan></text><rect x="230" y="470" width="190" height="70" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="242" y="494" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="242" dy="0">R04 WC</tspan></text><text x="242" y="516" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="242" dy="0">leaf · grace 8 min</tspan></text><rect x="490" y="318" width="240" height="88" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="502" y="342" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="502" dy="0">R03 — corridor half</tspan></text><text x="502" y="364" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="502" dy="0">transit · grace 3 min</tspan><tspan x="502" dy="15">zoned mmWave (zone A)</tspan></text><rect x="490" y="170" width="240" height="96" rx="8" fill="#fefce8" stroke="#1f2933" stroke-width="1.8"/><text x="502" y="194" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="502" dy="0">R03 dining half + R02 konyha</tspan></text><text x="502" y="216" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="502" dy="0">one zone — open plan, island loop</tspan><tspan x="502" dy="15">dwell · grace 12 min · mmWave (zone B)</tspan></text><rect x="490" y="470" width="240" height="70" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="502" y="494" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="502" dy="0">R05 kamra</tspan></text><text x="502" y="516" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="502" dy="0">leaf · grace 3 min · V1 riser</tspan></text><rect x="800" y="318" width="210" height="88" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="812" y="342" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="812" dy="0">R06 nappali</tspan></text><text x="812" y="364" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="812" dy="0">living · grace 15 min</tspan><tspan x="812" dy="15">mmWave + CO₂ · void above</tspan></text><rect x="1080" y="318" width="210" height="88" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="1092" y="342" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1092" dy="0">R07 szoba</tspan></text><text x="1092" y="364" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1092" dy="0">bedroom · grace 45 min</tspan><tspan x="1092" dy="15">mmWave + CO₂</tspan></text><rect x="1360" y="318" width="210" height="88" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="1372" y="342" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1372" dy="0">R08 fürdő</tspan></text><text x="1372" y="364" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1372" dy="0">en-suite · 8 min + interlock</tspan><tspan x="1372" dy="15">thermal array (primary)</tspan></text><rect x="800" y="760" width="210" height="88" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="812" y="784" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="812" dy="0">R11 közlekedő</tspan></text><text x="812" y="806" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="812" dy="0">stair head · grace 3 min</tspan></text><rect x="1080" y="690" width="210" height="88" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="1092" y="714" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1092" dy="0">R09 szoba</tspan></text><text x="1092" y="736" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1092" dy="0">bedroom · grace 45 min</tspan><tspan x="1092" dy="15">mmWave masked to the void</tspan></text><rect x="1080" y="820" width="210" height="76" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="1092" y="844" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1092" dy="0">R10 fürdő</tspan></text><text x="1092" y="866" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1092" dy="0">8 min + interlock</tspan></text><rect x="1080" y="940" width="210" height="76" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="1092" y="964" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1092" dy="0">R12 terasz</tspan></text><text x="1092" y="986" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1092" dy="0">outdoor cul-de-sac</tspan></text><rect x="1360" y="940" width="210" height="76" rx="8" fill="#fff" stroke="#1f2933" stroke-width="1.8"/><text x="1372" y="964" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1372" dy="0">R13 tároló</tspan></text><text x="1372" y="986" font-size="12" font-weight="400" fill="#52606d" text-anchor="start"><tspan x="1372" dy="0">leaf · reached via R12</tspan></text><path d="M170,362 L230,362" fill="none" stroke="#c2410c" stroke-width="8" stroke-linejoin="round"/><rect x="146" y="297" width="72.8" height="21" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="150" y="312" font-size="12" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="150" dy="0">P-3 entry</tspan></text><path d="M325,406 L325,470" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/><rect x="328" y="433" width="29.6" height="21" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="332" y="448" font-size="12" font-weight="700" fill="#64748b" text-anchor="start"><tspan x="332" dy="0">P-1</tspan></text><path d="M420,362 L490,362" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"/><rect x="430" y="337" width="29.6" height="21" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="434" y="352" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="434" dy="0">P-2</tspan></text><path d="M610,406 L610,470" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/><rect x="618" y="433" width="29.6" height="21" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="622" y="448" font-size="12" font-weight="700" fill="#64748b" text-anchor="start"><tspan x="622" dy="0">P-1</tspan></text><path d="M730,362 L800,362" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"/><rect x="740" y="337" width="29.6" height="21" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="744" y="352" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="744" dy="0">P-2</tspan></text><path d="M1010,362 L1080,362" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"/><rect x="1020" y="337" width="29.6" height="21" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="1024" y="352" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="1024" dy="0">P-2</tspan></text><path d="M1290,362 L1360,362" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"/><rect x="1300" y="337" width="29.6" height="21" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="1304" y="352" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="1304" dy="0">P-2</tspan></text><path d="M690,406 L690,804 L800,804" fill="none" stroke="#c2410c" stroke-width="8" stroke-linejoin="round"/><rect x="696" y="605" width="72.8" height="21" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="700" y="620" font-size="12" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="700" dy="0">P-3 stair</tspan></text><path d="M1010,790 L1045,790 L1045,734 L1080,734" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"/><rect x="1018" y="707" width="29.6" height="21" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="1022" y="722" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="1022" dy="0">P-2</tspan></text><path d="M1010,820 L1045,820 L1045,858 L1080,858" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"/><rect x="1018" y="863" width="29.6" height="21" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="1022" y="878" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="1022" dy="0">P-2</tspan></text><path d="M905,848 L905,978 L1080,978" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/><rect x="908" y="953" width="29.6" height="21" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="912" y="968" font-size="12" font-weight="700" fill="#64748b" text-anchor="start"><tspan x="912" dy="0">P-1</tspan></text><path d="M1290,978 L1360,978" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/><rect x="1300" y="953" width="29.6" height="21" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="1304" y="968" font-size="12" font-weight="700" fill="#64748b" text-anchor="start"><tspan x="1304" dy="0">P-1</tspan></text><path d="M610,266 L610,318" stroke="#1f2933" stroke-width="2" stroke-dasharray="4 4"/><text x="620" y="298" font-size="11" font-weight="400" fill="#52606d" text-anchor="start" font-style="italic"><tspan x="620" dy="0">sensor-zone boundary, not a portal</tspan></text><path d="M1185,690 C1185,560 905,560 905,406" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><text x="960" y="548" font-size="12" font-weight="600" fill="#0369a1" text-anchor="start"><tspan x="960" dy="0">line of sight across the 4.5 m void — no edge, people cannot cross it</tspan></text><rect x="1620" y="120" width="350" height="940" rx="12" fill="#fff" stroke="#9aa5b1"/><text x="1640" y="152" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="1640" dy="0">Reading the graph</tspan></text><text x="1640" y="182" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1640" dy="0">It is a TREE. Every room has exactly</tspan><tspan x="1640" dy="16.25">one way in, so every crossing has one</tspan><tspan x="1640" dy="16.25">possible destination and counts</tspan><tspan x="1640" dy="16.25">propagate without ambiguity.</tspan><tspan x="1640" dy="16.25"> </tspan><tspan x="1640" dy="16.25">Two count anchors, both P-3:</tspan><tspan x="1640" dy="16.25">the entrance and the stair. The stair</tspan><tspan x="1640" dy="16.25">is the only walkable link between</tspan><tspan x="1640" dy="16.25">floors.</tspan><tspan x="1640" dy="16.25"> </tspan><tspan x="1640" dy="16.25">R08 is an en-suite: reached only</tspan><tspan x="1640" dy="16.25">through R07, which is reached only</tspan><tspan x="1640" dy="16.25">through R06. A night bathroom trip</tspan><tspan x="1640" dy="16.25">never touches the rest of the house.</tspan><tspan x="1640" dy="16.25"> </tspan><tspan x="1640" dy="16.25">R03 is two zones in one room, split</tspan><tspan x="1640" dy="16.25">by sensing, not by a door. The</tspan><tspan x="1640" dy="16.25">kitchen joins the dining half.</tspan><tspan x="1640" dy="16.25"> </tspan><tspan x="1640" dy="16.25">The terrace is not an exterior edge:</tspan><tspan x="1640" dy="16.25">nobody arrives from it, so the house</tspan><tspan x="1640" dy="16.25">count holds while someone is outside</tspan><tspan x="1640" dy="16.25">on it.</tspan><tspan x="1640" dy="16.25"> </tspan><tspan x="1640" dy="16.25">R09 can see R06 through the void.</tspan><tspan x="1640" dy="16.25">Mask its mmWave, or the living room</tspan><tspan x="1640" dy="16.25">will appear upstairs.</tspan></text><rect x="40" y="1090" width="1930" height="106" rx="8" fill="#f5f7fa" stroke="#9aa5b1"/><line x1="60" y1="1124" x2="106" y2="1124" stroke="#c2410c" stroke-width="8"/><text x="122" y="1129" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="122" dy="0">P-3 — count anchor: P-2 + mmWave + thermal</tspan></text><line x1="703.3333333333334" y1="1124" x2="749.3333333333334" y2="1124" stroke="#1d4ed8" stroke-width="5"/><text x="765.3333333333334" y="1129" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="765.3333333333334" dy="0">P-2 — direction + count (dual ToF)</tspan></text><line x1="1346.6666666666667" y1="1124" x2="1392.6666666666667" y2="1124" stroke="#64748b" stroke-width="2.5"/><text x="1408.6666666666667" y="1129" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1408.6666666666667" dy="0">P-1 — direction only (the default, D01)</tspan></text><line x1="60" y1="1162" x2="106" y2="1162" stroke="#1f2933" stroke-width="2" stroke-dasharray="4 4"/><text x="122" y="1167" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="122" dy="0">zone boundary inside a room — sensing only</tspan></text><line x1="703.3333333333334" y1="1162" x2="749.3333333333334" y2="1162" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><text x="765.3333333333334" y="1167" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="765.3333333333334" dy="0">line of sight — not an edge</tspan></text><rect x="1346.6666666666667" y="1152" width="46" height="20" rx="4" fill="#fff" stroke="#1f2933"/><text x="1408.6666666666667" y="1167" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1408.6666666666667" dy="0">zone · grace period per STD-003 §3.4</tspan></text></svg>