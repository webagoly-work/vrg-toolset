<style>/* melyviz:begin */
/* Mélyvíz — the VRG dev-side style (CITY-D26, 2026-10-27), shared by every dev-side app. Spec: docs/city/melyviz.md.
   This file is the source. Apps carry a copy between the markers  melyviz:begin / melyviz:end  that
   tools/melyviz-sync.js writes; `node tools/melyviz-sync.js --check` fails when a copy has drifted.
   Do not edit a copy inside an app — edit this file and sync.

   Tokens are --mv-* so they never collide with an app's own names; an app maps its variables onto them.
   The base layer applies only under html.mv, so adding the block changes nothing until the app opts in.
   M1 ice = the instrument and you (selection, focus, "you are here"); warm = activity (running, heat, recent work).
   M5 smoked glass, 1 px hairlines, square controls, two cut corners, no rounded corners, no drop shadows.
   M6 numbers and readouts mono; titles in the condensed voice; small labels uppercase and tracked. */
:root {
  --mv-bg: #0a141c; --mv-horizon: #11202b;
  --mv-panel: rgba(20, 30, 38, .74); --mv-panel-solid: #121c24; --mv-raised: #17232c;
  --mv-line: rgba(232, 240, 246, .15); --mv-line-strong: rgba(232, 240, 246, .34);
  --mv-text: #e8f0f6; --mv-dim: #a6afb7; --mv-faint: #646d74;
  --mv-accent: #93d3e6; --mv-accent-soft: rgba(147, 211, 230, .14); --mv-accent-glow: rgba(147, 211, 230, .5);
  --mv-warm: #e8a873; --mv-warm-soft: rgba(232, 168, 115, .14);
  --mv-ok: #8bcca1; --mv-warn: #e3be7b; --mv-crit: #e4877d;
  --mv-cut: 6px; --mv-blur: 12px; --mv-glow: 3px;
  --mv-mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --mv-voice: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif;
  --mv-sans: "Segoe UI", system-ui, sans-serif;
}
html.mv.low-glow { --mv-glow: 0px; }

/* ---- base layer (opt-in: html.mv; zero specificity, so any app rule wins) ---- */
:where(html.mv) { color-scheme: dark; }
:where(html.mv) :where(body) { background: var(--mv-bg); color: var(--mv-text); font-family: var(--mv-sans); }
:where(html.mv) :where(:is(h1, h2, h3)) { font-family: var(--mv-voice); font-stretch: 75%; font-weight: 600; letter-spacing: .03em; }
:where(html.mv) :where(:is(code, kbd, pre, samp, .mv-num)) { font-family: var(--mv-mono); }
:where(html.mv) :where(:focus-visible) { outline: 2px solid var(--mv-accent); outline-offset: 2px; }
:where(html.mv) ::selection { background: var(--mv-accent-soft); color: var(--mv-text); }
:where(html.mv) :where(:is(button, input, select, textarea)) { font: inherit; color: var(--mv-text); border-radius: 0; }
:where(html.mv) :where(:is(button, select, input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]), textarea)) {
  background: var(--mv-panel-solid); border: 1px solid var(--mv-line-strong); box-shadow: none; }
:where(html.mv) :where(button) { cursor: pointer; }
:where(html.mv) :where(button:hover:not(:disabled)) { border-color: var(--mv-accent); }
:where(html.mv) :where(:is(input, select, textarea):focus) { border-color: var(--mv-accent); outline: none; box-shadow: 0 0 var(--mv-glow) var(--mv-accent-glow); }
:where(html.mv) :where(:is(input[type=checkbox], input[type=radio], input[type=range])) { accent-color: var(--mv-accent); }
:where(html.mv) :where(input, textarea)::placeholder { color: var(--mv-faint); }
:where(html.mv) :where(:disabled) { opacity: .45; cursor: default; }
:where(html.mv) :where(table) { border-collapse: collapse; }
:where(html.mv) :where(:is(th, td)) { border-color: var(--mv-line); }
:where(html.mv) :where(th) { color: var(--mv-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; }
:where(html.mv) :where(a) { color: var(--mv-accent); }
:where(html.mv) :where(hr) { border: 0; border-top: 1px solid var(--mv-line); }
:where(html.mv) { scrollbar-color: var(--mv-line-strong) transparent; scrollbar-width: thin; }

/* ---- components (usable anywhere) ---- */
.mv-glass {
  border: 1px solid var(--mv-line-strong); border-radius: 0; box-shadow: none;
  -webkit-backdrop-filter: blur(var(--mv-blur)) saturate(1.2); backdrop-filter: blur(var(--mv-blur)) saturate(1.2);
  background: var(--mv-panel); }
.mv-solid { border: 1px solid var(--mv-line-strong); border-radius: 0; box-shadow: none; background: var(--mv-panel-solid); }
/* two cut corners (top left, bottom right) drawn as diagonals; layer on .mv-glass or .mv-solid */
.mv-cut {
  clip-path: polygon(var(--mv-cut) 0, 100% 0, 100% calc(100% - var(--mv-cut)), calc(100% - var(--mv-cut)) 100%, 0 100%, 0 var(--mv-cut));
  background-image:
    linear-gradient(to bottom right, transparent 50%, var(--mv-line-strong) 50%, var(--mv-line-strong) calc(50% + 1.2px), transparent calc(50% + 1.2px)),
    linear-gradient(to top left, transparent 50%, var(--mv-line-strong) 50%, var(--mv-line-strong) calc(50% + 1.2px), transparent calc(50% + 1.2px));
  background-position: left top, right bottom; background-size: var(--mv-cut) var(--mv-cut); background-repeat: no-repeat;
  background-origin: border-box; }
.mv-title { font-family: var(--mv-voice); font-stretch: 75%; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.mv-label { font-family: var(--mv-mono); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; color: var(--mv-dim); }
.mv-btn { background: none; border: 1px solid var(--mv-line-strong); border-radius: 0; color: inherit; font: inherit; padding: 3px 10px; cursor: pointer; }
.mv-btn:hover { border-color: var(--mv-accent); }
.mv-on, .mv-btn.on { border-color: var(--mv-accent); color: var(--mv-accent); background: var(--mv-accent-soft); box-shadow: 0 0 var(--mv-glow) var(--mv-accent-glow); }
.mv-live { color: var(--mv-warm); }
.mv-badge { font: 11px var(--mv-mono); padding: 1px 7px; border: 1px solid var(--mv-line-strong); color: var(--mv-dim); white-space: nowrap; }
.mv-badge.ok { color: var(--mv-ok); border-color: var(--mv-ok); }
.mv-badge.warn { color: var(--mv-warn); border-color: var(--mv-warn); }
.mv-badge.crit { color: var(--mv-crit); border-color: var(--mv-crit); }

/* print stays paper: Mélyvíz is a screen style */
@media print {
  :where(html.mv) { color-scheme: light; }
  :where(html.mv) body { background: #fff; color: #000; }
  .mv-glass, .mv-solid { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
/* melyviz:end */</style>
<style>
  /* Mélyvíz (shared/melyviz.css), chrome only: the board, copper, silk, holes, rails and the protocol tag hues keep
     their meaning. --accent is selection and focus (you), so ice; OK lines and badges use --mv-ok in the skin below.
     No web fonts: the page works offline. */
  :root {
    --bg:       var(--mv-bg);
    --bg2:      var(--mv-horizon);
    --bg3:      var(--mv-raised);
    --panel:    var(--mv-panel-solid);
    --border:   var(--mv-line);
    --border2:  var(--mv-line-strong);
    --board:    #1a3320;
    --board2:   #1f3d25;
    --copper:   #c8860a;
    --silk:     #d4f0c8;
    --hole:     #0a0e0b;
    --rail-r:   #8b1a1a;
    --rail-b:   #1a3a8b;
    --rail-y:   #c8860a;
    --accent:   var(--mv-accent);
    --accent2:  #3d6f80;
    --warn:     var(--mv-warn);
    --danger:   var(--mv-crit);
    --text:     var(--mv-text);
    --text2:    var(--mv-dim);
    --text3:    var(--mv-faint);
    --mono:     var(--mv-mono);
    --head:     var(--mv-voice);
    --cell:     10px;
    --gap:      1px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── TOP BAR ── */
  #topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border2);
    padding: 0 16px;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
  }
  #logo {
    font-family: var(--head);
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
  }
  #logo span { color: var(--text3); font-weight: 400; font-size: 13px; letter-spacing: 0; margin-left: 6px; }

  .board-tabs { display: flex; gap: 2px; }
  .board-tab {
    padding: 4px 14px;
    font-family: var(--mono);
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text2);
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .board-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }
  .board-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 5px 14px;
    font-family: var(--mono);
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .btn-test  { background: transparent; border-color: var(--warn);   color: var(--warn);   }
  .btn-reset { background: transparent; border-color: var(--danger);  color: var(--danger); }
  .btn-save  { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .btn:hover { opacity: 0.8; transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }

  /* ── MAIN LAYOUT ── */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── LEFT PANEL: MODULE PALETTE ── */
  #palette {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #palette-header {
    padding: 10px 12px 6px;
    font-family: var(--head);
    font-size: 13px;
    color: var(--text2);
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #palette-search {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #palette-search input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 2px;
    outline: none;
  }
  #palette-search input:focus { border-color: var(--accent); }
  #palette-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  #palette-list::-webkit-scrollbar { width: 4px; }
  #palette-list::-webkit-scrollbar-track { background: var(--bg); }
  #palette-list::-webkit-scrollbar-thumb { background: var(--border2); }

  .palette-group-label {
    padding: 8px 12px 3px;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .palette-item {
    padding: 5px 10px;
    cursor: grab;
    border-left: 3px solid transparent;
    transition: all 0.1s;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .palette-item:hover {
    background: var(--bg3);
    border-left-color: var(--accent);
  }
  .palette-item.dragging { opacity: 0.4; cursor: grabbing; }
  .pi-color {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-top: 3px;
    flex-shrink: 0;
  }
  .pi-info { flex: 1; min-width: 0; }
  .pi-name {
    font-family: var(--head);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pi-sub {
    font-size: 10px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pi-dims {
    font-size: 9px;
    color: var(--text3);
    font-family: var(--mono);
    white-space: nowrap;
    margin-top: 1px;
  }

  /* ── CENTER: CANVAS ── */
  #canvas-area {
    flex: 1;
    background: var(--bg);
    overflow: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 30px;
    position: relative;
  }
  #canvas-area::-webkit-scrollbar { width: 6px; height: 6px; }
  #canvas-area::-webkit-scrollbar-track { background: var(--bg); }
  #canvas-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  .board-label {
    font-family: var(--head);
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: -24px;
    align-self: flex-start;
    padding-left: 4px;
  }

  .board-wrapper {
    position: relative;
    cursor: crosshair;
  }
  .board-wrapper.drop-target { outline: 2px dashed var(--accent); }

  /* ── RIGHT PANEL: INSPECTOR ── */
  #inspector {
    width: 200px;
    background: var(--panel);
    border-left: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #inspector-header {
    padding: 10px 12px 6px;
    font-family: var(--head);
    font-size: 13px;
    color: var(--text2);
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #inspector-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  #inspector-body::-webkit-scrollbar { width: 4px; }
  #inspector-body::-webkit-scrollbar-track { background: var(--bg); }
  #inspector-body::-webkit-scrollbar-thumb { background: var(--border2); }

  .insp-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  .insp-label { color: var(--text3); }
  .insp-val   { color: var(--text);  text-align: right; font-family: var(--mono); }

  .insp-section {
    font-family: var(--head);
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 1px;
    padding: 8px 0 4px;
    text-transform: uppercase;
  }

  .tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 10px;
    margin: 2px 2px 0 0;
    font-family: var(--mono);
  }
  .tag-espnow  { background: #1a3a20; color: #4dc870; border: 1px solid #2a5a30; }
  .tag-wifi    { background: #1a2a3a; color: #4a90d4; border: 1px solid #2a3a5a; }
  .tag-i2c     { background: #2a2010; color: #c8a040; border: 1px solid #4a3a10; }
  .tag-spi     { background: #2a1020; color: #c840a0; border: 1px solid #4a1a30; }
  .tag-uart    { background: #20102a; color: #a040c8; border: 1px solid #301a4a; }
  .tag-lora    { background: #102a2a; color: #40c8c8; border: 1px solid #1a4a4a; }
  .tag-ble     { background: #10202a; color: #4088c8; border: 1px solid #1a3040; }
  .tag-power   { background: #2a2000; color: #c88820; border: 1px solid #4a3a00; }
  .tag-zigbee  { background: #1a1a2a; color: #8888d0; border: 1px solid #2a2a4a; }

  .conn-badge {
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 10px;
    margin: 2px 0;
    display: block;
  }
  .conn-ok   { background: #0a2a10; color: var(--accent);  border: 1px solid #1a5a20; }
  .conn-warn { background: #2a1a00; color: var(--warn);    border: 1px solid #5a3a00; }
  .conn-err  { background: #2a0a0a; color: var(--danger);  border: 1px solid #5a1a1a; }
  .conn-info { background: #001a2a; color: #60aacc;        border: 1px solid #003a5a; }

  /* ── BOTTOM LOG ── */
  #log-bar {
    height: 80px;
    background: var(--panel);
    border-top: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #log-header {
    padding: 4px 12px;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #log-content {
    flex: 1;
    overflow-y: auto;
    padding: 4px 12px;
    font-size: 10px;
    line-height: 1.6;
  }
  #log-content::-webkit-scrollbar { width: 4px; }
  #log-content::-webkit-scrollbar-thumb { background: var(--border2); }
  .log-ok   { color: var(--accent); }
  .log-warn { color: var(--warn); }
  .log-err  { color: var(--danger); }
  .log-info { color: var(--text2); }

  /* ── PLACED MODULE on canvas ── */
  .placed-module {
    position: absolute;
    border-radius: 2px;
    border: 1.5px solid rgba(255,255,255,0.15);
    cursor: move;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: box-shadow 0.15s, border-color 0.15s;
    z-index: 10;
  }
  .placed-module:hover {
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 0 1px var(--accent), 0 0 12px rgba(61,220,132,0.2);
    z-index: 20;
  }
  .placed-module.selected {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(61,220,132,0.3);
    z-index: 30;
  }
  .pm-name {
    font-family: var(--head);
    font-size: 9px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    text-align: center;
    line-height: 1.2;
    padding: 1px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pm-sub {
    font-size: 7px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pm-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1px;
    padding: 0 2px;
  }
  .pm-tag {
    font-size: 6px;
    padding: 0 3px;
    border-radius: 1px;
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.2);
    line-height: 1.4;
  }
  .pm-delete {
    position: absolute;
    top: 1px;
    right: 2px;
    font-size: 9px;
    color: rgba(255,60,60,0.7);
    cursor: pointer;
    line-height: 1;
    padding: 1px;
    display: none;
  }
  .placed-module:hover .pm-delete,
  .placed-module.selected .pm-delete { display: block; }

  /* Connection lines SVG overlay */
  #conn-overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* Modal */
  #modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #modal-bg.show { display: flex; }
  #modal {
    background: var(--panel);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 20px;
    width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 12px;
  }
  #modal h2 {
    font-family: var(--head);
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  #modal .modal-close {
    float: right;
    cursor: pointer;
    color: var(--danger);
    font-size: 14px;
  }
  .modal-section { margin-top: 14px; }
  .modal-section h3 {
    font-family: var(--head);
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 1px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
  }
  .modal-item { padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--text2); }
  .modal-item b { color: var(--warn); }
  .modal-item .ok { color: var(--accent); }
  .modal-item .err { color: var(--danger); }

  #no-modules-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text3);
    font-size: 11px;
    text-align: center;
    pointer-events: none;
    line-height: 2;
  }

  /* ── Mélyvíz skin (chrome) ── condensed titles, square controls, outline primary, OK in --mv-ok, ice selection
     glow on placed modules (their own colours stay), glass top bar, cut corners on the modal */
  #logo, #palette-header, #inspector-header, .insp-section, .board-label, .pi-name, #modal h2, .modal-section h3 { font-stretch: 75%; }

  .board-tab.active, .btn-save { background: var(--mv-accent-soft); border-color: var(--mv-accent); color: var(--mv-accent); box-shadow: 0 0 var(--mv-glow) var(--mv-accent-glow); }
  .btn:hover { transform: none; }
  #topbar { background: var(--mv-panel); -webkit-backdrop-filter: blur(var(--mv-blur)); backdrop-filter: blur(var(--mv-blur)); }
  .conn-ok { color: var(--mv-ok); background: rgba(139,204,161,.08); border-color: rgba(139,204,161,.35); }

let selectedId = null;
let dragModule = null;
let dragOffset = {x:0, y:0};
let nextId = 1;
const CELL = 10; // px per breadboard unit

// Board configs (in breadboard units)
const BOARDS = {
  single: {
    cols: 1,
    colWidth: 63,   // standard 830pt breadboard = 63 rows
    totalW: 63,
    totalH: 34,     // 5 bus top + 2ch + 25 main + 2ch + 5 bus bottom (approx)
    label: 'SINGLE RAIL · 830pt'
  },
  triple: {
    cols: 3,
    colWidth: 63,
    totalW: 63*3 + 6, // 3 boards + 2 gaps, in CELL units (gaps drawn as px)
    totalH: 34,
    label: 'TRIPLE RAIL · 3× 830pt'
  }
};

// ═══════════════════════════════════════════════
// BOARD DRAWING
// ═══════════════════════════════════════════════
function drawBoard(canvas, type) {
  const cfg = BOARDS[type];
  const boardPxW = 63 * CELL;
  const H = cfg.totalH * CELL;
  const W = type === 'triple' ? boardPxW * 3 + 60 : boardPxW;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  if (type === 'single') {
    drawBreadboard(ctx, 0, 0, CELL);
  } else {
    // 3 boards side by side with 30px gap between each
    const boardPxW = 63 * CELL;
    for (let c = 0; c < 3; c++) {
      drawBreadboard(ctx, c * (boardPxW + 30), 0, CELL);
    }
    // fill gaps
    ctx.fillStyle = '#0d1a10';
    ctx.fillRect(boardPxW, 0, 30, H);
    ctx.fillRect(boardPxW*2+30, 0, 30, H);
  }
}

function drawBreadboard(ctx, ox, oy, cell) {
  const ROWS = 63;
  const BUS_ROWS = 5;
  const MAIN_COLS = 5; // each side
  const CHAN = 2.5; // channel width in cells

  const bw = ROWS * cell;
  const bh = 34 * cell;

  // Board body
  ctx.fillStyle = '#1a3320';
  ctx.beginPath();
  roundRect(ctx, ox, oy, bw, bh, 4);
  ctx.closePath();
  ctx.fill();

  // Board edge
  ctx.strokeStyle = '#2a5030';
  ctx.lineWidth = 1;
  ctx.beginPath();
  roundRect(ctx, ox+0.5, oy+0.5, bw-1, bh-1, 4);
  ctx.closePath();
  ctx.stroke();

  // Silk text
  ctx.fillStyle = '#3a6040';
  ctx.font = `${cell*0.8}px 'Share Tech Mono', monospace`;
  ctx.textAlign = 'center';

  // RAIL REGIONS
  // Top power bus (rows 1-5 in bus cols)
  const busH = (BUS_ROWS + 1) * cell;
  ctx.fillStyle = 'rgba(15,25,18,0.6)';
  ctx.fillRect(ox+cell*0.5, oy+cell*0.5, bw - cell, busH - cell*0.5);

  // Bottom power bus
  ctx.fillRect(ox+cell*0.5, oy + bh - busH + cell*0.5 - cell, bw - cell, busH - cell*0.5);

  // Center channel
  const chanY = oy + busH + MAIN_COLS*cell;
  ctx.fillStyle = 'rgba(8,15,10,0.8)';
  ctx.fillRect(ox, chanY, bw, cell*2);

  // Draw holes
  const holeR = cell * 0.18;

  // Top bus holes (2 rows: + and -)
  for (let railRow = 0; railRow < 2; railRow++) {
    const hy = oy + (railRow + 1) * cell + cell * 0.5;
    for (let col = 0; col < ROWS; col++) {
      const hx = ox + col * cell + cell * 0.5;
      // Color stripe
      ctx.fillStyle = railRow === 0 ? 'rgba(140,20,20,0.6)' : 'rgba(20,40,140,0.6)';
      ctx.fillRect(ox + col * cell + cell*0.15, hy - cell*0.22, cell*0.7, cell*0.44);
      drawHole(ctx, hx, hy, holeR);
    }
    // Rail label
    ctx.fillStyle = railRow === 0 ? '#8b2a2a' : '#2a408b';
    ctx.font = `bold ${cell*0.7}px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(railRow === 0 ? '+' : '−', ox + 2, hy + cell * 0.3);
  }

  // Bottom bus holes
  for (let railRow = 0; railRow < 2; railRow++) {
    const hy = oy + bh - (2 - railRow) * cell - cell * 0.5;
    for (let col = 0; col < ROWS; col++) {
      const hx = ox + col * cell + cell * 0.5;
      ctx.fillStyle = railRow === 0 ? 'rgba(140,20,20,0.6)' : 'rgba(20,40,140,0.6)';
      ctx.fillRect(ox + col * cell + cell*0.15, hy - cell*0.22, cell*0.7, cell*0.44);
      drawHole(ctx, hx, hy, holeR);
    }
    ctx.fillStyle = railRow === 0 ? '#8b2a2a' : '#2a408b';
    ctx.font = `bold ${cell*0.7}px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(railRow === 0 ? '+' : '−', ox + 2, hy + cell * 0.3);
  }

  // Main holes (a-e top, f-j bottom)
  for (let row = 0; row < ROWS; row++) {
    const hx = ox + row * cell + cell * 0.5;
    // Row number every 5
    if ((row+1) % 5 === 0 || row === 0) {
      ctx.fillStyle = '#2a5030';
      ctx.font = `${cell*0.6}px 'Share Tech Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(row+1, hx, oy + busH + 0.7*cell);
    }
    for (let col = 0; col < MAIN_COLS; col++) {
      // Top side (a-e)
      const hy1 = oy + busH + (col + 1.5) * cell;
      drawHole(ctx, hx, hy1, holeR);
      // Bottom side (f-j)
      const hy2 = oy + busH + (col + MAIN_COLS + CHAN + 1.5) * cell;
      drawHole(ctx, hx, hy2, holeR);
    }
  }

  // Column letters
  const letters = ['a','b','c','d','e','f','g','h','i','j'];
  ctx.fillStyle = '#2a6035';
  ctx.font = `${cell*0.65}px 'Share Tech Mono', monospace`;
  ctx.textAlign = 'right';
  for (let col = 0; col < 5; col++) {
    ctx.fillText(letters[col], ox + cell*0.9, oy + busH + (col+1.5)*cell + cell*0.22);
    ctx.fillText(letters[col+5], ox + cell*0.9, oy + busH + (col+MAIN_COLS+CHAN+1.5)*cell + cell*0.22);
  }
}

function drawHole(ctx, x, y, r) {
  ctx.fillStyle = '#080f0a';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a3a20';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);
  ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r);
  ctx.arcTo(x, y, x+r, y, r);
}

// ═══════════════════════════════════════════════
// PALETTE RENDERING
// ═══════════════════════════════════════════════
function renderPalette(filter='') {
  const list = document.getElementById('palette-list');
  list.innerHTML = '';
  const groups = {};
  MODULES.forEach(m => {
    const name = m.name.toLowerCase();
    const desc = m.desc.toLowerCase();
    if (filter && !name.includes(filter.toLowerCase()) && !desc.includes(filter.toLowerCase())) return;
    if (!groups[m.group]) groups[m.group] = [];
    groups[m.group].push(m);
  });
  Object.entries(groups).forEach(([g, mods]) => {
    const gl = document.createElement('div');
    gl.className = 'palette-group-label';
    gl.textContent = g;
    list.appendChild(gl);
    mods.forEach(m => {
      const el = document.createElement('div');
      el.className = 'palette-item';
      el.draggable = true;
      el.dataset.moduleId = m.id;
      el.innerHTML = `
        <div class="pi-color" style="background:${m.color};border:1px solid rgba(255,255,255,0.15)"></div>
        <div class="pi-info">
          <div class="pi-name">${m.name}</div>
          <div class="pi-sub">${m.desc}</div>
          <div class="pi-dims">${m.dims} · ${m.pins}p</div>
        </div>`;
      el.addEventListener('dragstart', e => {
        dragModule = m;
        e.dataTransfer.effectAllowed = 'copy';
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      list.appendChild(el);
    });
  });
}

function filterPalette(val) { renderPalette(val); }

// ═══════════════════════════════════════════════
// BOARD DRAG/DROP + MODULE PLACEMENT
// ═══════════════════════════════════════════════
function initBoardDrop() {
  const wrapper = document.getElementById('board-wrapper');
  wrapper.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    wrapper.classList.add('drop-target');
  });
  wrapper.addEventListener('dragleave', () => wrapper.classList.remove('drop-target'));
  wrapper.addEventListener('drop', e => {
    e.preventDefault();
    wrapper.classList.remove('drop-target');
    if (!dragModule) return;
    const rect = wrapper.getBoundingClientRect();
    const px = Math.round((e.clientX - rect.left) / CELL) * CELL;
    const py = Math.round((e.clientY - rect.top) / CELL) * CELL;
    placeModule(dragModule, px, py);
    dragModule = null;
  });
}

function placeModule(moduleDef, px, py) {
  const placed = {
    uid: nextId++,
    moduleId: moduleDef.id,
    x: px,
    y: py,
    w: moduleDef.w * CELL,
    h: moduleDef.h * CELL,
  };
  placedModules.push(placed);
  renderPlacedModules();
  log(`info`, `placed ${moduleDef.name} @ (${Math.round(px/CELL)}, ${Math.round(py/CELL)}) BU`);
  updateNoModulesMsg();
}

function renderPlacedModules() {
  const container = document.getElementById('board-modules');
  container.innerHTML = '';
  const svg = document.getElementById('conn-overlay');
  const canvas = document.getElementById('board-canvas');
  svg.setAttribute('width', canvas.width);
  svg.setAttribute('height', canvas.height);
  svg.innerHTML = '';

  placedModules.forEach(pm => {
    const m = MODULES.find(x => x.id === pm.moduleId);
    if (!m) return;
    const el = document.createElement('div');
    el.className = 'placed-module' + (pm.uid === selectedId ? ' selected' : '');
    el.style.cssText = `left:${pm.x}px;top:${pm.y}px;width:${pm.w}px;height:${pm.h}px;background:${m.color};`;
    el.dataset.uid = pm.uid;

    const tags = m.protocols.slice(0,3).map(p =>
      `<span class="pm-tag">${p}</span>`).join('');

    el.innerHTML = `
      <span class="pm-delete" onclick="deleteModule(${pm.uid},event)">✕</span>
      <div class="pm-name">${m.short}</div>
      <div class="pm-sub">${m.dims}</div>
      <div class="pm-tags">${tags}</div>`;

    el.addEventListener('mousedown', e => startDragPlaced(e, pm.uid));
    el.addEventListener('click', e => { e.stopPropagation(); selectModule(pm.uid); });
    container.appendChild(el);
  });

  // Draw I2C/power connection lines between modules sharing protocols
  drawConnectionLines(svg);
}

function drawConnectionLines(svg) {
  const pairs = [];
  for (let i = 0; i < placedModules.length; i++) {
    for (let j = i+1; j < placedModules.length; j++) {
      const a = MODULES.find(x => x.id === placedModules[i].moduleId);
      const b = MODULES.find(x => x.id === placedModules[j].moduleId);
      if (!a || !b) continue;
      const shared = a.protocols.filter(p => b.protocols.includes(p) && p !== 'power');
      if (shared.length === 0) continue;
      pairs.push({a: placedModules[i], b: placedModules[j], protocols: shared});
    }
  }
  pairs.forEach(pair => {
    const ax = pair.a.x + pair.a.w/2;
    const ay = pair.a.y + pair.a.h/2;
    const bx = pair.b.x + pair.b.w/2;
    const by = pair.b.y + pair.b.h/2;
    const color = getProtoColor(pair.protocols[0]);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', ax); line.setAttribute('y1', ay);
    line.setAttribute('x2', bx); line.setAttribute('y2', by);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '1');
    line.setAttribute('stroke-dasharray', '3 3');
    line.setAttribute('opacity', '0.5');
    svg.appendChild(line);
    // Protocol label at midpoint
    const tx = (ax+bx)/2;
    const ty = (ay+by)/2;
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', tx); t.setAttribute('y', ty-3);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('fill', color);
    t.setAttribute('font-size','7');
    t.setAttribute('font-family',"'Share Tech Mono',monospace");
    t.textContent = pair.protocols[0];
    svg.appendChild(t);
  });
}

function getProtoColor(p) {
  const map = {
    'ESP-NOW':'#3ddc84','WiFi':'#4a90d4','WiFi6':'#4ab0f4',
    'BLE':'#6060e0','BLE5':'#6060e0','I2C':'#c8a040','SPI':'#c840a0',
    'UART':'#a040c8','LoRa':'#40c8c8','Meshtastic':'#40e0c0',
    'Thread':'#8888d0','Zigbee':'#8888d0','Ethernet':'#40a0c0',
    'I2S':'#d06080','analog':'#80a040','power':'#c8860a'
  };
  return map[p] || '#888';
}

// ═══════════════════════════════════════════════
// MODULE DRAGGING (placed on board)
// ═══════════════════════════════════════════════
function startDragPlaced(e, uid) {
  e.stopPropagation();
  const pm = placedModules.find(p => p.uid === uid);
  if (!pm) return;
  selectModule(uid);
  const rect = document.getElementById('board-wrapper').getBoundingClientRect();
  dragOffset.x = e.clientX - rect.left - pm.x;
  dragOffset.y = e.clientY - rect.top - pm.y;

  function onMove(ev) {
    const r = document.getElementById('board-wrapper').getBoundingClientRect();
    const nx = Math.max(0, Math.round((ev.clientX - r.left - dragOffset.x) / CELL) * CELL);
    const ny = Math.max(0, Math.round((ev.clientY - r.top - dragOffset.y) / CELL) * CELL);
    pm.x = nx; pm.y = ny;
    renderPlacedModules();
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    log('info', `moved module to (${Math.round(pm.x/CELL)}, ${Math.round(pm.y/CELL)}) BU`);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function deleteModule(uid, e) {
  e.stopPropagation();
  const pm = placedModules.find(p => p.uid === uid);
  const m = pm ? MODULES.find(x => x.id === pm.moduleId) : null;
  placedModules = placedModules.filter(p => p.uid !== uid);
  if (selectedId === uid) {
    selectedId = null;
    renderInspector(null);
  }
  renderPlacedModules();
  updateNoModulesMsg();
  if (m) log('warn', `removed ${m.name}`);
}

function selectModule(uid) {
  selectedId = uid;
  const pm = placedModules.find(p => p.uid === uid);
  const m = pm ? MODULES.find(x => x.id === pm.moduleId) : null;
  renderInspector(m, pm);
  renderPlacedModules();
}

document.getElementById('canvas-area').addEventListener('click', () => {
  selectedId = null;
  renderInspector(null);
  renderPlacedModules();
});

// ═══════════════════════════════════════════════
// INSPECTOR
// ═══════════════════════════════════════════════
function renderInspector(m, pm) {
  const body = document.getElementById('inspector-body');
  if (!m) {
    body.innerHTML = `<div style="color:var(--text3);font-size:11px;padding:8px 0">Select a module to inspect</div>`;
    return;
  }
  const tagHtml = m.protocols.map(p =>
    `<span class="tag tag-${p.toLowerCase().replace(/[^a-z]/g,'').replace('espnow','espnow').replace('wifi6','wifi').replace('ble5','ble')}">${p}</span>`
  ).join(' ');

  body.innerHTML = `
    <div style="background:${m.color};border-radius:3px;padding:8px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.1)">
      <div style="font-family:var(--head);font-size:16px;font-weight:700;color:#fff">${m.name}</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.6);margin-top:2px">${m.desc}</div>
    </div>
    <div class="insp-row"><span class="insp-label">dims</span><span class="insp-val">${m.dims}</span></div>
    <div class="insp-row"><span class="insp-label">pins</span><span class="insp-val">${m.pins}</span></div>
    <div class="insp-row"><span class="insp-label">BU size</span><span class="insp-val">${m.w} × ${m.h}</span></div>
    <div class="insp-row"><span class="insp-label">power</span><span class="insp-val" style="font-size:9px;max-width:110px;text-align:right">${m.power}</span></div>
    ${pm ? `<div class="insp-row"><span class="insp-label">position</span><span class="insp-val">(${Math.round(pm.x/CELL)}, ${Math.round(pm.y/CELL)}) BU</span></div>` : ''}
    <div class="insp-section">PROTOCOLS</div>
    <div style="padding:4px 0">${tagHtml}</div>
    <div class="insp-section">NOTES</div>
    <div style="font-size:10px;color:var(--text2);line-height:1.5;padding:4px 0">${m.notes}</div>
    ${renderCompatibility(m)}`;
}

function renderCompatibility(m) {
  if (placedModules.length < 2) return '';
  const placed = placedModules.map(pm => MODULES.find(x => x.id === pm.moduleId)).filter(Boolean);
  const others = placed.filter(o => o.id !== m.id);
  if (others.length === 0) return '';

  let html = `<div class="insp-section">COMPATIBILITY</div>`;
  others.forEach(o => {
    const shared = m.protocols.filter(p => o.protocols.includes(p));
    const cls = shared.length > 0 ? 'conn-ok' : 'conn-warn';
    const txt = shared.length > 0 ? `↔ ${o.short}: ${shared.join(', ')}` : `↔ ${o.short}: no shared bus`;
    html += `<span class="conn-badge ${cls}">${txt}</span>`;
  });
  return html;
}

// ═══════════════════════════════════════════════
// CONNECTION TEST
// ═══════════════════════════════════════════════
function testConnections() {
  if (placedModules.length === 0) {
    log('warn', 'no modules placed — nothing to test');
    return;
  }
  const mods = placedModules.map(pm => MODULES.find(x => x.id === pm.moduleId)).filter(Boolean);

  const results = {
    power: [],
    busses: {},
    conflicts: [],
    warnings: [],
    ok: []
  };

  // Check power distribution
  const hasPower = mods.some(m => m.category === 'power' || m.type === 'power');
  const hasBoost = mods.some(m => m.id === 'mt3608-boost');
  const hasCharger = mods.some(m => m.id === 'tp4056-usbc');
  const mcus = mods.filter(m => m.category === 'mcu');

  if (!hasPower) {
    results.warnings.push('No POWER module detected — bus rails unregulated');
  } else {
    results.ok.push('Power module present');
  }
  if (!hasCharger && mcus.length > 0) {
    results.warnings.push('No TP4056 charger — LiPo backup not covered');
  }
  if (hasBoost && !hasCharger) {
    results.warnings.push('Boost converter without charger — check upstream');
  }

  // Check protocol buses
  const protocols = ['I2C','SPI','UART','ESP-NOW','WiFi','LoRa'];
  protocols.forEach(proto => {
    const users = mods.filter(m => m.protocols.includes(proto));
    if (users.length === 0) return;
    const isWireless = ['ESP-NOW','WiFi','LoRa','BLE','BLE5','Meshtastic','Thread','Zigbee'].includes(proto);
    results.busses[proto] = users.map(m => m.short);
    if (proto === 'I2C' && users.length > 1) {
      results.ok.push(`I2C bus: ${users.map(m=>m.short).join(' ↔ ')} (shared SDA/SCL)`);
    }
    if (proto === 'SPI' && users.length > 1) {
      const needCS = users.length;
      results.ok.push(`SPI bus: ${users.map(m=>m.short).join(' + ')} (need ${needCS} CS pins)`);
      if (needCS > 3 && mcus.some(m => m.id.includes('c3'))) {
        results.warnings.push('C3 has limited GPIO — check SPI CS pin count');
      }
    }
    if (proto === 'ESP-NOW') {
      if (users.length > 1) results.ok.push(`ESP-NOW: ${users.length} nodes — mesh capable`);
      else results.ok.push(`ESP-NOW: ${users[0]?.short} — needs peer`);
    }
    if (proto === 'LoRa' && users.length > 0) {
      const hasMCU = mcus.some(m => m.protocols.includes('SPI'));
      if (!hasMCU) results.warnings.push('LoRa SX1278 present but no SPI master MCU detected');
      else results.ok.push('LoRa + SPI MCU: wiring compatible');
    }
  });

  // Check I2C address conflicts
  const i2cDevices = {
    'bme280-env': 0x76, 'mpu6050-imu': 0x68, 'ds3231-rtc': 0x68,
    'ssd1306-oled': 0x3C, 'at24c256-eeprom': 0x50, 'ina219-power-mon': 0x40
  };
  const usedAddrs = {};
  mods.forEach(m => {
    if (i2cDevices[m.id] !== undefined) {
      const addr = i2cDevices[m.id];
      if (usedAddrs[addr]) {
        results.conflicts.push(`I2C conflict 0x${addr.toString(16).toUpperCase()}: ${usedAddrs[addr]} + ${m.short}`);
      } else {
        usedAddrs[addr] = m.short;
      }
    }
  });

  // DS3231 + MPU6050 both 0x68
  if (mods.some(m=>m.id==='ds3231-rtc') && mods.some(m=>m.id==='mpu6050-imu')) {
    results.conflicts.push('DS3231 and MPU-6050 share I2C 0x68 — conflict! Use MPU AD0 pin to shift to 0x69');
  }

  // nRF24 voltage check
  if (mods.some(m=>m.id==='nrf24l01-rf') && mods.some(m=>m.type==='mcu')) {
    results.warnings.push('nRF24L01: 3.3V sensitive — add 100µF bypass cap at VCC');
  }

  // Power consumption estimate
  let mW = 0;
  mods.forEach(m => {
    const table = {mcu:200,power:50,storage:30,sensor:15,display:80,audio:120,radio:100};
    mW += table[m.category]||50;
  });
  results.ok.push(`Est. draw ~${mW}mW — LiPo 500mAh ≈ ${Math.round(3700*500/mW/60)} min runtime`);

  // Render modal
  let html = '';
  if (results.ok.length) {
    html += `<div class="modal-section"><h3>✓ PASSING</h3>`;
    results.ok.forEach(r => html += `<div class="modal-item"><span class="ok">✓</span> ${r}</div>`);
    html += '</div>';
  }
  if (results.warnings.length) {
    html += `<div class="modal-section"><h3>⚠ WARNINGS</h3>`;
    results.warnings.forEach(r => html += `<div class="modal-item"><b>⚠</b> ${r}</div>`);
    html += '</div>';
  }
  if (results.conflicts.length) {
    html += `<div class="modal-section"><h3>✕ CONFLICTS</h3>`;
    results.conflicts.forEach(r => html += `<div class="modal-item"><span class="err">✕</span> ${r}</div>`);
    html += '</div>';
  }
  html += `<div class="modal-section"><h3>BUS MAP</h3>`;
  Object.entries(results.busses).forEach(([proto, nodes]) => {
    html += `<div class="modal-item"><b>${proto}</b>: ${nodes.join(' → ')}</div>`;
  });
  html += '</div>';

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');

  log('ok', `test complete — ${results.ok.length} pass, ${results.warnings.length} warn, ${results.conflicts.length} conflict`);
  results.conflicts.forEach(r => log('err', r));
  results.warnings.forEach(r => log('warn', r));
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-bg')) {
    document.getElementById('modal-bg').classList.remove('show');
  }
}

// ═══════════════════════════════════════════════
// RESET + SAVE
// ═══════════════════════════════════════════════
function resetBoard() {
  if (placedModules.length > 0 && !confirm('Reset board? All placed modules will be removed.')) return;
  placedModules = [];
  selectedId = null;
  renderPlacedModules();
  renderInspector(null);
  updateNoModulesMsg();
  log('warn', 'board reset');
}

function saveImage() {
  const boardCanvas = document.getElementById('board-canvas');
  const modulesEl = document.getElementById('board-modules');
  const connSvg = document.getElementById('conn-overlay');

  // Create offscreen canvas
  const off = document.createElement('canvas');
  off.width = boardCanvas.width;
  off.height = boardCanvas.height;
  const ctx = off.getContext('2d');

  // Draw board
  ctx.drawImage(boardCanvas, 0, 0);

  // Draw connection SVG
  const svgData = new XMLSerializer().serializeToString(connSvg);
  const svgBlob = new Blob([svgData], {type:'image/svg+xml'});
  const svgUrl = URL.createObjectURL(svgBlob);
  const svgImg = new Image();
  svgImg.onload = () => {
    ctx.drawImage(svgImg, 0, 0);
    URL.revokeObjectURL(svgUrl);

    // Draw placed modules
    placedModules.forEach(pm => {
      const m = MODULES.find(x => x.id === pm.moduleId);
      if (!m) return;
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.roundRect(pm.x, pm.y, pm.w, pm.h, 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Label
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.min(pm.w/4, 11)}px 'Rajdhani',sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(m.short, pm.x + pm.w/2, pm.y + pm.h/2);
      // Dims
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = `${Math.min(pm.w/5.5, 8)}px 'Share Tech Mono',monospace`;
      ctx.fillText(m.dims, pm.x + pm.w/2, pm.y + pm.h/2 + 12);
    });

    // Watermark
    ctx.fillStyle = 'rgba(61,220,132,0.3)';
    ctx.font = `bold 14px 'Rajdhani',sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('ESPBLOK · BOARD BUILDER', off.width - 8, off.height - 6);

    const link = document.createElement('a');
    link.download = `espblok-layout-${Date.now()}.png`;
    link.href = off.toDataURL('image/png');
    link.click();
    log('ok', 'PNG exported');
  };
  svgImg.src = svgUrl;
}

// ═══════════════════════════════════════════════
// BOARD SWITCHING
// ═══════════════════════════════════════════════
function setBoard(type) {
  currentBoard = type;
  document.querySelectorAll('.board-tab').forEach(t => {
    t.classList.toggle('active', t.getAttribute('onclick').includes(type));
  });
  document.getElementById('board-label').textContent = BOARDS[type].label;
  const canvas = document.getElementById('board-canvas');
  drawBoard(canvas, type);
  // Resize SVG overlay
  const svg = document.getElementById('conn-overlay');
  svg.setAttribute('width', canvas.width);
  svg.setAttribute('height', canvas.height);
  renderPlacedModules();
  log('info', `board: ${BOARDS[type].label}`);
}

// ═══════════════════════════════════════════════
// LOGGING
// ═══════════════════════════════════════════════
function log(level, msg) {
  const c = document.getElementById('log-content');
  const span = document.createElement('span');
  span.className = `log-${level}`;
  const now = new Date();
  const ts = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  span.textContent = `[${ts}] ${msg}`;
  const br = document.createElement('br');
  c.appendChild(span);
  c.appendChild(br);
  c.scrollTop = c.scrollHeight;
}

function updateNoModulesMsg() {
  const msg = document.getElementById('no-modules-msg');
  msg.style.display = placedModules.length === 0 ? 'block' : 'none';
  const counter = document.getElementById('module-counter');
  if (counter) counter.textContent = `${placedModules.length} module${placedModules.length !== 1 ? 's' : ''}`;
}

// Keyboard: Delete/Backspace removes selected module
document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId !== null) {
    if (document.activeElement.tagName === 'INPUT') return;
    const pm = placedModules.find(p => p.uid === selectedId);
    const m = pm ? MODULES.find(x => x.id === pm.moduleId) : null;
    placedModules = placedModules.filter(p => p.uid !== selectedId);
    selectedId = null;
    renderPlacedModules();
    renderInspector(null);
    updateNoModulesMsg();
    if (m) log('warn', `deleted ${m.name} via keyboard`);
  }
  // Escape deselects
  if (e.key === 'Escape') {
    selectedId = null;
    renderInspector(null);
    renderPlacedModules();
  }
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderPalette();
  setBoard('single');
  initBoardDrop();
  updateNoModulesMsg();
  log('ok', 'ESPBLOK board builder initialized');
  log('info', `${MODULES.length} modules loaded in palette`);
});
</script>
</body>
</html>
