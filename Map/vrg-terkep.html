<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRG Térkép</title>
<!--
  VRG Térkép — offline, keyless map of Hungary in the VRG Terep style: address search,
  3D buildings, terrain. Served by Map/serve.js (http://localhost:8802); data from
  node Map/tools/fetch-data.js. Optional, online only: the Google 3D view (G).

  URL:  #zoom/lat/lon/bearing/pitch   the camera (shareable)
        ?q=Budapest Váci út 12         search on load and fly there
        ?embed=1                        slim UI for embedding in Kapu / Planner
        ?job=BK2                        the job layer on, fly to that job (internal; docs/map/JOBS-MAP.md)
        ?arnyek=1 | ?arnyek=2026-12-21T15:30   the building shadows now / at that local time
        ?wx=1 / ?wx=0                   the weather layer on at load / hidden (docs/map/WEATHER-MAP.md)
  Keys: /  search   3  3D buildings   T  terrain   S  shadows   J  jobs   W  weather   G  Google 3D view   N  north   Esc  close
        with W on: P play/pause   [ ]  step   M  forecast / measured

  Libraries (Vendor/, see vendor-manifest.json):
    MapLibre GL JS — Copyright (c) 2023, MapLibre contributors; (c) 2020 Mapbox. BSD-3-Clause.
    PMTiles — Copyright (c) 2021 Protomaps LLC. BSD-3-Clause.
  Neither the names of the copyright holders nor of the contributors may be used to endorse
  or promote products derived from this software without specific prior written permission.
-->
<link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css">
<style>
  :root{
    --ink:#1f1d1a; --ink-2:#4d4943; --faint:#8a8378; --paper:#fbf9f4; --line:#d8d0c2; --field:#ffffff;
    --accent:#c26a12; --accent-soft:#f6e3c9; --ok:#2f7d4a; --warn:#b5491f; --press:#1f1d1a; --on-press:#ffffff;
    --shadow:0 2px 10px rgba(40,30,15,.18); --bg:#e9e5dc;
  }
  /* The UI follows the colour scheme; the VRG Terep basemap and the job pins stay light (REFINE R11). */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#efe9dc; --ink-2:#cfc6b6; --faint:#9b927f; --paper:#23211d; --line:#3d3830; --field:#1a1916;
      --accent:#f0a04b; --accent-soft:#4a3418; --ok:#6cc890; --warn:#f08a62; --press:#efe9dc; --on-press:#1f1d1a;
      --shadow:0 2px 12px rgba(0,0,0,.45); --bg:#1a1916;
    }
  }
  :root[data-theme="dark"]{
    --ink:#efe9dc; --ink-2:#cfc6b6; --faint:#9b927f; --paper:#23211d; --line:#3d3830; --field:#1a1916;
    --accent:#f0a04b; --accent-soft:#4a3418; --ok:#6cc890; --warn:#f08a62; --press:#efe9dc; --on-press:#1f1d1a;
    --shadow:0 2px 12px rgba(0,0,0,.45); --bg:#1a1916;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;top:12px;left:12px;width:min(380px,calc(100vw - 24px));z-index:5;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
  .bar{display:flex;align-items:center;gap:8px;padding:8px 10px}
  .brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .brand b{color:var(--accent)}
  #q{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;
    background:var(--field);color:var(--ink);outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #results{list-style:none;margin:0;padding:0 0 6px;max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
  #results:empty{display:none}
  #results li{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  #results li[aria-selected=true],#results li:hover{background:var(--accent-soft)}
  #results .k{font-size:11px;color:var(--faint);min-width:52px;text-transform:uppercase;letter-spacing:.04em}
  #results .t{flex:1}
  #results .s{color:var(--ink-2);font-size:12px}
  #results .online{color:var(--accent)}
  .status{display:flex;gap:10px;flex-wrap:wrap;padding:0 12px 8px;font-size:12px;color:var(--faint)}
  .status .on{color:var(--ok)} .status .off{color:var(--warn)}
  .tools{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;
    padding:7px 11px;font:600 13px/1 inherit;cursor:pointer;box-shadow:var(--shadow);min-width:44px}
  .btn[aria-pressed=true]{background:var(--press);color:var(--on-press);border-color:var(--press)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn kbd{font:11px ui-monospace,Consolas,monospace;color:var(--faint);margin-left:6px}
  .btn[aria-pressed=true] kbd{color:var(--faint)}
  .maplibregl-ctrl-top-right{top:auto;bottom:34px}
  #notice{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(233,229,220,.92)}
  #notice.show{display:grid}
  #notice div{max-width:560px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 26px;box-shadow:var(--shadow)}
  #notice code{display:block;margin:10px 0;padding:8px 10px;background:var(--field);border:1px solid var(--line);border-radius:6px;user-select:all}
  .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);
    border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  /* Google 3D view: an embedded panel, opened on command, aimed where our map looks */
  #gpanel{position:absolute;top:0;right:0;bottom:0;width:min(46vw,720px);z-index:10;display:none;flex-direction:column;
    background:#111;border-left:2px solid var(--ink);box-shadow:-4px 0 18px rgba(0,0,0,.25)}
  #gpanel.show{display:flex}
  #gpanel header{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
  #gpanel header .t{flex:1;font-weight:700}
  #gpanel header .s{font-weight:400;color:var(--faint);font-size:12px;margin-left:6px}
  #gbody{position:relative;flex:1;min-height:0}
  #gbody iframe,#gbody .cesium{position:absolute;inset:0;width:100%;height:100%;border:0}
  #gfoot{padding:8px 10px;background:var(--paper);border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #gfoot a{color:var(--accent)}
  #gfoot input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:12px ui-monospace,Consolas,monospace}
  body.embed .panel{width:min(300px,calc(100vw - 24px))}
  body.embed .brand,body.embed .status{display:none}
  @media (max-width:700px){ #gpanel{width:100vw;top:40%} }
  /* J: the job layer (client data) — docs/map/JOBS-MAP.md, docs/map/REFINE.md */
  #jobs-badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;background:#8b1f1f;color:#fff;
    font:700 11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.12em;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}
  #jobs-badge[hidden],#jobs-legend[hidden],#jobs-sheet[hidden],.lg-time[hidden]{display:none}
  #jobs-legend{position:absolute;left:12px;bottom:30px;z-index:5;width:min(470px,calc(100vw - 24px));box-sizing:border-box;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow)}
  .lg-h{display:flex;align-items:center;gap:8px}
  .lg-h b{color:var(--ink);font-size:13px;letter-spacing:.02em}
  .lg-x{margin-left:auto;border:0;background:none;color:var(--ink-2);font-size:14px;cursor:pointer;min-width:32px;min-height:28px}
  #jobs-legend.collapsed .lg-b{display:none}
  .lg-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
  .lg-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;
    padding:4px 9px;font:600 12px/1.1 inherit;cursor:pointer;min-height:28px}
  .lg-chip[aria-pressed=false]{opacity:.5;text-decoration:line-through}
  .lg-chip.yr[aria-pressed=false],.lg-chip.tool[aria-pressed=false]{opacity:1;text-decoration:none;color:var(--ink-2)}
  .lg-chip.yr[aria-pressed=true],.lg-chip.tool[aria-pressed=true]{background:var(--press);color:var(--on-press);border-color:var(--press)}
  .lg-chip kbd{font:10px ui-monospace,Consolas,monospace;color:var(--faint)}
  .lg-chip .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.5px #1f1d1a inset,0 0 0 1px #fffaf0}
  .lg-chip span{color:var(--faint);font-weight:400}
  #jobs-legend select{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:4px 8px;font:12px inherit;min-height:28px}
  .lg-key{display:inline-flex;align-items:center;gap:5px;color:var(--faint)}
  .lg-key i{width:10px;height:10px;border-radius:50%}
  .lg-key i.pin-d{border:2px dashed #f2c94c}
  .lg-key i.ring{border:1.5px solid var(--faint)}
  .lg-time{display:flex;gap:8px;align-items:center;margin-top:8px}
  .lg-time input{flex:1;accent-color:var(--accent);min-height:28px}
  .lg-time output{font:600 12px ui-monospace,Consolas,monospace;color:var(--ink);min-width:84px;text-align:right}
  .m{color:var(--faint)}
  body.jobs-on .maplibregl-ctrl-bottom-left{display:none}
  #toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:30;background:var(--press);color:var(--on-press);padding:9px 14px;border-radius:8px;
    box-shadow:var(--shadow);font-size:13px;max-width:calc(100vw - 32px);opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  .jpop .maplibregl-popup-content{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 13px 9px;box-shadow:var(--shadow);
    max-height:min(60vh,520px);overflow:auto}
  .jpop.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--paper)}
  .jpop.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--paper)}
  .jpop .maplibregl-popup-close-button{color:var(--ink-2);font-size:18px;width:28px;height:28px}
  .jcard + .jcard{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .jcard .jh{display:flex;align-items:center;gap:7px;margin-bottom:3px;padding-right:18px}
  .jcard .jh b{font-size:16px;letter-spacing:.05em}
  .jcard .chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--c);color:#fff}
  .jcard .chip.draft{background:#f2c94c;color:#3b2f00}
  .jcard .chip.kit{background:var(--field);color:var(--ink-2);border:1px solid var(--line)}
  .jcard .jt{color:var(--ink-2);margin-bottom:6px}
  .jcard .jbar{position:relative;height:5px;border-radius:3px;background:var(--line);margin:0 0 7px}
  .jcard .jbar i{position:absolute;top:0;bottom:0;border-radius:3px}
  .jcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12px}
  .jcard dt{color:var(--faint)} .jcard dd{margin:0}
  .jcard .warn{color:var(--warn)}
  .jcard .jl,.jcard .jb{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:2px 7px;font:600 11px inherit;cursor:pointer;color:var(--ink);min-height:24px}
  .jcard .jact{display:flex;gap:6px;margin-top:8px}
  .jcard .jb{padding:4px 10px;font-size:12px}
  #jobs-sheet{position:absolute;left:0;right:0;bottom:0;z-index:12;max-height:55vh;overflow:auto;background:var(--paper);color:var(--ink);
    border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.25);padding:14px 16px 18px}
  #jobs-sheet .jclose{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--ink-2);font-size:18px;min-width:40px;min-height:40px;cursor:pointer}
  #results .k.munka{color:var(--accent);font-weight:700}
  /* S: the building shadows (lib/shadow-layer.js, docs/map/SHADOWS.md) */
  #sun-panel{position:absolute;left:12px;bottom:30px;z-index:7;width:min(460px,calc(100vw - 24px));box-sizing:border-box;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow)}
  #sun-panel[hidden]{display:none}
  #sun-panel input[type=date]{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:4px 9px;font:12px inherit;min-height:28px}
  #sun-panel .sun-time output{min-width:44px}
  #sun-panel .sun-note{margin-top:6px;font-size:11px}
  #sun-panel .lg-chip{opacity:1;text-decoration:none}
  #sun-panel .lg-chip[aria-pressed=true]{background:var(--press);color:var(--on-press);border-color:var(--press)}
  #sun-panel .sun-note[data-warn="1"]{color:var(--warn)}
  body.sun-on.jobs-on #jobs-legend{bottom:150px}
  body.sun-on .maplibregl-ctrl-bottom-left{display:none}
  /* W: the weather layer (lib/weather-layer.js, docs/map/WEATHER-MAP.md) — same panel language as the J legend */
  #wx-panel{position:absolute;right:12px;bottom:30px;z-index:5;width:min(440px,calc(100vw - 24px));box-sizing:border-box;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow)}
  #wx-panel[hidden],#wx-read[hidden]{display:none}
  #wx-panel.collapsed .lg-b{display:none}
  #wx-panel .lg-h .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  #wx-panel .wx-layers .lg-chip[aria-pressed=false]{text-decoration:none;opacity:.55;background:none}
  #wx-panel .lg-chip[data-empty]{opacity:.42}
  #wx-panel .lg-chip[data-empty][aria-pressed=true]{text-decoration:none}
  #wx-panel .lg-chip .dot{box-shadow:0 0 0 1.5px #1f1d1a inset}
  #wx-panel .lg-chip:disabled{opacity:.4;cursor:not-allowed}
  .wx-eval{font:700 10px/1 inherit;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#8b5a1f;border-radius:999px;padding:4px 7px;white-space:nowrap}
  .wx-time output{min-width:140px;white-space:nowrap}
  .wx-time output.wx-past{color:var(--accent)}
  .wx-legend{margin-top:6px;display:grid;gap:5px}
  .wx-ramp{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:8px;position:relative}
  .wx-ramp>span:first-child{color:var(--ink-2)} .wx-ramp em{font-style:normal;color:var(--faint);font-size:11px}
  .wx-ramp>i{height:9px;border-radius:5px;border:1px solid var(--line)}
  .wx-ticks{position:absolute;left:104px;right:42px;top:12px;height:12px;font:10px ui-monospace,Consolas,monospace;color:var(--faint)}
  .wx-ticks b{position:absolute;transform:translateX(-50%);font-weight:400}
  .wx-ramp:has(.wx-ticks){padding-bottom:12px}
  .wx-age{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--faint);grid-column:2/4}
  .wx-age i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px #1f1d1a inset;margin-left:4px}
  .wx-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:11px;color:var(--faint)}
  .wx-foot>span:first-child{min-width:0}
  .wx-attr{font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.35}
  .wx-ctl{display:flex;gap:6px;align-items:center;white-space:nowrap}
  .wx-ctl input{width:70px;accent-color:var(--accent);vertical-align:middle}
  .wx-overlay{position:absolute;left:0;top:0;pointer-events:none}
  .wx-overlay[hidden]{display:none}
  #wx-read{position:absolute;z-index:6;pointer-events:none;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;
    font:12px/1.2 "Segoe UI",system-ui,sans-serif;box-shadow:var(--shadow);white-space:nowrap}
  .jcard .wx-jobline{margin-top:8px;padding:6px 8px;border-left:3px solid var(--c);background:var(--field);border-radius:0 6px 6px 0;font-size:12px}
  .jcard .wx-jobline b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
  body.wx-on .maplibregl-ctrl-top-right{bottom:auto;top:262px}
  @media (max-width:980px){ body.wx-on.jobs-on #wx-panel{bottom:auto;top:64px;right:72px;width:min(380px,calc(100vw - 96px))} }
  /* R10: the phone (also through the VRG Mobile relay) */
  @media (max-width:640px){
    .panel{top:8px;left:8px;width:calc(100vw - 16px)}
    .status{display:none}
    .tools{top:62px;right:8px;left:8px;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:5px}
    .btn{padding:7px 9px;font-size:12px;min-height:36px}
    .btn kbd{display:none}
    #jobs-badge{top:0;left:0;right:0;transform:none;border-radius:0;text-align:center;padding:4px 0;font-size:10px}
    body.jobs-on .panel{top:24px}
    body.jobs-on .tools{top:78px}
    #jobs-legend{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;padding:8px 12px 12px}
    .lg-chip{min-height:34px;padding:5px 11px}
    .maplibregl-ctrl-top-right{bottom:auto;top:126px}
    body.jobs-on .maplibregl-ctrl-top-right{top:140px}
    #sun-panel{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;padding:8px 12px 12px}
    body.sun-on.jobs-on #jobs-legend{bottom:132px}
    #wx-panel{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;padding:8px 12px 12px;max-height:46vh;overflow:auto}
    body.wx-on.jobs-on #wx-panel{top:auto;right:0;width:auto;bottom:0;z-index:7}
    body.wx-on .maplibregl-ctrl-top-right{top:126px}
    body.sun-on.wx-on #wx-panel{bottom:132px}
  }
</style>
</head>
<body>
<div id="map" aria-label="Térkép"></div>

<section class="panel" aria-label="Keresés">
  <div class="bar">
    <span class="brand">VRG <b>Térkép</b></span>
    <input id="q" type="search" placeholder="Cím, utca, település…  ( / )" autocomplete="off" spellcheck="false"
           aria-controls="results" aria-autocomplete="list">
  </div>
  <ul id="results" role="listbox"></ul>
  <div class="status"><span id="st-net"></span><span id="st-index">címjegyzék: betöltés…</span><span id="st-data"></span></div>
</section>

<div class="tools">
  <button class="btn" id="b-3d" aria-pressed="true" title="3D épületek">3D<kbd>3</kbd></button>
  <button class="btn" id="b-terrain" aria-pressed="true" title="Domborzat">Domb<kbd>T</kbd></button>
  <button class="btn" id="b-north" title="Északra, felülnézet">É<kbd>N</kbd></button>
  <button class="btn" id="b-sun" aria-pressed="false" title="Az épületek árnyéka választott napon és órában">Árnyék<kbd>S</kbd></button>
  <button class="btn" id="b-jobs" aria-pressed="false" title="Munkák a térképen (ügyféladat, csak belső)">Munkák<kbd>J</kbd></button>
  <button class="btn" id="b-wx" aria-pressed="false" title="Időjárás-rétegek: mezők, szél, csapadék, villám, mérések, figyelmeztetések (VRG Időjárás, online források)">Időjárás<kbd>W</kbd></button>
  <button class="btn" id="b-google" aria-pressed="false" title="Google 3D nézet ugyanerre a helyre (online)">Google 3D<kbd>G</kbd></button>
</div>

<aside id="gpanel" aria-label="Google 3D nézet">
  <header>
    <span class="t">Google 3D nézet<span class="s" id="g-mode"></span></span>
    <button class="btn" id="g-sync" title="Igazítás a VRG térkép nézetéhez">Igazítás</button>
    <button class="btn" id="g-close" title="Bezárás (Esc)">✕</button>
  </header>
  <div id="gbody"></div>
  <div id="gfoot"></div>
</aside>

<div id="jobs-badge" hidden title="A munkák rétege ügyféladatot mutat: ne oszd meg, ne mutasd ügyfélnek">● ÜGYFÉLADAT · MUNKÁK</div>
<div id="jobs-legend" hidden aria-label="Munkák jelmagyarázata"></div>
<div id="toast" role="status" aria-live="polite"></div>
<section id="sun-panel" hidden aria-label="Árnyékok"></section>
<aside id="jobs-sheet" hidden aria-label="Munka adatai"></aside>
<aside id="wx-panel" hidden aria-label="Időjárás-rétegek"></aside>
<div id="wx-read" hidden></div>
<div id="notice"><div id="notice-body"></div></div>

<script>
// Opened as a file (from Kapu or Explorer) the page cannot reach its data: say how to start it.
if (location.protocol === 'file:') {
  document.getElementById('notice-body').innerHTML = '<h2>A VRG Térkép szerverről fut</h2>' +
    '<p>Fájlként megnyitva nem éri el az adatait. Indítsd a START menüből (<b>M</b>), vagy:</p>' +
    '<code>node Map\\serve.js</code><p>majd nyisd meg: <b>http://localhost:8802/</b></p>';
  document.getElementById('notice').classList.add('show');
}
</script>
<script src="/vendor/pmtiles/pmtiles.js"></script>
<script src="/lib/geocode.js"></script>
<!-- VRG Sketcher Helyszín (F1): the sketch on the building. Plain scripts, so a phone app that does not serve them still opens the map. -->
<script src="/lib/site-math.js"></script>
<script src="/lib/site-layer.js" defer></script>
<script src="/lib/sun.js"></script>
<script type="module">
import * as maplibregl from '/vendor/maplibre-gl/maplibre-gl.mjs';
import { initJobs } from '/lib/jobs-layer.js';
// loaded, not imported: a missing optional layer (an older VRG Mobile does not serve it) must not stop the whole map
const { initWeather } = await import('/lib/weather-layer.js').catch(() => ({ initWeather: () => null }));
const { initShadows } = await import('/lib/shadow-layer.js').catch(() => ({ initShadows: () => null }));

const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
if (params.get('embed') === '1') document.body.classList.add('embed');
const store = {
  get(k, d) { try { const v = localStorage.getItem('vrg.terkep.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('vrg.terkep.' + k, JSON.stringify(v)); } catch { /* private window */ } },
};

// ---------------------------------------------------------------- data check
async function exists(url) { try { return (await fetch(url, { method: 'HEAD' })).ok; } catch { return false; } }
// ?remote=1 (testing only): read the same planet files over the internet instead of Map/data.
// Goes through serve.js's /remote/ proxy (start it with --allow-remote).
const REMOTE = params.get('remote') === '1' ? {
  base: location.origin + '/remote/build.protomaps.com/' + (params.get('build') || '20261105') + '.pmtiles',
  terrain: location.origin + '/remote/download.mapterhorn.com/planet.pmtiles',
  assets: location.origin + '/remote/protomaps.github.io/basemaps-assets',
} : null;
const [hasBase, hasTerrain] = REMOTE ? [true, true]
  : await Promise.all([exists('/data/hungary.pmtiles'), exists('/data/terrain.pmtiles')]);
if (!hasBase) {
  $('#notice-body').innerHTML = '<h2>Még nincs letöltve a térkép</h2>' +
    '<p>A VRG Térkép offline fut, ehhez egyszer le kell tölteni Magyarország adatait (~1,7 GB, ingyenes, kulcs nélkül):</p>' +
    '<code>node Map\\tools\\fetch-data.js</code><p>Utána frissítsd ezt az oldalt.</p>';
  $('#notice').classList.add('show');
  throw new Error('no basemap');
}

// ---------------------------------------------------------------- map
const protocol = new pmtiles.Protocol();   // attribution comes from our style, not the archives (no doubles)
maplibregl.addProtocol('pmtiles', protocol.tile);
const style = JSON.parse((await (await fetch('/style/terep.json')).text()).replaceAll('{origin}', location.origin));
if (REMOTE) {
  style.sources.protomaps.url = 'pmtiles://' + REMOTE.base;
  style.sources.terrain.url = 'pmtiles://' + REMOTE.terrain;
  style.sources.hillshade.url = 'pmtiles://' + REMOTE.terrain;
  style.glyphs = REMOTE.assets + '/fonts/{fontstack}/{range}.pbf';
  style.sprite = REMOTE.assets + '/sprites/v4/light';
}
if (!hasTerrain) {
  delete style.sources.terrain; delete style.sources.hillshade; delete style.terrain;
  style.layers = style.layers.filter(l => l.source !== 'terrain' && l.source !== 'hillshade');
}

const HOME = { center: [19.0402, 47.4979], zoom: 11.2, pitch: 45, bearing: -15 };
const map = new maplibregl.Map({
  container: 'map', style, hash: true, ...HOME,
  minZoom: 6, maxZoom: 19.5, maxPitch: 80,
  maxBounds: [[15.2, 45.3], [23.8, 49.0]],
  attributionControl: { compact: true },
  canvasContextAttributes: { antialias: true },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
// Nothing below waits for the first tiles: search works while the map is still drawing.
map.once('load', () => { apply3d(); applyTerrain(); });

// ---------------------------------------------------------------- toggles
function press(btn, on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
let show3d = store.get('3d', true), showTerrain = store.get('terrain', true) && hasTerrain;
function apply3d() {
  if (!map.getLayer('buildings-3d')) return;
  map.setLayoutProperty('buildings-3d', 'visibility', show3d ? 'visible' : 'none');
  map.setPaintProperty('buildings', 'fill-opacity', show3d
    ? ['interpolate', ['linear'], ['zoom'], 13, 0.55, 14.5, 0.8, 15, 0] : 0.85);
  press($('#b-3d'), show3d); store.set('3d', show3d);
}
function applyTerrain() {
  if (!hasTerrain) { $('#b-terrain').disabled = true; press($('#b-terrain'), false); return; }
  map.setTerrain(showTerrain ? { source: 'terrain', exaggeration: 1.25 } : null);
  if (map.getLayer('hillshade')) map.setLayoutProperty('hillshade', 'visibility', showTerrain ? 'visible' : 'none');
  press($('#b-terrain'), showTerrain); store.set('terrain', showTerrain);
}
$('#b-3d').onclick = () => { show3d = !show3d; apply3d(); };
$('#b-terrain').onclick = () => { showTerrain = !showTerrain; applyTerrain(); };
$('#b-north').onclick = () => map.easeTo({ bearing: 0, pitch: 0 });

// ---------------------------------------------------------------- status
function net() { $('#st-net').innerHTML = navigator.onLine ? '<span class="on">● online</span>' : '<span class="off">● offline</span>'; }
addEventListener('online', net); addEventListener('offline', net); net();
fetch('/data/manifest.json').then(r => r.ok ? r.json() : null).then(m => {
  if (m && m.parts && m.parts.basemap) $('#st-data').textContent = 'térkép: ' + m.parts.basemap.fetched;
}).catch(() => {});

// ---------------------------------------------------------------- address index (offline)
// The parsing and the search live in lib/geocode.js (shared with tools/build-jobs.js and the tests).
const G = window.VRGGeocode;
let IDX = null;
async function loadIndex() {
  try {
    const r = await fetch('/data/addresses.json');
    if (!r.ok) throw new Error('missing');
    const d = await r.json();
    IDX = G.buildIndex(d);
    $('#st-index').textContent = 'címjegyzék: ' + d.addr.length.toLocaleString('hu') + ' cím (' + d.built + ')';
  } catch (e) {
    if (e.message !== 'missing') console.warn('address index:', e);
    $('#st-index').innerHTML = '<span class="off">címjegyzék hiányzik</span>';
  }
}
loadIndex();
const searchOffline = text => G.search(IDX, text);

// ---------------------------------------------------------------- online fallback (Nominatim, on request only)
let lastOnline = 0;
async function searchOnline(text) {
  const wait = 1100 - (Date.now() - lastOnline);           // OSM policy: max 1 request / second
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastOnline = Date.now();
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=hu&limit=6&accept-language=hu&q=' + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).map(x => ({ kind: 'online', title: x.display_name.split(',').slice(0, 2).join(','),
    sub: x.display_name.split(',').slice(2, 5).join(','), lon: +x.lon, lat: +x.lat, zoom: x.type === 'house' || x.addresstype === 'building' ? 18.2 : 15.5 }));
}

// ---------------------------------------------------------------- search UI
const q = $('#q'), ul = $('#results');
let results = [], sel = -1, timer = 0;
function render() {
  ul.innerHTML = '';
  results.forEach((r, i) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'option'); li.setAttribute('aria-selected', i === sel ? 'true' : 'false');
    li.innerHTML = `<span class="k${r.job ? ' munka' : ''}">${r.kind}</span><span class="t">${esc(r.title)}<br><span class="s">${esc(r.sub || '')}</span></span>`;
    li.onmousedown = e => { e.preventDefault(); choose(i); };
    ul.appendChild(li);
  });
  if (q.value.trim().length > 2 && navigator.onLine) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="k online">online</span><span class="t online">Keresés az interneten (OpenStreetMap Nominatim)</span>';
    li.onmousedown = async e => {
      e.preventDefault();
      try { results = await searchOnline(q.value.trim()); sel = results.length ? 0 : -1; render(); }
      catch (err) { li.querySelector('.t').textContent = 'Online keresés sikertelen: ' + err.message; }
    };
    ul.appendChild(li);
  }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => { results = searchAll(q.value); sel = results.length ? 0 : -1; render(); }, 120);
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, results.length - 1); render(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
  else if (e.key === 'Enter') { if (sel >= 0) choose(sel); }
  else if (e.key === 'Escape') { ul.innerHTML = ''; q.blur(); }
});
q.addEventListener('blur', () => setTimeout(() => { ul.innerHTML = ''; }, 150));
q.addEventListener('focus', () => { if (q.value.trim()) { results = searchAll(q.value); render(); } });
// R5: a job code (BK2, p3…) lists the jobs first, when the J layer is allowed and loaded
function searchAll(text) {
  const J = window.vrgJobs;
  const jobsHit = J && J.searchCodes ? J.searchCodes(text) : [];
  return jobsHit.concat(searchOffline(text)).slice(0, 8);
}

const marker = new maplibregl.Marker({ element: Object.assign(document.createElement('div'), { className: 'pin' }), anchor: 'bottom-left' });
function choose(i) {
  const r = results[i]; if (!r) return;
  ul.innerHTML = ''; q.value = r.title + (r.sub ? ', ' + r.sub : '');
  if (r.job) { q.value = r.job; marker.remove(); window.vrgJobs.fly(r.job); return; }
  flyToPlace(r);
}
function flyToPlace(r) {
  marker.setLngLat([r.lon, r.lat]).addTo(map);
  // The "arrival" camera: close, tilted, slightly turned, so terrain and building heights read at once.
  map.flyTo({ center: [r.lon, r.lat], zoom: r.zoom, pitch: r.zoom >= 16 ? 62 : 50, bearing: -20, speed: 1.4, curve: 1.5, essential: true });
  map.once('moveend', () => { if ($('#gpanel').classList.contains('show')) gsync(); });
}
if (params.get('q')) {
  const text = params.get('q'); q.value = text;
  const wait = setInterval(() => { if (IDX) { clearInterval(wait); results = searchOffline(text); if (results[0]) flyToPlace(results[0]); } }, 200);
  setTimeout(() => clearInterval(wait), 15000);
}

// ---------------------------------------------------------------- Google 3D view (optional, online)
// Opened on command (G). It is aimed at what the VRG map shows: same centre, heading, tilt and
// roughly the same distance. With a Map Tiles API key it is the real 3D city in CesiumJS (free
// quota: 1 000 root requests a month, one per opening); without a key a keyless satellite embed.
const CESIUM = 'https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';
const GEOID_HU = 44;   // EGM96 geoid above the ellipsoid in Hungary (~43-45 m); Google tiles use ellipsoid heights
let viewer = null;

function camera() {
  const c = map.getCenter(), z = map.getZoom(), pitch = map.getPitch(), bearing = map.getBearing();
  const fovDeg = typeof map.getVerticalFieldOfView === 'function' ? map.getVerticalFieldOfView() : 36.87;
  const h = map.getCanvas().clientHeight, fovy = fovDeg * Math.PI / 180;
  const mpp = 40075016.686 * Math.cos(c.lat * Math.PI / 180) / (512 * Math.pow(2, z));
  const range = (h / 2) / Math.tan(fovy / 2) * mpp;
  let ground = 0;
  try { ground = (map.queryTerrainElevation(c) || 0) / (map.getTerrain() ? map.getTerrain().exaggeration || 1 : 1); } catch { /* no terrain */ }
  return { lat: c.lat, lon: c.lng, zoom: z, pitch, bearing, range, ground, fovy };
}
function links(cam) {
  const alt = Math.round(cam.ground);
  const earth = `https://earth.google.com/web/@${cam.lat.toFixed(6)},${cam.lon.toFixed(6)},${alt}a,${Math.round(cam.range)}d,35y,${cam.bearing.toFixed(1)}h,${cam.pitch.toFixed(1)}t,0r`;
  const gmaps = `https://www.google.com/maps/@${cam.lat.toFixed(6)},${cam.lon.toFixed(6)},${Math.round(cam.range)}m/data=!3m1!1e3`;
  return { earth, gmaps };
}
function foot(cam, keyed) {
  const l = links(cam), used = store.get('gcount', { m: '', n: 0 });
  const month = new Date().toISOString().slice(0, 7);
  $('#gfoot').innerHTML =
    `<a href="${l.earth}" target="_blank" rel="noopener">Megnyitás a Google Földben</a>` +
    `<a href="${l.gmaps}" target="_blank" rel="noopener">Google Térkép</a>` +
    (keyed ? `<span>ebben a hónapban ${used.m === month ? used.n : 0} / 1000 ingyenes megnyitás</span>` +
             `<button class="btn" id="g-forget">Kulcs törlése</button>`
           : `<input id="g-key" placeholder="Map Tiles API kulcs a valódi 3D-hez (opcionális)"><button class="btn" id="g-save">Mentés</button>`);
  const save = $('#g-save'), forget = $('#g-forget');
  if (save) save.onclick = () => { const k = $('#g-key').value.trim(); if (k) { store.set('gkey', k); gopen(true); } };
  if (forget) forget.onclick = () => { store.set('gkey', ''); if (viewer) { viewer.destroy(); viewer = null; } gopen(true); };
}
function loadCesium() {
  if (window.Cesium) return Promise.resolve();
  return new Promise((ok, fail) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = CESIUM + 'Widgets/widgets.css';
    document.head.appendChild(css);
    window.CESIUM_BASE_URL = CESIUM;
    const s = document.createElement('script'); s.src = CESIUM + 'Cesium.js'; s.onload = ok; s.onerror = () => fail(new Error('CesiumJS nem tölthető be'));
    document.head.appendChild(s);
  });
}
async function gopen(fresh) {
  const panel = $('#gpanel'), body = $('#gbody'), key = store.get('gkey', '');
  panel.classList.add('show'); press($('#b-google'), true);
  const cam = camera();
  foot(cam, !!key);
  if (!navigator.onLine) { body.innerHTML = '<p style="color:#ddd;padding:20px">A Google nézethez internet kell. A VRG térkép offline is fut.</p>'; return; }
  if (!key) {
    $('#g-mode').textContent = 'műhold, kulcs nélkül (2D)';
    const gz = Math.min(21, Math.round(cam.zoom + 1));
    body.innerHTML = `<iframe title="Google műholdkép" referrerpolicy="no-referrer-when-downgrade"
      src="https://maps.google.com/maps?q=${cam.lat.toFixed(6)},${cam.lon.toFixed(6)}&z=${gz}&t=k&output=embed"></iframe>`;
    return;
  }
  $('#g-mode').textContent = 'fotorealisztikus 3D (Map Tiles API)';
  try {
    if (!viewer || fresh) {
      if (viewer) { viewer.destroy(); viewer = null; }
      await loadCesium();
      body.innerHTML = '<div class="cesium" id="cesium"></div>';
      viewer = new Cesium.Viewer('cesium', {
        globe: false, baseLayer: false, geocoder: false, homeButton: false, sceneModePicker: false, baseLayerPicker: false,
        navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false, infoBox: false, selectionIndicator: false,
      });
      viewer.scene.skyAtmosphere.show = true;
      Cesium.GoogleMaps.defaultApiKey = key;
      const tiles = await Cesium.createGooglePhotorealistic3DTileset({ key });
      viewer.scene.primitives.add(tiles);
      const month = new Date().toISOString().slice(0, 7), used = store.get('gcount', { m: month, n: 0 });
      store.set('gcount', { m: month, n: used.m === month ? used.n + 1 : 1 });
      foot(cam, true);
    }
    gsync();
  } catch (e) {
    body.innerHTML = `<p style="color:#f3c9b6;padding:20px">Google 3D hiba: ${esc(e.message || e)}</p>`;
  }
}
function gsync() {
  const cam = camera();
  if (!viewer) { if ($('#gpanel').classList.contains('show')) gopen(false); return; }
  const C = Cesium, v = viewer, cv = v.canvas;
  const aspect = cv.clientWidth / Math.max(1, cv.clientHeight);
  v.camera.frustum.fov = aspect > 1 ? 2 * Math.atan(Math.tan(cam.fovy / 2) * aspect) : cam.fovy;   // Cesium's fov is the wider side
  const target = C.Cartesian3.fromDegrees(cam.lon, cam.lat, cam.ground + GEOID_HU);
  v.camera.lookAt(target, new C.HeadingPitchRange(C.Math.toRadians(cam.bearing), C.Math.toRadians(-(90 - cam.pitch)), cam.range));
  v.camera.lookAtTransform(C.Matrix4.IDENTITY);
  foot(cam, true);
}
function gclose() { $('#gpanel').classList.remove('show'); press($('#b-google'), false); }
$('#b-google').onclick = () => ($('#gpanel').classList.contains('show') ? gclose() : gopen(false));
$('#g-close').onclick = gclose;
$('#g-sync').onclick = () => gsync();

// ---------------------------------------------------------------- keys
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === '/') { q.focus(); q.select(); e.preventDefault(); }
  else if (k === '3') $('#b-3d').click();
  else if (k === 't') $('#b-terrain').click();
  else if (k === 'n') $('#b-north').click();
  else if (k === 's') $('#b-sun').click();
  else if (k === 'g') $('#b-google').click();
  else if (k === 'j' && !$('#b-jobs')?.disabled) $('#b-jobs')?.click();
  else if (k === 'escape' && $('#gpanel').classList.contains('show')) gclose();
});
// ---------------------------------------------------------------- toast
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4200); }

// ---------------------------------------------------------------- J: the jobs (lib/jobs-layer.js; client data, internal only)
const jobs = initJobs({ map, maplibregl, params, store, toast });

// ---------------------------------------------------------------- S: the building shadows (lib/shadow-layer.js)
const shadows = initShadows({ map, params, store, toast });
if (!shadows) $('#b-sun')?.remove();

// ---------------------------------------------------------------- W: the weather (lib/weather-layer.js; VRG Időjárás data)
const weather = initWeather({ map, maplibregl, params, store, toast });

window.vrgMap = { map, maplibregl, searchOffline, camera, jobs, weather, shadows };   // for tests, the console and the phone (VRG Mobile M43)
</script>
</body>
</html>
