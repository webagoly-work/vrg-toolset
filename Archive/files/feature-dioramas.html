<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Dioramas</title>
<!-- VRG Feature Dioramas. Every feature in the VRG Features registry as its own isometric diorama on a
     plinth, in the language of the UI Kit's emblem (shared/vrg-ui-kit/components/emblem.js, the Kapu's
     "airport"). Self-contained: no kit files, no fonts, no network. Two variants:
       Equal tiles    every plinth 10 x 10 grid units, the scene squeezed to fit.
       Sized by mass  the grid unit is the same everywhere; the plinth side N grows with the feature's mass
                      (code lines, kind, parts, links), so a big feature is a larger district at the same
                      resolution, a small one a single lot.
     Maturity is drawn as how far the diorama is built: in use = lit, built = solid, in dev = part-built with
     a crane, plan = ghost outlines and survey stakes, idea = a dotted blueprint.
     Data: the block between FEATURES-BEGIN / FEATURES-END is written by build.js from
     notes/features/features.json; re-run `node shared/vrg-ui-kit/dioramas/build.js` after the registry changes. -->
<style>
:root {
  --vk-bg: #f2f3f1; --vk-bg-sunken: #e8eae7; --vk-surface-1: #fbfbfa; --vk-surface-2: #ffffff;
  --vk-line: rgba(18,26,32,.12); --vk-line-strong: rgba(18,26,32,.26);
  --vk-text: #11181d; --vk-text-muted: #4b5761; --vk-activity: #9c5216; --vk-cool: #2f6f9a;
  --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --vk-bg: #0b0d0f; --vk-bg-sunken: #070809; --vk-surface-1: #111417; --vk-surface-2: #171b1f;
    --vk-line: rgba(235,240,245,.11); --vk-line-strong: rgba(235,240,245,.24);
    --vk-text: #eef2f5; --vk-text-muted: #a5aeb6; --vk-activity: #eaa46f; --vk-cool: #7fb8de; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --vk-bg: #0b0d0f; --vk-bg-sunken: #070809; --vk-surface-1: #111417; --vk-surface-2: #171b1f;
  --vk-line: rgba(235,240,245,.11); --vk-line-strong: rgba(235,240,245,.24);
  --vk-text: #eef2f5; --vk-text-muted: #a5aeb6; --vk-activity: #eaa46f; --vk-cool: #7fb8de; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--vk-bg); color: var(--vk-text); font: 14px/1.45 var(--font-sans); }
button { font: inherit; color: inherit; }

/* ---------- page ---------- */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--vk-bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--vk-line); }
.top__in { max-width: 1480px; margin: 0 auto; padding: 14px 16px 12px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: end; }
.brand { min-width: 0; flex: 1 1 320px; }
.kicker { margin: 0; font: 600 10.5px/1.2 var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--vk-text-muted); }
h1 { margin: 3px 0 0; font-size: 22px; line-height: 1.15; font-weight: 650; letter-spacing: -.01em; }
.sub { margin: 4px 0 0; color: var(--vk-text-muted); font-size: 12.5px; max-width: 70ch; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--vk-line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--vk-line-strong); }
.seg button[aria-pressed="true"] { background: var(--vk-text); color: var(--vk-bg); }
.search { border: 1px solid var(--vk-line-strong); background: var(--vk-surface-1); border-radius: 8px; padding: 6px 10px; width: 170px; color: var(--vk-text); font: inherit; font-size: 12.5px; }
.chips { max-width: 1480px; margin: 0 auto; padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--vk-line-strong); background: transparent; border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--vk-text-muted); }
.chip[aria-pressed="true"] { color: var(--vk-text); background: var(--vk-surface-2); border-color: var(--vk-text-muted); }
.chip .n { font-family: var(--font-mono); font-size: 10.5px; opacity: .7; margin-left: 4px; }
.legend { max-width: 1480px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--vk-text-muted); }
.legend b { color: var(--vk-text); font-weight: 600; }
main { max-width: 1480px; margin: 0 auto; padding: 4px 16px 60px; }
.lane { margin-top: 26px; }
.lane__h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border-bottom: 1px solid var(--vk-line); padding-bottom: 6px; margin-bottom: 12px; }
.lane__h h2 { margin: 0; font-size: 16px; font-weight: 650; }
.lane__h p { margin: 0; color: var(--vk-text-muted); font-size: 12.5px; }
.lane__h .code { font: 600 11px var(--font-mono); color: var(--vk-text-muted); letter-spacing: .12em; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
.mass { display: flex; flex-wrap: wrap; gap: 14px 10px; align-items: flex-end; }
.tile { position: relative; display: flex; flex-direction: column; border: 1px solid transparent; border-radius: 10px;
  background: transparent; padding: 6px 6px 8px; cursor: pointer; text-align: left; min-width: 0; }
.tile:hover, .tile:focus-visible { border-color: var(--vk-line-strong); background: var(--vk-surface-1); outline: none; }
.grid .art { aspect-ratio: 1 / 0.92; display: flex; align-items: flex-end; justify-content: center; }
.grid .art svg { width: 100%; height: 100%; }
.mass .tile { min-width: 112px; align-items: center; }
.mass .cap { max-width: 100%; align-self: stretch; }
.cap { margin-top: 2px; min-width: 0; }
.cap__t { font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.cap__m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; font: 10.5px/1.2 var(--font-mono); color: var(--vk-text-muted); }
.tier { display: inline-flex; align-items: center; gap: 4px; }
.tier i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--vk-text-muted); }
.tier[data-t="1"] i { background: var(--vk-activity); border-color: var(--vk-activity); }
.tier[data-t="2"] i { background: var(--vk-text); border-color: var(--vk-text); }
.tier[data-t="3"] i { background: linear-gradient(90deg, var(--vk-cool) 50%, transparent 50%); border-color: var(--vk-cool); }
.tier[data-t="4"] i { border-style: dashed; }
.tier[data-t="5"] i { border-style: dotted; }
.src { padding: 0 5px; border-radius: 4px; border: 1px solid var(--vk-line-strong); }
.src[data-s="kit"] { color: var(--vk-activity); border-color: currentColor; }
.empty { color: var(--vk-text-muted); padding: 30px 0; }

dialog { border: 1px solid var(--vk-line-strong); border-radius: 14px; background: var(--vk-surface-1); color: var(--vk-text);
  padding: 0; width: min(980px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; }
.dlg__art { background: var(--vk-bg); display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 300px; }
.dlg__art svg { max-width: 100%; height: auto; max-height: 62vh; }
.dlg__txt { padding: 18px 20px 20px; overflow: auto; }
.dlg__txt h3 { margin: 4px 0 6px; font-size: 20px; }
.dlg__txt p { margin: 0 0 10px; }
.dlg__txt dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0 0; font-size: 12.5px; }
.dlg__txt dt { color: var(--vk-text-muted); }
.dlg__txt dd { margin: 0; overflow-wrap: anywhere; }
.dlg__txt .design { border-left: 2px solid var(--vk-activity); padding-left: 10px; color: var(--vk-text); }
.dlg__close { position: absolute; top: 8px; right: 8px; border: 1px solid var(--vk-line-strong); background: var(--vk-surface-2); border-radius: 8px; padding: 3px 9px; cursor: pointer; }
.mono { font-family: var(--font-mono); font-size: 12px; }
@media (max-width: 720px) {
  .dlg { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .search { width: 100%; }
}

/* ---------- the diorama (ported from components/emblem.css) ---------- */
.dio { --_pt: color-mix(in srgb, var(--vk-text) 7%, var(--vk-surface-2));
  --_pl: color-mix(in srgb, var(--vk-text) 13%, var(--vk-surface-1)); --_pr: var(--vk-bg-sunken);
  --_t: color-mix(in srgb, var(--vk-text) 22%, var(--vk-surface-2)); --_l: color-mix(in srgb, var(--vk-text) 11%, var(--vk-surface-1));
  --_r: color-mix(in srgb, var(--vk-text) 4%, var(--vk-bg-sunken)); --_edge: var(--vk-line-strong);
  --_win: color-mix(in srgb, var(--vk-bg-sunken) 75%, transparent); --_lit: var(--vk-activity); --_cable: var(--vk-activity);
  --_glow: color-mix(in srgb, var(--vk-activity) 30%, transparent); --_street: color-mix(in srgb, var(--vk-activity) 55%, transparent);
  --_shadow: transparent; --_halo: color-mix(in srgb, var(--vk-activity) 9%, transparent);
  --_ghost: color-mix(in srgb, var(--vk-text) 55%, transparent); --_ghostfill: color-mix(in srgb, var(--vk-text) 4%, transparent);
  --_water: color-mix(in srgb, var(--vk-cool) 40%, var(--vk-bg-sunken)); --_glass: color-mix(in srgb, var(--vk-cool) 22%, transparent);
  --_pcb: color-mix(in srgb, var(--vk-cool) 22%, var(--vk-surface-1)); --_tree: color-mix(in srgb, var(--vk-text) 16%, var(--vk-surface-1));
  display: block; overflow: visible; }
[data-phase="day"] .dio { --_pt: color-mix(in srgb, var(--vk-text) 4%, var(--vk-bg));
  --_pl: color-mix(in srgb, var(--vk-text) 13%, var(--vk-surface-2)); --_pr: color-mix(in srgb, var(--vk-text) 22%, var(--vk-surface-2));
  --_t: var(--vk-surface-2); --_l: color-mix(in srgb, var(--vk-text) 6%, var(--vk-surface-2)); --_r: color-mix(in srgb, var(--vk-text) 15%, var(--vk-surface-2));
  --_edge: color-mix(in srgb, var(--vk-text) 30%, transparent); --_win: color-mix(in srgb, var(--vk-text) 20%, var(--vk-surface-2));
  --_lit: color-mix(in srgb, var(--vk-activity) 40%, var(--vk-surface-2)); --_cable: color-mix(in srgb, var(--vk-text) 70%, var(--vk-surface-2));
  --_glow: transparent; --_street: color-mix(in srgb, var(--vk-text) 9%, transparent);
  --_shadow: color-mix(in srgb, var(--vk-text) 9%, transparent); --_halo: color-mix(in srgb, var(--vk-text) 5%, transparent);
  --_water: color-mix(in srgb, var(--vk-cool) 30%, var(--vk-surface-2)); --_tree: color-mix(in srgb, var(--vk-text) 9%, var(--vk-surface-2)); }
.dio polygon, .dio path, .dio line, .dio polyline { stroke-linejoin: round; stroke-linecap: round; }
.dio .halo { fill: var(--_halo); }
.dio .p-t { fill: var(--_pt); stroke: var(--_edge); stroke-width: .7; }
.dio .p-l { fill: var(--_pl); stroke: var(--_edge); stroke-width: .7; }
.dio .p-r { fill: var(--_pr); stroke: var(--_edge); stroke-width: .7; }
.dio .p-lip { fill: none; stroke: var(--vk-line); stroke-width: .5; stroke-dasharray: 1.5 2.5; }
.dio .tick { stroke: var(--_edge); stroke-width: .5; }
.dio .engrave { font: 5px var(--font-mono); letter-spacing: .14em; fill: var(--vk-text-muted); }
.dio .shadow { fill: var(--_shadow); }
.dio .street { fill: none; stroke: var(--_street); stroke-width: 1.4; }
.dio .cable { fill: none; stroke: var(--_cable); stroke-width: 1.3; }
.dio .cable-glow { fill: none; stroke: var(--_glow); stroke-width: 4; }
.dio .cable.c-silver { stroke: var(--vk-text-muted); }
.dio .cable.c-bronze { stroke: color-mix(in srgb, var(--_cable) 55%, var(--vk-text-muted)); stroke-dasharray: 3 1.5; }
.dio .cable.c-cool { stroke: var(--vk-cool); }
.dio .cable.c-thin { stroke-width: .8; }
.dio .cable.c-plan { stroke: var(--_ghost); stroke-dasharray: 2.5 2; stroke-width: 1; }
.dio .node { fill: var(--vk-text); }
.dio .junction { fill: var(--_pt); stroke: var(--vk-text); stroke-width: .8; }
.dio .term { fill: var(--_cable); }
.dio .ring { fill: none; stroke: var(--_cable); stroke-width: .9; stroke-dasharray: 3 2; }
.dio .f-t { fill: var(--_t); stroke: var(--_edge); stroke-width: .5; }
.dio .f-l { fill: var(--_l); stroke: var(--_edge); stroke-width: .5; }
.dio .f-r { fill: var(--_r); stroke: var(--_edge); stroke-width: .5; }
.dio .hot { fill: var(--vk-activity); }
.dio [data-type="slab"] .f-t { fill: color-mix(in srgb, var(--_t) 60%, var(--_pt)); }
.dio [data-type="socket"] .f-t { fill: var(--_cable); }
.dio [data-type="pcb"] .f-t { fill: var(--_pcb); }
.dio [data-type="chip"] :is(.f-t, .f-l, .f-r) { fill: color-mix(in srgb, var(--vk-bg-sunken) 80%, var(--vk-text)); }
.dio [data-type="glass"] :is(.f-t, .f-l, .f-r) { fill: var(--_glass); stroke: color-mix(in srgb, var(--vk-cool) 60%, transparent); }
.dio [data-type="water"] .f-t, .dio .water { fill: var(--_water); stroke: var(--_edge); stroke-width: .4; }
.dio .pad { fill: color-mix(in srgb, var(--vk-text) 8%, var(--_pt)); stroke: var(--_edge); stroke-width: .4; }
.dio .padhot { fill: color-mix(in srgb, var(--vk-activity) 45%, transparent); stroke: none; }
.dio .mark { fill: none; stroke: var(--_edge); stroke-width: .6; }
.dio .mark-hot { fill: none; stroke: var(--vk-activity); stroke-width: .9; }
.dio .win { fill: var(--_win); stroke: none; }
.dio .win.lit { fill: var(--_lit); }
.dio .win.screen.lit { fill: color-mix(in srgb, var(--_lit) 70%, transparent); }
.dio .seam { fill: none; stroke: var(--_edge); stroke-width: .45; }
.dio .mast { stroke: var(--vk-text-muted); stroke-width: .8; fill: none; }
.dio .beacon { fill: var(--vk-activity); }
.dio .sph { fill: var(--_t); stroke: var(--_edge); stroke-width: .6; }
.dio .sph-hl { fill: color-mix(in srgb, var(--vk-surface-2) 70%, transparent); }
.dio .vr { fill: none; stroke: var(--vk-activity); stroke-width: 1.8; }
.dio .vr.vr-thin { stroke-width: .8; stroke: var(--vk-text-muted); }
.dio .tree { fill: var(--_tree); stroke: var(--_edge); stroke-width: .5; }
.dio .trunk { stroke: var(--_edge); stroke-width: .9; }
.dio .crane { stroke: var(--vk-cool); stroke-width: .8; fill: none; }
.dio .crane-hook { stroke: var(--vk-cool); stroke-width: .5; fill: none; }
.dio .gh :is(.f-t, .f-l, .f-r, .sph) { fill: var(--_ghostfill); stroke: var(--_ghost); stroke-dasharray: 2 1.6; stroke-width: .6; }
.dio .gh.idea :is(.f-t, .f-l, .f-r, .sph) { stroke-dasharray: .6 1.6; stroke-width: .8; fill: transparent; }
.dio .gh .vr { stroke: var(--_ghost); stroke-dasharray: 2 2; stroke-width: 1; }
.dio .stake { stroke: var(--vk-cool); stroke-width: .9; }
[data-phase="night"] .dio :is(.win.lit, .beacon, .hot) { filter: drop-shadow(0 0 1.5px var(--vk-activity)); }
[data-phase="night"] .dio .beacon { animation: dio-blink 2.4s steps(2, jump-none) infinite; }
@keyframes dio-blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dio .beacon { animation: none !important; } }
.dio.small :is(.engrave, .p-lip) { display: none; }
@media (forced-colors: active) { .dio { forced-color-adjust: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top__in">
    <div class="brand">
      <p class="kicker">VRG Eszköztár · from the Kapu emblem</p>
      <h1>Feature Dioramas</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Variant">
        <button type="button" data-mode="equal" aria-pressed="true">Equal tiles</button>
        <button type="button" data-mode="mass" aria-pressed="false">Sized by mass</button>
      </div>
      <div class="seg" role="group" aria-label="Phase">
        <button type="button" data-ph="day">Day</button>
        <button type="button" data-ph="night">Night</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search features" aria-label="Search features">
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Lanes"></div>
</header>
<div class="legend" id="legend"></div>
<main id="main"></main>
<dialog id="dlg" aria-labelledby="dlgTitle"><button class="dlg__close" type="button" id="dlgClose" aria-label="Close">×</button><div class="dlg" id="dlgBody"></div></dialog>

<script>

// ============================================================ geometry
const A = 10, T = 12, NS = 'http://www.w3.org/2000/svg', SQ2 = Math.SQRT2;
function P(i, j, z) { return [(i - j) * A, (i + j) * A / 2 - (z || 0)]; }
function pts(arr) { return arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '); }
function S(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function poly(parent, points, cls) { return S('polygon', { points: pts(points), class: cls }, parent); }
function hull(p) {
  p = p.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  lo.pop(); up.pop(); return lo.concat(up);
}
function rng(seed) {
  let h = 2166136261 >>> 0;
  for (let k = 0; k < seed.length; k++) { h ^= seed.charCodeAt(k); h = Math.imul(h, 16777619); }
  let a = h;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ============================================================ scene + frames
// A Frame maps a local design space (0…S) into the plinth: offset x0,y0 and scale k on i/j; heights shrink a
// little with k so a squeezed scene keeps its proportions.
class Frame {
  constructor(sc, x0, y0, k, S) { this.sc = sc; this.x0 = x0; this.y0 = y0; this.k = k; this.S = S; this.r = sc.r; }
  X(i) { return this.x0 + i * this.k; } Y(j) { return this.y0 + j * this.k; } H(h) { return h * (0.55 + 0.45 * Math.min(1, this.k)); }
  box(i, j, w, d, h, type, ex) {
    ex = ex || {};
    const b = Object.assign({ t: 'box', type: type || 'block', layer: 1 }, ex,
      { i: this.X(i), j: this.Y(j), w: w * this.k, d: d * this.k, h: this.H(h), z0: this.H(ex.z0 || 0) });
    if (ex.antenna) b.antenna = this.H(ex.antenna);
    this.sc.items.push(b); return b;
  }
  tower(i, j, h, ex) { return this.box(i, j, 0.6, 0.6, h, 'tower', ex); }
  cab(i, j, h, ex) { return this.box(i, j, 0.9, 0.9, h, 'cabinet', ex); }
  cyl(ci, cj, rad, h, ex) {
    ex = ex || {};
    const c = Object.assign({ t: 'cyl', type: 'tank', layer: 1 }, ex, { ci: this.X(ci), cj: this.Y(cj), rad: rad * this.k, h: this.H(h), z0: this.H(ex.z0 || 0) });
    this.sc.items.push(c); return c;
  }
  sph(ci, cj, rad, z0, ex) { const s = Object.assign({ t: 'sph', layer: 1 }, ex || {}, { ci: this.X(ci), cj: this.Y(cj), rad: rad * this.k, z0: this.H(z0 || 0) }); this.sc.items.push(s); return s; }
  vring(ci, cj, zc, rad, u, v, ex) { const o = Object.assign({ t: 'vring', layer: 1 }, ex || {}, { ci: this.X(ci), cj: this.Y(cj), zc: this.H(zc), rad: rad * this.k, u: u, v: v }); this.sc.items.push(o); return o; }
  tree(ci, cj, h) { const o = { t: 'tree', layer: 1, ci: this.X(ci), cj: this.Y(cj), h: this.H(h || 10) }; this.sc.items.push(o); return o; }
  dish(ci, cj, rad, z0) { const o = { t: 'dish', layer: 1, ci: this.X(ci), cj: this.Y(cj), rad: rad * this.k, z0: this.H(z0) }; this.sc.items.push(o); return o; }
  _p(p) { return [this.X(p[0]), this.Y(p[1]), p[2] == null ? null : this.H(p[2])]; }
  cable(p, cls, ex) { this.sc.cables.push(Object.assign({ p: p.map(q => this._p(q)), cls: cls || '' }, ex || {})); }
  street(p) { this.sc.streets.push(p.map(q => this._p(q))); }
  ring(ci, cj, r) { this.sc.rings.push([this.X(ci), this.Y(cj), r * this.k]); }
  quad(p, cls, z) { this.sc.flats.push({ p: p.map(q => this._p(q)), cls: cls, z: z == null ? 0.15 : z }); }
  rect(i, j, w, d, cls, z) { this.quad([[i, j], [i + w, j], [i + w, j + d], [i, j + d]], cls, z); }
  line(p, cls, z) { this.sc.flats.push({ p: p.map(q => this._p(q)), cls: cls || 'mark', z: z == null ? 0.2 : z, open: true }); }
  sub(i, j, k, S) { return new Frame(this.sc, this.X(i), this.Y(j), this.k * k, S); }
}

// ---------- shared pieces ----------
function walls(c, x, y, w, d, h, ex) {   // a room outline: four thin walls
  const t = 0.14;
  c.box(x, y, w, t, h, 'wall', ex); c.box(x, y, t, d, h, 'wall', ex);
  c.box(x, y + d - t, w, t, h * 0.55, 'wall', ex); c.box(x + w - t, y, t, d, h * 0.55, 'wall', ex);
}
function portal(c, i, j, span, h, along, ex) {   // two posts and a lintel; along = 'i' or 'j'
  const p = 0.25;
  if (along === 'i') { c.box(i, j, p, p, h, 'block', ex); c.box(i + span - p, j, p, p, h, 'block', ex); c.box(i, j, span, p, 1.4, 'block', Object.assign({ z0: h }, ex)); }
  else { c.box(i, j, p, p, h, 'block', ex); c.box(i, j + span - p, p, p, h, 'block', ex); c.box(i, j, p, span, 1.4, 'block', Object.assign({ z0: h }, ex)); }
}
function phone(c, i, j, w, d, ex) { return c.box(i, j, w, d, 1.6, 'phone', ex); }
function cyd(c, i, j, h) {   // a CYD board standing on its edge, screen on the i face
  c.box(i, j, 0.35, 2.6, h || 10, 'pcb', { z0: 0.6 });
  c.box(i - 0.4, j + 0.3, 1.1, 2, 0.6, 'slab');
}
function crates(c, i, j, nx, ny, r, maxH) { for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) if (r() < 0.85) c.box(i + a * 0.9, j + b * 0.9, 0.75, 0.75, 1.5 + r() * (maxH || 4), 'crate', { hot: r() < 0.08 }); }
function plates(c, i, j, w, d, n, gap, ex) { for (let k = 0; k < n; k++) c.box(i, j, w, d, 0.6, 'slab', Object.assign({ z0: k * gap }, ex || {})); }
function pcbBoard(c, i, j, w, d, r) {
  c.box(i, j, w, d, 0.6, 'pcb');
  const nc = 1 + Math.floor(r() * 3);
  for (let k = 0; k < nc; k++) c.box(i + 0.2 + r() * (w - 0.9), j + 0.2 + r() * (d - 0.9), 0.6, 0.6, 0.6, 'chip', { z0: 0.6 });
}

// ============================================================ cores
// Each core draws in its own local space 0…C (C defaults to 8). grow: the core fills more area when the plinth
// is bigger (it reads c.S). Kit cores (C = 10) are the UI Kit's emblem recipes, unchanged.
const CORES = {};
function core(name, C, fn, grow) { CORES[name] = { C: C, fn: fn, grow: !!grow }; }

// ---- the six kit recipes (components/emblem.js) ----
core('kit:city', 10, (c, r) => {
  const N = c.S, m = N / 2; let best = null;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (i % 4 === 3 || j % 4 === 3) continue;
    const d = Math.hypot(i + 0.5 - m, j + 0.5 - m);
    if (r() < d / (N * 0.9) - 0.05) continue;
    const h = 5 + 50 * Math.exp(-Math.pow(d / (N * 0.31), 2)) * (0.45 + 0.55 * r()) + r() * 4;
    const b = c.box(i + 0.12, j + 0.12, 0.76, 0.76, h, 'block');
    if (!best || h > best.h) best = b;
  }
  if (best) { best.type = 'tower-block'; best.h = Math.max(best.h, c.H(52)); best.antenna = 14; }
  for (let k = 3.5; k < N; k += 4) { c.street([[k, 0.2], [k, N - 0.2]]); c.street([[0.2, k], [N - 0.2, k]]); }
}, true);

  if (!plan && c.cls.indexOf('c-thin') < 0) S('path', { d: d, class: 'cable-glow' }, parent);
  S('path', { d: d, class: 'cable ' + c.cls.replace('c-lit', '') }, parent);
  if (plan || c.smooth || c.cls.indexOf('c-thin') >= 0) return;
  c.p.forEach((q, idx) => {
    const p = P(q[0], q[1], q[2] == null ? 0.25 : q[2]);
    if (idx === c.p.length - 1) S('rect', { x: p[0] - 1.6, y: p[1] - 1.6, width: 3.2, height: 3.2, class: 'term' }, parent);
    else if (idx > 0) S('path', { d: `M${p[0]} ${p[1] - 2}l2 2-2 2-2-2z`, class: 'junction' }, parent);
    else S('circle', { cx: p[0], cy: p[1], r: 1.7, class: 'node' }, parent);
  });
}

// ============================================================ page
const TIERS = { 1: 'In use', 2: 'Built', 3: 'In dev', 4: 'Planned', 5: 'Idea' };
const reg = REGISTRY || { lanes: [], features: [], generated: '—' };
const FEATURES = reg.features.map(f => Object.assign({}, f, UPDATES[f.id] || {}, { _updated: !!UPDATES[f.id] })).concat(ADDED.map(f => Object.assign({ _added: true }, f)));
FEATURES.forEach(f => { f._children = FEATURES.filter(x => (x.partOf || []).indexOf(f.id) >= 0).length; });
const LANES = reg.lanes;
const state = { mode: 'equal', lanes: new Set(LANES.map(l => l.id)), q: '' };
try { const s = JSON.parse(localStorage.getItem('vrg-dioramas') || '{}'); if (s.mode) state.mode = s.mode; } catch (e) { /* storage unavailable */ }
function save() { try { localStorage.setItem('vrg-dioramas', JSON.stringify({ mode: state.mode, phase: document.documentElement.dataset.phase })); } catch (e) { /* ignore */ } }

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) { if (attrs[k] == null) continue; if (k === 'class') n.className = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); }
  kids.flat().forEach(c => { if (c == null) return; n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
}
const isKit = f => String((DESIGNS[f.id] || [''])[0]).startsWith('kit:');
function caption(f, N) {
  return el('div', { class: 'cap' },
    el('div', { class: 'cap__t' }, f.title),
    el('div', { class: 'cap__m' },
      el('span', { class: 'tier', 'data-t': f.tier }, el('i'), TIERS[f.tier]),
      el('span', {}, f.id.toUpperCase()),
      state.mode === 'mass' ? el('span', {}, N + '×' + N) : null,
      el('span', { class: 'src', 'data-s': isKit(f) ? 'kit' : 'new', title: isKit(f) ? 'The UI Kit\'s own emblem recipe' : 'New design for this page' }, isKit(f) ? 'kit' : 'new')));
}
function matches(f) {
  if (!state.lanes.has(f.lane)) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return (f.title + ' ' + f.brief + ' ' + f.id + ' ' + f.kind + ' ' + (DESIGNS[f.id] || ['', ''])[1]).toLowerCase().indexOf(q) >= 0;
}
function render() {
  const main = document.getElementById('main');
  main.textContent = '';
  let shown = 0;
  LANES.forEach(l => {
    let list = FEATURES.filter(f => f.lane === l.id && matches(f));
    if (!list.length) return;
    shown += list.length;
    if (state.mode === 'mass') list = list.slice().sort((a, b) => massOf(b).value - massOf(a).value);
    const wrap = el('div', { class: state.mode === 'mass' ? 'mass' : 'grid' });
    list.forEach(f => {
      const built = state.mode === 'mass' ? buildSvg(f, 'mass', { scale: 0.86, small: massOf(f).N < 9 }) : buildSvg(f, 'equal', { fixedTop: -64 });
      const t = el('button', { type: 'button', class: 'tile', 'aria-label': f.title + ', ' + TIERS[f.tier] + ': open details', onclick: () => openDetail(f) },
        el('div', { class: 'art' }, built.svg), caption(f, built.N));
      wrap.append(t);
    });
    main.append(el('section', { class: 'lane', 'aria-label': l.name },
      el('div', { class: 'lane__h' }, el('span', { class: 'code' }, l.id.toUpperCase()), el('h2', {}, l.name), el('p', {}, l.about)), wrap));
  });
  if (!shown) main.append(el('p', { class: 'empty' }, 'No feature matches.'));
  document.querySelectorAll('.seg [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
}
function openDetail(f) {
  const m = massOf(f), d = DESIGNS[f.id] || ['', ''];
  const big = buildSvg(f, 'mass', { scale: 1.5, tag: 'dlg' });
  const parents = (f.partOf || []).map(id => (FEATURES.find(x => x.id === id) || {}).title).filter(Boolean);
  const kids = FEATURES.filter(x => (x.partOf || []).indexOf(f.id) >= 0).map(x => x.title);
  const lane = LANES.find(l => l.id === f.lane) || {};
  document.getElementById('dlgBody').replaceChildren(
    el('div', { class: 'dlg__art' }, big.svg),
    el('div', { class: 'dlg__txt' },
      el('p', { class: 'kicker' }, (lane.name || '') + ' · ' + f.id.toUpperCase() + ' · ' + f.kind),
      el('h3', { id: 'dlgTitle' }, f.title),
      el('p', {}, f.brief),
      el('p', { class: 'design' }, (isKit(f) ? 'Kit emblem. ' : 'New design. ') + d[1]),
      el('dl', {},
        el('dt', {}, 'Maturity'), el('dd', {}, el('span', { class: 'tier', 'data-t': f.tier }, el('i'), TIERS[f.tier])),
        el('dt', {}, 'Open'), el('dd', { class: 'mono' }, f.open || '—'),
        parents.length ? [el('dt', {}, 'Part of'), el('dd', {}, parents.join(', '))] : null,
        kids.length ? [el('dt', {}, 'Parts'), el('dd', {}, kids.join(', '))] : null,
        el('dt', {}, 'Plinth'), el('dd', {}, m.N + ' × ' + m.N + ' grid units'),
        el('dt', {}, 'Mass'), el('dd', { class: 'mono' },
          (KIND_BASE[f.kind] || 4.5) + ' ' + f.kind + (m.loc ? ' + 1.7·log2(1+' + (m.loc / 1000).toFixed(1) + 'k lines)' : '') +
          (m.parts ? ' + 0.6·' + m.parts + ' parts' : '') + (f.links ? ' + 0.15·' + f.links + ' links' : '') +
          (TIER_ADJ[f.tier] ? ' ' + (TIER_ADJ[f.tier] > 0 ? '+ ' : '− ') + Math.abs(TIER_ADJ[f.tier]) + ' tier' : '') + ' = ' + m.value.toFixed(1)),
        f._updated ? [el('dt', {}, 'Note'), el('dd', {}, 'Updated after the registry (git log since 2026-11-09).')] : null,
        f._added ? [el('dt', {}, 'Note'), el('dd', {}, 'Not in the registry yet; added from git log since 2026-11-09.')] : null)));
  const dlg = document.getElementById('dlg');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}

function setPhase(ph) {
  document.documentElement.dataset.phase = ph;
  document.documentElement.dataset.theme = ph === 'night' ? 'dark' : 'light';
  document.querySelectorAll('.seg [data-ph]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ph === ph)));
  save();
}
function init() {
  let ph = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
  try { const s = JSON.parse(localStorage.getItem('vrg-dioramas') || '{}'); if (s.phase) ph = s.phase; } catch (e) { /* ignore */ }
  const qs = new URLSearchParams(location.search);   // ?mode=equal|mass&phase=day|night for direct links
  if (qs.get('mode') === 'mass' || qs.get('mode') === 'equal') state.mode = qs.get('mode');
  if (qs.get('phase') === 'day' || qs.get('phase') === 'night') ph = qs.get('phase');
  setPhase(ph);
  const kit = FEATURES.filter(isKit).length;
  document.getElementById('sub').textContent = FEATURES.length + ' features from the VRG Features registry (' + reg.generated + ', plus ' + ADDED.length + ' added since): ' +
    kit + ' use the UI Kit\'s own emblem recipes, ' + (FEATURES.length - kit) + ' are new designs. Click one for its story.';
  document.getElementById('legend').replaceChildren(
    el('span', {}, el('b', {}, 'Maturity is how far it is built: ')),
    ...[1, 2, 3, 4, 5].map(t => el('span', { class: 'tier', 'data-t': t }, el('i'), TIERS[t] + [' — lit at night', ' — solid', ' — part-built, crane', ' — ghost outlines, stakes', ' — dotted blueprint'][t - 1])),
    el('span', {}, el('b', {}, 'Sized by mass: '), 'same grid unit everywhere; plinth side 4–22 from code lines, kind, parts and links.'));
  const chips = document.getElementById('chips');
  LANES.forEach(l => {
    const n = FEATURES.filter(f => f.lane === l.id).length;
    chips.append(el('button', { type: 'button', class: 'chip', 'aria-pressed': 'true', onclick: e => {
      const b = e.currentTarget;
      if (state.lanes.size === LANES.length) { state.lanes = new Set([l.id]); }
      else if (state.lanes.has(l.id)) { state.lanes.delete(l.id); if (!state.lanes.size) state.lanes = new Set(LANES.map(x => x.id)); }
      else state.lanes.add(l.id);
      chips.querySelectorAll('.chip').forEach((c, k) => c.setAttribute('aria-pressed', String(state.lanes.has(LANES[k].id))));
      render();
    } }, l.name, el('span', { class: 'n' }, n)));
  });
  document.querySelectorAll('.seg [data-mode]').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; save(); render(); }));
  document.querySelectorAll('.seg [data-ph]').forEach(b => b.addEventListener('click', () => setPhase(b.dataset.ph)));
  let qt = 0;
  document.getElementById('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120); });
  const dlg = document.getElementById('dlg');
  document.getElementById('dlgClose').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  render();
}
init();
</script>
