<style>
/* Layout: Mélyvíz instrument panel — a sticky readout column beside a long module rack; hairlines, square controls, two cut corners. */
:root {
  --bg: #0a141c; --horizon: #11202b; --panel: #121c24; --raised: #17232c;
  --line: rgba(232,240,246,.14); --line-strong: rgba(232,240,246,.32);
  --text: #e8f0f6; --dim: #a6afb7; --faint: #6c757c;
  --accent: #93d3e6; --accent-soft: rgba(147,211,230,.13); --on-accent: #08141a;
  --warm: #e8a873; --warm-soft: rgba(232,168,115,.14);
  --ok: #8bcca1; --warn: #e3be7b; --crit: #e4877d;
  --p0: #93d3e6; --p1: #6fb4c9; --p2: #5294a8; --p3: #e8a873; --p4: #c98f5e; --p5: #6c757c;
  --cut: 7px;
  --voice: Bahnschrift, "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef3f6; --horizon: #e2eaef; --panel: #f8fbfc; --raised: #ffffff;
  --line: rgba(14,32,43,.13); --line-strong: rgba(14,32,43,.30);
  --text: #0e1a22; --dim: #475660; --faint: #7d8a93;
  --accent: #1f6f87; --accent-soft: rgba(31,111,135,.10); --on-accent: #ffffff;
  --warm: #a5582a; --warm-soft: rgba(165,88,42,.10);
  --ok: #2f7d4c; --warn: #8a6516; --crit: #b0433a;
  --p0: #1f6f87; --p1: #3a8aa1; --p2: #66a7ba; --p3: #b8693a; --p4: #d39a6e; --p5: #9aa6ae;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef3f6; --horizon: #e2eaef; --panel: #f8fbfc; --raised: #ffffff;
  --line: rgba(14,32,43,.13); --line-strong: rgba(14,32,43,.30);
  --text: #0e1a22; --dim: #475660; --faint: #7d8a93;
  --accent: #1f6f87; --accent-soft: rgba(31,111,135,.10); --on-accent: #ffffff;
  --warm: #a5582a; --warm-soft: rgba(165,88,42,.10);
  --ok: #2f7d4c; --warn: #8a6516; --crit: #b0433a;
  --p0: #1f6f87; --p1: #3a8aa1; --p2: #66a7ba; --p3: #b8693a; --p4: #d39a6e; --p5: #9aa6ae;
  color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: .86em; }
h1, h2, h3 { font-family: var(--voice); font-weight: 600; letter-spacing: .02em; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: var(--text); border-radius: 0; }
button { cursor: pointer; background: var(--panel); border: 1px solid var(--line-strong); padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
input[type=search], input[type=text], select, textarea { background: var(--raised); border: 1px solid var(--line-strong); padding: 7px 10px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); font-weight: 600; }

.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 24px; }
.brand .sub { color: var(--dim); font-size: 13px; }
.lang { margin-left: auto; display: flex; border: 1px solid var(--line-strong); }
.lang button { border: 0; padding: 4px 10px; font-family: var(--mono); font-size: 12px; background: transparent; color: var(--dim); }
.lang button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; scrollbar-width: none; }
nav.tabs a { text-decoration: none; color: var(--dim); padding: 6px 12px; border-bottom: 2px solid transparent; white-space: nowrap; font-family: var(--voice); font-size: 16px; letter-spacing: .03em; }
nav.tabs a[aria-current=page] { color: var(--text); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--text); }

main { padding-block: 22px 60px; }
.intro { max-width: 70ch; color: var(--dim); margin: 0 0 18px; }
.intro strong { color: var(--text); font-weight: 600; }

/* modules view */
.mod-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
@media (max-width: 980px) { .mod-grid { grid-template-columns: minmax(0, 1fr); } .aside { order: -1; position: static !important; max-height: none !important; } }
.aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 130px); overflow-y: auto; display: grid; gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line-strong); padding: 14px 16px;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.panel h2 { font-size: 17px; margin-bottom: 8px; }
.readout { display: flex; align-items: baseline; gap: 10px; }
.readout .big { font-family: var(--mono); font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1.1; }
.readout .of { color: var(--dim); font-family: var(--mono); }
.bar { display: flex; height: 10px; margin: 10px 0 6px; background: var(--horizon); }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin-top: 10px; }
.counts div { border: 1px solid var(--line); padding: 6px 8px; }
.counts b { display: block; font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 16px; }
.counts small { color: var(--dim); font-size: 11.5px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { font-size: 13px; padding: 5px 9px; }
.hint { font-size: 12.5px; color: var(--dim); margin: 6px 0 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ai textarea { min-height: 74px; resize: vertical; }
.ai .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { font-size: 12.5px; padding: 3px 8px; background: transparent; border: 1px dashed var(--line-strong); color: var(--dim); }
.chip:hover { color: var(--text); }
.ai-out { margin-top: 10px; border-left: 2px solid var(--warm); padding: 4px 0 4px 10px; font-size: 13.5px; }
.ai-out ul { margin: 6px 0; padding-left: 18px; }
.status { font-size: 12.5px; color: var(--dim); }
.status.ok { color: var(--ok); } .status.err { color: var(--crit); } .status.warn { color: var(--warn); }

.filters { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-bottom: 10px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; }
.fchips .sep { width: 1px; height: 20px; background: var(--line-strong); margin: 0 4px; }
.fchip { font-size: 12.5px; padding: 3px 9px; font-family: var(--mono); color: var(--dim); background: transparent; }
.fchip[aria-pressed=true] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.fam { margin-bottom: 26px; }
.fam-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line-strong); padding-bottom: 6px; margin-bottom: 4px; }
.fam-h h2 { font-size: 20px; }
.fam-h .n { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.fam-h button { margin-left: auto; font-size: 12px; padding: 2px 8px; }
.mod { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mod:hover { background: var(--accent-soft); }
.mod.on { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }
.mod.core { cursor: default; }
.mod input { margin: 4px 0 0; width: 16px; height: 16px; }
.mod .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.mod .id { font-family: var(--mono); font-size: 12.5px; color: var(--accent); }
.mod .name { font-weight: 600; }
.mod .tags { display: inline-flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
.pill { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line-strong); color: var(--dim); white-space: nowrap; }
.pill.t0 { color: var(--accent); border-color: var(--accent); }
.pill.t1 { color: var(--ok); border-color: var(--ok); }
.pill.t2 { color: var(--warn); border-color: var(--warn); }
.pill.t3 { color: var(--faint); }
.mod .desc { grid-column: 2; color: var(--dim); font-size: 14px; max-width: 78ch; }
.mod .meta { grid-column: 2; font-size: 12.5px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.mod .meta b { color: var(--dim); font-weight: 500; }
.mod .why { grid-column: 2; font-size: 13px; color: var(--warm); }
.empty { color: var(--dim); padding: 20px 0; }

/* text views */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; min-width: 0; }
.card h3 { font-size: 18px; margin-bottom: 6px; }
.card ul { margin: 6px 0 0; padding-left: 18px; color: var(--dim); }
.card li { margin: 3px 0; }
.card li b { color: var(--text); font-weight: 600; }
.section-h { margin: 28px 0 10px; font-size: 22px; }
.section-h:first-child { margin-top: 0; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); background: var(--horizon); font-weight: 600; }
td.prod { font-weight: 600; white-space: nowrap; }
td.take { color: var(--warm); }
.plbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 14px; }
.plbar input { flex: 1 1 220px; min-width: 0; padding: 6px 9px; background: var(--panel, transparent); color: var(--text); border: 1px solid var(--line-strong); font: inherit; }
.verdict { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid; white-space: nowrap; }
.verdict.have { color: var(--ok); } .verdict.part { color: var(--warn); } .verdict.new { color: var(--accent); } .verdict.core { color: var(--dim); } .verdict.no { color: var(--faint); }
.goto { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; margin: 0 4px 3px 0; border: 1px solid var(--line-strong); color: var(--accent); background: transparent; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.goto:hover { border-color: var(--accent); }
.goto i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); display: inline-block; }
.goto.on i { background: var(--ok); }
td.plname { font-weight: 600; white-space: nowrap; }
.plsum { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 14px; font-size: 13px; color: var(--dim); }
.plsum b { color: var(--text); font-family: var(--mono); }
td .mono { color: var(--accent); }
pre.tree { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: var(--dim); margin: 0; }
.dec { border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; margin-bottom: 10px; }
.dec .q { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dec .q .mono { color: var(--accent); }
.dec .q h3 { font-size: 17px; }
.dec label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; color: var(--dim); cursor: pointer; }
.dec label.sel { color: var(--text); }
.dec label input { margin-top: 4px; }
.dec .rec { font-family: var(--mono); font-size: 11px; color: var(--ok); border: 1px solid var(--ok); padding: 0 5px; margin-left: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--raised); border: 1px solid var(--accent); padding: 8px 14px; font-size: 13.5px; max-width: calc(100% - 32px); z-index: 20; }
footer { color: var(--faint); font-size: 12.5px; border-top: 1px solid var(--line); padding-block: 14px 30px; }
@media (prefers-reduced-motion: no-preference) { .mod { transition: background .15s; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1 id="h-title">VRG Jegyzetek</h1><span class="sub" id="h-sub"></span></div>
    <div class="lang" role="group" aria-label="Language">

  </div>
</header>

<main class="wrap">
  <section data-view="modules">
    <p class="intro" id="mod-intro"></p>
    <div class="mod-grid">
      <div>
        <div class="filters">
          <input type="search" id="q" autocomplete="off">
          <label class="row" style="white-space:nowrap;font-size:13.5px;color:var(--dim)"><input type="checkbox" id="only-sel"> <span id="only-sel-l"></span></label>
        </div>
        <div class="fchips" id="fchips"></div>
        <div id="list"></div>
      </div>
      <aside class="aside" id="aside">

          <div class="label" id="sum-l"></div>
          <div class="readout"><span class="big" id="sum-n">0</span><span class="of" id="sum-of"></span></div>
          <div class="bar" id="sum-bar"></div>
          <div class="legend" id="sum-legend"></div>
          <div class="counts" id="sum-counts"></div>
        </div>
        <div class="panel">
          <h2 id="pre-h"></h2>
          <div class="presets" id="presets"></div>
          <p class="hint" id="pre-hint"></p>
        </div>
        <div class="panel ai">
          <h2 id="ai-h"></h2>
          <textarea id="ai-goal"></textarea>
          <div class="chips" id="ai-chips"></div>
          <div class="row"><button type="button" class="primary" id="ai-go"></button><span class="status" id="ai-status"></span></div>
          <div id="ai-out" hidden></div>

        <div class="panel">
          <h2 id="save-h"></h2>
          <div class="row"><button type="button" class="primary" id="save"></button><span class="status" id="save-status"></span></div>
          <p class="hint" id="save-hint"></p>
          <div class="row" style="margin-top:10px"><button type="button" id="copy-md"></button><button type="button" id="copy-json"></button></div>
          <textarea id="copy-fallback" readonly hidden style="margin-top:8px;min-height:120px;font-family:var(--mono);font-size:12px"></textarea>
        </div>
      </aside>
    </div>
  </section>

  <section data-view="market" hidden><div id="market"></div></section>
  <section data-view="plugins" hidden><div id="plugins"></div></section>
  <section data-view="vrg" hidden><div id="vrg"></div></section>
  <section data-view="backend" hidden><div id="backend"></div></section>
  <section data-view="decisions" hidden><div id="decisions"></div></section>
</main>
<footer class="wrap" id="foot"></footer>
<div class="toast" id="toast" hidden></div>

  state.goal = typeof d.goal === 'string' ? d.goal.slice(0, 2000) : '';
  state.reasons = {}; if (d.reasons && typeof d.reasons === 'object') Object.keys(d.reasons).forEach(k => { if (MOD[k]) state.reasons[k] = String(d.reasons[k]).slice(0, 300); });

  state.dbChecked = true;

  state.db = db;
  const ref = db.doc('picks/current');
  ref.onSnapshot(snap => {

    const d = snap.exists ? snap.data() : null;
    if (d && d.updatedAt !== state.savedAt) {

    const res = await sampleFn.json(aiPrompt(goal), { modelTier: 'default', cache: false });
    const list = (res && Array.isArray(res.modules) ? res.modules : []).filter(x => x && MOD[x.id]);
    const reasons = {}; list.forEach(x => { if (typeof x.why === 'string') reasons[x.id] = x.why.slice(0, 300); });
    state.pendingAi = { ids: list.map(x => x.id), reasons, summary: typeof res.summary === 'string' ? res.summary.slice(0, 1200) : '' };
    st.className = 'status ok'; st.textContent = L.aiDone(list.length);
  } catch (e) {
    st.className = 'status err';
    st.textContent = e && e.code === 'not_granted' ? L.aiNone : L.aiErr + ((e && (e.message || e.code)) || '');
    if (e && e.code === 'not_granted') { sampleFn = null; }
  }
  btn.disabled = !sampleFn; renderAiOut();
}
function renderAiOut() {
  const out = $('ai-out'), L = tt(), p = state.pendingAi;
  if (!p) { out.hidden = true; out.innerHTML = ''; return; }
  out.hidden = false;
  out.innerHTML = `<div class="ai-out"><p style="margin:0">${esc(p.summary)}</p>
    <ul>${p.ids.map(id => `<li><span class="mono">${id}</span> ${esc(MOD[id][state.lang][0])}${p.reasons[id] ? ` — ${esc(p.reasons[id])}` : ''}</li>`).join('')}</ul></div>
    <div class="row" style="margin-top:8px"><button type="button" class="primary" id="ai-apply">${esc(L.aiApply)}</button><button type="button" id="ai-dismiss">${esc(L.aiDismiss)}</button></div>`;
}
function applyAi() {
  const p = state.pendingAi; if (!p) return;
  state.sel = new Set(closeDeps(p.ids)); state.reasons = { ...p.reasons }; state.aiSummary = p.summary;
  state.pendingAi = null; markDirty(); renderAiOut(); renderList(); renderSummary(); toast(tt().aiApplied);
  $('ai-status').textContent = '';
}

/* ---------------------------------------------------------------- events */
$('lang-hu').addEventListener('click', () => { state.lang = 'hu'; store.set('vrgj.lang', 'hu'); renderAll(); });
$('lang-en').addEventListener('click', () => { state.lang = 'en'; store.set('vrgj.lang', 'en'); renderAll(); });
window.addEventListener('hashchange', () => { renderChrome(); if (currentView() === 'plugins') renderPlugins(); window.scrollTo(0, 0); });
$('q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('only-sel').addEventListener('change', e => { state.onlySel = e.target.checked; renderList(); });
$('fchips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const tog = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); };
  if (b.dataset.ftier != null) tog(state.tiers, +b.dataset.ftier);
  if (b.dataset.fwhere != null) tog(state.wheres, b.dataset.fwhere);
  if (b.dataset.fphase != null) tog(state.phases, +b.dataset.fphase);
  renderModulesStatic(); renderList();
});
$('list').addEventListener('change', e => { const id = e.target.dataset && e.target.dataset.id; if (id) setOn(id, e.target.checked); });
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-fam]'); if (!b) return;
  e.preventDefault();
  const on = b.dataset.on === 'true', f = b.dataset.fam;
  const ids = IDS.filter(id => MOD[id].fam === f && MOD[id].tier !== 0 && matches(MOD[id]));
  if (on) closeDeps(ids).forEach(x => state.sel.add(x));
  else ids.forEach(id => { state.sel.delete(id); dependentsOf(id, state.sel).forEach(x => state.sel.delete(x)); });
  markDirty(); renderList(); renderSummary();
});
$('presets').addEventListener('click', e => { const b = e.target.closest('button[data-preset]'); if (b) applyPreset(b.dataset.preset); });
$('ai-chips').addEventListener('click', e => { const b = e.target.closest('button[data-chip]'); if (b) { $('ai-goal').value = tt().aiChips[+b.dataset.chip]; $('ai-goal').focus(); } });
$('ai-go').addEventListener('click', runAi);
$('aside').addEventListener('click', e => {
  if (e.target.id === 'ai-apply') applyAi();
  if (e.target.id === 'ai-dismiss') { state.pendingAi = null; renderAiOut(); $('ai-status').textContent = ''; }
  if (e.target.id === 'load-remote' && state.remote) applyRemote(state.remote);
});
$('ai-goal').addEventListener('input', e => { state.goal = e.target.value; });
$('save').addEventListener('click', save);
$('copy-md').addEventListener('click', () => copy(toMarkdown()));
$('copy-json').addEventListener('click', () => copy(JSON.stringify(payload(), null, 2)));
$('plugins').addEventListener('click', e => {
  const g = e.target.closest('button[data-goto]');
  if (g) { state.q = g.dataset.goto; state.onlySel = false; $('q').value = state.q; $('only-sel').checked = false; location.hash = 'modules'; renderList(); return; }
  const v = e.target.closest('button[data-plv]');
  if (v) { const x = v.dataset.plv; state.plV.has(x) ? state.plV.delete(x) : state.plV.add(x); renderPlugins(); }
});
$('plugins').addEventListener('input', e => {
  if (e.target.id !== 'pl-q') return;
  state.plQ = e.target.value; const pos = e.target.selectionStart; renderPlugins();
  const el = $('pl-q'); el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {}
});
$('decisions').addEventListener('change', e => { if (e.target.type === 'radio') { state.decisions[e.target.name] = e.target.value; markDirty(); renderDecisions(); } });

/* restore an unsent local draft (per-viewer convenience) before the shared copy answers */
try { const dr = JSON.parse(store.get('vrgj.draft') || 'null'); if (dr && Array.isArray(dr.modules)) { applyRemote(dr); state.dirty = true; } } catch (e) {}
renderAll();
initDb();
initSample();
})();
</script>

</body></html>
