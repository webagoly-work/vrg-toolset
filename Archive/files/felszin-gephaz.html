<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Felszín és gépház</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: control rail · device stage · engine room. The surface sits in the middle; the machinery is on the right. */
:root{
  --bg:#0a141c; --horizon:#11202b; --panel:#121c24; --raised:#17232c;
  --line:rgba(232,240,246,.15); --line2:rgba(232,240,246,.34);
  --text:#e8f0f6; --dim:#a6afb7; --faint:#6f7880;
  --accent:#93d3e6; --accent-soft:rgba(147,211,230,.14); --on-accent:#0a141c;
  --warm:#e8a873; --warm-soft:rgba(232,168,115,.16);
  --ok:#8bcca1; --warn:#e3be7b; --crit:#e4877d; --bezel:#05090c;
  /* Ismerős phone skin (follows the theme) */
  --i-bg:#000; --i-cell:#1c1c1e; --i-text:#fff; --i-dim:#8d8d93; --i-sep:#38383a; --i-accent:#ffd60a; --i-fill:#2c2c2e; --i-dim2:rgba(255,214,10,.16);
  /* Alap phone skin (Mélyvíz, a single dark look on purpose) */
  --a-bg:#0a141c; --a-panel:#121c24; --a-raised:#17232c; --a-line:rgba(232,240,246,.15); --a-text:#e8f0f6; --a-dim:#a6afb7; --a-accent:#93d3e6; --a-warm:#e8a873; --a-on:#0a141c;
  --voice:Bahnschrift,"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI",system-ui,sans-serif;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --cut:7px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eaeff2; --horizon:#dde5ea; --panel:#ffffff; --raised:#f3f6f8;
    --line:rgba(10,20,28,.14); --line2:rgba(10,20,28,.32);
    --text:#0f1a22; --dim:#4b5862; --faint:#7f8a93;
    --accent:#1d7891; --accent-soft:rgba(29,120,145,.12); --on-accent:#ffffff;
    --warm:#a75e22; --warm-soft:rgba(167,94,34,.12);
    --ok:#2c8150; --warn:#8f6512; --crit:#b3443a; --bezel:#1d2328;
    --i-bg:#f2f2f7; --i-cell:#ffffff; --i-text:#000; --i-dim:#8a8a8e; --i-sep:#c6c6c8; --i-accent:#b98a00; --i-fill:#e3e3e8; --i-dim2:rgba(185,138,0,.13);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eaeff2; --horizon:#dde5ea; --panel:#ffffff; --raised:#f3f6f8;
  --line:rgba(10,20,28,.14); --line2:rgba(10,20,28,.32);
  --text:#0f1a22; --dim:#4b5862; --faint:#7f8a93;
  --accent:#1d7891; --accent-soft:rgba(29,120,145,.12); --on-accent:#ffffff;
  --warm:#a75e22; --warm-soft:rgba(167,94,34,.12);
  --ok:#2c8150; --warn:#8f6512; --crit:#b3443a; --bezel:#1d2328;
  --i-bg:#f2f2f7; --i-cell:#ffffff; --i-text:#000; --i-dim:#8a8a8e; --i-sep:#c6c6c8; --i-accent:#b98a00; --i-fill:#e3e3e8; --i-dim2:rgba(185,138,0,.13);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.brand h1{font-family:var(--voice);font-stretch:75%;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:30px;line-height:1;margin:0;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--dim);max-width:62ch}
.lab{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--dim)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{padding:6px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:280px minmax(0,1fr)}.engine{grid-column:1/-1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);min-width:0}
.panel h2{font-family:var(--voice);font-stretch:75%;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:17px;margin:0 0 4px}
.panel .sub{color:var(--dim);font-size:12.5px;margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.hint{font-size:12px;color:var(--dim)}
/* the big switch */
.snap{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line2);background:var(--raised);width:100%;text-align:left}
.snap .knob{flex:none;width:46px;height:26px;border:1px solid var(--line2);position:relative;background:var(--bg)}
.snap .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--faint);transition:transform .18s,background .18s}
.snap[aria-pressed="true"] .knob{background:var(--accent-soft);border-color:var(--accent)}
.snap[aria-pressed="true"] .knob::after{transform:translateX(20px);background:var(--accent)}
.snap b{font-family:var(--voice);font-stretch:75%;font-size:18px;letter-spacing:.05em;text-transform:uppercase;display:block}
.snap span.h{font-size:12px;color:var(--dim)}
.feats{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.feat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.feat .box{width:16px;height:16px;border:1px solid var(--line2);display:grid;place-items:center}
.feat[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.feat[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.feat .nm{font-weight:600;font-size:13px;min-width:0}
.feat .ds{grid-column:2/4;font-size:11.5px;color:var(--dim)}
.feat .ft{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line2);padding:1px 5px;white-space:nowrap}
.feat:disabled{cursor:not-allowed}
.feat:disabled .nm,.feat:disabled .ds{opacity:.45}
.feat:disabled .ft{color:var(--faint)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);padding:7px 11px;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.budget{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;font-size:12.5px}
.budget .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.budget .v.ok{color:var(--ok)} .budget .v.over{color:var(--crit)}
.check{margin-top:10px;padding:8px 10px;border:1px solid var(--line);font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.check i{font-style:normal;font-family:var(--mono);flex:none}
.check.ok i{color:var(--ok)} .check.info i{color:var(--accent)} .check.bad i{color:var(--crit)}
/* stage */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 12px;background:linear-gradient(180deg,var(--horizon),var(--bg));border:1px solid var(--line);min-width:0}
.stage .note-l{font-size:12px;color:var(--dim);text-align:center;max-width:60ch}
.phone{width:100%;max-width:372px;height:760px;border-radius:46px;background:var(--bezel);padding:11px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:13px;font-weight:600;position:relative}
.sbar .island{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:104px;height:28px;border-radius:16px;background:#000}
.sbar .sig{display:flex;gap:5px;align-items:center}
.sbar .bat{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sbar .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.ico{width:22px;height:22px;display:block}
.ico.s{width:17px;height:17px}
.pcscroll{width:100%;overflow-x:auto}
/* ---------- Ismerős skin ---------- */
.ism{background:var(--i-bg);color:var(--i-text);font-family:var(--ios)}
.ism .sbar{color:var(--i-text)}
.i-nav{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--i-accent)}
.i-nav .back{display:flex;align-items:center;gap:2px;font-size:17px;color:var(--i-accent)}
.i-nav .rt{display:flex;gap:16px;align-items:center}
.i-nav button{color:var(--i-accent);font-size:17px}
.i-scroll{flex:1;overflow-y:auto;padding:0 16px 16px}
.i-large{font-size:32px;font-weight:700;letter-spacing:.01em;margin:2px 0 10px;line-height:1.1}
.i-search{display:flex;align-items:center;gap:6px;background:var(--i-fill);border-radius:10px;height:36px;padding:0 8px;color:var(--i-dim);font-size:16px;width:100%;text-align:left;margin-bottom:6px}
.i-search input{flex:1;min-width:0;background:none;border:0;font:inherit;color:var(--i-text);outline:none}
.i-sec{font-size:20px;font-weight:700;margin:16px 4px 8px}
.i-gh{font-size:13px;color:var(--i-dim);text-transform:uppercase;margin:16px 16px 6px;letter-spacing:.02em}
.i-group{background:var(--i-cell);border-radius:11px;overflow:hidden}
.i-row{display:flex;gap:10px;align-items:center;padding:10px 14px 10px 16px;position:relative;width:100%;text-align:left}
.i-row+.i-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--i-sep)}
.i-row .m{flex:1;min-width:0}
.i-row .t{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-row .s{font-size:14px;color:var(--i-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-row .s b{color:var(--i-text);font-weight:400;opacity:.85;margin-right:6px}
.i-row .thumb{width:44px;height:44px;border-radius:6px;flex:none}
.i-frow{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 16px;position:relative;width:100%;text-align:left;font-size:17px}
.i-frow+.i-frow::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--i-sep)}
.i-frow .fi{color:var(--i-accent)}
.i-frow .n{flex:1;min-width:0}
.i-frow .c{color:var(--i-dim)}
.i-frow .chev{color:var(--i-sep)}
.i-toolbar{height:50px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px 6px;color:var(--i-accent);border-top:.5px solid var(--i-sep);background:var(--i-bg)}
.i-toolbar .r{justify-self:end;display:flex;gap:22px}
.i-toolbar .l{display:flex;gap:22px}
.i-toolbar .count{font-size:11px;color:var(--i-text)}
.i-toolbar button{color:var(--i-accent)}
.i-date{text-align:center;color:var(--i-dim);font-size:13px;margin:4px 0 10px}
.i-title{font-size:23px;font-weight:700;margin:0 0 6px;line-height:1.2;display:flex;align-items:flex-start;gap:8px}
.ism .nbody{font-size:17px;line-height:1.4}
.ism .ck .bx{border-radius:50%;border-color:var(--i-dim)}
.ism .ck.on .bx{background:var(--i-accent);border-color:var(--i-accent)}
.ism .ck.on .bx::after{border-color:var(--i-cell)}
.ism .ck.on .tx{color:var(--i-dim)}
.ism .chip{background:var(--i-fill);color:var(--i-text);border-radius:999px}
.ism .chip.sug{background:transparent;border:1.5px dashed var(--i-accent);color:var(--i-accent)}
.ism .chip .q{color:var(--i-accent)}
.ism .hintchip{background:var(--i-fill);border-radius:999px;color:var(--i-accent)}
/* ---------- Alap skin (Mélyvíz) ---------- */
.alap{background:var(--a-bg);color:var(--a-text);font-family:var(--sans)}
.alap .sbar{color:var(--a-text)}
.a-top{padding:6px 12px 8px;flex:none}
.a-search{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;background:var(--a-raised);border:1px solid var(--a-line);color:var(--a-dim);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%);width:100%}
.a-search input{flex:1;min-width:0;background:none;border:0;font:inherit;color:var(--a-text);outline:none}
.a-search button{color:var(--a-text)}
.a-scroll{flex:1;overflow-y:auto;padding:0 12px 90px}
.a-h{display:flex;align-items:baseline;gap:8px;margin:6px 2px 4px;font-family:var(--voice);font-stretch:75%;font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.a-h .n{font-family:var(--mono);font-size:11px;color:var(--a-dim);letter-spacing:.1em}
.a-sec{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--a-dim);margin:14px 2px 6px}
.a-card{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;background:var(--a-panel);border:1px solid var(--a-line);margin-bottom:6px}
.a-card:hover{border-color:rgba(147,211,230,.5)}
.a-card .m{flex:1;min-width:0}
.a-card .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-card .s{font-size:13px;color:var(--a-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-card .s b{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--a-accent);margin-right:6px}
.a-card .thumb{width:46px;height:46px;flex:none}
.a-fab{position:absolute;right:18px;bottom:26px;width:58px;height:58px;background:var(--a-accent);color:var(--a-on);display:grid;place-items:center;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.a-bar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;color:var(--a-text)}
.a-bar .sp{flex:1}
.a-bar button{width:42px;height:42px;display:grid;place-items:center}
.a-bar button.on{color:var(--a-accent)}
.a-note .ttl{font-family:var(--sans);font-size:22px;font-weight:700;margin:2px 0 4px;line-height:1.25;display:flex;align-items:flex-start;gap:8px}
.a-note .dt{font-family:var(--mono);font-size:11px;color:var(--a-dim);letter-spacing:.06em;margin-bottom:8px}
.alap .nbody{font-size:15.5px;line-height:1.5}
.alap .ck .bx{border-color:var(--a-dim)}
.alap .ck.on .bx{background:var(--a-accent);border-color:var(--a-accent)}
.alap .ck.on .bx::after{border-color:var(--a-on)}
.alap .ck.on .tx{color:var(--a-dim);text-decoration:line-through}
.alap .chip{border:1px solid rgba(232,240,246,.34);color:var(--a-text)}
.alap .chip.sug{border-style:dashed;border-color:var(--a-accent);color:var(--a-accent)}
.alap .chip .q{color:var(--a-accent)}
.alap .hintchip{border:1px solid rgba(147,211,230,.5);color:var(--a-accent)}
.a-insert{height:54px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 6px;border-top:1px solid var(--a-line);background:var(--a-panel)}
.a-insert button{width:44px;height:44px;display:grid;place-items:center;color:var(--a-text)}
.a-insert .sp{flex:1}
.a-insert .sv{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--a-dim);padding-right:8px}
.a-drawer{position:absolute;inset:0;z-index:30;display:flex}
.a-drawer .pane{width:78%;background:var(--a-panel);border-right:1px solid var(--a-line);padding:54px 0 0;overflow-y:auto}
.a-drawer .rest{flex:1;background:rgba(0,0,0,.5)}
.a-drawer .dh{font-family:var(--voice);font-stretch:75%;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:18px;padding:0 18px 10px}
.a-frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;color:var(--a-text)}
.a-frow .n{flex:1}
.a-frow .c{font-family:var(--mono);font-size:11px;color:var(--a-dim)}
.a-frow.cur{background:rgba(147,211,230,.14);color:var(--a-accent)}
.a-frow .fi{color:var(--a-dim)}
/* shared phone pieces */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 9px;line-height:1.3;white-space:nowrap}
.chip.more{font-family:var(--mono);font-size:11px}
.rchips{display:flex;gap:5px;margin-top:4px;flex-wrap:nowrap;overflow:hidden}
.rchips .chip{font-size:11px;padding:1px 7px}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.hintchip{font-size:12.5px;padding:3px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a-warm);flex:none;display:inline-block}
.ism .dot{background:var(--i-accent)}
.nbody p{margin:0 0 10px}
.ck{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;width:100%;text-align:left}
.ck .bx{width:20px;height:20px;border:1.5px solid;flex:none;margin-top:2px;display:grid;place-items:center}
.ck.on .bx::after{content:"";width:9px;height:5px;border:2px solid;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.photo{height:150px;margin:2px 0 12px;position:relative;overflow:hidden;background:
  linear-gradient(135deg,rgba(0,0,0,.25),rgba(0,0,0,0) 60%),
  repeating-linear-gradient(90deg,#3d4a52 0 22px,#46545d 22px 24px),#3a464e}
.ism .photo{border-radius:8px}
.photo::before{content:"";position:absolute;left:16%;top:18%;width:68%;height:64%;background:repeating-linear-gradient(90deg,#d9dde0 0 9px,#9aa3a8 9px 11px);opacity:.75;box-shadow:0 0 0 6px #2a3237}
.photo span{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px}
.thumb{background:linear-gradient(135deg,rgba(0,0,0,.2),transparent),repeating-linear-gradient(90deg,#d9dde0 0 5px,#8f989d 5px 6px)}
.empty{padding:40px 10px;text-align:center;color:var(--i-dim)}
.alap .empty{color:var(--a-dim)}
/* sheets inside the device */
.sheetwrap{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.42)}
.sheet{max-height:78%;overflow-y:auto;padding:8px 0 18px}
.ism .sheet{background:var(--i-bg);border-radius:14px 14px 0 0}
.alap .sheet{background:var(--a-panel);border-top:1px solid rgba(147,211,230,.5)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--i-sep);margin:4px auto 10px}

    S.log.unshift({ ev:e, at:clock(), undone:false, n:++S.seq });
  });
}

  const le = S.log.find(x => x.n === seq); if (!le || le.undone) return;

}

function chipHTML(c, small){

}

function folderList(){
  const l = L(), f = [
    {id:'all', t:l.f_all, n:NOTES.length},
    {id:'munka', t:l.f_munka, n:NOTES.filter(x => x.folder === 'munka').length},
    {id:'iroda', t:l.f_iroda, n:NOTES.filter(x => x.folder === 'iroda').length},
    {id:'otlet', t:l.f_otlet, n:NOTES.filter(x => x.folder === 'otlet').length},
  ];
  if (on('diary') && !S.dismissed.diary) f.push({id:'ma', t:l.f_ma, n:NOTES.filter(x => x.when === 'ma').length, feat:1, ic:'calendar'});
  if (on('task')) f.push({id:'todo', t:l.f_todo, n:NOTES.filter(hasOpen).length, feat:1, ic:'checkC'});
  f.push({id:'trash', t:l.f_trash, n:0, ic:'trash'});
  return f;
}
const hasOpen = n => bodyOf(n).some(b => b[0] === 'c' && !b[1]);
function folderName(id){ const f = folderList().find(x => x.id === id); return f ? f.t : L().f_all; }
function visibleNotes(){
  let ns = NOTES.slice();
  const fo = S.folder;
  if (fo === 'trash') return [];
  if (fo === 'ma') ns = ns.filter(n => n.when === 'ma');
  else if (fo === 'todo') ns = ns.filter(hasOpen);
  else if (fo !== 'all') ns = ns.filter(n => n.folder === fo);
  const q = fold(S.search.trim());
  if (q){
    ns = ns.filter(n => {
      if (q.startsWith('munka:')) return n.job && fold(n.job).includes(q.slice(6).trim());
      if (q === 'teendo') return hasOpen(n);
      if (q === 'van foto') return !!n.photo;
      if (q.startsWith('#')) return (n.tags||[]).some(t => fold(t).startsWith(q));
      const txt = fold(n.title + ' ' + bodyOf(n).map(b => b[b.length-1]).join(' ') + (S.fired.site1 ? ' ' + (n.ocr||'') : ''));
      return q.split(/\s+/).every(w => txt.includes(w));
    });
  }
  return ns;
}
function sections(ns){
  const l = L(), out = [];
  const pin = ns.filter(n => n.pinned); if (pin.length) out.push([l.pinned, pin]);
  [['ma',l.s_ma],['het',l.s_het],['honap',l.s_honap],['okt',l.s_okt]].forEach(([k,t]) => { const g = ns.filter(n => !n.pinned && n.when === k); if (g.length) out.push([t,g]); });
  return out;
}
function preview(n){ const b = bodyOf(n).find(x => x[0] !== 'img'); return b ? b[b.length-1] : ''; }
function searchHints(){
  if (!S.searching) return [];
  const h = [];
  if (on('job')) h.push('munka: Kovács');
  if (on('task')) h.push('teendő');
  if (on('site')) h.push('van fotó');
  if (on('tag')) h.push('#elosztó');

}

/* ---------------- snap-back comparison ---------------- */
function surfaceNow(){ return S.device === 'pc' ? pcHTML() : phoneInner(); }
function surfacePlain(){
  const keep = S.feats, keepSimple = S.simple;
  S.feats = Object.fromEntries(FEATS.map(f => [f.id, false])); S.simple = false;
  const h = surfaceNow();
  S.feats = keep; S.simple = keepSimple;
  return h;
}
function slotsInUse(){
  const n = note(S.noteId), used = [];
  if (chipsFor(n).length) used.push('S1/S2');
  if (on('sync')) used.push('S3');
  if (menuItems(n).length > 4) used.push('S4');
  if (insertItems().length > 3) used.push('S5');
  if (on('meas')) used.push('S6');
  if (folderList().length > 5) used.push('S7');
  if (on('job') || on('task') || on('site') || on('tag')) used.push('S8');
  return used;
}

function rulesHTML(){
  const l = L(), lg = S.lang;
  const lk = LOOKS[lg];
  return `<section>
    <div class="sect" style="margin-top:0"><h2>${esc(l.rulesH)}</h2><div class="rules">${RULES[lg].map(([id,t,d]) => `<div class="rule"><span class="id">${id}</span><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}</div></div>
    <div class="sect"><h2>${esc(l.slotsH)}</h2><div class="tbl"><table><thead><tr><th>#</th><th>${esc(l.th_slot)}</th><th>${esc(l.th_where)}</th><th>${esc(l.th_limit)}</th><th>${esc(l.th_ex)}</th></tr></thead><tbody>${SLOTS[lg].map(r => `<tr><td><code>${r[0]}</code></td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="sect"><h2>${esc(l.lookH)}</h2><div class="tbl"><table><thead><tr>${lk[0].map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${lk.slice(1).map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="sect"><h2>${esc(l.footH)}</h2><div class="tbl"><table><thead><tr><th>${esc(l.th_fp)}</th><th>${esc(l.th_mod)}</th><th>${esc(l.th_n)}</th></tr></thead><tbody>${FOOT.map(([k,t,m]) => { const ms = m.split(' '); return `<tr><td><b>${esc(t[lg])}</b></td><td><div class="foot">${ms.map(x => `<code>${x}</code>`).join('')}</div></td><td>${ms.length}</td></tr>`; }).join('')}<tr><td></td><td style="text-align:right"><b>Σ</b></td><td><b>${FOOT.reduce((a,f) => a + f[2].split(' ').length, 0)}</b></td></tr></tbody></table></div></div>
    <div class="sect"><h2>${esc(l.decH)}</h2><div class="tbl"><table><thead><tr><th>#</th><th>${esc(l.th_q)}</th><th>${esc(l.th_a)}</th><th>${esc(l.th_b)}</th></tr></thead><tbody>${DEC[lg].map(r => `<tr><td><code>${r[0]}</code></td><td>${esc(r[1])}</td><td><b>${esc(r[2])}</b></td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div></div>
    <p class="repo">${esc(l.repo)}<code>docs/notes/SIMPLE.md</code> · <code>docs/notes/SIMPLE.hu.md</code></p>
  </section>`;
}

function render(){
  renderHeader();
  const app = document.getElementById('app');
  const fid = document.activeElement && document.activeElement.id;
  const caret = fid && document.activeElement.selectionStart;
  if (S.view === 'rules') app.innerHTML = rulesHTML();
  else app.innerHTML = `<div class="grid">${controlsHTML()}${stageHTML()}${engineHTML()}</div>`;
  if (fid && (fid === 'q-phone' || fid === 'q-pc')){ const el = document.getElementById(fid); if (el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} } }
}

/* ---------------- interaction ---------------- */
let toastTimer = null;
function toast(msg){ S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2400); }
function openNew(type){
  const l = L(), id = 'x' + (++S.seq);
  const tpl = {
    t_note:[], t_survey:[['p','Helyszín:'],['c',false,'Elosztó'],['c',false,'Áramkörök'],['c',false,'Fotók']],
    t_meas:[['p','Áramkör — érték — határ — eredmény']], t_phone:[['p','Ki hívott:'],['p','Mit kér:']],
  }[type || 't_note'];
  NOTES.unshift({id, folder: S.folder in {munka:1,iroda:1,otlet:1} ? S.folder : 'munka', title: type && type !== 't_note' ? l[type] : l.newNote, when:'ma', time:clock(), date:'2026. november 11. ' + clock(), type: type === 't_survey' ? 'felmérés' : type === 't_meas' ? 'mérés' : undefined, body:tpl});
  S.noteId = id; S.screen = 'note'; S.sheet = null;
}
function act(el, ev){
  const a = el.dataset.act, l = L();
  switch (a){
    case 'view': S.view = el.dataset.v; try { location.hash = S.view; } catch(e){} break;
    case 'lang': S.lang = el.dataset.l; LS.set('fg.lang', S.lang); break;
    case 'simple': S.simple = !S.simple; S.sheet = null; S.drawer = false; break;
    case 'look': S.look = el.dataset.v; S.beh = S.look === 'ismeros' ? 'csendes' : 'kezi'; S.sheet = null; S.drawer = false; if (S.look === 'alap' && S.screen === 'folders') S.screen = 'list'; break;
    case 'beh': S.beh = el.dataset.v; break;
    case 'device': S.device = el.dataset.v; S.sheet = null; break;
    case 'feat': S.feats[el.dataset.f] = !S.feats[el.dataset.f]; break;
    case 'allon': FEATS.forEach(f => S.feats[f.id] = true); break;
    case 'alloff': FEATS.forEach(f => S.feats[f.id] = false); S.simple = false; S.sheet = null; if (['ma','todo'].includes(S.folder)) S.folder = 'all'; break;
    case 'folder': S.folder = el.dataset.f; S.drawer = false; S.screen = S.device === 'pc' ? S.screen : 'list'; S.search = ''; break;
    case 'tofolders': S.screen = 'folders'; S.searching = false; break;
    case 'tolist': S.screen = 'list'; S.sheet = null; break;
    case 'open': S.noteId = el.dataset.id; if (S.device === 'phone') S.screen = 'note'; S.sheet = null; break;
    case 'drawer': S.drawer = !S.drawer; break;
    case 'side': S.side = !S.side; break;
    case 'searchfocus': S.screen = 'list'; S.folder = 'all'; S.searching = true; break;
    case 'hint': S.search = el.dataset.h; S.searching = true; break;
    case 'tick': { const n = note(S.noteId), b = bodyOf(n)[+el.dataset.i]; if (b && b[0] === 'c') b[1] = !b[1]; break; }
    case 'pin': { const n = note(S.noteId); n.pinned = !n.pinned; S.sheet = null; break; }
    case 'sheet': S.sheet = el.dataset.s; break;
    case 'menuall': S.sheet = 'menuall'; break;
    case 'closesheet': if (ev.target.closest('[data-stop]') && el.classList.contains('sheetwrap')) return false; S.sheet = null; break;
    case 'accept': S.accepted[el.dataset.k] = true; toast(l.toastAccepted); break;
    case 'undo': undo(+el.dataset.n); break;
    case 'report': S.sheet = null; toast(l.toastReport); break;
    case 'visit': S.sheet = 'visit'; break;
    case 'lock': S.sheet = null; toast(l.toastLock); break;
    case 'airun': S.done.ai = true; S.fired.ai1 = true; S.log.unshift({ev:EV.find(e => e.id === 'ai1'), at:clock(), undone:false, n:++S.seq}); S.sheet = null; break;
    case 'elog': S.sheet = 'elog'; break;
    case 'inserted': S.sheet = null; toast(l.toastInsert); break;
    case 'photo': toast(l.toastPhoto); break;
    case 'newtype': openNew(el.dataset.t); break;
    case 'new': openNew(); break;
    case 'toast': S.sheet = null; toast(l.toastGeneric); break;
    default: return false;
  }
  return true;
}
document.addEventListener('click', ev => {
  if (holdFired){ holdFired = false; ev.preventDefault(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.disabled) return;
  if (el.classList.contains('sheetwrap') && ev.target.closest('[data-stop]') && !ev.target.closest('[data-act]:not(.sheetwrap)')) return;
  if (act(el, ev) !== false){ runEngine(); render(); }
});
document.addEventListener('input', ev => {
  if (ev.target.dataset && ev.target.dataset.act === 'q'){ S.search = ev.target.value; S.searching = true; render(); }
});
document.addEventListener('focusin', ev => {
  if (ev.target.dataset && ev.target.dataset.act === 'q' && !S.searching){ S.searching = true; render(); }
});
/* long press on New = note types (S6), only when Note types are on */
let holdTimer = null, holdFired = false;
document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('[data-hold]'); if (!el) return;
  holdTimer = setTimeout(() => { if (on('meas')){ holdFired = true; S.sheet = 'hold'; render(); } }, 480);
});
['pointerup','pointercancel','pointerleave'].forEach(t => document.addEventListener(t, () => clearTimeout(holdTimer), true));
document.addEventListener('contextmenu', ev => { if (ev.target.closest('[data-hold]')) ev.preventDefault(); });
window.addEventListener('hashchange', () => { S.view = location.hash === '#rules' ? 'rules' : 'proto'; render(); });
if (location.hash === '#rules') S.view = 'rules';
render();
</script>
