<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Wire Detectives</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b33; --panel2:#1b2442; --line:#2a355e;
    --ink:#eef2ff; --mute:#9aa6cc; --cold:#3b82f6; --warm:#22c55e; --hot:#f59e0b; --found:#ef4444;
    --accent:#facc15;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 28px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#fb923c);display:grid;place-items:center;font-size:22px;color:#111;font-weight:900}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .sub{font-size:12px;color:var(--mute)}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--mute);padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--panel2);color:var(--ink)}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:10px;font-weight:700;font-size:15px;cursor:pointer}
  .tab.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .warn{background:#2a1a0a;border:1px solid #7c4a12;color:#fde7c4;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35;margin-bottom:12px}
  .warn b{color:#fff}
  .gaugeBox{position:relative;display:grid;place-items:center}
  canvas{display:block;width:100%}
  #gauge{max-width:340px;aspect-ratio:1/1}
  .gaugeText{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
  .big{font-size:52px;font-weight:900;line-height:1}
  .word{font-size:24px;font-weight:800;margin-top:6px}
  .small{font-size:12px;color:var(--mute)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{flex:1;min-width:120px;border:0;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:800;cursor:pointer;background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}
  .btn:disabled{opacity:.45}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{background:var(--panel2);border-radius:12px;padding:8px;text-align:center}
  .stat .v{font-size:20px;font-weight:800}
  .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:90px;margin-top:6px}
  .bar{background:var(--panel2);border-radius:8px 8px 4px 4px;position:relative;height:100%;overflow:hidden}
  .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:8px 8px 4px 4px;transition:height .12s}
  .barLbl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:11px;color:var(--mute);margin-top:4px}
  h2{font-size:14px;margin:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;max-width:100%}
  label.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;font-size:14px}
  #wall{touch-action:none;border-radius:12px;aspect-ratio:4/3;background:#d9d4c7;cursor:crosshair}
  .hidden{display:none!important}
  .msg{font-size:14px;line-height:1.4;color:var(--mute)}
  .err{color:#fca5a5}
  .calbar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:8px}
  .calbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
  footer{font-size:11px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.4}
  #qrBox{display:grid;place-items:center;background:#fff;border-radius:12px;padding:12px;margin-top:8px}
  #qrBox img,#qrBox canvas{width:220px;height:220px;image-rendering:pixelated}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <div><h1 data-t="title"></h1><div class="sub" data-t="tagline"></div></div>
    </div>
    <div class="seg" id="lang"><button data-l="hu">HU</button><button data-l="en">EN</button></div>
  </header>

  <div class="warn" data-t="warn" data-html></div>

  <div class="tabs">
    <button class="tab on" id="tabLive" data-t="tabLive"></button>
    <button class="tab" id="tabDemo" data-t="tabDemo"></button>
  </div>

  <!-- LIVE MODE -->
  <section id="live">
    <div class="card" id="startCard">
      <p class="msg" data-t="startMsg"></p>
      <div class="row"><button class="btn primary" id="startBtn" data-t="start"></button></div>
      <p class="msg err hidden" id="micErr"></p>
    </div>

    <div class="card hidden" id="calCard">
      <h2 data-t="calTitle"></h2>
      <p class="msg" data-t="calMsg"></p>
      <div class="row"><button class="btn primary" id="calBtn" data-t="calibrate"></button></div>
      <div class="calbar"><i id="calProg"></i></div>
    </div>
  </section>

  <!-- DEMO MODE -->
  <section id="demo" class="hidden">
    <div class="card">
      <h2 data-t="demoTitle"></h2>
      <p class="msg" data-t="demoMsg"></p>
      <canvas id="wall"></canvas>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="revealBtn" data-t="reveal"></button>
        <button class="btn" id="newWallBtn" data-t="newWall"></button>
      </div>
    </div>
  </section>

  <!-- SHARED DASHBOARD -->
  <section id="dash" class="hidden">
    <div class="card">
      <div class="gaugeBox">
        <canvas id="gauge"></canvas>
        <div class="gaugeText"><div><div class="big" id="pct">0</div><div class="word" id="word">–</div><div class="small" data-t="strength"></div></div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="v" id="best">0</div><div class="small" data-t="best"></div></div>
        <div class="stat"><div class="v" id="db">0</div><div class="small">dB</div></div>
        <div class="stat"><div class="v" id="hz">50</div><div class="small">Hz</div></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="soundBtn"></button>
        <button class="btn" id="resetBtn" data-t="reset"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-t="history"></h2>
      <canvas id="hist" style="height:110px"></canvas>
    </div>

    <div class="card">
      <h2 data-t="finger"></h2>
      <div class="bars" id="bars"></div>
      <div class="barLbl" id="barLbl"></div>
      <p class="small" data-t="fingerMsg" style="margin:8px 0 0"></p>
    </div>
  </section>

  <div class="card">
    <h2 data-t="settings"></h2>
    <label class="opt"><span data-t="mains"></span>
      <span class="seg" id="mainsSeg"><button data-f="50" class="on">50 Hz</button><button data-f="60">60 Hz</button></span></label>
    <label class="opt hidden" id="devRow"><span data-t="input"></span><select id="devSel"></select></label>
    <label class="opt"><span data-t="vibrate"></span><input type="checkbox" id="vibChk" checked></label>
    <div class="row" style="margin-top:6px"><button class="btn" id="recalBtn" data-t="recal" disabled></button><button class="btn" id="qrBtn" data-t="qr"></button></div>
    <div id="qrBox" class="hidden"></div>
    <p class="small hidden" id="qrUrl" style="word-break:break-all;text-align:center"></p>
  </div>

  <footer data-t="footer"></footer>
</div>

<script>
/* ---------------- i18n ---------------- */
const T = {
  hu:{
    title:"Vezetékvadászok", tagline:"Keresd meg a falban rejtőző vezetéket!",
    warn:"<b>Ez egy tanulójáték, nem feszültségmérő!</b> A csend NEM jelenti, hogy nincs áram. Ne érj konnektorhoz, kapcsolóhoz vagy vezetékhez – a szondát csak közelíts a falhoz.",
    tabLive:"Szondával", tabDemo:"Gyakorló mód",
    startMsg:"Dugd be a Vezetékvadász-szondát a telefonba, aztán nyomd meg az Indítás gombot. A telefon engedélyt kér a mikrofonhoz – ez a szonda bemenete. Semmit nem veszünk fel és nem küldünk el.",
    start:"Indítás", calTitle:"Kalibrálás", calMsg:"Tartsd a szondát a levegőben, legalább egy lépésre a faltól és a vezetékektől, 3 másodpercig.",
    calibrate:"Kalibrálás (3 mp)", calibrating:"Mérés…",
    strength:"jelerősség", best:"legjobb", reset:"Legjobb nullázása",
    soundOn:"🔊 Hang: be", soundOff:"🔇 Hang: ki",
    history:"Utolsó 10 másodperc", finger:"Zúgás-ujjlenyomat", fingerMsg:"Az elektromos hálózat 50 Hz-en „zúg”. Ha a vezeték közel van, ezek az oszlopok együtt nőnek.",
    settings:"Beállítások", mains:"Hálózati frekvencia", input:"Bemenet", vibrate:"Rezgés, ha forró", recal:"Újrakalibrálás", qr:"QR-kód a gyerekeknek",
    demoTitle:"Gyakorló fal", demoMsg:"Húzd az ujjad a falon, és figyeld a mérőt! Hol bújik a vezeték?",
    reveal:"Mutasd a vezetéket", hide:"Rejtsd el", newWall:"Új fal",
    lv:["Hideg","Langyos","Meleg","Forró – megvan!"], waiting:"–",
    micErr:"Nem érem el a bemenetet. Engedélyezd a mikrofont a böngészőben (HTTPS oldalon), vagy próbáld a Gyakorló módot.",
    footer:"Vezetékvadászok · tanulójáték tábori foglalkozáshoz · nem mérőműszer, nem helyettesíti a kétpólusú feszültségvizsgálót · nem rögzít és nem küld adatot"
  },
  en:{
    title:"Wire Detectives", tagline:"Find the wire hiding in the wall!",
    warn:"<b>This is a learning toy, not a voltage tester!</b> Quiet does NOT mean there is no electricity. Never touch sockets, switches or wires – only bring the probe near the wall.",
    tabLive:"With probe", tabDemo:"Practice mode",
    startMsg:"Plug the Wire Detective probe into the phone, then press Start. The phone will ask for microphone access – that is the probe's input. Nothing is recorded or sent anywhere.",
    start:"Start", calTitle:"Calibrate", calMsg:"Hold the probe in the air, at least one step away from walls and cables, for 3 seconds.",
    calibrate:"Calibrate (3 s)", calibrating:"Measuring…",
    strength:"signal strength", best:"best", reset:"Reset best",
    soundOn:"🔊 Sound: on", soundOff:"🔇 Sound: off",
    history:"Last 10 seconds", finger:"Hum fingerprint", fingerMsg:"Mains electricity hums at 50 Hz. When a live wire is close, these bars grow together.",
    settings:"Settings", mains:"Mains frequency", input:"Input", vibrate:"Vibrate when hot", recal:"Recalibrate", qr:"QR code for the kids",
    demoTitle:"Practice wall", demoMsg:"Slide your finger over the wall and watch the meter. Where is the wire hiding?",
    reveal:"Show the wire", hide:"Hide it", newWall:"New wall",
    lv:["Cold","Warm","Hot","Very hot – found it!"], waiting:"–",
    micErr:"Can't reach the input. Allow the microphone in the browser (the page must be on HTTPS), or try Practice mode.",
    footer:"Wire Detectives · camp learning toy · not a measuring instrument and no substitute for a two-pole voltage tester · records and sends no data"
  }
};
let lang = 'hu';
const sysLang = (navigator.language||'').toLowerCase().startsWith('hu') ? 'hu' : 'en';
try{ lang = localStorage.getItem('wd-lang') || sysLang; }catch(e){ lang = sysLang; }
function t(k){ return T[lang][k]; }
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = t(el.dataset.t); if(v==null) return;
    if(el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  $('revealBtn').textContent = demo.reveal ? t('hide') : t('reveal');
  updateSoundBtn();
  if(state.word>=0) $('word').textContent = t('lv')[state.word];
  drawBarLabels();
}
const $ = id => document.getElementById(id);
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.l; try{localStorage.setItem('wd-lang',lang)}catch(e){} applyLang(); });

/* ---------------- shared state ---------------- */
const state = { mains:50, level:0, db:0, best:0, word:-1, harm:[0,0,0,0,0], hist:[], sound:true, vib:true, source:null };
const HARM = [1,2,3,4,5];       // multiples of mains frequency shown as fingerprint
const DB_FULL = 30;             // dB above baseline that fills the meter
const LEVELS = [8, 16, 24];     // dB thresholds: cold | warm | hot | found
const COLORS = ['#3b82f6','#22c55e','#f59e0b','#ef4444'];

document.querySelectorAll('#mainsSeg button').forEach(b=>b.onclick=(e)=>{
  e.preventDefault();
  state.mains = +b.dataset.f;
  document.querySelectorAll('#mainsSeg button').forEach(x=>x.classList.toggle('on', x===b));
  $('hz').textContent = state.mains; drawBarLabels();
  if(audio.ctx) startCalibration();
});
$('vibChk').onchange = e => state.vib = e.target.checked;

/* ---------------- tabs ---------------- */
function showTab(which){
  $('tabLive').classList.toggle('on', which==='live');
  $('tabDemo').classList.toggle('on', which==='demo');
  $('live').classList.toggle('hidden', which!=='live');
  $('demo').classList.toggle('hidden', which!=='demo');
  state.source = which;
  if(which==='demo'){ $('dash').classList.remove('hidden'); demo.ensure(); }
  else { $('dash').classList.toggle('hidden', !audio.calibrated); }
  resetBest(); state.hist = []; state.db = 0;
}
$('tabLive').onclick = ()=>showTab('live');
$('tabDemo').onclick = ()=>showTab('demo');

/* ---------------- audio input ---------------- */
const audio = { ctx:null, stream:null, analyser:null, buf:null, win:null, baseline:null, calibrated:false, calibrating:false, calSamples:[] };

async function startAudio(deviceId){
  $('micErr').classList.add('hidden');
  try{
    if(audio.stream) audio.stream.getTracks().forEach(tr=>tr.stop());
    const constraints = { audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1 } };
    if(deviceId) constraints.audio.deviceId = { exact: deviceId };
    audio.stream = await navigator.mediaDevices.getUserMedia(constraints);
    if(!audio.ctx) audio.ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(audio.ctx.state==='suspended') await audio.ctx.resume();
    const src = audio.ctx.createMediaStreamSource(audio.stream);
    audio.analyser = audio.ctx.createAnalyser();
    audio.analyser.fftSize = 8192;          // ~170 ms at 48 kHz: resolves 50 Hz well
    audio.analyser.smoothingTimeConstant = 0;
    src.connect(audio.analyser);            // NOT connected to the speakers
    audio.buf = new Float32Array(audio.analyser.fftSize);
    audio.win = new Float32Array(audio.analyser.fftSize);
    for(let i=0;i<audio.win.length;i++) audio.win[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(audio.win.length-1));
    await listDevices();
    $('startCard').classList.add('hidden');
    $('calCard').classList.remove('hidden');
    $('recalBtn').disabled = false;
  }catch(err){
    $('micErr').textContent = t('micErr') + ' (' + (err && err.name || err) + ')';
    $('micErr').classList.remove('hidden');
  }
}
async function listDevices(){
  try{
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
    const sel = $('devSel'); sel.innerHTML='';
    const cur = audio.stream.getAudioTracks()[0].getSettings().deviceId;
    devs.forEach((d,i)=>{ const o=document.createElement('option'); o.value=d.deviceId; o.textContent=d.label||('Input '+(i+1)); if(d.deviceId===cur) o.selected=true; sel.appendChild(o); });
    $('devRow').classList.toggle('hidden', devs.length<2);
  }catch(e){}
}
$('devSel').onchange = e => { audio.calibrated=false; startAudio(e.target.value).then(()=>{}); };
$('startBtn').onclick = ()=>{ unlockOut(); startAudio(); };
$('calBtn').onclick = ()=>startCalibration();
$('recalBtn').onclick = ()=>{ if(audio.ctx){ $('calCard').classList.remove('hidden'); startCalibration(); } };

function goertzel(buf, f, sr){
  const w = 2*Math.PI*f/sr, k = 2*Math.cos(w);
  let s1=0, s2=0;
  for(let i=0;i<buf.length;i++){ const s = buf[i] + k*s1 - s2; s2 = s1; s1 = s; }
  return (s1*s1 + s2*s2 - k*s1*s2) / (buf.length*buf.length);
}
function measure(){
  audio.analyser.getFloatTimeDomainData(audio.buf);
  const b = audio.buf, w = audio.win, x = new Float32Array(b.length);
  let mean=0; for(let i=0;i<b.length;i++) mean+=b[i]; mean/=b.length;
  for(let i=0;i<b.length;i++) x[i]=(b[i]-mean)*w[i];
  const sr = audio.ctx.sampleRate;
  const harm = HARM.map(h=>goertzel(x, state.mains*h, sr));
  // odd harmonics dominate an E-field pickup; weight the fundamental most
  const hum = harm[0] + 0.5*harm[2] + 0.35*harm[4] + 0.25*harm[1];
  return { hum, harm };
}
function startCalibration(){
  audio.calibrating = true; audio.calibrated = false; audio.calSamples = [];
  $('calBtn').disabled = true; $('calBtn').textContent = t('calibrating');
  const t0 = performance.now();
  const step = ()=>{
    const p = Math.min(1,(performance.now()-t0)/3000);
    $('calProg').style.width = (p*100)+'%';
    audio.calSamples.push(measure());
    if(p<1) return requestAnimationFrame(step);
    const hs = audio.calSamples.map(s=>s.hum).sort((a,b)=>a-b);
    audio.baseline = Math.max(hs[Math.floor(hs.length*0.75)], 1e-14);
    audio.harmBase = HARM.map((_,i)=>{ const v=audio.calSamples.map(s=>s.harm[i]).sort((a,b)=>a-b); return Math.max(v[Math.floor(v.length*0.75)],1e-14); });
    audio.calibrating=false; audio.calibrated=true;
    $('calBtn').disabled=false; $('calBtn').textContent=t('calibrate');
    $('calCard').classList.add('hidden');
    if(state.source==='live') $('dash').classList.remove('hidden');
    resetBest();
  };
  requestAnimationFrame(step);
}
function liveReading(){
  const m = measure();
  const db = 10*Math.log10(m.hum/audio.baseline);
  const harm = m.harm.map((v,i)=>Math.max(0,Math.min(1,(10*Math.log10(v/audio.harmBase[i]))/DB_FULL)));
  return { db, harm };
}

/* ---------------- practice (demo) wall ---------------- */
const demo = {
  canvas:$('wall'), ctx:null, path:[], reveal:false, finger:null, made:false,
  ensure(){ if(!this.made){ this.made=true; this.newWall(); this.bind(); } this.draw(); },
  newWall(){
    const shapes = [
      [[0.0,0.25],[0.55,0.25],[0.55,1.0]],
      [[0.2,0.0],[0.2,0.6],[0.8,0.6],[0.8,1.0]],
      [[0.0,0.15],[1.0,0.15]],
      [[0.7,0.0],[0.7,0.45],[0.15,0.45],[0.15,1.0]],
      [[0.0,0.8],[0.4,0.8],[0.4,0.3],[1.0,0.3]]
    ];
    let next; do{ next = shapes[Math.floor(Math.random()*shapes.length)]; }while(next===this.path && shapes.length>1);
    this.path = next; this.reveal=false; $('revealBtn').textContent=t('reveal'); resetBest(); this.draw();
  },
  size(){ const c=this.canvas, r=c.getBoundingClientRect(), d=window.devicePixelRatio||1; c.width=r.width*d; c.height=r.width*0.75*d; this.ctx=c.getContext('2d'); this.ctx.setTransform(d,0,0,d,0,0); this.w=r.width; this.h=r.width*0.75; },
  bind(){
    const c=this.canvas;
    const pos = e => { const r=c.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
    c.addEventListener('pointerdown', e=>{ unlockOut(); c.setPointerCapture(e.pointerId); this.finger=pos(e); this.draw(); });
    c.addEventListener('pointermove', e=>{ if(e.pointerType==='mouse' || this.finger){ this.finger=pos(e); this.draw(); } });
    c.addEventListener('pointerup', ()=>{ this.finger=null; this.draw(); });
    c.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse'){ this.finger=null; this.draw(); } });
    window.addEventListener('resize', ()=>this.draw());
  },
  dist(p){ // distance in "cm" on a 120 x 90 cm wall
    let best=1e9; const W=120, H=90;
    for(let i=0;i<this.path.length-1;i++){
      const a=this.path[i], b=this.path[i+1];
      const ax=a[0]*W, ay=a[1]*H, bx=b[0]*W, by=b[1]*H, px=p[0]*W, py=p[1]*H;
      const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
      let u = L? ((px-ax)*dx+(py-ay)*dy)/L : 0; u=Math.max(0,Math.min(1,u));
      const qx=ax+u*dx, qy=ay+u*dy; best=Math.min(best, Math.hypot(px-qx,py-qy));
    }
    return best;
  },
  reading(){
    if(!this.finger) return { db: Math.random()*1.5, harm:[0,0,0,0,0].map(()=>Math.random()*0.05) };
    const d = this.dist(this.finger);
    const db = 32*Math.exp(-d/9) + Math.random()*1.5;
    const k = Math.max(0,Math.min(1,db/DB_FULL));
    return { db, harm:[k, k*0.35, k*0.7, k*0.25, k*0.55].map(v=>Math.max(0,Math.min(1,v+(Math.random()-0.5)*0.06))) };
  },
  draw(){
    if(!this.made) return; this.size(); const g=this.ctx, W=this.w, H=this.h;
    g.fillStyle='#e7e2d6'; g.fillRect(0,0,W,H);
    // plaster texture
    for(let i=0;i<220;i++){ g.fillStyle='rgba(0,0,0,'+(0.025+((i*37)%7)/300)+')'; const x=((i*97)%1000)/1000*W, y=((i*61)%1000)/1000*H; g.fillRect(x,y,2,2); }
    // socket + switch as visual hints (no-go zones)
    const box=(x,y,label)=>{ g.fillStyle='#fff'; g.strokeStyle='#999'; g.lineWidth=1.5; g.beginPath(); g.roundRect? g.roundRect(x*W-14,y*H-14,28,28,5): g.rect(x*W-14,y*H-14,28,28); g.fill(); g.stroke(); g.fillStyle='#777'; g.font='10px system-ui'; g.textAlign='center'; g.fillText(label,x*W,y*H+4); };
    const ends=[this.path[0], this.path[this.path.length-1]];
    ends.forEach((p,i)=>{ const x=Math.min(0.92,Math.max(0.08,p[0])), y=Math.min(0.9,Math.max(0.1,p[1])); box(x,y,i? '⏻':'⚡'); });
    if(this.reveal){
      g.strokeStyle='rgba(239,68,68,.85)'; g.lineWidth=6; g.lineCap='round'; g.lineJoin='round'; g.setLineDash([]);
      g.beginPath(); this.path.forEach((p,i)=> i? g.lineTo(p[0]*W,p[1]*H) : g.moveTo(p[0]*W,p[1]*H)); g.stroke();
    }
    if(this.finger){
      const r = demo.reading(); const lv = levelOf(r.db);
      g.strokeStyle=COLORS[lv]; g.lineWidth=4; g.beginPath(); g.arc(this.finger[0]*W,this.finger[1]*H,18,0,Math.PI*2); g.stroke();
      g.fillStyle=COLORS[lv]; g.beginPath(); g.arc(this.finger[0]*W,this.finger[1]*H,5,0,Math.PI*2); g.fill();
    }
  }
};
$('revealBtn').onclick = ()=>{ demo.reveal=!demo.reveal; $('revealBtn').textContent = demo.reveal? t('hide'):t('reveal'); demo.draw(); };
$('newWallBtn').onclick = ()=>demo.newWall();

/* ---------------- feedback: sound + vibration ---------------- */
let outCtx=null, nextBeep=0;
function unlockOut(){ try{ if(!outCtx) outCtx = audio.ctx || new (window.AudioContext||window.webkitAudioContext)(); if(outCtx.state==='suspended') outCtx.resume(); }catch(e){} }
function beep(freq, dur){
  const c = audio.ctx || outCtx; if(!c || !state.sound) return;
  const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=freq;
  const t0=c.currentTime; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.25,t0+0.01); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function feedback(level){
  const now = performance.now(); if(now < nextBeep) return;
  const k = Math.max(0,Math.min(1,level));
  if(k < 0.12){ nextBeep = now + 400; return; }      // silent when cold
  const interval = 900 - 820*k;                      // faster beeps when closer
  beep(420 + 900*k, 0.06);
  if(state.vib && k>=LEVELS[2]/DB_FULL && navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
  nextBeep = now + interval;
}
function updateSoundBtn(){ $('soundBtn').textContent = state.sound ? t('soundOn') : t('soundOff'); }
$('soundBtn').onclick = ()=>{ unlockOut(); state.sound=!state.sound; updateSoundBtn(); };
function resetBest(){ state.best=0; $('best').textContent='0'; }
$('resetBtn').onclick = resetBest;

/* ---------------- drawing ---------------- */
function levelOf(db){ return db>=LEVELS[2]?3: db>=LEVELS[1]?2: db>=LEVELS[0]?1:0; }
function sizeCanvas(c, hCss){ const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1; const h = hCss || r.width; if(c.width!==Math.round(r.width*d) || c.height!==Math.round(h*d)){ c.width=Math.round(r.width*d); c.height=Math.round(h*d); } const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0); return [g, r.width, h]; }
function drawGauge(){
  const [g,W,H] = sizeCanvas($('gauge'));
  g.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, R=W*0.42, a0=Math.PI*0.75, a1=Math.PI*2.25;
  g.lineCap='round';
  g.lineWidth=W*0.075; g.strokeStyle='#1f2a4d'; g.beginPath(); g.arc(cx,cy,R,a0,a1); g.stroke();
  // coloured zones
  const zones=[0,LEVELS[0],LEVELS[1],LEVELS[2],DB_FULL];
  for(let i=0;i<4;i++){ g.strokeStyle=COLORS[i]+'40'; g.beginPath(); g.arc(cx,cy,R+W*0.06, a0+(a1-a0)*zones[i]/DB_FULL, a0+(a1-a0)*zones[i+1]/DB_FULL); g.lineWidth=W*0.015; g.stroke(); }
  g.lineWidth=W*0.075;
  const lv = state.word<0?0:state.word;
  g.strokeStyle=COLORS[lv]; g.shadowColor=COLORS[lv]; g.shadowBlur=W*0.05;
  g.beginPath(); g.arc(cx,cy,R,a0,a0+(a1-a0)*Math.max(0.005,state.level)); g.stroke(); g.shadowBlur=0;
  // best marker
  const ab=a0+(a1-a0)*state.best/100; g.strokeStyle='#facc15'; g.lineWidth=3;
  g.beginPath(); g.moveTo(cx+Math.cos(ab)*(R-W*0.06),cy+Math.sin(ab)*(R-W*0.06)); g.lineTo(cx+Math.cos(ab)*(R+W*0.06),cy+Math.sin(ab)*(R+W*0.06)); g.stroke();
}
function drawHist(){
  const c=$('hist'); const [g,W,H]=sizeCanvas(c,110);
  g.clearRect(0,0,W,H);
  [LEVELS[0],LEVELS[1],LEVELS[2]].forEach((v,i)=>{ const y=H-(v/DB_FULL)*H; g.strokeStyle=COLORS[i+1]+'55'; g.lineWidth=1; g.setLineDash([4,4]); g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); });
  g.setLineDash([]);
  const n = state.hist.length; if(n<2) return;
  g.lineWidth=2.5; g.lineJoin='round';
  for(let i=1;i<n;i++){
    const x0=W*(i-1)/(600-1), x1=W*i/(600-1);
    const v0=state.hist[i-1], v1=state.hist[i];
    g.strokeStyle=COLORS[levelOf(v1*DB_FULL)];
    g.beginPath(); g.moveTo(x0+W*(600-n)/(600-1),H-v0*H); g.lineTo(x1+W*(600-n)/(600-1),H-v1*H); g.stroke();
  }
}
function drawBarLabels(){
  const bars=$('bars'), lbl=$('barLbl');
  if(!bars.children.length) HARM.forEach(()=>{ const d=document.createElement('div'); d.className='bar'; d.innerHTML='<i></i>'; bars.appendChild(d); });
  lbl.innerHTML = HARM.map(h=>'<div>'+(state.mains*h)+' Hz</div>').join('');
}
function drawBars(){ [...$('bars').children].forEach((b,i)=>{ b.firstChild.style.height = (state.harm[i]*100).toFixed(0)+'%'; b.firstChild.style.background = COLORS[levelOf(state.harm[i]*DB_FULL)]; }); }

/* ---------------- main loop ---------------- */
let lastHist=0;
function loop(now){
  let r = null;
  if(state.source==='live' && audio.calibrated && !audio.calibrating) r = liveReading();
  else if(state.source==='demo') r = demo.reading();
  if(r){
    const db = Math.max(0, r.db);
    state.db = state.db*0.7 + db*0.3;                       // smoothing
    state.level = Math.max(0, Math.min(1, state.db/DB_FULL));
    state.harm = state.harm.map((v,i)=>v*0.6 + r.harm[i]*0.4);
    const pct = Math.round(state.level*100);
    if(pct>state.best){ state.best=pct; $('best').textContent=pct; }
    state.word = levelOf(state.db);
    $('pct').textContent = pct;
    $('pct').style.color = COLORS[state.word];
    $('word').textContent = t('lv')[state.word];
    $('word').style.color = COLORS[state.word];
    $('db').textContent = state.db.toFixed(0);
    if(now-lastHist>16){ state.hist.push(state.level); if(state.hist.length>600) state.hist.shift(); lastHist=now; }
    feedback(state.level);
    drawGauge(); drawHist(); drawBars();
    if(state.source==='demo' && demo.finger) {} // demo draws on pointer events
  }
  requestAnimationFrame(loop);
}

/* ---------------- QR code for kids' phones ---------------- */
$('qrBtn').onclick = ()=>{
  const box=$('qrBox'), url=location.href.split('#')[0];
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); $('qrUrl').classList.add('hidden'); return; }
  box.classList.remove('hidden'); $('qrUrl').classList.remove('hidden'); $('qrUrl').textContent=url;
  if(window.qrcode){ const q=qrcode(0,'M'); q.addData(url); q.make(); box.innerHTML=q.createImgTag(6,8); }
  else box.textContent = url;
};

/* ---------------- boot ---------------- */
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('startBtn').disabled=true; $('micErr').textContent=t('micErr'); setTimeout(()=>{ $('micErr').textContent=t('micErr'); $('micErr').classList.remove('hidden'); },0); }
drawBarLabels();
applyLang();
showTab('live');
drawGauge();
requestAnimationFrame(loop);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" async></script>
