<title>VRG Szerver Kalauz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the control desk for the VRG ServerKit in the Mélyvíz look of the manual. Top: what to do now,
   then the six pieces of hardware with their live state, then the four phases as ticked steps.
   Each step names the device it happens on; buttons start things when the page runs from the stick. */
:root {
  --bg: #0a141c; --horizon: #11202b; --panel: #121c24; --raised: #17232c; --term: #071017;
  --line: rgba(232,240,246,.13); --line-strong: rgba(232,240,246,.30);
  --text: #e8f0f6; --dim: #a6afb7; --faint: #6c757c;
  --accent: #93d3e6; --accent-soft: rgba(147,211,230,.12); --on-accent: #08141a;
  --warm: #e8a873; --warm-soft: rgba(232,168,115,.13);
  --ok: #8bcca1; --ok-soft: rgba(139,204,161,.12); --crit: #e4877d; --crit-soft: rgba(228,135,125,.12);
  --d-bl: #93d3e6; --d-srv: #e8a873; --d-hs: #d8c27a; --d-is: #c3a6e6; --d-ph: #8bcca1; --d-tab: #9fb5e8; --d-rt: #c7a0b8;
  --qr-bg: #ffffff;
  --cut: 7px;
  --voice: Bahnschrift, "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef3f6; --horizon: #e2eaef; --panel: #f8fbfc; --raised: #ffffff; --term: #e6edf1;
  --line: rgba(14,32,43,.12); --line-strong: rgba(14,32,43,.28);
  --text: #0e1a22; --dim: #475660; --faint: #7d8a93;
  --accent: #1f6f87; --accent-soft: rgba(31,111,135,.09); --on-accent: #ffffff;
  --warm: #a5582a; --warm-soft: rgba(165,88,42,.09);
  --ok: #2f7d4c; --ok-soft: rgba(47,125,76,.09); --crit: #b0433a; --crit-soft: rgba(176,67,58,.09);
  --d-bl: #1f6f87; --d-srv: #a5582a; --d-hs: #86701c; --d-is: #6a4a9a; --d-ph: #2f7d4c; --d-tab: #3f58a0; --d-rt: #8a4a6e;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef3f6; --horizon: #e2eaef; --panel: #f8fbfc; --raised: #ffffff; --term: #e6edf1;
  --line: rgba(14,32,43,.12); --line-strong: rgba(14,32,43,.28);
  --text: #0e1a22; --dim: #475660; --faint: #7d8a93;
  --accent: #1f6f87; --accent-soft: rgba(31,111,135,.09); --on-accent: #ffffff;
  --warm: #a5582a; --warm-soft: rgba(165,88,42,.09);
  --ok: #2f7d4c; --ok-soft: rgba(47,125,76,.09); --crit: #b0433a; --crit-soft: rgba(176,67,58,.09);
  --d-bl: #1f6f87; --d-srv: #a5582a; --d-hs: #86701c; --d-is: #6a4a9a; --d-ph: #2f7d4c; --d-tab: #3f58a0; --d-rt: #8a4a6e;
  color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--voice); font-weight: 600; letter-spacing: .02em; text-wrap: balance; margin: 0; }
code { font-family: var(--mono); font-size: .86em; background: var(--horizon); padding: 1px 4px; }
button, input { font: inherit; color: var(--text); border-radius: 0; }
button { cursor: pointer; background: var(--panel); border: 1px solid var(--line-strong); padding: 5px 11px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { cursor: not-allowed; color: var(--faint); border-style: dashed; }
button.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.go:disabled { background: transparent; color: var(--faint); border-color: var(--line-strong); font-weight: 500; }
button.risk { border-color: var(--crit); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text] { background: var(--raised); border: 1px solid var(--line-strong); padding: 6px 9px; width: 100%; font-family: var(--mono); font-size: 13.5px; }
input[type=text]:focus { outline: none; border-color: var(--accent); }
input[type=checkbox] { accent-color: var(--ok); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .35; } }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 23px; }
.mode { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border: 1px solid currentColor; white-space: nowrap; }
.mode.m-local { color: var(--ok); } .mode.m-mirror { color: var(--d-tab); } .mode.m-shared, .mode.m-plain { color: var(--dim); } .mode.m-lost { color: var(--crit); }
.prog { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.prog .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.prog .bar { width: 140px; height: 8px; background: var(--horizon); }
.prog .bar span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.lang { display: flex; }
.lang button { font-family: var(--mono); font-size: 12.5px; padding: 3px 10px; background: transparent; color: var(--dim); }
.lang button + button { border-left: 0; }
.lang button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
@media (max-width: 640px) {
  .brand { flex: 1 1 0; } .brand h1 { font-size: 20px; }
  .lang { order: 1; } .prog { order: 2; margin-left: 0; width: 100%; }
}

.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; padding-block: 20px 70px; align-items: start; }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 1px; }
nav.rail a { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; text-decoration: none; color: var(--dim); padding: 6px 8px; border-left: 2px solid transparent; font-size: 14px; }
nav.rail a:hover { color: var(--text); background: var(--accent-soft); }
nav.rail a.cur { color: var(--text); border-left-color: var(--accent); background: var(--accent-soft); }
nav.rail a.done { color: var(--ok); }
nav.rail .pn, nav.rail .pc { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  nav.rail { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav.rail a { grid-template-columns: auto auto; border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; padding: 5px 9px; }
  nav.rail a .pt { display: none; } nav.rail a.cur { border-bottom-color: var(--accent); }
  .prog .bar { width: 80px; }
}

.banner { border-left: 2px solid var(--accent); background: var(--accent-soft); padding: 9px 13px; font-size: 14px; margin-bottom: 18px; max-width: 92ch; }
.banner.lost { border-left-color: var(--crit); background: var(--crit-soft); }
.banner b { font-weight: 600; }

/* what to do now */
.now { background: var(--panel); border: 1px solid var(--accent); padding: 14px 18px 16px; margin-bottom: 26px;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.now .label { color: var(--accent); }
.now h2 { font-size: 26px; margin: 2px 0 6px; }
.now .txt { max-width: 78ch; color: var(--text); }
.now .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.now .live { margin-top: 8px; }
.now.fin { border-color: var(--ok); } .now.fin .label { color: var(--ok); }

/* the six devices */
.devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-bottom: 30px; }
.dev { border: 1px solid var(--line); border-top: 3px solid var(--dc, var(--line-strong)); background: var(--panel); padding: 10px 12px 12px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.dev h3 { font-size: 17px; display: flex; align-items: baseline; gap: 8px; }
.dev h3 small { font-family: var(--sans); font-size: 12px; color: var(--dim); font-weight: 400; letter-spacing: 0; }
.dev ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13.5px; }
.dev li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 7px; align-items: baseline; }
.dev li span:last-child { min-width: 0; overflow-wrap: anywhere; }
.dev .role { font-size: 13px; color: var(--dim); }
.dev .row { display: flex; flex-wrap: wrap; gap: 6px; }
.dev .row button { font-size: 12.5px; padding: 3px 9px; }
.dot { display: inline-block; width: 8px; height: 8px; background: var(--faint); transform: translateY(-1px); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--crit); } .dot.wait { background: var(--warm); } .dot.na { background: transparent; border: 1px solid var(--faint); }
.d-bl { --dc: var(--d-bl); } .d-srv { --dc: var(--d-srv); } .d-hs { --dc: var(--d-hs); } .d-is { --dc: var(--d-is); } .d-ph { --dc: var(--d-ph); } .d-tab { --dc: var(--d-tab); } .d-rt { --dc: var(--d-rt); }

/* server card */
.card { background: var(--panel); border: 1px solid var(--line-strong); padding: 14px 16px 16px; margin-bottom: 30px; }
.card h2 { font-size: 19px; margin-bottom: 4px; }
.card p { margin: 0 0 12px; color: var(--dim); font-size: 13.5px; max-width: 84ch; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
.fields label { display: grid; gap: 3px; font-size: 12.5px; color: var(--dim); min-width: 0; }
.fields small { color: var(--faint); font-size: 11.5px; }

/* phases and steps */
.phase { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 72px); margin-bottom: 40px; }
.ph-h { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: baseline; border-bottom: 1px solid var(--line-strong); padding-bottom: 8px; margin-bottom: 4px; }
.ph-h .num { font-family: var(--mono); font-size: 13px; color: var(--accent); border: 1px solid var(--accent); padding: 0 6px; }
.ph-h h2 { font-size: 24px; }
.ph-h .goal { grid-column: 2; color: var(--dim); font-size: 14px; max-width: 80ch; }
.step { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 12px; padding: 13px 4px 13px 0; border-bottom: 1px solid var(--line); scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 80px); }
.step.next { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }
.step > input { margin: 5px 0 0 2px; width: 17px; height: 17px; cursor: pointer; }
.step-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; cursor: pointer; }
.sid { font-family: var(--mono); font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.st { font-size: 15.5px; font-weight: 600; }
.step.done .st { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--faint); }
.tags { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-family: var(--mono); font-size: 11px; padding: 0 6px; border: 1px solid var(--dc); color: var(--dc); white-space: nowrap; }
.body { grid-column: 2; min-width: 0; display: grid; gap: 8px; margin-top: 5px; font-size: 14.5px; }
.body p { margin: 0; max-width: 80ch; }
.live { font-size: 13px; display: flex; gap: 8px; align-items: baseline; color: var(--dim); }
.who { font-size: 12px; color: var(--faint); }
.who b { font-weight: 500; color: var(--ok); }
.acts { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.acts .hint { font-size: 12.5px; color: var(--faint); }
.warn, .note { padding: 7px 12px; font-size: 14px; max-width: 84ch; }
.warn { border-left: 2px solid var(--crit); background: var(--crit-soft); }
.note { border-left: 2px solid var(--accent); background: var(--accent-soft); }
.cmd { background: var(--term); border: 1px solid var(--line); min-width: 0; max-width: 84ch; display: flex; align-items: flex-start; }
.cmd pre { margin: 0; padding: 7px 11px; overflow-x: auto; font-family: var(--mono); font-size: 13px; flex: 1 1 auto; min-width: 0; }
.cmd button { font-size: 12px; padding: 2px 9px; margin: 4px; background: transparent; flex: none; }
.mref { font-size: 12.5px; color: var(--faint); }
.mref a { color: var(--dim); }

/* toolbox */
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.tools > div { border: 1px solid var(--line); padding: 11px 13px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.tools h3 { font-size: 16px; }
.tools p { margin: 0; font-size: 13px; color: var(--dim); }
footer { color: var(--faint); font-size: 12.5px; border-top: 1px solid var(--line); padding-block: 14px 30px; }
footer p { max-width: 100ch; margin: 0 0 6px; }

.modal { position: fixed; inset: 0; z-index: 30; background: rgba(4,10,14,.72); display: grid; place-items: center; padding: 16px; }
.modal > div { background: var(--panel); border: 1px solid var(--accent); padding: 16px 18px; max-width: 460px; width: 100%; display: grid; gap: 10px; max-height: 100%; overflow-y: auto; }
.modal h2 { font-size: 21px; }
.modal p { margin: 0; font-size: 14px; color: var(--dim); }
.qr { background: var(--qr-bg); padding: 12px; justify-self: center; width: min(260px, 100%); }
.qr svg { display: block; width: 100%; height: auto; }
.url { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; background: var(--term); padding: 6px 9px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--raised); border: 1px solid var(--accent); padding: 7px 14px; font-size: 13.5px; z-index: 40; max-width: calc(100% - 32px); }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1 data-ui="h1">VRG Szerver Kalauz</h1><span class="mode" id="mode"></span></div>
    <div class="prog"><span class="n" id="prog-n">0 / 0</span><span class="bar"><span id="prog-bar"></span></span></div>
    <div class="lang" role="group" aria-label="Language / Nyelv">
      <button type="button" data-lang="hu" aria-pressed="true" lang="hu" title="Magyar">HU</button><button type="button" data-lang="en" aria-pressed="false" lang="en" title="English">EN</button>
    </div>
  </div>
</header>

<div class="wrap layout">
  <nav class="rail" id="rail"></nav>
  <main>
    <div class="banner" id="banner"></div>
    <section class="now" id="now" aria-live="polite"></section>
    <section class="devices" id="devices" aria-label="Devices"></section>
    <section class="card" id="card">
      <h2 data-ui="cardT"></h2>
      <p data-ui="cardP"></p>
      <div class="fields" id="fields"></div>
    </section>
    <div id="phases"></div>
    <section class="phase" id="tools-sec">
      <div class="ph-h"><span class="num">+</span><h2 data-ui="toolsT"></h2><span class="goal" data-ui="toolsG"></span></div>
      <div class="tools" id="tools"></div>
    </section>
  </main>
</div>
<footer class="wrap" id="foot"></footer>
<div class="modal" id="modal" hidden><div id="modal-in"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';
const T = (en, hu) => ({ en: en, hu: hu });
const LANG_KEY = 'vrg-kalauz-lang';
let lang = 'hu';
try { const s = localStorage.getItem(LANG_KEY); if (s === 'en' || s === 'hu') lang = s; } catch (e) { /* storage blocked */ }
const L = x => (x && typeof x === 'object' && 'en' in x) ? x[lang] : x;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MANUAL_URL = 'https://claude.ai/artifact/N2JbyRKE3732kwD6P8jRXE';

/* ------------------------------------------------------------ words */
const UI = {
  h1: T('VRG Server Kalauz', 'VRG Szerver Kalauz'),
  m_local: T('live · from the stick', 'élő · a stickről'), m_mirror: T('tablet view', 'tablet nézet'),
  m_shared: T('shared ticks', 'közös pipák'), m_plain: T('this device only', 'csak ez az eszköz'), m_lost: T('connection lost', 'megszakadt'),
  b_local: T('<b>Live.</b> This page runs from the helper stick: the buttons start things on this laptop and the dots show what the laptop sees right now. Keep the small black <b>VRG Kalauz</b> window open.',
             '<b>Élő kapcsolat.</b> Ez az oldal a segítő stickről fut: a gombok ezen a laptopon indítanak el dolgokat, a pöttyök azt mutatják, amit a laptop most lát. A kis fekete <b>VRG Kalauz</b> ablakot hagyd nyitva.'),
  b_mirror: T('<b>Tablet view.</b> You see the state your laptop sees, refreshed every few seconds, and you can tick steps. Buttons that start programs work only on the laptop.',
              '<b>Tablet nézet.</b> Azt látod, amit a laptopod lát, pár másodpercenként frissítve, és pipálhatsz. A programokat indító gombok csak a laptopon működnek.'),
  b_shared: T('<b>Shared ticks.</b> Ticks are saved for everyone who opens this page. For the buttons and the automatic checks, open the Kalauz from the helper stick: double-click <code>KALAUZ.cmd</code> on your laptop.',
              '<b>Közös pipák.</b> A pipák mindenkinek mentődnek, aki megnyitja ezt az oldalt. A gombokhoz és az automatikus ellenőrzéshez nyisd meg a Kalauzt a segítő stickről: a laptopodon dupla kattintás a <code>KALAUZ.cmd</code>-re.'),
  b_plain: T('<b>Ticks are kept in this browser only.</b> For the buttons and the automatic checks, double-click <code>KALAUZ.cmd</code> in the root of the helper stick.',
             '<b>A pipák csak ebben a böngészőben maradnak meg.</b> A gombokhoz és az automatikus ellenőrzéshez kattints duplán a <code>KALAUZ.cmd</code>-re a segítő stick gyökerében.'),
  b_lost: T('<b>The Kalauz window on the laptop does not answer.</b> Was it closed? Double-click <code>KALAUZ.cmd</code> on the helper stick again; this page reconnects by itself only if the window is still open.',
            '<b>A laptopon futó Kalauz ablak nem válaszol.</b> Bezárult? Kattints duplán újra a <code>KALAUZ.cmd</code>-re a segítő sticken; ez az oldal csak akkor kapcsolódik vissza magától, ha az ablak még nyitva van.'),
  nowL: T('Now', 'Most'), nowWhere: T('where', 'hol'), doneBtn: T('Done, next step', 'Kész, jöhet a következő'),
  finL: T('Finished', 'Kész'), finT: T('The server is built and handed over', 'A szerver kész és át van adva'),
  finP: T('Every step is ticked. The handover for A is on the stick (helper/ATADAS-A-NAK.md). Ask the helper about the server any time in plain words.',
          'Minden lépés kipipálva. Az átadás A-nak a sticken van (helper/ATADAS-A-NAK.md). A szerverről bármikor kérdezheted a segítőt, egyszerű szavakkal.'),
  cardT: T('Server card', 'Szerverkártya'),
  cardP: T('The helper fills this in on the server (address, name, user). You can type the address here yourself after the install: the welcome text after login shows it. Never a password.',
           'Ezt a segítő tölti ki a szerveren (cím, név, felhasználó). A telepítés után a címet magad is beírhatod: a bejelentkezés utáni üdvözlő szöveg mutatja. Jelszót soha.'),
  f_ip: T('Address on the home network', 'Cím az otthoni hálózaton'), f_ip_h: T('e.g. 192.168.1.50', 'pl. 192.168.1.50'),
  f_host: T('Server name', 'Szerver neve'), f_host_h: T('set during the install', 'telepítéskor adod meg'),
  f_user: T('User name on the server', 'Felhasználónév a szerveren'), f_user_h: T('set during the install', 'telepítéskor adod meg'),
  f_alias: T('Short name for ssh', 'Rövid név az ssh-hoz'), f_alias_h: T('phase 3 creates it', 'a 3. fázis hozza létre'),

/* ------------------------------------------------------------ state */

const sGet = k => { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } };
const sSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } };

/* ------------------------------------------------------------ automatic checks: null = cannot tell here */
const ok = (o, en, hu) => ({ ok: !!o, txt: T(en, hu) });
const AUTO = {
  local: s => ok(true, 'The Kalauz runs on ' + (s.pc && s.pc.name || 'this laptop'), 'A Kalauz fut: ' + (s.pc && s.pc.name || 'ezen a laptopon')),

  },
  tabletSeen: s => recent(ST.lan && ST.lan.seen, 600) ? ok(true, 'A tablet connected', 'Egy tablet csatlakozott') : (ST.lan && ST.lan.on ? ok(false, 'Tablet view on, waiting for the tablet', 'Tablet nézet bekapcsolva, várja a tabletet') : ok(false, 'Tablet view is off', 'A tablet nézet ki van kapcsolva')),
  isoOk: s => {

    if (i.state === 'bad') return ok(false, 'DAMAGED: do not use it, tell A', 'SÉRÜLT: ne használd, szólj A-nak');

  },
  secondStick: s => { const o = s.usb.filter(u => u.role !== 'helper'); return o.length ? ok(true, 'Second stick: ' + o[0].gb + ' GB', 'Második stick: ' + o[0].gb + ' GB') : ok(false, 'Only the helper stick is in', 'Csak a segítő stick van bedugva'); },
  installerStick: s => {

  srvSsh: s => !s.srv.target ? ok(false, 'No server address yet', 'Még nincs szervercím') : (s.srv.ssh ? ok(true, 'SSH open on ' + s.srv.target, 'SSH nyitva: ' + s.srv.target) : ok(false, 'SSH does not answer on ' + s.srv.target, 'Az SSH nem válaszol: ' + s.srv.target)),

  keyLogin: s => s.srv.key === true ? ok(true, 'ssh ' + s.pc.alias + ' gets in with the key', 'ssh ' + s.pc.alias + ' kulccsal belép') : (s.pc.cfg ? ok(false, 'Short name set, key login not working yet (is the key loaded? ssh-add)', 'A rövid név megvan, a kulcsos belépés még nem megy (betöltötted? ssh-add)') : ok(false, 'No short name "' + s.pc.alias + '" in .ssh\\config yet', 'Még nincs "' + s.pc.alias + '" rövid név a .ssh\\config-ban')),

  p2: s => probe(s, p => p.p2 === '1' ? ok(true, 'Phase 2 closed on the server', 'A 2. fázis lezárva a szerveren') : ok(false, 'Phase 2 not closed yet', 'A 2. fázis még nincs lezárva')),
  sudoGone: s => probe(s, p => p.sudo === '0' ? ok(true, 'Temporary sudo rule removed', 'Az ideiglenes sudo-szabály törölve') : ok(false, 'Temporary sudo rule still there', 'Az ideiglenes sudo-szabály még megvan')),
  tsPc: s => s.pc.ts && s.pc.ts.ip ? ok(true, 'This laptop on Tailscale: ' + s.pc.ts.ip, 'Ez a laptop a Tailscale-en: ' + s.pc.ts.ip) : (s.pc.ts && s.pc.ts.inst ? ok(false, 'Installed, not signed in', 'Telepítve, nincs bejelentkezve') : ok(false, 'Not installed', 'Nincs telepítve')),

  kitBack: s => (s.kit.present && done('K2.16')) ? ok(true, 'The helper stick is in this laptop', 'A segítő stick ebben a laptopban van') : ok(false, s.kit.present ? 'Stick here; phase 2 not closed yet' : 'The helper stick is not in this laptop', s.kit.present ? 'A stick itt van; a 2. fázis még nincs lezárva' : 'A segítő stick nincs ebben a laptopban')
};
function probe(s, f) { return s.srv.probe ? f(s.srv.probe) : null; }
function recent(iso, sec) { if (!iso) return false; const t = Date.parse(iso); return !isNaN(t) && (Date.now() - t) / 1000 < sec; }
function autoOf(st) { if (!st.auto || !ST || !ST.state || !ST.state.kit) return null; try { return AUTO[st.auto](ST.state); } catch (e) { return null; } }

/* ------------------------------------------------------------ rendering */
const live = () => MODE === 'local' || MODE === 'mirror';
function tags(ws) { return '<span class="tags">' + ws.map(w => '<span class="tag d-' + w + '">' + esc(L(DEV[w].t)) + '</span>').join('') + '</span>'; }
function mlink(m) {
  const a = 's-' + m.replace('.', '-');
  if (MODE === 'local') return '/manual#' + a;
  if (MODE === 'mirror') return '/manual?r=' + encodeURIComponent(KEY) + '#' + a;
  if (MODE === 'shared') return MANUAL_URL + '#' + a;
  return 'vrg-laptop-server.html#' + a;
}
function actBtn(a) {
  const d = ACT[a]; if (!d) return '';
  const can = MODE === 'local';
  const cls = (d.go ? 'go' : '') + (d.risk ? ' risk' : '');
  return '<button type="button" class="' + cls + '" data-act="' + a + '"' + (can ? '' : ' disabled') + '>' + esc(L(d.l)) + '</button>';
}
function actHints(acts) {
  if (MODE === 'local' || !acts || !acts.length) return '';
  const fs = acts.map(a => ACT[a] && ACT[a].f).filter(Boolean).map(f => esc(L(f)));
  return fs.length ? '<span class="hint">' + esc(ui('onlyLaptop')) + fs.join(' · ') + '</span>' : '';
}
function liveLine(st) {
  const a = autoOf(st); if (!a) return '';
  const cls = a.ok ? 'ok' : (st.auto === 'isoOk' && ST.iso && ST.iso.state === 'bad' ? 'bad' : 'wait');
  return '<div class="live"><span class="dot ' + cls + (ST.iso && ST.iso.state === 'running' && st.auto === 'isoOk' ? ' pulse' : '') + '"></span><span>' + esc(L(a.txt)) + '</span></div>';
}
function whoLine(st) {
  const e = PROG.steps[st.id];
  if (e && e.done) {
    const when = e.at ? new Date(e.at).toLocaleString(lang === 'hu' ? 'hu-HU' : 'en-GB', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    return '<div class="who"><b>' + esc(ui('by_' + (UI['by_' + e.by] ? e.by : 'B'))) + '</b>' + (when ? ' · ' + esc(when) : '') + (e.note ? ' · ' + esc(e.note) : '') + '</div>';
  }
  if (st.who === 'segito' || st.who === 'go') return '<div class="who">' + esc(ui('willHelper')) + '</div>';
  if (st.auto && live()) return '<div class="who">' + esc(ui('willAuto')) + '</div>';
  return '';
}
function cmdHtml(st) {
  if (!st.cmd) return '';
  const text = st.cmd.map(L).join('\n');
  return '<div class="cmd"><pre>' + esc(text) + '</pre><button type="button" data-copy="' + st.id + '">' + esc(ui('copy')) + '</button></div>';
}
function stepBody(st) {
  return '<p>' + L(st.d) + '</p>' + (st.warn ? '<div class="warn">' + L(st.warn) + '</div>' : '') + cmdHtml(st) + liveLine(st) +
    ((st.acts && st.acts.length) ? '<div class="acts">' + st.acts.map(actBtn).join('') + actHints(st.acts) + '</div>' : '') +
    whoLine(st) +
    (st.m ? '<div class="mref">' + esc(ui('manual')) + ': ' + st.m.map(m => '<a href="' + mlink(m) + '" target="_blank" rel="noopener">§' + m + '</a>').join(' · ') + '</div>' : '');
}
function renderPhases() {
  let h = '';
  PH.forEach((ph, pi) => {
    h += '<section class="phase" id="' + ph.id + '"><div class="ph-h"><span class="num">' + ph.n + '</span><h2>' + esc(L(ph.t)) + '</h2><span class="goal">' + esc(L(ph.g)) + '</span></div>';
    STEPS.filter(s => s.ph === pi).forEach(st => {
      const sid = st.id.replace('.', '-');
      h += '<div class="step" id="' + sid + '" data-id="' + st.id + '"><input type="checkbox" id="c-' + sid + '" data-tick="' + st.id + '" aria-label="' + esc(st.id) + '">' +
        '<label class="step-h" for="c-' + sid + '"><span class="sid">' + st.id + '</span><span class="st">' + esc(L(st.t)) + '</span>' + tags(st.w) + '</label>' +
        '<div class="body" data-body="' + st.id + '"></div></div>';
    });
    h += '</section>';
  });
  $('phases').innerHTML = h;
}
function refreshSteps() {
  const nx = nextStep();
  STEPS.forEach(st => {
    const sid = st.id.replace('.', '-'), row = $(sid); if (!row) return;
    const cb = $('c-' + sid), on = done(st.id);
    if (cb.checked !== on) cb.checked = on;
    row.classList.toggle('done', on); row.classList.toggle('next', nx === st);
    const b = row.querySelector('[data-body]'), html = stepBody(st);
    if (b.dataset.h !== html) { b.innerHTML = html; b.dataset.h = html; }
  });
}
function nextStep() { return STEPS.find(s => !done(s.id)) || null; }
function renderNow() {
  const el = $('now'), st = nextStep();
  let h;
  if (!st) { el.classList.add('fin'); h = '<div class="label">' + esc(ui('finL')) + '</div><h2>' + esc(ui('finT')) + '</h2><p class="txt">' + esc(ui('finP')) + '</p>'; }
  else {
    el.classList.remove('fin');
    h = '<div class="label">' + esc(ui('nowL')) + ' · ' + st.id + ' · ' + esc(L(PH[st.ph].t)) + '</div><h2>' + esc(L(st.t)) + '</h2>' +
      '<div class="txt">' + L(st.d) + '</div>' + (st.warn ? '<div class="warn" style="margin-top:8px">' + L(st.warn) + '</div>' : '') + liveLine(st) +
      '<div class="row">' + (st.acts || []).map(actBtn).join('') + '<button type="button" data-now="' + st.id + '">' + esc(ui('doneBtn')) + '</button>' + tags(st.w) + actHints(st.acts) + '</div>';
  }
  if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
}
function li(cls, en, hu) { return '<li><span class="dot ' + cls + '"></span><span>' + esc(L(T(en, hu))) + '</span></li>'; }
function devCard(w, body, row) {

}
function renderDevices() {

    h += devCard('hs', role('Holds the helper, the files and the ticks. Moves: your laptop → server → your laptop.', 'Ezen van a segítő, a fájlok és a pipák. Útja: laptopod → szerver → laptopod.'));
    h += devCard('is', role('Becomes the Ubuntu installer in phase 1; used once in phase 2.', 'Az 1. fázisban Ubuntu-telepítő lesz belőle; a 2. fázisban egyszer kell.'));

  const yes = b => b ? 'ok' : 'bad';
  // your laptop
  h += devCard('bl', '<ul>' +
    li('ok', 'Kalauz running on ' + s.pc.name, 'Kalauz fut: ' + s.pc.name) +
    li(yes(s.net.online), s.net.online ? 'Internet: yes' : 'Internet: no', s.net.online ? 'Internet: van' : 'Internet: nincs') +
    li(s.helper.running ? 'ok' : 'na', s.helper.running ? 'Helper running' : 'Helper not running', s.helper.running ? 'A segítő fut' : 'A segítő nem fut') +
    li(s.pc.key ? 'ok' : 'na', s.pc.key ? 'SSH key: yes' : 'SSH key: not yet', s.pc.key ? 'SSH-kulcs: van' : 'SSH-kulcs: még nincs') +
    li(s.pc.ts && s.pc.ts.ip ? 'ok' : 'na', 'Tailscale: ' + (s.pc.ts && s.pc.ts.ip ? s.pc.ts.ip : (s.pc.ts && s.pc.ts.inst ? 'installed' : 'no')), 'Tailscale: ' + (s.pc.ts && s.pc.ts.ip ? s.pc.ts.ip : (s.pc.ts && s.pc.ts.inst ? 'telepítve' : 'nincs'))) +
    '</ul>', MODE === 'local' ? actBtn('refresh') : '');
  // server
  let sv = '';

  else {
    sv += li(yes(s.srv.ping || s.srv.ssh), s.srv.target + (s.srv.ping || s.srv.ssh ? ' answers' : ' does not answer'), s.srv.target + (s.srv.ping || s.srv.ssh ? ' válaszol' : ' nem válaszol'));
    sv += li(s.srv.ssh ? 'ok' : 'wait', s.srv.ssh ? 'SSH open' : 'SSH closed', s.srv.ssh ? 'SSH nyitva' : 'SSH zárva');
    sv += li(s.srv.key === true ? 'ok' : 'na', s.srv.key === true ? 'Key login works' : 'Key login: not yet', s.srv.key === true ? 'Kulcsos belépés működik' : 'Kulcsos belépés: még nem');

      sv += li(p.pw === 'no' ? 'ok' : 'wait', 'Password login: ' + (p.pw === 'no' ? 'off' : 'on'), 'Jelszavas belépés: ' + (p.pw === 'no' ? 'ki' : 'be'));
      sv += li(p.ufw === 'on' ? 'ok' : 'wait', 'Firewall: ' + p.ufw, 'Tűzfal: ' + (p.ufw === 'on' ? 'be' : 'ki'));
      sv += li(p.sudo === '0' ? 'ok' : 'wait', p.sudo === '0' ? 'Helper sudo: removed' : 'Helper sudo: active', p.sudo === '0' ? 'Segítő sudo: törölve' : 'Segítő sudo: aktív');
      sv += li('ok', 'Up ' + Math.round(+p.up / 3600) + ' h · disk ' + p.disk, 'Fut ' + Math.round(+p.up / 3600) + ' órája · lemez ' + p.disk);
    }
  }
  h += devCard('srv', '<ul>' + sv + '</ul>', MODE === 'local' && s.srv.target ? actBtn('ssh-window') : '');
  // helper stick
  const k = s.kit;
  h += devCard('hs', '<ul>' + (k.present
    ? li('ok', 'In this laptop: ' + k.path + (k.fs ? ' · ' + k.fs : '') + (k.label ? ' · ' + k.label : ''), 'Ebben a laptopban: ' + k.path + (k.fs ? ' · ' + k.fs : '') + (k.label ? ' · ' + k.label : ''))
    : li('na', 'Not in this laptop (on the server?)', 'Nincs ebben a laptopban (a szerveren?)')) +
    (k.present && !k.removable ? li('wait', 'Running from a folder, not a stick (test)', 'Mappából fut, nem stickről (teszt)') : '') + '</ul>', MODE === 'local' && k.present ? actBtn('open-kit') : '');
  // install stick
  const others = s.usb.filter(u => u.role !== 'helper');
  const rname = r => ({ installer: T('Ubuntu install stick', 'Ubuntu telepítő stick'), 'installer?': T('probably the install stick', 'valószínűleg a telepítő'), empty: T('empty', 'üres'), other: T('has files: will be erased', 'fájlok vannak rajta: törlődnek'), unreadable: T('unreadable', 'olvashatatlan') })[r] || T(r, r);
  h += devCard('is', '<ul>' + (others.length
    ? others.map(u => li(u.role.startsWith('installer') ? 'ok' : 'wait', u.gb + ' GB · ' + rname(u.role).en, u.gb + ' GB · ' + rname(u.role).hu)).join('')
    : li('na', done('K1.4') ? 'Not in this laptop (done, or in the server)' : 'Not plugged in', done('K1.4') ? 'Nincs ebben a laptopban (kész, vagy a szerverben)' : 'Nincs bedugva')) + '</ul>');
  // phone
  h += devCard('ph', role('Password safe (K2.4), QR code for A (K2.13), router page (K2.11), photos of the screen.', 'Jelszószéf (K2.4), QR-kód A-nak (K2.13), router oldal (K2.11), fotók a képernyőről.'));
  // tablet
  const lan = ST.lan || {};
  let tb = '<ul>';
  if (MODE === 'mirror') tb += li('ok', 'You are looking at it', 'Most ezt nézed');
  else tb += li(lan.on ? (recent(lan.seen, 600) ? 'ok' : 'wait') : 'na', lan.on ? (recent(lan.seen, 600) ? 'Tablet view on, tablet connected' : 'Tablet view on, no tablet yet') : 'Tablet view off', lan.on ? (recent(lan.seen, 600) ? 'Tablet nézet be, tablet csatlakozva' : 'Tablet nézet be, még nincs tablet') : 'Tablet nézet ki');
  tb += '</ul>';

  $('devices').innerHTML = h;
}
const FILLED = { go: T('the server itself', 'maga a szerver'), segito: T('the helper', 'a segítő'), auto: T('the Kalauz', 'a Kalauz'), B: T('you', 'te') };
const FIELDS = [['ip', 'f_ip', 'f_ip_h'], ['host', 'f_host', 'f_host_h'], ['user', 'f_user', 'f_user_h'], ['alias', 'f_alias', 'f_alias_h'], ['ts', 'f_ts', 'f_ts_h']];
function renderFields() {
  $('fields').innerHTML = FIELDS.map(f => '<label for="f-' + f[0] + '">' + esc(ui(f[1])) + '<input type="text" id="f-' + f[0] + '" data-f="' + f[0] + '" autocomplete="off" spellcheck="false" placeholder="' + esc(ui(f[2])) + '"><small id="fb-' + f[0] + '"></small></label>').join('');
  syncFields();
}
function syncFields() {
  FIELDS.forEach(f => {
    const el = $('f-' + f[0]), e = PROG.facts[f[0]];
    if (el && document.activeElement !== el && el.value !== fact(f[0])) el.value = fact(f[0]);
    const sm = $('fb-' + f[0]);
    if (sm) sm.textContent = e && e.v ? ui('f_by') + ': ' + L(FILLED[e.by] || FILLED.B) : '';
  });
}
function renderRail() {
  $('rail').innerHTML = PH.map((ph, pi) => {
    const ss = STEPS.filter(s => s.ph === pi), d = ss.filter(s => done(s.id)).length;
    return '<a href="#' + ph.id + '" data-ph="' + ph.id + '" class="' + (d === ss.length ? 'done' : '') + '"><span class="pn">' + ph.n + '</span><span class="pt">' + esc(L(ph.t)) + '</span><span class="pc">' + d + '/' + ss.length + '</span></a>';
  }).join('') + '<a href="#tools-sec" data-ph="tools-sec"><span class="pn">+</span><span class="pt">' + esc(ui('toolsT')) + '</span><span class="pc"></span></a>';
  const n = STEPS.filter(s => done(s.id)).length;
  $('prog-n').textContent = n + ' / ' + STEPS.length;
  $('prog-bar').style.width = (100 * n / STEPS.length) + '%';
}
function renderTools() {
  const box = (t, p, acts) => '<div><h3>' + esc(L(t)) + '</h3><p>' + esc(L(p)) + '</p><div class="acts">' + acts.map(actBtn).join('') + actHints(acts) + '</div></div>';
  $('tools').innerHTML =
    box(T('The helper', 'A segítő'), T('Claude from the stick, in the room of each phase. It continues the previous conversation if you ask it to.', 'Claude a stickről, minden fázis saját szobájában. Ha kéred, folytatja az előző beszélgetést.'), ['helper1', 'helper3']) +
    box(T('Notes on the stick', 'Jegyzetek a sticken'), T('What the helper knows (STATE.md), what you learned (NAPLO.md), the handover for A, and every command it ran.', 'Amit a segítő tud (STATE.md), amit te tanultál (NAPLO.md), az átadás A-nak, és minden parancs, amit futtatott.'), ['open-state', 'open-naplo', 'open-atadas', 'open-logs']) +
    box(T('Checks', 'Ellenőrzések'), T('Re-check the Ubuntu file or every file on the stick. Both only read.', 'Az Ubuntu-fájl vagy a stick összes fájljának újraellenőrzése. Mindkettő csak olvas.'), ['verify-iso', 'verify-kit', 'refresh']) +
    box(T('Windows on this laptop', 'Ablakok ezen a laptopon'), T('Your own PowerShell window for passwords and passphrases; an ssh window to the server once it has an address.', 'Saját PowerShell ablak a jelszavakhoz és jelmondatokhoz; ssh ablak a szerverre, ha már van címe.'), ['ps-window', 'ssh-window', 'open-kit']) +
    box(T('Programs on the stick', 'Programok a sticken'), T('Rufus writes the install stick; Tailscale connects this laptop to A\'s private network (only if A invited you).', 'A Rufus írja a telepítő sticket; a Tailscale A privát hálózatához köti ezt a laptopot (csak ha A meghívott).'), ['rufus', 'tailscale-msi', 'lan']) +
    box(T('Fallback: only if A asked', 'Tartalék: csak ha A kérte'), T('These erase a stick. Each asks you to pick the stick and to type its number again before anything happens.', 'Ezek egy sticket törölnek. Mindegyik kéri, hogy válaszd ki a sticket, és írd be újra a számát, mielőtt bármi történik.'), ['make-install', 'make-helper']);
}
function renderStatic() {
  document.querySelectorAll('[data-ui]').forEach(el => { el.innerHTML = ui(el.dataset.ui); });
  const m = $('mode'); const mk = LOST ? 'lost' : MODE;
  m.textContent = ui('m_' + mk); m.className = 'mode m-' + mk;
  const b = $('banner'); b.innerHTML = ui('b_' + mk); b.classList.toggle('lost', LOST);
  $('foot').innerHTML = '<p>' + esc(ui('foot1')) + '</p><p>' + esc(ui('foot2')) + '<a href="' + (MODE === 'shared' ? MANUAL_URL : mlink('0.1').replace(/#.*/, '')) + '" target="_blank" rel="noopener">' + esc(ui('foot3')) + '</a>.</p>';
}
function renderAll() { renderStatic(); renderRail(); renderPhases(); renderFields(); renderTools(); refresh(); }
function refresh() { renderRail(); renderNow(); renderDevices(); refreshSteps(); syncFields(); }

/* ------------------------------------------------------------ talking to the Kalauz helper */
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: Object.assign({ 'X-Kalauz': KEY }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = null; try { j = await r.json(); } catch (e) { /* not json */ }
  if (!r.ok) { const err = new Error((j && j.error) || 'http'); err.code = (j && j.error) || 'http'; throw err; }
  return j;
}
function take(j) {
  if (!j) return;
  if (j.mode && j.mode !== MODE) { MODE = j.mode; sSet('kalauz-mode', MODE); ST = j; renderAll(); }
  ST = j;
  if (j.progress) PROG = { steps: j.progress.steps || {}, facts: j.progress.facts || {} };
  const wasLost = LOST; LOST = false; if (wasLost) renderStatic();
  refresh(); autoTick();
}
let pollT = null;
async function poll() {
  clearTimeout(pollT);
  try { take(await api('/api/state')); pollT = setTimeout(poll, 3000); }
  catch (e) { if (!LOST) { LOST = true; renderStatic(); } pollT = setTimeout(poll, 5000); }
}
function autoTick() {
  if (MODE !== 'local') return;
  for (const st of STEPS) {
    if (!st.auto || done(st.id) || AUTO_SENT[st.id]) continue;
    const e = PROG.steps[st.id]; if (e && e.by === 'B' && !e.done) continue;   // B unticked it on purpose
    const a = autoOf(st);
    if (a && a.ok) { AUTO_SENT[st.id] = true; api('/api/tick', { id: st.id, done: true, by: 'auto' }).then(take).catch(() => { delete AUTO_SENT[st.id]; }); return; }
  }
}

/* ------------------------------------------------------------ ticks and facts in the other modes */
const LS = 'vrg-kalauz-v1';
let saveT = null;
function saveOther() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const body = { steps: PROG.steps, facts: PROG.facts, updated: new Date().toISOString() };
    if (MODE === 'shared' && docRef) { try { await docRef.set(body); } catch (e) { toast(ui('e_other')); } return; }
    try { localStorage.setItem(LS, JSON.stringify(body)); } catch (e) { /* storage blocked: ticks last this visit */ }
  }, 500);
}
async function setTick(id, on) {
  if (live()) { try { take(await api('/api/tick', { id: id, done: on })); } catch (e) { toast(ui('e_other')); refresh(); } return; }
  PROG.steps[id] = { done: on, by: 'B', at: new Date().toISOString() }; refresh(); saveOther();
}
const VAL_RE = /^[A-Za-z0-9._:@-]{0,64}$/;
async function setFact(k, v) {
  v = v.trim();
  if (!VAL_RE.test(v)) { $('fb-' + k).textContent = ui('f_bad'); return; }
  if (v === fact(k)) return;
  if (live()) { try { take(await api('/api/fact', { key: k, v: v })); } catch (e) { toast(ui('e_other')); } return; }
  PROG.facts[k] = { v: v, by: 'B', at: new Date().toISOString() }; refresh(); saveOther();
}

/* ------------------------------------------------------------ actions */
async function runAct(a, btn) {
  if (a === 'lan') { openLan(); return; }
  if (btn) btn.disabled = true;
  try { await api('/api/run', { a: a }); toast(ui('started') + ': ' + L(ACT[a].l)); if (a === 'verify-iso' || a === 'refresh') setTimeout(poll, 400); }
  catch (e) { const c = e.code; toast(ui('failed') + ': ' + ui(c === 'nokit' ? 'e_nokit' : c === 'missing' ? 'e_missing' : c === 'noserver' ? 'e_noserver' : 'e_other')); }
  setTimeout(() => { if (btn) btn.disabled = false; }, 1500);
}
let qrLoaded = null;
function loadQr() {
  if (!qrLoaded) qrLoaded = new Promise((res, rej) => { const s = document.createElement('script'); s.src = '/lib/qrcode.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  return qrLoaded;
}
async function openLan() {
  let j;
  try { j = await api('/api/lan', { on: true }); take(j); }
  catch (e) { toast(ui('failed') + ': ' + ui(e.code === 'nolan' ? 'e_nolan' : 'e_other')); return; }
  const url = j.lan && j.lan.url; if (!url) return;
  let svg = '';
  try { await loadQr(); const q = window.qrcode(0, 'M'); q.addData(url); q.make(); svg = q.createSvgTag(4, 0); } catch (e) { svg = ''; }
  $('modal-in').innerHTML = '<h2>' + esc(ui('qrT')) + '</h2><p>' + esc(ui('qrP')) + '</p>' + (svg ? '<div class="qr">' + svg + '</div>' : '') +
    '<div class="url">' + esc(url) + '</div><p class="note">' + esc(ui('qrFw')) + '</p><div class="acts"><button type="button" class="go" data-modal="close">' + esc(ui('close')) + '</button><button type="button" data-modal="off">' + esc(ui('qrOff')) + '</button></div>';
  $('modal').hidden = false;
  const c = $('modal-in').querySelector('[data-modal="close"]'); if (c) c.focus();
}

/* ------------------------------------------------------------ small things */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600); }
function copy(text, btn) {
  const doneC = () => { btn.textContent = ui('copied'); setTimeout(() => { btn.textContent = ui('copy'); }, 1400); };
  const fallback = () => { const pre = btn.parentElement.querySelector('pre'); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(ui('clip')); };
  try { navigator.clipboard.writeText(text).then(doneC, fallback); } catch (e) { fallback(); }
}
function setLang(l) {
  if (l !== 'en' && l !== 'hu') return;
  lang = l; document.documentElement.lang = l;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* the choice lasts this visit */ }
}
let io = null;
function watchPhases() {
  if (!('IntersectionObserver' in window)) return;
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) document.querySelectorAll('nav.rail a').forEach(a => a.classList.toggle('cur', a.dataset.ph === en.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('.phase').forEach(s => io.observe(s));
}

function bind() {
  document.addEventListener('change', e => {
    const id = e.target.dataset && e.target.dataset.tick; if (id) setTick(id, e.target.checked);
  });
  document.addEventListener('focusout', e => { const k = e.target.dataset && e.target.dataset.f; if (k) setFact(k, e.target.value); });
  document.addEventListener('keydown', e => {
    const k = e.target.dataset && e.target.dataset.f; if (k && e.key === 'Enter') { e.preventDefault(); setFact(k, e.target.value); }
    if (e.key === 'Escape' && !$('modal').hidden) $('modal').hidden = true;
  });
  document.addEventListener('click', e => {
    const a = e.target.closest('button[data-act]'); if (a) { runAct(a.dataset.act, a); return; }
    const n = e.target.closest('button[data-now]'); if (n) { setTick(n.dataset.now, true); return; }
    const c = e.target.closest('button[data-copy]'); if (c) { const st = STEPS.find(s => s.id === c.dataset.copy); copy(st.cmd.map(L).join('\n'), c); return; }
    const m = e.target.closest('[data-modal]');
    if (m) { if (m.dataset.modal === 'off') api('/api/lan', { on: false }).then(take).catch(() => {}); $('modal').hidden = true; return; }
    if (e.target === $('modal')) $('modal').hidden = true;
    const l = e.target.closest('.lang button[data-lang]'); if (l && l.dataset.lang !== lang) { setLang(l.dataset.lang); renderAll(); watchPhases(); }
  });
}

/* ------------------------------------------------------------ start */
async function start() {
  const qs = new URLSearchParams(location.search);
  const k = qs.get('k'), r = qs.get('r');
  if (k || r) { KEY = k || r; sSet('kalauz-key', KEY); sSet('kalauz-mode', k ? 'local' : 'mirror'); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* ignore */ } }
  else { KEY = sGet('kalauz-key'); }
  if (/^https?:$/.test(location.protocol) && KEY && /^(127\.0\.0\.1|localhost|\d+\.\d+\.\d+\.\d+)$/.test(location.hostname)) {
    MODE = sGet('kalauz-mode') === 'mirror' ? 'mirror' : 'local';
    renderAll(); watchPhases(); poll(); return;
  }
  // claude.ai artifact: shared ticks through the page's database
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (db) {
    MODE = 'shared'; docRef = db.doc('kalauz/progress');
    renderAll(); watchPhases();
    docRef.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (snap.exists) { const d = snap.data() || {}; PROG = { steps: d.steps || {}, facts: d.facts || {} }; refresh(); }
    }, () => { toast(ui('e_other')); });
    return;
  }

  try { const raw = localStorage.getItem(LS); if (raw) { const d = JSON.parse(raw); PROG = { steps: d.steps || {}, facts: d.facts || {} }; } } catch (e) { /* storage blocked */ }

}
setLang(lang); bind();
renderAll();
start();
})();
