<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Segoe UI,Arial,sans-serif">
  <title>Switching logic: chain versus star, with the cores on each link</title>
  <defs>
    <g id="lmp"><circle r="9" fill="#fff" stroke="#2f79c9" stroke-width="2"/><path d="M-6.3,-6.3 L6.3,6.3 M6.3,-6.3 L-6.3,6.3" stroke="#2f79c9" stroke-width="1.5"/></g>
    <g id="swi"><rect x="-8" y="-8" width="16" height="16" fill="#fff" stroke="#7f77dd" stroke-width="2"/></g>
    <g id="kd"><rect x="-9" y="-9" width="18" height="18" fill="#e67e22"/></g>
  </defs>
  <rect width="980" height="470" fill="#fbfaf6"/>

  <!-- chain -->
  <g transform="translate(16,16)">
    <rect width="466" height="300" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#262624">Lánc — kapcsolóról kapcsolóra</text>
    <text x="14" y="44" font-size="11" fill="#6d6a63">master → leader kapcsoló → … → tail kapcsoló → lámpa(k)</text>
    <g stroke="#2f79c9" stroke-width="2.4" fill="none">
      <path d="M58,120 H130"/><path d="M150,120 H222"/><path d="M242,120 H314"/><path d="M324,128 L324,226"/><path d="M334,236 H402"/>
    </g>
    <use href="#kd" x="48" y="120"/><use href="#swi" x="140" y="120"/><use href="#swi" x="232" y="120"/><use href="#swi" x="324" y="120"/>
    <use href="#lmp" x="324" y="236"/><use href="#lmp" x="412" y="236"/>
    <g font-size="10" fill="#262624" text-anchor="middle">
      <text x="48" y="146" fill="#b0600f">master</text><text x="140" y="146">106 váltó</text><text x="232" y="146">107 kereszt</text><text x="356" y="112">106 váltó</text>
      <text x="94" y="104">L·N·PE</text><text x="94" y="92" font-weight="700">3×1,5</text>
      <text x="186" y="104">T1·T2·N·PE</text><text x="186" y="92" font-weight="700">4×1,5</text>
      <text x="278" y="104">T1·T2·N·PE</text><text x="278" y="92" font-weight="700">4×1,5</text>
      <text x="362" y="190">Lk·N·PE</text><text x="362" y="178" font-weight="700">3×1,5</text>
      <text x="368" y="258">Lk·N·PE</text>
    </g>
    <text x="14" y="276" font-size="10.5" fill="#262624">N és PE végigfut a kapcsolódobozokon (mély doboz, összekötő) ⚑ Q-T05.</text>
    <text x="14" y="292" font-size="10.5" fill="#262624">Kevés kapcsoló, egy vonalban: rövidebb, kevesebb doboz.</text>
  </g>

  <!-- star -->
  <g transform="translate(498,16)">
    <rect width="466" height="300" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#262624">Csillag — közös ponton át (portáldoboz / KD)</text>
    <text x="14" y="44" font-size="11" fill="#6d6a63">minden kapcsoló és lámpa a hubhoz; a hubban fordul vissza a kapcsolt fázis</text>
    <g stroke="#2f79c9" stroke-width="2.4" fill="none">
      <path d="M50,160 H210"/><path d="M222,150 L110,104"/><path d="M230,148 L230,112"/><path d="M238,150 L352,104"/><path d="M236,170 L320,230"/><path d="M340,236 H402"/>
    </g>
    <use href="#kd" x="40" y="160"/><use href="#kd" x="230" y="160"/>
    <use href="#swi" x="104" y="100"/><use href="#swi" x="230" y="102"/><use href="#swi" x="358" y="100"/>
    <use href="#lmp" x="330" y="236"/><use href="#lmp" x="412" y="236"/>
    <g font-size="10" fill="#262624" text-anchor="middle">
      <text x="40" y="186" fill="#b0600f">master</text><text x="230" y="194" fill="#b0600f" font-weight="700">HUB</text>
      <text x="130" y="152">L·N·PE  3×1,5</text>
      <text x="104" y="84">106 · L·T1·T2·PE</text><text x="104" y="72" font-weight="700">4×1,5</text>
      <text x="230" y="86">107 · 2×(T1·T2)·PE</text><text x="230" y="74" font-weight="700">5×1,5</text>
      <text x="370" y="84">106 · T1'·T2'·Lk·PE</text><text x="370" y="72" font-weight="700">4×1,5</text>
      <text x="300" y="200">Lk·N·PE 3×1,5</text>
    </g>
    <text x="14" y="276" font-size="10.5" fill="#262624">Lk a hubban kap N + PE-t → 3 eres a lámpákhoz.</text>
    <text x="14" y="292" font-size="10.5" fill="#262624">Javasolt, ha ≥ 2 kapcsoló egy ajtó portáldobozán osztozik (Q-T06).</text>
  </g>

  <!-- type table -->
  <g transform="translate(16,332)">
    <rect width="948" height="122" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#262624">Kapcsolótípus a csoportból (TR-W1, = E1 levezetése) · erek linkenként (TR-W3, rules.js SWITCH_LEG)</text>
    <g font-size="11" fill="#262624">
      <text x="14" y="48">1 kapcsoló · 1 kapcsolt ág</text><text x="250" y="48" font-weight="700">101 egypólusú</text>
      <text x="14" y="66">1 kapcsoló · 2 kapcsolt ág</text><text x="250" y="66" font-weight="700">105 csillár</text>
      <text x="14" y="84">2 kapcsoló</text><text x="250" y="84" font-weight="700">106 + 106 váltó</text>
      <text x="14" y="102">n ≥ 3 kapcsoló</text><text x="250" y="102" font-weight="700">106 + (n − 2) × 107 + 106</text>
      <text x="500" y="48">Láncban a két vég mindig váltó, a közép kereszt.</text>
      <text x="500" y="66">Ér-szám → kábel: ≤ 3 → 3×1,5 · 4 → 4×1,5 · 5 → 5×1,5.</text>
      <text x="500" y="84">5 ér felett: kapcsolónként külön kábel (E5 szabály).</text>
      <text x="500" y="102" fill="#6d6a63">PE minden kábelben; az ér-táblák ⚑ szakmai jóváhagyásra.</text>
    </g>
  </g>
</svg>
