<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Segoe UI,Arial,sans-serif">
  <title>The four circuit patterns of the basic version</title>
  <defs>
    <g id="B"><rect x="-8" y="-20" width="16" height="40" rx="2" fill="#2c3e50"/></g>
    <g id="soc"><circle r="7" fill="#fff" stroke="#1d9e75" stroke-width="2.2"/></g>
    <g id="lmp"><circle r="8" fill="#fff" stroke="#2f79c9" stroke-width="2"/><path d="M-5.6,-5.6 L5.6,5.6 M5.6,-5.6 L-5.6,5.6" stroke="#2f79c9" stroke-width="1.5"/></g>
    <g id="swi"><rect x="-6.5" y="-6.5" width="13" height="13" fill="#fff" stroke="#7f77dd" stroke-width="2"/></g>
    <g id="ded"><path d="M0,-9 l9,9 l-9,9 l-9,-9 z" fill="#fff" stroke="#d85a30" stroke-width="2"/></g>
    <g id="kd"><rect x="-8" y="-8" width="16" height="16" fill="#e67e22"/></g>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d9e75"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f79c9"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d85a30"/></marker>
  </defs>
  <rect width="980" height="520" fill="#fbfaf6"/>

  <!-- P1 -->
  <g transform="translate(16,16)">
    <rect width="466" height="230" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#262624">P1 · Dedikált kör</text>
    <text x="14" y="44" font-size="11" fill="#6d6a63">Elosztó → egyetlen végpont. Mosógép, sütő, főzőlap, klíma …</text>
    <use href="#B" x="50" y="100"/>
    <path d="M60,100 H398" stroke="#d85a30" stroke-width="2.6" marker-end="url(#r)"/>
    <use href="#ded" x="412" y="100"/>
    <text x="300" y="90" font-size="10" fill="#d85a30">betáp (feed)</text>
    <use href="#B" x="50" y="180"/>
    <path d="M60,180 H398" stroke="#d85a30" stroke-width="2.6" stroke-dasharray="7 3" marker-end="url(#r)"/>
    <rect x="200" y="170" width="20" height="20" fill="none" stroke="#e67e22" stroke-width="2.4"/>
    <use href="#ded" x="412" y="180"/>
    <text x="160" y="210" font-size="10" fill="#262624">kötődobozon / portáldobozon ÁT: bontás nélkül (TR-D2)</text>
    <text x="14" y="140" font-size="10.5" fill="#262624">Pontosan 1 végpont · a kábel folytonos az Elosztótól a végpontig.</text>
  </g>

  <!-- P2 -->
  <g transform="translate(498,16)">
    <rect width="466" height="230" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#262624">P2 · Dugaljkör (lánc)</text>
    <text x="14" y="44" font-size="11" fill="#6d6a63">leader → … → tail; közvetlenül vagy egy master dobozból</text>
    <text x="14" y="76" font-size="10.5" font-weight="600" fill="#262624">a) klasszikus (E06 alapértelmezés)</text>
    <use href="#B" x="40" y="104"/>
    <path d="M50,104 H128" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#soc" x="140" y="104"/><path d="M148,104 H208" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#soc" x="220" y="104"/><path d="M228,104 H288" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#soc" x="300" y="104"/><path d="M308,104 H368" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#soc" x="380" y="104"/>
    <g font-size="10" fill="#1d9e75"><text x="126" y="128">leader</text><text x="368" y="128">tail</text></g>
    <text x="14" y="160" font-size="10.5" font-weight="600" fill="#262624">b) master dobozzal (a doboz = a szoba mini-Elosztója)</text>
    <use href="#B" x="40" y="194"/>
    <path d="M50,194 H106" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#kd" x="118" y="194"/>
    <path d="M126,194 H188" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#soc" x="200" y="194"/><path d="M208,194 H268" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#soc" x="280" y="194"/><path d="M288,194 H348" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#soc" x="360" y="194"/>
    <g font-size="10"><text x="96" y="218" fill="#b0600f">master</text><text x="186" y="218" fill="#1d9e75">leader</text><text x="350" y="218" fill="#1d9e75">tail</text></g>
    <text x="400" y="198" font-size="10" fill="#6d6a63">(Q-TV03)</text>
  </g>

  <!-- P3 -->
  <g transform="translate(16,262)">
    <rect width="466" height="242" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#262624">P3 · Ház-füzér (V1 világítás)</text>
    <text x="14" y="44" font-size="11" fill="#6d6a63">Elosztó → KD → KD → KD, saját csőben; minden KD betáp pont</text>
    <use href="#B" x="40" y="96"/>
    <g stroke="#2f79c9" stroke-width="3.4" fill="none">
      <path d="M50,96 H130" marker-end="url(#b)"/><path d="M146,96 H250" marker-end="url(#b)"/><path d="M266,96 H370" marker-end="url(#b)"/>
    </g>
    <use href="#kd" x="140" y="96"/><use href="#kd" x="260" y="96"/><use href="#kd" x="380" y="96"/>
    <g font-size="10" fill="#b0600f"><text x="122" y="80">KD1 Szoba</text><text x="244" y="80">KD2 Fürdő</text><text x="362" y="80">KD3 Konyha</text></g>
    <text x="180" y="116" font-size="9.5" fill="#2f79c9">string (feed)</text>
    <g stroke="#2f79c9" stroke-width="2" fill="none">
      <path d="M140,104 V150" marker-end="url(#b)"/><path d="M140,170 V198" marker-end="url(#b)"/>
      <path d="M260,104 V150" marker-end="url(#b)"/><path d="M260,170 V198" marker-end="url(#b)"/>
      <path d="M380,104 V150" marker-end="url(#b)"/><path d="M386,166 L418,198" marker-end="url(#b)"/><path d="M374,166 L346,198" marker-end="url(#b)"/>
    </g>
    <use href="#swi" x="140" y="160"/><use href="#lmp" x="140" y="210"/>
    <use href="#swi" x="260" y="160"/><use href="#lmp" x="260" y="210"/>
    <use href="#swi" x="380" y="160"/><use href="#lmp" x="340" y="210"/><use href="#lmp" x="424" y="210"/>
    <text x="146" y="138" font-size="9.5" fill="#2f79c9">master → leader</text>
    <text x="14" y="236" font-size="10.5" fill="#262624">A füzér csak dobozokat köt össze; a dobozban ágazik a szobák csoportjaira.</text>
  </g>

  <!-- P4 -->
  <g transform="translate(498,262)">
    <rect width="466" height="242" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#262624">P4 · Elágazás csak dobozban</text>
    <text x="14" y="44" font-size="11" fill="#6d6a63">egy kör két ágra bomlik — a bontás helye mindig doboz (TR-S4)</text>
    <use href="#B" x="40" y="130"/>
    <path d="M50,130 H126" stroke="#1d9e75" stroke-width="2.6" marker-end="url(#g)"/>
    <use href="#kd" x="138" y="130"/>
    <g stroke="#1d9e75" stroke-width="2.6" fill="none">
      <path d="M146,124 L206,88" marker-end="url(#g)"/><path d="M226,84 H286" marker-end="url(#g)"/><path d="M306,84 H366" marker-end="url(#g)"/>
      <path d="M146,136 L206,172" marker-end="url(#g)"/><path d="M226,176 H286" marker-end="url(#g)"/>
    </g>
    <use href="#soc" x="216" y="84"/><use href="#soc" x="296" y="84"/><use href="#soc" x="376" y="84"/>
    <use href="#soc" x="216" y="176"/><use href="#soc" x="296" y="176"/>
    <g font-size="10" fill="#1d9e75"><text x="198" y="68">leader 1</text><text x="364" y="68">tail 1</text><text x="198" y="200">leader 2</text><text x="284" y="200">tail 2</text></g>
    <g transform="translate(330,150)">
      <circle cx="0" cy="40" r="7" fill="#fff" stroke="#c0392b" stroke-width="2.2"/>
      <path d="M-40,40 H-8 M5,35 L30,15 M5,45 L30,65" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
      <text x="-170" y="80" font-size="10" fill="#c0392b">✗ elágazás dugaljban: alapból tiltva (Q-TV11)</text>
    </g>
  </g>
</svg>
