    <text x="772" y="218">↑↓ sorrend · Tail legyen</text>
    <text x="772" y="236">Leválasztás a láncról</text>
    <text x="772" y="254">Mutasd az alaprajzon</text>
    <text x="768" y="284" font-weight="700">Rögzítve (fix)</text>
    <text x="772" y="302">☑ a Javaslat nem írja át</text>
  </g>
  <rect x="768" y="324" width="190" height="90" rx="5" fill="#fff" stroke="#d8d4ca"/>
  <text x="776" y="342" font-size="10" fill="#6d6a63">mini-alaprajz: a kijelölt link</text>
  <path d="M790,400 V360 H900 V400" fill="none" stroke="#1d9e75" stroke-width="3"/>
  <circle cx="790" cy="400" r="4" fill="#1d9e75"/><circle cx="900" cy="400" r="4" fill="#1d9e75"/>

  <!-- check bar -->
  <rect x="10" y="496" width="960" height="54" fill="#fff" stroke="#d8d4ca"/>
  <g font-size="11">
    <text x="24" y="518" fill="#1d9e75" font-weight="700">✓ 41 / 43 végpont körben</text>
    <text x="214" y="518" fill="#b8901f" font-weight="700">⚠ 2 végpont kör nélkül</text>
    <text x="384" y="518" fill="#c0392b" font-weight="700">✗ 1 link fizikai út nélkül</text>
    <text x="566" y="518" fill="#b8901f" font-weight="700">⚠ 1 kilépés doboz nélkül</text>
    <text x="756" y="518" fill="#6d6a63">A4, A5: végpontra vár</text>
    <text x="24" y="538" fill="#6d6a63">kattintás egy sorra → kijelöli a hibás elemet; minden ellenőrzés a STK_CHECKS listában is megjelenik</text>
  </g>
