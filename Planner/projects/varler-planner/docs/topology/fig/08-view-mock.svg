    <rect x="202" y="22" width="70" height="22" rx="4" fill="#3d5266"/><text x="214" y="37" fill="#cfd8e0">Pályák</text>
    <rect x="274" y="22" width="84" height="22" rx="4" fill="#fbfaf6"/><text x="282" y="37" fill="#2c3e50" font-weight="700">Kapcsolatok</text>
    <text x="368" y="37" fill="#cfd8e0">Csövek</text>
    <g fill="#fff"><text x="448" y="37">⤳ Betáp</text><text x="510" y="37">⇢ Master</text><text x="576" y="37">⋯ Lánc</text><text x="632" y="37">⎇ Kapcsolás</text><text x="714" y="37">▣ KD</text></g>
    <rect x="756" y="21" width="84" height="24" rx="5" fill="#1d9e75"/><text x="766" y="37" fill="#fff" font-weight="700">✨ Javaslat</text>
    <rect x="846" y="21" width="86" height="24" rx="5" fill="#e67e22"/><text x="854" y="37" fill="#fff" font-weight="700">▶ Bekötés</text>
