      <path d="M338,270 V420" stroke="#2f79c9" stroke-dasharray="7 3"/>
      <path d="M248,272 C300,272 320,116 420,116" stroke="#2f79c9"/><path d="M432,116 H496" stroke="#2f79c9"/>
      <path d="M346,262 C380,262 390,300 414,300" stroke="#2f79c9"/><path d="M426,300 H496" stroke="#2f79c9"/>
      <path d="M346,420 C380,420 390,396 414,396" stroke="#2f79c9"/><path d="M426,396 H496" stroke="#2f79c9"/>
      <path d="M248,268 C300,268 320,226 414,226" stroke="#1d9e75"/>
      <path d="M426,226 H490 M504,226 H570 M584,226 H650" stroke="#1d9e75"/>
      <path d="M248,264 C300,264 320,154 414,154" stroke="#16a3b8"/>
      <path d="M248,282 C300,282 320,460 414,460" stroke="#d85a30" stroke-dasharray="6 3"/>
      <path d="M584,226 C620,226 640,290 660,300" stroke="#c0392b" stroke-dasharray="4 3"/>
    </g>
    <rect x="232" y="248" width="16" height="44" rx="2" fill="#2c3e50"/>
    <use href="#kd" x="338" y="262"/><use href="#kd" x="338" y="420"/>
    <use href="#swi" x="420" y="116"/><use href="#lmp" x="504" y="116"/><use href="#soc" x="420" y="154"/>
    <use href="#soc" x="420" y="226"/><use href="#soc" x="497" y="226"/><use href="#soc" x="577" y="226"/><use href="#soc" x="657" y="226"/>
    <use href="#swi" x="420" y="300"/><use href="#lmp" x="504" y="300"/>
    <use href="#swi" x="420" y="396"/><use href="#lmp" x="504" y="396"/><use href="#ded" x="420" y="460"/>
    <use href="#soc" x="664" y="302"/><text x="652" y="290" font-size="9.5" fill="#262624">S7</text>
    <circle cx="577" cy="226" r="13" fill="none" stroke="#262624" stroke-width="1.4"/>
    <text x="604" y="318" font-size="9.5" fill="#c0392b">✗ nincs fizikai út</text>
    <g font-size="9.5" fill="#262624"><text x="320" y="252">PB1</text><text x="320" y="442">PB2</text></g>
