  <path d="M22,326 H194" stroke="#d8d4ca"/>
  <text x="22" y="346" font-size="12" font-weight="700" fill="#262624">Kör nélkül (2)</text>
  <g font-size="10.5" fill="#262624"><text x="26" y="366">◦ S6 dugalj · Konyha</text><text x="26" y="384">◦ L3 lámpa · Kamra</text></g>
  <path d="M22,398 H194" stroke="#d8d4ca"/>
  <text x="22" y="418" font-size="12" font-weight="700" fill="#262624">Kapcsolás</text>
  <g font-size="10.5"><rect x="22" y="426" width="80" height="22" rx="4" fill="#fff" stroke="#2f79c9"/><text x="40" y="441" fill="#2f79c9" font-weight="700">Lánc</text>
  <rect x="106" y="426" width="88" height="22" rx="4" fill="#fff" stroke="#d8d4ca"/><text x="126" y="441" fill="#262624">Csillag</text></g>
  <text x="22" y="470" font-size="10" fill="#6d6a63">hub: PB1 (Szoba ajtó, L4)</text>

