  <rect x="22" y="86" width="172" height="22" rx="4" fill="#fff" stroke="#d8d4ca"/><text x="30" y="101" font-size="10.5" fill="#262624">NV4 minta ▾  (betöltve)</text>
  <g font-size="10.5" fill="#262624">
    <rect x="18" y="116" width="180" height="24" rx="4" fill="#fff" stroke="#1d9e75" stroke-width="1.6"/>
    <circle cx="30" cy="128" r="5" fill="#1d9e75"/><text x="40" y="132">A1 Szoba dugalj</text><text x="190" y="132" text-anchor="end" fill="#1d9e75">4/4 ✓</text>
    <circle cx="30" cy="154" r="5" fill="#16a3b8"/><text x="40" y="158">A2 Előszoba dugalj</text><text x="190" y="158" text-anchor="end">1/1 ✓</text>
    <circle cx="30" cy="180" r="5" fill="#d85a30"/><text x="40" y="184">A3 Mosógép · DED</text><text x="190" y="184" text-anchor="end">✓</text>
    <circle cx="30" cy="206" r="5" fill="#8e44ad"/><text x="40" y="210">A4 Klíma 1 · DED</text><text x="190" y="210" text-anchor="end" fill="#b8901f">vár</text>
    <circle cx="30" cy="232" r="5" fill="#5d8a1f"/><text x="40" y="236">A5 Klíma 2 · DED</text><text x="190" y="236" text-anchor="end" fill="#b8901f">vár</text>
    <circle cx="30" cy="258" r="5" fill="#2f79c9"/><text x="40" y="262">V1 Világítás · füzér</text><text x="190" y="262" text-anchor="end">3 csop.</text>
    <text x="26" y="290" fill="#6d6a63">＋ Saját kör…</text>
    <text x="26" y="312" fill="#6d6a63">＋ a katalógusból…</text>
