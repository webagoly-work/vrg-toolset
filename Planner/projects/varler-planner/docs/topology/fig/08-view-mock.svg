  <!-- inspector -->
  <rect x="756" y="56" width="214" height="440" fill="#f3f1ea"/>
  <text x="768" y="78" font-size="12" font-weight="700" fill="#262624">S3 — dugalj</text>
  <g font-size="10.5" fill="#262624">
    <text x="768" y="100">Kör: A1 Szoba dugalj</text>
    <text x="768" y="118">Szerep: lánc · 3. / 4</text>
    <text x="768" y="136">Előtte: S2 · 2,4 m · É fal</text>
    <text x="768" y="154">Utána: S4 · 3,1 m · K fal</text>
    <text x="768" y="172" fill="#1d9e75">✓ fizikai út megvan</text>
