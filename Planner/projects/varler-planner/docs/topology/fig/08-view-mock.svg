    <rect x="218" y="188" width="530" height="150" fill="#eef5f1"/><text x="740" y="204" font-size="10" fill="#6d6a63" text-anchor="end">Szoba</text>
    <rect x="218" y="342" width="530" height="150" fill="#eef2f8"/><text x="740" y="358" font-size="10" fill="#6d6a63" text-anchor="end">Fürdő</text>
