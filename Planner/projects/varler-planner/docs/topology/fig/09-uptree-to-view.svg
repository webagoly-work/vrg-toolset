<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Segoe UI,Arial,sans-serif">
  <title>From the stored up-tree to the Topology View, and the PCB words</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d6a63"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d9e75"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f79c9"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d85a30"/></marker>
    <g id="soc"><circle r="6.5" fill="#fff" stroke="#1d9e75" stroke-width="2.2"/></g>
    <g id="lmp"><circle r="7.5" fill="#fff" stroke="#2f79c9" stroke-width="2"/><path d="M-5.3,-5.3 L5.3,5.3 M5.3,-5.3 L-5.3,5.3" stroke="#2f79c9" stroke-width="1.5"/></g>
    <g id="swi"><rect x="-6" y="-6" width="12" height="12" fill="#fff" stroke="#7f77dd" stroke-width="2"/></g>
    <g id="ded"><path d="M0,-8 l8,8 l-8,8 l-8,-8 z" fill="#fff" stroke="#d85a30" stroke-width="2"/></g>
    <g id="kd"><rect x="-7" y="-7" width="14" height="14" fill="#e67e22"/></g>
  </defs>
  <rect width="980" height="560" fill="#fbfaf6"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#262624">A tárolt betáp-fa (d.up) → Topológia nézet</text>
  <text x="20" y="44" font-size="11" fill="#6d6a63">minden pontnak EGY betápja van (GO WIRE T1); a link fajtája a két végből adódik (tvKind) — nincs második tár</text>

  <!-- left: the records -->
  <g transform="translate(20,60)">
    <rect width="400" height="292" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#262624">A tervben tárolva (eszközönként)</text>
    <g font-family="Consolas,'Azeret Mono',monospace" font-size="11" fill="#262624" xml:space="preserve">
      <text x="14" y="48">A3 mosógép  up: {id: Elosztó, fix}</text>
      <text x="14" y="70">SZD1        up: {id: Elosztó, fix}</text>
      <text x="14" y="92">KD2         up: {id: SZD1}</text>
      <text x="14" y="114">S1 dugalj   up: {id: B12, room: R02}</text>
      <text x="14" y="136">S2 dugalj   up: {id: S1}</text>
      <text x="14" y="158">S3 dugalj   up: {id: S2}</text>
      <text x="14" y="180">K1 kapcs.   up: {id: SZD1}</text>
      <text x="14" y="202">L1 lámpa    up: {id: K1}   meet: SZD1</text>
      <text x="14" y="224">S4 dugalj   up: {id: KD2, fix}</text>
    </g>
    <g font-size="10" fill="#6d6a63">
      <text x="270" y="48">feed (home run)</text><text x="270" y="70">feed → master</text><text x="270" y="92">feed: string (G2)</text>
      <text x="270" y="114">master: leader (ajtó L4)</text><text x="270" y="136">chain</text><text x="270" y="158">chain → tail</text>
      <text x="270" y="180">master: kapcsoló</text><text x="300" y="202">lamp</text><text x="270" y="224">master: KD (G1)</text>
    </g>
    <path d="M14,240 H386" stroke="#d8d4ca"/>
    <g font-size="10.5" fill="#262624">
      <text x="14" y="258">fix = rögzített (folytonos) · nincs fix = javasolt (szaggatott)</text>
      <text x="14" y="276">bekötetlen = piros gyűrű (a motor R.unreached listájából)</text>
    </g>
  </g>

  <path d="M430,200 H478" stroke="#6d6a63" stroke-width="2" marker-end="url(#a)"/>
  <text x="432" y="190" font-size="9.5" fill="#6d6a63">tvKind</text><text x="432" y="218" font-size="9.5" fill="#6d6a63">tpoLayout</text>

  <!-- right: the view -->
  <g transform="translate(490,60)">
    <rect width="470" height="292" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <g font-size="9.5" fill="#6d6a63" font-weight="600"><text x="16" y="20">Elosztó</text><text x="86" y="20">közép</text><text x="186" y="20">leader</text><text x="300" y="20">→ tail</text></g>
    <rect x="70" y="30" width="390" height="120" fill="#eef5f1"/><text x="452" y="44" font-size="9.5" fill="#6d6a63" text-anchor="end">R02 Szoba</text>
    <rect x="70" y="154" width="390" height="128" fill="#f3f1ea"/><text x="452" y="168" font-size="9.5" fill="#6d6a63" text-anchor="end">R03 Konyha</text>
    <g fill="none" stroke-width="2.3" stroke-linecap="round">
      <path d="M40,150 C70,150 80,70 92,70" stroke="#1d9e75" stroke-dasharray="6 3"/>
      <path d="M106,70 H178" stroke="#1d9e75" stroke-dasharray="6 3" marker-end="url(#ag)"/>
      <path d="M200,70 H252 M266,70 H318" stroke="#1d9e75" stroke-dasharray="6 3"/>
      <path d="M40,156 C80,156 90,200 110,200" stroke="#2c2c2c"/>
      <path d="M124,200 C150,200 150,124 178,124" stroke="#2f79c9"/><path d="M194,124 H246" stroke="#2f79c9" stroke-dasharray="6 3"/>
      <path d="M124,204 H160" stroke="#2c2c2c"/>
      <path d="M182,204 H230" stroke="#16a3b8"/>
      <path d="M40,162 C80,162 100,262 178,262" stroke="#d85a30" marker-end="url(#ar)"/>
    </g>
    <rect x="24" y="128" width="16" height="44" rx="2" fill="#2c3e50"/>
    <g><rect x="92" y="63" width="14" height="14" fill="none" stroke="#b0600f" stroke-width="2" stroke-dasharray="3 2"/><text x="84" y="94" font-size="9" fill="#b0600f">B12 L4</text></g>
    <use href="#kd" x="117" y="200"/><text x="102" y="222" font-size="9" fill="#b0600f">SZD1</text>
    <use href="#kd" x="170" y="204"/><text x="160" y="226" font-size="9" fill="#b0600f">KD2</text>
    <use href="#soc" x="190" y="70"/><use href="#soc" x="259" y="70"/><use href="#soc" x="325" y="70"/>
    <use href="#swi" x="186" y="124"/><use href="#lmp" x="254" y="124"/>
    <use href="#soc" x="238" y="204"/><use href="#ded" x="190" y="262"/>
    <g font-size="9" fill="#262624"><text x="180" y="90">S1</text><text x="250" y="90">S2</text><text x="316" y="90">S3</text><text x="178" y="142">K1</text><text x="246" y="142">L1</text><text x="232" y="222">S4</text><text x="204" y="266">A3</text></g>
    <g font-size="9" fill="#c0392b"><text x="246" y="194">CK-14: G1</text><text x="132" y="236">CK-14: G2</text></g>
  </g>

  <!-- PCB mapping -->
  <g transform="translate(20,366)">
    <rect width="940" height="180" rx="8" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#262624">GO ROUTE: a NYÁK-tervezők szavai → a Planner</text>
    <g font-size="10.5" fill="#262624">
      <text x="14" y="46" font-weight="700">NYÁK (EDA)</text><text x="250" y="46" font-weight="700">Planner</text><text x="560" y="46" font-weight="700">Hol</text>
      <path d="M10,54 H930" stroke="#d8d4ca"/>
      <text x="14" y="72">netlist (mi mivel kötendő)</text><text x="250" y="72">áramkörök + betáp-fa (d.up)</text><text x="560" y="72">05j, 08od — megvan</text>
      <text x="14" y="90">ratsnest / airwire (még nem huzalozott vonal)</text><text x="250" y="90">a Topológia nézet vonalai</text><text x="560" y="90">TV0–TV2</text>
      <text x="14" y="108">rétegek + via</text><text x="250" y="108">falsíkok, mennyezet, padló + szervizpont-átvezetés</text><text x="560" y="108">network.js — megvan</text>
      <text x="14" y="126">design rules / DRC</text><text x="250" y="126">jelölések (tilos / mínusz / előnyben) + Pálya-ellenőrzés</text><text x="560" y="126">T0 — megvan; MP-4 / MP-5 nyitott</text>
      <text x="14" y="144">autorouter (rip-up, negotiated congestion)</text><text x="250" y="144">plan.js: a fa illesztése falakba, torlódási tag</text><text x="560" y="144">T2 megvan; G8 = GO ROUTE magja</text>
      <text x="14" y="162">a router menetei (pass) képernyőn</text><text x="250" y="162">▶ Bekötés lejátszása</text><text x="560" y="162">TV11 + G7 napló</text>
    </g>
  </g>
</svg>
