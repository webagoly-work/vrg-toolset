<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="Segoe UI,Arial,sans-serif">
  <title>Autowiring playback: circuit by circuit, then the composite</title>
  <defs>
    <g id="net" fill="none" stroke="#e1ddd3" stroke-width="3" stroke-linecap="round">
      <path d="M20,100 H90 M90,100 V40 H200 M90,100 V160 H200 M200,40 V100 M200,160 V100 M90,40 L60,40"/>
    </g>
    <g id="pts">
      <rect x="12" y="86" width="14" height="28" rx="2" fill="#2c3e50"/>
      <rect x="84" y="94" width="12" height="12" fill="#e67e22"/>
      <circle cx="150" cy="40" r="5.5" fill="#fff" stroke="#1d9e75" stroke-width="2"/><circle cx="200" cy="40" r="5.5" fill="#fff" stroke="#1d9e75" stroke-width="2"/><circle cx="200" cy="100" r="5.5" fill="#fff" stroke="#1d9e75" stroke-width="2"/>
      <rect x="140" y="154" width="11" height="11" fill="#fff" stroke="#7f77dd" stroke-width="2"/>
      <circle cx="200" cy="160" r="6.5" fill="#fff" stroke="#2f79c9" stroke-width="2"/>
      <path d="M60,32 l8,8 l-8,8 l-8,-8 z" fill="#fff" stroke="#d85a30" stroke-width="2"/>
    </g>
  </defs>
  <rect width="980" height="330" fill="#fbfaf6"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#262624">Bekötés lejátszása — körönként egy villanás, a végén az összkép</text>
  <text x="20" y="44" font-size="11" fill="#6d6a63">a kör útja végigfut a pálya-gráfon (stroke-dashoffset), a többi halványan marad; ⏭ léptet, Esc / ⏹ az összképre ugrik</text>

  <!-- frame 1 -->
  <g transform="translate(20,62)">
    <rect width="224" height="196" rx="6" fill="#fff" stroke="#d8d4ca"/><text x="10" y="18" font-size="11" font-weight="700" fill="#1d9e75">1 · A1 dugaljkör</text>
    <g transform="translate(4,14)"><use href="#net"/>
      <path d="M26,100 H90 V40 H200 V100" fill="none" stroke="#1d9e75" stroke-width="4" stroke-linecap="round"/>
      <use href="#pts"/></g>
    <text x="10" y="188" font-size="10" fill="#262624">Elosztó → KD → 3 dugalj · 7,2 m</text>
  </g>
  <!-- frame 2 -->
  <g transform="translate(260,62)">
    <rect width="224" height="196" rx="6" fill="#fff" stroke="#d8d4ca"/><text x="10" y="18" font-size="11" font-weight="700" fill="#d85a30">2 · A3 mosógép (DED)</text>
    <g transform="translate(4,14)"><use href="#net"/>
      <path d="M26,100 H90 V40 H66" fill="none" stroke="#d85a30" stroke-width="4" stroke-linecap="round"/>
      <path d="M26,104 H90 V40 H200 V100" fill="none" stroke="#1d9e75" stroke-width="2" opacity="0.3"/>
      <use href="#pts"/></g>
    <text x="10" y="188" font-size="10" fill="#262624">KD-n át bontás nélkül · 3,1 m</text>
  </g>
  <!-- frame 3 -->
  <g transform="translate(500,62)">
    <rect width="224" height="196" rx="6" fill="#fff" stroke="#d8d4ca"/><text x="10" y="18" font-size="11" font-weight="700" fill="#2f79c9">3 · V1 világítás</text>
    <g transform="translate(4,14)"><use href="#net"/>
      <path d="M26,100 H90 V160 H146 M151,160 H194" fill="none" stroke="#2f79c9" stroke-width="4" stroke-linecap="round"/>
      <path d="M26,104 H90 V40 H200 V100 M90,40 H66" fill="none" stroke="#9a968c" stroke-width="2" opacity="0.35"/>
      <use href="#pts"/></g>
    <text x="10" y="188" font-size="10" fill="#262624">KD = betáp · lánc K → L · 4,6 m</text>
  </g>
  <!-- composite -->
  <g transform="translate(740,62)">
    <rect width="220" height="196" rx="6" fill="#fff" stroke="#262624" stroke-width="1.2"/><text x="10" y="18" font-size="11" font-weight="700" fill="#262624">Σ összkép</text>
    <g transform="translate(4,14)"><use href="#net"/>
      <path d="M26,100 H90" stroke="#262624" stroke-width="9" stroke-linecap="round"/><path d="M26,100 H90" stroke="#fff" stroke-width="3"/>
      <path d="M90,100 V40" stroke="#262624" stroke-width="6" stroke-linecap="round"/><path d="M90,100 V40" stroke="#fff" stroke-width="1.6"/>
      <path d="M90,40 H200 V100 M90,40 H66" fill="none" stroke="#262624" stroke-width="3"/>
      <path d="M90,100 V160 H200" fill="none" stroke="#262624" stroke-width="3"/>
      <use href="#pts"/>
      <g font-size="9" fill="#262624"><text x="30" y="92">2 × M20</text><text x="94" y="74">2 kör</text></g></g>
    <text x="10" y="188" font-size="10" fill="#262624">vastagság = csőszám · felirat = méret</text>
  </g>

  <!-- timeline -->
  <g transform="translate(20,276)">
    <rect width="940" height="40" rx="6" fill="#fff" stroke="#d8d4ca"/>
    <text x="14" y="25" font-size="13" fill="#262624">▶ ⏸ ⏭ ⏹</text>
    <rect x="110" y="16" width="560" height="8" rx="4" fill="#ece9e1"/>
    <rect x="110" y="16" width="140" height="8" fill="#1d9e75"/><rect x="250" y="16" width="140" height="8" fill="#d85a30"/><rect x="390" y="16" width="140" height="8" fill="#2f79c9"/>
    <rect x="530" y="16" width="140" height="8" rx="0" fill="#262624"/>
    <text x="690" y="25" font-size="11" fill="#262624">sebesség ½× · 1× · 2× · ⏩</text>
    <text x="928" y="25" font-size="10" fill="#6d6a63" text-anchor="end">≈ 0,6 s / kör</text>
  </g>
</svg>
