<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" width="960" height="860" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img"><title>IDEA-003 F2 — the L pattern in CLA R06 nappali and R07 szoba</title><desc>Plan of R06 and R07 from the CLA test plan: walls, doors with handing, RBX06, the two rooms' Silver Rails along their L-forma walls, the Portals and the corner cluster points.</desc><rect width="960" height="860" fill="#ffffff"/><defs><clipPath id="vw"><rect x="40" y="70" width="568" height="731"/></clipPath></defs><text x="40" y="30" font-size="13" fill="#2b2b2b" font-weight="600">IDEA-003 · F2 — the L pattern: CLA R06 nappali + R07 szoba (geometry from CLA-teszt_v2)</text><text x="40" y="48" font-size="11" fill="#9a978f">Plan, 1 px = 10 mm. Thick faces = the user's L-forma marks. Both rooms are served by RBX06 on their shared wall W15.</text><g clip-path="url(#vw)"><polygon points="-226,279.2 -369.6,279.2 -369.6,100 -226,100" fill="#fafafa" stroke="none"/><polygon points="-139.5,688.1 -369.6,688.1 -369.6,304.2 -115,304.2 -115,300.6 54.7,300.6 54.7,394.4 44.3,394.4 44.3,555 -139.5,555" fill="#fafafa" stroke="none"/><polygon points="-140,279.2 -206,279.2 -206,100 -140,100" fill="#fafafa" stroke="none"/><polygon points="54.7,275.6 -31.5,275.6 -31.5,100 54.7,100" fill="#fafafa" stroke="none"/><polygon points="-51.5,300.6 -115,300.6 -115,100 -51.5,100" fill="#fafafa" stroke="none"/><polygon points="562,482.5 84.7,482.5 84.7,100 562,100" fill="#f6f4ee" stroke="none"/><polygon points="562,766 171.8,766 171.8,615 84.7,615 84.7,507.5 562,507.5" fill="#f6f4ee" stroke="none"/><polygon points="141.8,766 64.9,766 64.9,688.1 -114.5,688.1 -114.5,575 54.7,575 54.7,635 141.8,635" fill="#fafafa" stroke="none"/><rect x="562" y="95.8" width="40" height="685.2" fill="#d8d5cc" stroke="#8a877f" stroke-width="0.6"/><rect x="49.9" y="766" width="552.1" height="30" fill="#d8d5cc" stroke="#8a877f" stroke-width="0.6"/><rect x="34.9" y="703.1" width="30" h