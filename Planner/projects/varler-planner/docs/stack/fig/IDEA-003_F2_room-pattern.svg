" y1="264.8" x2="-279.6" y2="264.8" stroke="#2b2b2b" stroke-width="1.4"/><path d="M -279.6 264.8 A 90 90 0 0 0 -369.6 174.8" fill="none" stroke="#9a978f" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="141.8" y="631.7" width="30" height="90" fill="#ffffff"/><line x1="171.8" y1="721.7" x2="261.8" y2="721.7" stroke="#2b2b2b" stroke-width="1.4"/><path d="M 261.8 721.7 A 90 90 0 0 0 171.8 631.7" fill="none" stroke="#9a978f" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="455.7" y="482.5" width="90" height="25" fill="#ffffff"/><line x1="545.7" y1="482.5" x2="545.7" y2="392.5" stroke="#2b2b2b" stroke-width="1.4"/><path d="M 545.7 392.5 A 90 90 0 0 0 455.7 482.5" fill="none" stroke="#9a978f" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="100.4" y="480.5" width="60" height="29" fill="#7f8a96" stroke="#2b2b2b" stroke-width="0.8"/><polyline points="91.7,420.1 91.7,475.5 435.7,475.5" fill="none" stroke="#7f8a96" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="130.4,514.5 91.7,514.5 91.7,608 178.8,608 178.8,741.7" fill="none" stroke="#7f8a96" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="130.4,514.5 435.7,514.5" fill="none" stroke="#7f8a96" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="50,355.1 87.7,355.1 87.7,479.5 130.4,479.5" fill="none" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="8 5"/><rect x="81.7" y="410.1" width="20" height="20" fill="#ffffff" stroke="#1d7a6e" stroke-width="2"/><text x="107.7" y="424.1" font-size="11" fill="#1d7a6e" text-anchor="start" font-weight="600">PT-S · B103 → R06 (H0 hinge side, swing face)</text><rect x="425.7" y="465.5" width="20" height="20" fill="#ffffff" stroke="#1d7a6e" stroke-width="2"/><text x="419.7" y="465.5" font-size="11" fill="#1d7a6e" text-anchor="end" font-weight="600">PT-D · B171 (H0 latch side ×2)</text><rect x="425.7" y="504.5" width="20" height="20" fill="#ffffff" stroke="#1d7a6e" stroke-width="2"/><text x="419.7" y="518.5" font-size="11" fill="#1d7a6e" text-anchor="end" font-weight="600"></text><rect x="168.8" y="731.7" width="20" height="20" fill="#ffffff" stroke="#1d7a6e" stroke-width="2"/><text x="194.8" y="745.7" font-size="11" fill="#1d7a6e" text-anchor="start" font-weight="600">PT-S · B109 → R07 (H0 hinge side)</text><circle cx="100.7" cy="116" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/><circle cx="100.7" cy="116" r="2.5" fill="#2b2b2b"/><circle cx="546" cy="116" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/><circle cx="546" cy="116" r="2.5" fill="#2b2b2b"/><circle cx="546" cy="466.5" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/><circle cx="546" cy="466.5" r="2.5" fill="#2b2b2b"/><circle cx="546" cy="523.5" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/><circle cx="546" cy="523.5" r="2.5" fill="#2b2b2b"/><circle cx="546" cy="750" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/><circle cx="546" cy="750" r="2.5" fill="#2b2b2b"/><circle cx="187.8" cy="750" r="7" fill="none" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="2 2"/></g><text x="322" y="261" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="600">R06 NAPPALI</text><text x="322" y="277" font-size="11" fill="#9a978f" text-anchor="middle">18.4 m² · RB-H RBX06 · 2 doors on its L</text><text x="352" y="651" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="600">R07 SZOBA</text><text x="352" y="667" font-size="11" fill="#9a978f" text-anchor="middle">12.2 m² · from RBX06 · an L-shaped room</text><text x="164.4" y="499" font-size="11" fill="#2b2b2b" font-weight="600">RBX06</text><text x="42" y="333.1" font-size="11" fill="#8a6d12">from RBX03</text><text x="50" y="731" font-size="11" fill="#9a978f">R08</text><text x="47" y="221" font-size="11" fill="#9a978f">R03 / R05</text><line x1="640" y1="110" x2="666" y2="110" stroke="#7f8a96" stroke-width="4"/><text x="674" y="114" font-size="11" fill="#2b2b2b" font-weight="600">Silver Rail</text><text x="674" y="129" font-size="11" fill="#9a978f">RBX ↔ Portals, ZW-o ≈ 2450</text><line x1="640" y1="150" x2="666" y2="150" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="8 5"/><text x="674" y="154" font-size="11" fill="#2b2b2b" font-weight="600">golden channel</text><text x="674" y="169" font-size="11" fill="#9a978f">RBX03 → RBX06, above the rail</text><rect x="645" y="182" width="16" height="16" fill="#ffffff" stroke="#1d7a6e" stroke-width="2"/><text x="674" y="194" font-size="11" fill="#2b2b2b" font-weight="600">Portal corner box H0</text><text x="674" y="209" font-size="11" fill="#9a978f">the nest, 2450</text><circle cx="653" cy="230" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/><text x="674" y="234" font-size="11" fill="#2b2b2b" font-weight="600">corner cluster point</text><text x="674" y="249" font-size="11" fill="#9a978f">the corners the L leaves out</text><line x1="640" y1="270" x2="666" y2="270" stroke="#2b2b2b" stroke-width="2.2" opacity="0.55"/><text x="674" y="274" font-size="11" fill="#2b2b2b" font-weight="600">L-forma face</text><text x="674" y="289" font-size="11" fill="#9a978f">the user's mark in the plan</text><rect x="640" y="303" width="26" height="14" fill="#7f8a96" stroke="#2b2b2b" stroke-width="0.8"/><text x="674" y="314" font-size="11" fill="#2b2b2b" font-weight="600">RBX (RB-H)</text><text x="640" y="346" font-size="11" fill="#2b2b2b" font-weight="600">Read in the model:</text><text x="640" y="362" font-size="11" fill="#55534d" font-weight="400">· B103 and B171 both open INTO R06, so R06</text><text x="640" y="378" font-size="11" fill="#55534d" font-weight="400">  sees their swing faces (Q-SF-08 rule H0-2).</text><text x="640" y="394" font-size="11" fill="#55534d" font-weight="400">· B171's hinge jamb is only 163 mm from</text><text x="640" y="410" font-size="11" fill="#55534d" font-weight="400">  the east wall: no room for a 200 box in</text><text x="640" y="426" font-size="11" fill="#55534d" font-weight="400">  ZS-t(h), so H0 moves to the latch side</text><text x="640" y="442" font-size="11" fill="#55534d" font-weight="400">  (rule H0-3) on both faces.</text><text x="640" y="458" font-size="11" fill="#55534d" font-weight="400">· R07's two L-forma faces do not meet: its</text><text x="640" y="474" font-size="11" fill="#55534d" font-weight="400">  rail goes round the R08 notch (W12, W13).</text><text x="640" y="490" font-size="11" fill="#55534d" font-weight="400">· R06 and R07 share W15 as one arm each;</text><text x="640" y="506" font-size="11" fill="#55534d" font-weight="400">  RBX06 sits in it and feeds both rails.</text><text x="640" y="522" font-size="11" fill="#55534d" font-weight="400">· R07 SW corner point lies 120 mm from</text><text x="640" y="538" font-size="11" fill="#55534d" font-weight="400">  the H0 of B109: the Portal absorbs it.</text></svg>
