<!doctype html>
<html lang="hu" class="mv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solomon Gömb</title>
<style>
/*MELYVIZ*/
html, body { margin: 0; height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 42%, var(--mv-horizon), var(--mv-bg) 68%); }
header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px 8px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; }
.stamp { font: 11px var(--mv-mono); color: var(--mv-faint); }
.pager { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
.pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; width: 100%; box-sizing: border-box; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; padding: 0 16px 12px; }
#p-sphere { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.stage { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas.drag { cursor: grabbing; }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 0 10px; max-width: 620px; width: 100%; margin: 0 auto; }
.chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; text-align: left; background: var(--mv-panel); min-width: 0; }
.chip[aria-pressed=true] { border-color: var(--mv-accent); background: var(--mv-accent-soft); }
.chip b { font: 600 20px var(--mv-mono); }
.chip span { font-size: 11px; color: var(--mv-dim); letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw { flex: none; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; }
.sw.c { background: var(--mv-crit); }
.sw.d { border: 2px solid var(--mv-warn); }
.sw.f { border: 2px dotted var(--mv-dim); }
nav { display: flex; border-top: 1px solid var(--mv-line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; padding: 11px 6px; border: 0; background: none; color: var(--mv-faint); font: 600 12px var(--mv-voice); letter-spacing: .12em; text-transform: uppercase; }
nav button[aria-current=true] { color: var(--mv-accent); box-shadow: inset 0 2px 0 var(--mv-accent); }
h2 { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; margin: 6px 0 10px; color: var(--mv-dim); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filters button { padding: 6px 10px; font-size: 12px; background: var(--mv-panel); }
.filters button[aria-pressed=true] { border-color: var(--mv-accent); color: var(--mv-accent); }
.row { display: block; width: 100%; box-sizing: border-box; text-align: left; padding: 9px 11px; margin-bottom: 6px; background: var(--mv-panel); border: 1px solid var(--mv-line); max-width: 860px; }
.row .t { display: flex; gap: 8px; align-items: center; font-size: 14px; line-height: 1.3; }
.row .t span:last-child { min-width: 0; overflow-wrap: anywhere; }
.row small { display: block; margin-top: 3px; color: var(--mv-faint); font: 11px var(--mv-mono); overflow-wrap: anywhere; }
table { width: 100%; max-width: 860px; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--mv-line); vertical-align: top; }
td.n { font-family: var(--mv-mono); white-space: nowrap; }
#card { position: fixed; z-index: 5; right: 16px; top: 56px; bottom: 56px; width: min(440px, calc(100vw - 32px)); box-sizing: border-box; overflow-y: auto; padding: 14px 16px; background: var(--mv-panel-solid); border: 1px solid var(--mv-line-strong); }
#card[hidden] { display: none; }
#card h3 { margin: 0 26px 3px 0; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
#card .path { font: 11px var(--mv-mono); color: var(--mv-faint); overflow-wrap: anywhere; }
#close { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; padding: 0; background: none; border: 0; color: var(--mv-dim); font-size: 18px; }
.sig { margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--mv-line); }
.sig .head { font-size: 14px; display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere; }
.tag { font: 10px var(--mv-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mv-dim); margin-top: 3px; }
.quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.quotes.one { grid-template-columns: 1fr; }
blockquote { margin: 0; padding: 8px 9px; background: var(--mv-raised); border: 1px solid var(--mv-line); font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; min-width: 0; }
blockquote cite { display: block; margin-top: 6px; font: 10.5px var(--mv-mono); color: var(--mv-faint); }
.note { margin-top: 7px; font-size: 12.5px; color: var(--mv-dim); }
.rule { margin-top: 9px; display: grid; gap: 6px; }
.rule textarea { width: 100%; box-sizing: border-box; min-height: 46px; padding: 6px; font-size: 13px; resize: vertical; }
.rule .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rule button { padding: 7px 4px; font-size: 12px; background: var(--mv-raised); }
.rule code { display: block; padding: 6px; font-size: 11px; background: var(--mv-raised); overflow-wrap: anywhere; user-select: all; }
.done { margin-top: 8px; font-size: 13px; color: var(--mv-ok); }
.empty { color: var(--mv-faint); font-size: 14px; }
@media (max-width: 640px) {
  #card { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 72vh; border-width: 1px 0 0; }
  .quotes { grid-template-columns: 1fr; }
  .chip { padding: 7px 8px; gap: 3px 6px; flex-wrap: wrap; }
  .chip b { font-size: 17px; }
  .chip span:last-child { flex-basis: 100%; }
}
</style>
</head>
<body>
<header><h1>Solomon · Gömb</h1><span class="stamp" id="stamp"></span></header>
<main class="pager" id="pager">
  <section class="page" id="p-sphere" aria-label="Gömb">
    <div class="stage"><canvas id="c" role="img" aria-label="Forgó gömb: egy pont egy dokumentum, a szigetek a szakaszok"></canvas></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="page" id="p-signals" aria-label="Jelzések">
    <h2>Jelzések</h2>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>
  <section class="page" id="p-sections" aria-label="Szakaszok">
    <h2>Szakaszok</h2>
    <table><thead><tr><th>Szakasz</th><th>Dok.</th><th>Nyitott</th><th>Átnézve</th><th>Gyakornok</th></tr></thead><tbody id="secs"></tbody></table>
  </section>
</main>
<nav id="tabs"></nav>
<aside id="card" class="mv-solid" hidden aria-live="polite"><button id="close" aria-label="Bezárás">×</button><div id="cardBody"></div></aside>

<script>
'use strict';
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const TYPE = { contradiction: 'Ellentmondás', dark: 'Sötét zóna', frozen: 'Dermedt' };
const SW = { contradiction: 'c', dark: 'd', frozen: 'f' };
const STAGE = { candidate: 'jelölt', confirmed: 'megerősítve', dismissed: 'elvetve' };
const HOW = { first: 'Az első áll', second: 'A második áll', coexist: 'Megférnek egymás mellett' };

/* ---- placement: keep this formula identical in the phone port (docs/mobile/WP/M14.md) ---- */
const GOLD = Math.PI * (3 - Math.sqrt(5));
const fib = (i, n) => { const y = 1 - 2 * (i + .5) / n, r = Math.sqrt(1 - y * y), a = i * GOLD; return [Math.cos(a) * r, y, Math.sin(a) * r]; };
const add = (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

const open = s => !s.ruling && s.stage !== 'dismissed';
const openSignals = DATA ? DATA.signals.filter(open) : [];
const docs = DATA ? DATA.docs : [];
const islands = [];
if (DATA) {
  const most = Math.max(...DATA.sections.map(s => s.docs));
  DATA.sections.forEach((s, i) => {
    const c = fib(i, DATA.sections.length), t1 = unit(cross(c, Math.abs(c[1]) > .9 ? [1, 0, 0] : [0, 1, 0])), t2 = cross(c, t1);
    const cap = .16 + .36 * Math.sqrt(s.docs / most);
    const members = docs.filter(d => d.s === s.id);
    members.forEach((d, j) => {
      const r = cap * Math.sqrt((j + .5) / members.length), a = j * GOLD;
      d.pos = unit(add(add(c, t1, r * Math.cos(a)), t2, r * Math.sin(a)));
      d.sig = [];
    });
    islands.push({ ...s, c });
  });
  for (const s of DATA.signals) {
    for (const i of [s.ai, s.bi]) if (i != null && docs[i] && !docs[i].sig.includes(s)) docs[i].sig.push(s);
  }
}
const ambient = Array.from({ length: 640 }, (_, i) => fib(i, 640));
const rank = d => {
  let best = 0;
  for (const s of d.sig) {
    if (!open(s)) continue;
    const r = s.type === 'contradiction' ? (s.stage === 'confirmed' ? 4 : 3) : s.type === 'dark' ? 2 : 1;
    if (r > best) best = r;
  }
  return best;
};
docs.forEach(d => { d.rank = rank(d); });
const arcs = openSignals.filter(s => s.type === 'contradiction' && s.ai != null && s.bi != null && s.ai !== s.bi);

/* ---- the sphere ---- */
const cv = $('c'), g = cv.getContext('2d');
const COL = { ice: css('--mv-accent'), warm: css('--mv-warm'), crit: css('--mv-crit'), warn: css('--mv-warn'), dim: css('--mv-dim'), ok: css('--mv-ok'), bg: css('--mv-bg'), text: css('--mv-dim') };
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, R = 0, CX = 0, CY = 0, dpr = 1;
let yaw = .6, pitch = -.25, vyaw = still ? 0 : .07, focus = null, selected = null, layer = null, seenPage = 0;
const today = DATA ? Date.parse(DATA.generated) : 0;

function size() {
  const b = cv.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = b.width; H = b.height;
  cv.width = W * dpr; cv.height = H * dpr;
  R = Math.min(W, H) * .47; CX = W / 2; CY = H / 2;
}
function project(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x = p[0] * cy + p[2] * sy, z0 = -p[0] * sy + p[2] * cy;
  const y = p[1] * cp - z0 * sp, z = p[1] * sp + z0 * cp;
  return [CX + R * x, CY - R * y, z];
}
const dimmed = d => layer && !d.sig.some(s => open(s) && s.type === layer);

function drawArc(a, b, s, t) {
  const pa = a.pos, pb = b.pos, ang = Math.acos(Math.min(1, Math.max(-1, pa[0] * pb[0] + pa[1] * pb[1] + pa[2] * pb[2])));
  const sin = Math.sin(ang) || 1, red = s.stage === 'confirmed';
  if (layer && layer !== 'contradiction') return;
  g.strokeStyle = COL.crit; g.lineWidth = red ? 1.3 : .7; g.setLineDash(red ? [] : [2, 4]);
  let prev = null;
  for (let i = 0; i <= 36; i++) {
    const u = i / 36, k1 = Math.sin((1 - u) * ang) / sin, k2 = Math.sin(u * ang) / sin, lift = 1 + .14 * Math.sin(Math.PI * u);
    const p = project([(pa[0] * k1 + pb[0] * k2) * lift, (pa[1] * k1 + pb[1] * k2) * lift, (pa[2] * k1 + pb[2] * k2) * lift]);
    if (prev) {
      g.globalAlpha = (red ? .9 : .3) * Math.max(.12, (p[2] + 1) / 2);
      g.beginPath(); g.moveTo(prev[0], prev[1]); g.lineTo(p[0], p[1]); g.stroke();
    }
    prev = p;
  }
  g.setLineDash([]);
}

function frame(ms) {
  const t = ms / 1000;
  requestAnimationFrame(frame);
  if (document.hidden || (seenPage !== 0 && !focus)) return;
  const dt = Math.min(.05, t - (frame.last || t)); frame.last = t;
  if (focus) {
    const dy = ((focus[0] - yaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    yaw += dy * Math.min(1, dt * 5); pitch += (focus[1] - pitch) * Math.min(1, dt * 5);
    if (Math.abs(dy) < .004 && Math.abs(focus[1] - pitch) < .004) focus = null;
  } else if (!dragging && !selected) yaw += vyaw * dt;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.globalAlpha = 1;
  g.strokeStyle = COL.ice; g.globalAlpha = .16; g.lineWidth = 1; g.beginPath(); g.arc(CX, CY, R, 0, 7); g.stroke();
  g.fillStyle = COL.ice;
  for (const p of ambient) {
    const q = project(p);
    g.globalAlpha = q[2] > 0 ? .1 + .16 * q[2] : .05;
    g.fillRect(q[0], q[1], 1.4, 1.4);
  }
  const pulse = still ? .5 : .5 + .5 * Math.sin(t * 2.6);
  for (const d of docs) {
    const q = d.q = project(d.pos), depth = .2 + .8 * (q[2] + 1) / 2, faint = dimmed(d) ? .22 : 1;
    const size = 1.6 + Math.min(1.8, d.i * .25);
    if (d.rank === 4) {
      g.globalAlpha = depth * (.2 + .25 * pulse) * faint; g.fillStyle = COL.crit;
      g.beginPath(); g.arc(q[0], q[1], 6 + 5 * pulse, 0, 7); g.fill();
      g.globalAlpha = depth * faint;
      g.beginPath(); g.arc(q[0], q[1], 3.4, 0, 7); g.fill();
    } else if (d.rank === 3) {
      g.globalAlpha = depth * .75 * faint; g.strokeStyle = COL.crit; g.lineWidth = 1.2;
      g.beginPath(); g.arc(q[0], q[1], 3.6, 0, 7); g.stroke();
    } else if (d.rank === 2) {
      g.globalAlpha = depth * .9 * faint; g.strokeStyle = COL.warn; g.lineWidth = 1.2;
      g.beginPath(); g.arc(q[0], q[1], 3.4, 0, 7); g.stroke();
    } else if (d.rank === 1) {
      g.globalAlpha = depth * .8 * faint; g.strokeStyle = COL.dim; g.lineWidth = 1.1; g.setLineDash([1.2, 2.2]);
      g.beginPath(); g.arc(q[0], q[1], 3.6, 0, 7); g.stroke(); g.setLineDash([]);
    } else {
      const recent = today - Date.parse(d.d) < 7 * 864e5;
      g.globalAlpha = depth * (recent ? 1 : .8) * faint; g.fillStyle = recent ? COL.warm : COL.ice;
      g.beginPath(); g.arc(q[0], q[1], size, 0, 7); g.fill();
    }
    if (d === selected) {
      g.globalAlpha = 1; g.strokeStyle = COL.ice; g.lineWidth = 1.4;
      g.beginPath(); g.arc(q[0], q[1], 9, 0, 7); g.stroke();
    }
  }
  for (const s of arcs) drawArc(docs[s.ai], docs[s.bi], s, t);
  // Island names on the near side only; a label that would touch a nearer one is left out.
  g.globalAlpha = 1; g.font = '600 11px ' + css('--mv-voice'); g.textAlign = 'center'; g.lineJoin = 'round';
  const placed = [];
  for (const i of islands.map(x => ({ x, q: project(x.c) })).sort((a, b) => b.q[2] - a.q[2])) {
    if (i.q[2] < .2) continue;
    const label = i.x.n.toUpperCase(), w = g.measureText(label).width + 10, box = [i.q[0] - w / 2, i.q[1] - 9, w, 16];
    if (placed.some(b => box[0] < b[0] + b[2] && box[0] + box[2] > b[0] && box[1] < b[1] + b[3] && box[1] + box[3] > b[1])) continue;
    placed.push(box);
    g.globalAlpha = Math.min(1, (i.q[2] - .2) * 3);
    g.strokeStyle = COL.bg; g.lineWidth = 3.5; g.strokeText(label, i.q[0], i.q[1] + 3);
    g.fillStyle = COL.text; g.fillText(label, i.q[0], i.q[1] + 3);
  }
  g.globalAlpha = 1;
}

/* ---- touch: inside the disc turns the sphere, outside it the page swipes ---- */
let dragging = false, down = null, moved = 0;
const inDisc = (x, y) => { const b = cv.getBoundingClientRect(); return Math.hypot(x - b.left - CX, y - b.top - CY) <= R + 14; };
cv.addEventListener('touchstart', e => { if (inDisc(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault(); }, { passive: false });
cv.addEventListener('pointerdown', e => {
  if (!inDisc(e.clientX, e.clientY)) return;
  dragging = true; down = [e.clientX, e.clientY]; moved = 0; focus = null;
  cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - down[0], dy = e.clientY - down[1];
  moved += Math.abs(dx) + Math.abs(dy); down = [e.clientX, e.clientY];
  yaw += dx / R; pitch = Math.max(-1.3, Math.min(1.3, pitch + dy / R));
});
cv.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false; cv.classList.remove('drag');
  if (moved < 7) pick(e.clientX, e.clientY);
});
cv.addEventListener('pointercancel', () => { dragging = false; cv.classList.remove('drag'); });

function pick(cx, cy) {
  const b = cv.getBoundingClientRect(), x = cx - b.left, y = cy - b.top;
  let best = null, bd = 1e9;
  for (const d of docs) {
    if (!d.q || d.q[2] < 0) continue;
    const reach = d.rank ? 22 : 10, dist = Math.hypot(d.q[0] - x, d.q[1] - y) - d.rank * 2;
    if (Math.hypot(d.q[0] - x, d.q[1] - y) < reach && dist < bd) { bd = dist; best = d; }
  }
  if (best) select(best); else closeCard();
}
function select(d, turn) {
  selected = d;
  if (turn) focus = [Math.atan2(-d.pos[0], d.pos[2]), Math.asin(d.pos[1])];
  showCard(d);
}

/* ---- the card ---- */
const serving = location.protocol.startsWith('http');
function ruleBox(s) {
  const box = el('div', 'rule'), why = el('textarea');
  why.placeholder = 'Indoklás (kötelező)'; why.setAttribute('aria-label', 'Indoklás');
  const btns = el('div', 'btns'), out = el('code'); out.hidden = true;
  for (const how of ['first', 'second', 'coexist']) {
    const b = el('button', '', HOW[how]);
    b.onclick = async () => {
      const text = why.value.trim();
      if (!text) { why.focus(); return; }
      if (serving) {
        const r = await fetch('/rule', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: s.id, how, why: text }) });
        if (r.ok) { location.reload(); return; }
        out.hidden = false; out.textContent = 'Nem sikerült menteni: ' + await r.text();
        return;
      }
      out.hidden = false;
      out.textContent = `node tools/solomon.js rule ${s.id} ${how} "${text.replace(/"/g, "'")}"`;
    };
    btns.append(b);
  }
  box.append(why, btns, out);
  return box;
}
function quote(q) {
  const b = el('blockquote', '', q.text);
  b.append(el('cite', '', `${q.p}:${q.line}`));
  return b;
}
function signalBlock(s) {
  const box = el('div', 'sig'), head = el('div', 'head');
  head.append(el('span', 'sw ' + SW[s.type]), el('span', '', s.title));
  box.append(head, el('div', 'tag', [TYPE[s.type], s.kind, STAGE[s.stage], s.keystone && 'sokan hivatkoznak rá'].filter(Boolean).join(' · ')));
  const q = el('div', 'quotes' + (s.b ? '' : ' one'));
  if (s.a) q.append(quote(s.a));
  if (s.b) q.append(quote(s.b));
  box.append(q);
  if (s.note) box.append(el('div', 'note', 'Gyakornok: ' + s.note));
  if (s.ruling) box.append(el('div', 'done', `${HOW[s.ruling.how]} (${s.ruling.date}): ${s.ruling.why}`));
  else if (s.type === 'contradiction' && s.stage === 'confirmed') box.append(ruleBox(s));
  return box;
}
function showCard(d) {
  const body = $('cardBody'); body.textContent = '';
  body.append(el('h3', '', d.t), el('div', 'path', `${d.p} · ${d.d}` + (d.i ? ` · ${d.i} hivatkozás` : '')));
  if (!d.sig.length) body.append(el('p', 'empty', 'Nincs jelzés ezen a dokumentumon.'));
  [...d.sig].sort((a, b) => order(a) - order(b)).forEach(s => body.append(signalBlock(s)));
  $('card').hidden = false;
}
function closeCard() { $('card').hidden = true; selected = null; }
$('close').onclick = closeCard;
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

/* ---- lists ---- */
const order = s => (s.ruling || s.stage === 'dismissed' ? 9 : 0) + (s.stage === 'confirmed' ? 0 : s.type === 'contradiction' ? 1 : s.type === 'dark' ? 2 : 3);
let listType = null;
function renderList() {
  const list = $('list'); list.textContent = '';
  const rows = DATA.signals.filter(s => !listType || s.type === listType).sort((a, b) => order(a) - order(b));
  if (!rows.length) list.append(el('p', 'empty', 'Nincs ilyen jelzés.'));
  for (const s of rows) {
    const b = el('button', 'row'), t = el('div', 't');
    t.append(el('span', 'sw ' + SW[s.type]), el('span', '', s.title));
    const state = s.ruling ? 'eldöntve' : STAGE[s.stage] || s.kind;
    b.append(t, el('small', '', `${s.a ? s.a.p + ':' + s.a.line : ''} · ${state}`));
    b.onclick = () => { const d = docs[s.ai]; if (d) { go(0); select(d, true); } };
    list.append(b);
  }
}
function renderFilters() {
  const box = $('filters'); box.textContent = '';
  for (const [k, n] of [[null, 'Összes'], ...Object.entries(TYPE)]) {
    const b = el('button', '', n); b.setAttribute('aria-pressed', listType === k);
    b.onclick = () => { listType = k; renderFilters(); renderList(); };
    box.append(b);
  }
}
function renderLegend() {
  const box = $('legend'); box.textContent = '';
  for (const k of Object.keys(TYPE)) {
    const b = el('button', 'chip'); b.setAttribute('aria-pressed', layer === k);
    b.append(el('span', 'sw ' + SW[k]), el('b', '', openSignals.filter(s => s.type === k).length), el('span', '', TYPE[k]));
    b.onclick = () => { layer = layer === k ? null : k; renderLegend(); };
    box.append(b);
  }
}
function renderSections() {
  const body = $('secs');
  for (const s of DATA.sections) {
    const tr = el('tr'), n = openSignals.filter(x => x.sec === s.id).length;
    tr.append(el('td', '', s.n), el('td', 'n', s.docs), el('td', 'n', n), el('td', 'n', s.reviewed || '–'), el('td', '', s.summary || ''));
    body.append(tr);
  }
}

/* ---- pages ---- */
const pager = $('pager'), TABS = ['Gömb', 'Jelzések', 'Szakaszok'];
const go = i => pager.scrollTo({ left: i * pager.clientWidth, behavior: still ? 'auto' : 'smooth' });
TABS.forEach((n, i) => { const b = el('button', '', n); b.onclick = () => go(i); $('tabs').append(b); });
function markTab() {
  seenPage = Math.round(pager.scrollLeft / (pager.clientWidth || 1));
  [...$('tabs').children].forEach((b, i) => b.setAttribute('aria-current', i === seenPage));
}
pager.addEventListener('scroll', markTab, { passive: true });
addEventListener('resize', size);

if (DATA) {
  $('stamp').textContent = `${docs.length} dokumentum · ${DATA.generated} · ${DATA.commit}`;
  renderLegend(); renderFilters(); renderList(); renderSections(); markTab(); size();
  requestAnimationFrame(frame);
} else {
  $('stamp').textContent = 'Nincs adat: futtasd a node tools/solomon.js scan parancsot.';
}
</script>
</body>
</html>
