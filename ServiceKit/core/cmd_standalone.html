<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parancsok – ServiceKit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2a93b'/%3E%3Cpath d='M8 11l5 5-5 5M15 21h9' fill='none' stroke='%23161a1f' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/*__CSS__*/
.sa-top { position: sticky; top: 0; z-index: 20; }
.sa-main { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px; }
</style>
</head>
<body class="dark">
<header class="topbar sa-top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 11l5 5-5 5M16 21h8"/></svg></span>
    <span class="brand-name">Parancsok</span>
    <span class="link-state offline"><span class="dot"></span><span id="saSub">ServiceKit · offline</span></span>
  </div>
  <div class="top-actions" style="margin-left:auto">
    <button class="seg" id="langBtn" type="button"></button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme"></button>
  </div>
</header>
<main class="sa-main">
  <h1 id="saTitle"></h1>
  <p class="lede" id="saLede"></p>
  <div id="cmdRoot"></div>
</main>
<div class="toast" id="toast"></div>
<script>
/*__DATA__*/
</script>
<script>
/*__VIEW__*/
</script>
<script>
(function () {
  function g(k, d) { try { var v = localStorage.getItem('sk.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function s(k, v) { try { localStorage.setItem('sk.' + k, JSON.stringify(v)); } catch (e) { } }
  var lang = g('lang', (navigator.language || 'hu').indexOf('hu') === 0 ? 'hu' : 'en');
  var theme = g('theme', 'dark');
  var T = {
    hu: { title: 'Parancsok', lede: 'CMD és PowerShell parancsok szervizeléshez, offline. Kattints egy parancsra a másoláshoz; a változókat (IP, gépnév…) egyszer állítsd be. A csillaggal kedvencet jelölsz.' },
    en: { title: 'Commands', lede: 'CMD and PowerShell commands for service work, offline. Click a command to copy it; set the variables (IP, host…) once. Star the ones you use often.' }
  };
  var view = CmdView.mount(document.getElementById('cmdRoot'), { lang: function () { return lang; }, toast: toast });
  var tt;
  function toast(m, err) { var el = document.getElementById('toast'); el.textContent = m; el.className = 'toast show' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(function () { el.className = 'toast'; }, 1800); }
  var sun = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var moon = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  function paint() {
    document.documentElement.setAttribute('lang', lang);
    document.body.className = theme === 'light' ? 'light' : 'dark';
    document.getElementById('langBtn').innerHTML = lang === 'hu' ? 'HU · <span style="opacity:.5">EN</span>' : '<span style="opacity:.5">HU</span> · EN';
    document.getElementById('themeBtn').innerHTML = theme === 'light' ? moon : sun;
    document.getElementById('saTitle').innerHTML = T[lang].title;
    document.getElementById('saLede').innerHTML = T[lang].lede;
    view.render();
  }
  document.getElementById('langBtn').onclick = function () { lang = lang === 'hu' ? 'en' : 'hu'; s('lang', lang); paint(); };
  document.getElementById('themeBtn').onclick = function () { theme = theme === 'light' ? 'dark' : 'light'; s('theme', theme); paint(); };
  document.onkeydown = function (e) { e = e || window.event; var tg = (e.target || e.srcElement).tagName; if ((e.keyCode === 191 || (e.ctrlKey && e.keyCode === 75)) && tg !== 'INPUT') { view.focus(); if (e.preventDefault) e.preventDefault(); return false; } };
  paint();
})();
</script>
</body>
</html>
