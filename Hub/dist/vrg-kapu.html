<!doctype html>
<html lang="hu" data-theme="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRG Kapu</title>
<style>
/* 00-themes.css */
/* The four VRG themes, verbatim from Modder/vrg-buildtree.html. */
:root{
  --bg:#14100c; --panel:#1d1712; --panel2:#241d16; --ink:#f4e9d6; --muted:#a8977d;
  --accent:#e6a532; --accent-dim:#8a6a2a; --line:#3a2f22;
  --green:#5b8c3e; --green-ink:#9ed46f; --amberflag:#c8912d; --red:#c8492d; --red-ink:#e88b73; --violet:#9a6cc0;
}
[data-theme="light"]{
  --bg:#f4efe6; --panel:#fff; --panel2:#f7f2e8; --ink:#221c14; --muted:#6d6252;
  --accent:#a9781a; --accent-dim:#a9781a; --line:#d8cdb8;
  --green:#4f7d34; --green-ink:#3c6a22; --amberflag:#9a6a10; --red:#b33f22; --red-ink:#8f3016; --violet:#7a4fa8;
}
[data-theme="slate"]{
  --bg:#0f1417; --panel:#161d22; --panel2:#1c252b; --ink:#e6edf2; --muted:#8fa2ad;
  --accent:#4fb0d0; --accent-dim:#2f6f86; --line:#26323a;
  --green:#4f9d6a; --green-ink:#7fd8a0; --amberflag:#c8912d; --red:#d0574a; --red-ink:#ec8b80; --violet:#8f7cd0;
}
[data-theme="green"]{
  --bg:#0b120d; --panel:#111a13; --panel2:#16211a; --ink:#d7f0dc; --muted:#7fa088;
  --accent:#57c07a; --accent-dim:#2f6f45; --line:#20301f; --green:#57c07a; --green-ink:#9ff0b6;
  --amberflag:#c8b02d; --red:#c85a4a; --red-ink:#ec9384; --violet:#7cc0a0;
}

/* Department hues (hub-seed.json "hue"). Four reuse the theme's own colours;
   the other five are new and set per theme so they keep contrast. */
:root{
  --hue-amber:var(--amberflag); --hue-green:var(--green-ink); --hue-red:var(--red-ink); --hue-purple:var(--violet);
  --hue-teal:#4fb8a8; --hue-coral:#e2876a; --hue-blue:#6a9ee0; --hue-pink:#d683b4; --hue-gray:#9a9084;
}
[data-theme="light"]{
  --hue-teal:#1f7d70; --hue-coral:#b4532f; --hue-blue:#2f5fa8; --hue-pink:#a3437c; --hue-gray:#6d6252;
}
[data-theme="slate"]{
  --hue-teal:#4fc0b0; --hue-coral:#e48f74; --hue-blue:#78a8ec; --hue-pink:#d98cbc; --hue-gray:#8fa2ad;
}
[data-theme="green"]{
  --hue-teal:#5cc8b0; --hue-coral:#e0907a; --hue-blue:#7aa8e0; --hue-pink:#d890b8; --hue-gray:#8fa894;
}

/* 10-layout.css */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DejaVu Sans",-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}

.kp-top{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.kp-brand{font-weight:700;font-size:17px;letter-spacing:.02em;color:var(--accent)}
.kp-top-mid{flex:1;display:flex;gap:8px;align-items:center}
.kp-top-right{display:flex;gap:8px;align-items:center}

.kp-themes{display:flex;gap:6px}
.kp-swatch{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.kp-swatch.sel{border-color:var(--ink)}

.kp-strip{padding:4px 16px;background:var(--panel2);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;min-height:8px}
.kp-strip:empty{display:none}

.kp-main{flex:1;display:flex;min-height:0}
.kp-rail{width:44px;display:flex;flex-direction:column;gap:4px;padding:8px 4px;background:var(--panel);border-right:1px solid var(--line)}
.kp-rail button{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.kp-rail button.on{color:var(--ink);border-color:var(--accent-dim)}
.kp-stage{flex:1;position:relative;min-width:0}
.kp-board{position:absolute;inset:0;width:100%;height:100%;display:block}
.kp-drawer{width:360px;max-width:90vw;background:var(--panel);border-left:1px solid var(--line);overflow:auto}

.kp-foot{display:flex;gap:16px;justify-content:space-between;padding:2px 16px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.kp-modal-root:empty{display:none}

/* 20-board.css */
.hue-gray{--h:var(--hue-gray)} .hue-purple{--h:var(--hue-purple)} .hue-coral{--h:var(--hue-coral)}
.hue-teal{--h:var(--hue-teal)} .hue-amber{--h:var(--hue-amber)} .hue-green{--h:var(--hue-green)}
.hue-blue{--h:var(--hue-blue)} .hue-pink{--h:var(--hue-pink)} .hue-red{--h:var(--hue-red)}

.kp-seg{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kp-seg-l{padding:0 8px;color:var(--muted);font-size:12px}
.kp-seg button,.kp-btn{border:0;background:var(--panel2);color:var(--muted);font:inherit;font-size:12px;padding:4px 10px;cursor:pointer}
.kp-seg button.on{background:var(--accent-dim);color:var(--ink)}
.kp-btn{border:1px solid var(--line);border-radius:6px}
.kp-btn:hover,.kp-seg button:hover{color:var(--ink)}
.kp-focus{color:var(--accent);font-size:12px}

.kp-board{cursor:default;user-select:none;font-family:"Segoe UI",Roboto,"DejaVu Sans",sans-serif}
.kp-board.space{cursor:grab} .kp-board.panning{cursor:grabbing}

.kp-edge{fill:none;stroke:var(--h);stroke-width:1.2;opacity:.75}
.kp-edge-curve{stroke-width:1.6}
.kp-edge-tick{opacity:.55}

.kp-card{fill:var(--panel);stroke:var(--h);stroke-width:1.5}
.kp-sub{fill:var(--panel2);stroke:var(--line);stroke-width:1}
.st-idea .kp-card{stroke-dasharray:6 4}
.st-v2{opacity:.6} .st-v2 .kp-card{stroke-dasharray:2 3}
.kp-slot .kp-card,.kp-summary .kp-card{fill:none;stroke-dasharray:6 4}

.kp-origin .kp-card{fill:var(--accent);stroke:var(--accent)}
.kp-origin-t{fill:var(--bg);font-weight:800;font-size:18px;text-anchor:middle;letter-spacing:.08em}
.kp-dept{cursor:pointer}
.kp-dept .kp-card{fill:var(--panel2)}
.kp-dept-bar{fill:var(--h)}
.kp-dept-t{fill:var(--ink);font-weight:700;font-size:13px}
.kp-dept-n{fill:var(--muted);font-size:12px;text-anchor:end}

.kp-icon{fill:var(--h);font-size:13px}
.kp-title{fill:var(--ink);font-weight:600;font-size:12.5px}
.kp-status{fill:var(--muted);font-size:11px}
.kp-sub-t{fill:var(--ink);font-size:12px}
.kp-d{fill:var(--muted);font-size:12px}
.kp-den{fill:var(--muted);font-size:12px;font-style:italic;opacity:.8}

.kp-rm-dot{fill:var(--h)}
.kp-rm-date{fill:var(--muted);font-size:11px;font-weight:600}
.kp-rm-t{fill:var(--ink);font-size:12px}

.kp-more{cursor:pointer}
.kp-chip{fill:var(--panel2);stroke:var(--h)}
.kp-chip-t{fill:var(--ink);font-size:11.5px;text-anchor:middle}

.kp-band-r{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.kp-band-t{fill:var(--ink);font-weight:600;font-size:13px}
.kp-band-s{fill:var(--muted);font-size:12px}

.kp-layer-l{fill:var(--muted);font-size:12px;font-weight:600;text-anchor:end;letter-spacing:.03em}

/* level of detail: far out, descriptions go first, then everything but the branches */
.lod-desc .kp-desc{display:none}
.lod-cards .kp-node:not(.kp-dept):not(.kp-origin),.lod-cards .kp-edge-tick,.lod-cards .kp-layer-labels{display:none}

/* overview (far out): department areas + screen-size labels */
.kp-area{fill:var(--h);opacity:0;stroke:none}
.lod-cards .kp-area{opacity:.16}
.kp-ov-t{fill:var(--ink);font-weight:700}
.kp-ov-n{fill:var(--muted)}
.lod-cards .kp-dept text{display:none}

/* focus + pulse */
.kp-focused .kp-card{stroke:var(--accent);stroke-width:3}
.kp-pulse .kp-card{animation:kpPulse .6s ease-in-out 3}
@keyframes kpPulse{50%{stroke-width:6;stroke:var(--accent)}}
.kp-node:not(.kp-origin):not(.kp-band){cursor:pointer}

/* 30-panels.css */
.kp-search-btn kbd{font:inherit;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.kp-muted{color:var(--muted)}
.kp-x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.kp-x:hover{color:var(--ink)}
.kp-in{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;min-width:0;flex:1}
.kp-path{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;word-break:break-all}

/* RCO menu */
.kp-menu,.kp-submenu{position:fixed;z-index:50;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:13px}
.kp-mi{position:relative;padding:6px 12px;border-radius:5px;cursor:pointer;outline:none;white-space:nowrap}
.kp-mi:hover,.kp-mi:focus{background:var(--panel2)}
.kp-mi.off{color:var(--muted);opacity:.55;cursor:default}
.kp-mi-arrow{float:right;color:var(--muted)}
.kp-submenu{display:none;position:absolute;left:100%;top:-5px;min-width:200px}
.kp-mi.has-sub:hover>.kp-submenu,.kp-mi.has-sub:focus-within>.kp-submenu{display:block}
.kp-sep{height:1px;background:var(--line);margin:4px 6px}

/* popover */
.kp-pop{position:fixed;z-index:45;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:13px}
.kp-pop .kp-x{position:absolute;right:6px;top:4px}
.kp-pop-h{font-weight:700;margin:0 24px 6px 0}
.kp-pop-row{display:flex;gap:8px;align-items:center;margin-top:8px}

/* drawer */
.kp-drawer{display:flex;flex-direction:column;width:380px;padding:12px 16px;gap:10px}
.kp-drawer-head{display:flex;justify-content:space-between;gap:8px}
.kp-drawer-t{font-weight:700;font-size:16px}
.kp-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.kp-tabs button{border:0;background:none;color:var(--muted);font:inherit;padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent}
.kp-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.kp-md{line-height:1.55}
.kp-md code{font-size:12px;background:var(--bg);padding:0 4px;border-radius:3px}
.kp-md a,.kp-drawer-links a{color:var(--accent)}
.kp-en{margin-top:10px;font-style:italic;color:var(--muted)}
.kp-drawer-sub{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kp-drawer-links ul{margin:4px 0 0;padding-left:18px}
.kp-drawer-links li{margin:3px 0}
.kp-claim{background:var(--panel2);border-left:3px solid var(--accent);padding:6px 8px;font-size:12.5px}

/* tooltip + toast */
.kp-tip{position:fixed;z-index:60;max-width:320px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.kp-tip-t{font-weight:700}
.kp-tip-w{color:var(--muted);margin-top:4px;word-break:break-all}
.kp-toast{position:fixed;z-index:70;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:var(--panel2);border:1px solid var(--accent-dim);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;pointer-events:none}
.kp-toast.on{opacity:1;transform:translateX(-50%)}

/* favourites strip */
.kp-strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kp-strip-l{color:var(--accent)}
.kp-fav{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:1px 10px;font:inherit;font-size:12px;cursor:pointer}

/* search */
.kp-backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.kp-search{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.kp-search-in{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:15px;padding:12px 14px;outline:none}
.kp-search-list{max-height:50vh;overflow:auto}
.kp-search-r{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;cursor:pointer}
.kp-search-r.sel,.kp-search-r:hover{background:var(--panel2)}
.kp-search-k{color:var(--muted);font-size:12px;white-space:nowrap}
.kp-search-none{padding:10px 14px;color:var(--muted)}
</style>
</head>

  <div class="kp-brand">VRG Kapu</div>

</main>

<script>
"use strict";
const KP_BUILD = "49178f78af9c";
// ---- 00-core.js
// Core helpers shared by every module. Pure where possible, so Hub/test can run them in Node.

const KP_PREFIX = 'vrgKapu.';

// Every storage access goes through here: file:// and locked-down profiles throw on
// localStorage, and the page must still render ("csak linkek" mode).
const kpStore = {
  available() {
    try { const k = KP_PREFIX + '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  },
  get(key, def) {
    try {
      const v = localStorage.getItem(KP_PREFIX + key);
      return v == null ? def : JSON.parse(v);
    } catch (e) { return def; }
  },
  set(key, value) {
    try { localStorage.setItem(KP_PREFIX + key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
};

const KP_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function kpEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => KP_ESC[c]);
}

// kpEl('button', { class: 'x', onclick: fn }, 'text', childNode)
function kpEl(tag, attrs, ...kids) {
  const svg = ['svg', 'g', 'path', 'rect', 'circle', 'line', 'text', 'tspan'].includes(tag);
  const el = svg ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// "2026-10-21" or a Date -> "2026. 10. 21." (Hungarian order); bad input -> ''
function kpFmtDate(d) {
  const m = typeof d === 'string' ? d.match(/^(\d{4})-(\d{2})-(\d{2})/) : null;
  if (m) return m[1] + '. ' + m[2] + '. ' + m[3] + '.';
  if (d instanceof Date && !isNaN(d)) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '. ' + p(d.getMonth() + 1) + '. ' + p(d.getDate()) + '.';
  }
  return '';
}

// The JSON blocks the build bakes in; null when a file did not exist at build time.
function kpEmbedded(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}

// ---- 10-model.js
// Topology model: validation, folder refs, views, links. Pure; shared by the page,
// Hub/test and tools/check-hub.js.

const KP_SCHEMA = 'vrg-hub/1';
const KP_STATUS = ['live', 'dev', 'idea', 'v2'];
const KP_D_MAX = 140;

function kpValidate(topo) {
  const errors = [], warnings = [];
  if (!topo || topo.schema !== KP_SCHEMA) {
    errors.push('schema: expected ' + KP_SCHEMA + ', got ' + (topo && topo.schema));
    return { ok: false, errors, warnings };
  }
  const deps = topo.departments || [], progs = topo.programs || [];
  const folderIds = new Set(((topo.onedrive || {}).folders || []).map(f => f.id));

  const seen = new Set();
  for (const d of deps) {
    if (seen.has(d.id)) errors.push('department: duplicate id "' + d.id + '"');
    seen.add(d.id);
  }
  const depIds = new Set(deps.map(d => d.id));
  const pseen = new Set();
  for (const p of progs) {
    const at = 'program "' + p.id + '"';
    if (pseen.has(p.id)) errors.push('program: duplicate id "' + p.id + '"');
    pseen.add(p.id);
    if (!depIds.has(p.dept)) errors.push(at + ': unknown dept "' + p.dept + '"');
    if (!KP_STATUS.includes(p.status)) errors.push(at + ': bad status "' + p.status + '"');
    for (const f of p.folders || []) {
      if (f.ref != null && !folderIds.has(f.ref)) errors.push(at + ': unknown folder ref "' + f.ref + '"');
      if (f.ref == null && 'url' in f && !f.url && !f.local) warnings.push(at + ': folder "' + (f.t || '?') + '" has no url yet');
    }
    if (p.claim && !/^\d{4}-\d{2}-\d{2}$/.test(p.claim.until || '')) errors.push(at + ': claim.until must be YYYY-MM-DD');
    if (!p.d) warnings.push(at + ': no description (d)');
    else if (p.d.length > KP_D_MAX) warnings.push(at + ': d is ' + p.d.length + ' chars (max ' + KP_D_MAX + ')');
  }
  for (const f of (topo.onedrive || {}).folders || []) {
    if (!f.url) warnings.push('onedrive folder "' + f.id + '" has no share url yet');
  }
  return { ok: errors.length === 0, errors, warnings };
}

// Folder entries with a ref become the referenced shared folder (ref kept, local fields win).
function kpResolveRefs(topo) {
  const byId = new Map(((topo.onedrive || {}).folders || []).map(f => [f.id, f]));
  return Object.assign({}, topo, {
    programs: (topo.programs || []).map(p => !p.folders ? p : Object.assign({}, p, {
      folders: p.folders.map(f => f.ref != null && byId.has(f.ref) ? Object.assign({}, byId.get(f.ref), f) : f)
    }))
  });
}

// 'now' hides the v2 vision; every department stays, in seed order, even when empty.
function kpVisible(topo, view) {
  const progs = (topo.programs || []).filter(p => view === 'vision' || p.status !== 'v2');
  return (topo.departments || []).map(d => ({ dept: d, programs: progs.filter(p => p.dept === d.id) }));
}

// A repo path with an extension in its last segment is a file (blob), otherwise a folder (tree).
function kpLinkFor(node, ctx) {
  const repo = (ctx && ctx.repo) || {};
  const base = 'https://github.com/' + repo.owner + '/' + repo.name;
  const branch = repo.branch || 'main';
  if (node.url) return { href: node.url, kind: 'url' };
  if (node.repo) {
    const p = String(node.repo).replace(/^\/+|\/+$/g, '');
    const isFile = /\.[A-Za-z0-9]+$/.test(p.split('/').pop());
    return { href: base + '/' + (isFile ? 'blob' : 'tree') + '/' + branch + '/' + p.split('/').map(encodeURIComponent).join('/'), kind: isFile ? 'repo-file' : 'repo-dir' };
  }
  if (node.local) {
    const root = (ctx && ctx.localRoot) || '';
    const path = root ? root.replace(/[\\/]+$/, '') + '\\' + node.local.replace(/\//g, '\\') : node.local;
    return { href: null, kind: 'local', path };
  }
  return { href: null, kind: 'none' };
}

if (typeof module !== 'undefined') module.exports = { kpValidate, kpResolveRefs, kpVisible, kpLinkFor, KP_STATUS };

// ---- 20-layout.js
// Board layout: pure geometry from the visible topology. Every number lives in KP_LAYOUT.
// Rows start at the 03_UI §2 defaults and grow when a cell's stack needs more room:
// no label may ever overlap another.

const KP_LAYOUT = {
  colW: 200, colGap: 24, deptGap: 16,
  originW: 120, originH: 48, originGap: 60, headerH: 44,
  rowTop: 200, rowStep: 150, rowPad: 28,
  roadmapGap: 90, roadmapRow: 34, roadmapChars: 30,
  cardX: 12, cardW: 176, cardH: 52, cardH2: 66, titleChars: 22,
  subH: 32, subChars: 24,
  stackGap: 6, stackMax: 3, chipH: 22,
  descGap: 4, lineH: 15, descChars: 30, descLines: 3, subLines: 2, charW: 6.2,
  spineX: 4, bandGap: 48, bandH: 64
};

const KP_LAYER_NAMES = {
  L1: 'Programok', L2: 'Megosztott mappák', L3: 'AI dokumentumok', L4: 'Git és ütemterv',
  L5: 'Saját linkek', L6: 'Helyi célmappa'
};

// Word wrap to `max` chars per line, at most `lines` lines; the last kept line ends in … when cut.
function kpWrap(text, max, lines) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const out = [];
  let cur = '';
  for (let w of words) {
    while (w.length > max) {
      if (cur) { out.push(cur); cur = ''; }
      out.push(w.slice(0, max - 1) + '-');
      w = w.slice(max - 1);
    }
    if (!cur) cur = w;
    else if (cur.length + 1 + w.length <= max) cur += ' ' + w;
    else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  if (out.length <= lines) return out;
  const kept = out.slice(0, lines);
  let last = kept[lines - 1];
  if (last.length > max - 1) last = last.slice(0, max - 1);
  kept[lines - 1] = last.replace(/[\s,.;:·-]+$/, '') + '…';
  return kept;
}

function kpCut(text, max) {
  const s = String(text || '');
  return s.length <= max ? s : s.slice(0, max - 1).replace(/\s+$/, '') + '…';
}

// opts: { layers: {L1..L6: bool}, collapsed: [deptId], expanded: [cellKey], en: bool }
function kpLayout(cols, opts) {
  const L = KP_LAYOUT;
  const o = Object.assign({ layers: {}, collapsed: [], expanded: [], en: true }, opts || {});
  const on = l => o.layers[l] !== false;
  const nodes = [], edges = [];

  // text block under a card: d, then dEn in italics (max lines each)
  function describe(n, d, dEn, max) {
    n.lines = d ? kpWrap(d, L.descChars, max) : [];
    n.en = o.en && dEn ? kpWrap(dEn, L.descChars, max) : [];
    const all = n.lines.concat(n.en);
    n.text = all.length ? {
      x: n.x, y: n.y + n.h + L.descGap,
      w: Math.ceil(Math.max(...all.map(s => s.length)) * L.charW), h: all.length * L.lineH
    } : null;
    return n;
  }
  const blockH = n => n.h + (n.text ? L.descGap + n.text.h : 0);

  // 1. columns
  const columns = [];
  const heads = [];
  let x = 0;
  for (const c of cols) {
    const d = c.dept;
    const collapsed = o.collapsed.includes(d.id);
    const kinds = collapsed ? [{ summary: c.programs.length }] : c.programs.length ? c.programs : [{ slot: true }];
    const w = kinds.length * L.colW + (kinds.length - 1) * L.colGap;
    heads.push({ dept: d, x, w, collapsed, count: c.programs.length });
    kinds.forEach((p, i) => columns.push({ dept: d, x: x + i * (L.colW + L.colGap), p }));
    x += w + L.colGap + L.deptGap;
  }
  const width = Math.max(0, x - L.colGap - L.deptGap);

  // 2. origin + headers
  const origin = { id: 'origin', kind: 'origin', x: width / 2 - L.originW / 2, y: 0, w: L.originW, h: L.originH, title: ['VRG'] };
  nodes.push(origin);
  const headY = L.originH + L.originGap;
  for (const h of heads) {
    const n = { id: 'dept:' + h.dept.id, kind: 'dept', x: h.x, y: headY, w: h.w, h: L.headerH, dept: h.dept.id,
      hue: h.dept.hue, title: [h.dept.t], collapsed: h.collapsed, count: h.count };
    nodes.push(n);
    edges.push({ from: origin.id, to: n.id, kind: 'curve', hue: h.dept.hue,
      pts: [[origin.x + L.originW / 2, origin.y + L.originH], [h.x + h.w / 2, headY]] });
  }

  // 3. cells: what each column holds per layer, before y is known
  const cardOf = (col) => {
    const p = col.p, d = col.dept;
    if (p.summary != null) return { kind: 'summary', title: ['▸ ' + p.summary + ' program'], d: 'Összecsukva — kattints a fejlécre.', status: null };
    if (p.slot) return { kind: 'slot', title: ['○ még üres'], d: 'Ebben az osztályban ebben a nézetben nincs program.', status: null };
    const t = kpWrap(p.t, L.titleChars, 2);
    return { kind: 'program', progId: p.id, title: t, status: p.status, d: p.d, dEn: p.dEn, src: p };
  };
  const subsOf = (col, layer) => {
    const p = col.p;
    if (p.summary != null || p.slot) return [];
    if (layer === 'L2') return (p.folders || []).map((f, i) => ({ kind: f.local && !f.url && !f.ref ? 'local' : 'folder',
      title: [kpCut(f.t || f.path || f.ref, L.subChars)], full: f.t || f.path || f.ref, d: f.d, dEn: f.dEn, src: f, key: 'f' + i }));
    if (layer === 'L3') return (p.agent || []).map((a, i) => ({ kind: a.go ? 'go' : 'agent',
      title: [kpCut(a.t, L.subChars)], full: a.t, d: a.d, dEn: a.dEn, src: a, key: 'a' + i }));
    if (layer === 'L4' && p.git) {
      const paths = p.git.paths || [];
      const last = (paths[0] || '').split('/').filter(Boolean).pop() || 'git';
      return [{ kind: 'git', title: [kpCut(last, L.subChars)], full: paths.join(', '),
        d: paths.join(' · ') + ' — ág: ' + (p.git.branch || 'main'), src: p.git, key: 'g' }];
    }
    return [];
  };

  // build one stacked cell at y; returns its height
  function placeCell(col, layer, y, items, layerKey) {
    const key = col.p.id + ':' + layerKey;
    let list = items;
    let more = 0;
    if (items.length > L.stackMax && !o.expanded.includes(key)) {
      list = items.slice(0, L.stackMax);
      more = items.length - L.stackMax;
    }
    let cy = y;
    const placed = [];
    for (const it of list) {
      const h = it.kind === 'program' ? (it.title.length > 1 ? L.cardH2 : L.cardH)
        : it.kind === 'summary' || it.kind === 'slot' ? L.cardH : L.subH;
      const n = describe({ id: (it.progId || col.p.id || 'slot:' + col.dept.id) + ':' + layerKey + (it.key ? ':' + it.key : ''),
        kind: it.kind, x: col.x + L.cardX, y: cy, w: L.cardW, h, layer, dept: col.dept.id, hue: col.dept.hue,
        progId: col.p.id, title: it.title, full: it.full, status: it.status || null, src: it.src || null }, it.d, it.dEn,
        h === L.subH ? L.subLines : L.descLines);
      nodes.push(n);
      placed.push(n);
      cy += blockH(n) + L.stackGap;
    }
    if (more) {
      const n = { id: key + ':more', kind: 'more', x: col.x + L.cardX, y: cy, w: 96, h: L.chipH, layer, dept: col.dept.id,
        hue: col.dept.hue, progId: col.p.id, title: ['+' + more + ' további'], cell: key, text: null };
      nodes.push(n);
      placed.push(n);
      cy += L.chipH + L.stackGap;
    }
    return { h: placed.length ? cy - L.stackGap - y : 0, placed };
  }

  // 4. rows, top to bottom; each row as tall as its tallest cell
  const placedBy = columns.map(() => []);
  let rowY = L.rowTop, prevY = null, prevH = 0;
  const rows = {};
  for (const layer of ['L1', 'L2', 'L3', 'L4']) {
    if (!on(layer)) continue;
    if (prevY != null) rowY = Math.max(prevY + L.rowStep, prevY + prevH + L.rowPad);
    let maxH = 0;
    columns.forEach((col, ci) => {
      const items = layer === 'L1' ? [cardOf(col)] : subsOf(col, layer);
      const r = placeCell(col, layer, rowY, items, layer);
      placedBy[ci].push(...r.placed);
      maxH = Math.max(maxH, r.h);
    });
    rows[layer] = { y: rowY, h: maxH };
    prevY = rowY; prevH = maxH;
  }

  // 5. roadmap under L4, newest first
  let bottom = prevY == null ? headY + L.headerH : prevY + prevH;
  if (on('L4')) {
    const r4 = rows.L4;
    const top = Math.max(r4.y + L.roadmapGap, r4.y + r4.h + L.rowPad);
    let maxN = 0;
    columns.forEach((col, ci) => {
      const rm = (col.p.roadmap || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      rm.forEach((e, i) => {
        const n = { id: col.p.id + ':rm:' + i, kind: 'roadmap', x: col.x + L.cardX, y: top + i * L.roadmapRow,
          w: L.colW - L.cardX, h: L.roadmapRow - 4, layer: 'L4', dept: col.dept.id, hue: col.dept.hue, progId: col.p.id,
          date: e.date, title: [kpCut(e.t, L.roadmapChars)], full: e.t, src: e, text: null };
        nodes.push(n);
        placedBy[ci].push(n);
      });
      maxN = Math.max(maxN, rm.length);
    });
    rows.roadmap = { y: top, h: maxN * L.roadmapRow };
    if (maxN) bottom = top + maxN * L.roadmapRow;
  }

  // 6. personal bands (filled by H8)
  const bands = ['L5', 'L6'].filter(on);
  if (bands.length) {
    const by = bottom + L.bandGap;
    const bw = bands.length === 2 ? (width - L.colGap) / 2 : width;
    bands.forEach((l, i) => nodes.push({ id: 'band:' + l, kind: 'band', layer: l, x: i * (bw + L.colGap), y: by, w: bw, h: L.bandH,
      title: [KP_LAYER_NAMES[l]], text: null }));
    bottom = by + L.bandH;
  }

  // 7. spines: header bottom down the left edge of each column, a tick into every node
  columns.forEach((col, ci) => {
    const list = placedBy[ci];
    if (!list.length) return;
    const sx = col.x + L.spineX;
    const last = list[list.length - 1];
    edges.push({ from: 'dept:' + col.dept.id, to: last.id, kind: 'spine', hue: col.dept.hue,
      pts: [[sx, headY + L.headerH], [sx, last.y + last.h / 2]] });
    for (const n of list) {
      if (n.kind === 'roadmap') continue;
      edges.push({ from: 'dept:' + col.dept.id, to: n.id, kind: 'tick', hue: col.dept.hue,
        pts: [[sx, n.y + n.h / 2], [n.x, n.y + n.h / 2]] });
    }
  });

  return { nodes, edges, width, height: bottom, rows };
}

// Pairwise overlap check over every card and text box (tests + a debug aid).
function kpOverlaps(layout) {
  const boxes = [];
  for (const n of layout.nodes) {
    if (n.kind === 'origin' || n.kind === 'band') continue;
    boxes.push({ id: n.id, part: 'card', x: n.x, y: n.y, w: n.w, h: n.h });
    if (n.text) boxes.push({ id: n.id, part: 'text', x: n.text.x, y: n.text.y, w: n.text.w, h: n.text.h });
  }
  const hits = [];
  for (let i = 0; i < boxes.length; i++) {
    for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i], b = boxes[j];
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) hits.push([a.id + '/' + a.part, b.id + '/' + b.part]);
    }
  }
  return hits;
}

if (typeof module !== 'undefined') module.exports = { KP_LAYOUT, KP_LAYER_NAMES, kpWrap, kpCut, kpLayout, kpOverlaps };

// ---- 30-board.js
// Board renderer + camera. Geometry comes from kpLayout; this file only draws and listens.

const KP_ICON = { program: '▣', third: '⧉', folder: '☁', local: '📁', agent: '🤖', go: '▶', git: '⎇', summary: '▸', slot: '○' };
const KP_STATUS_HU = { live: 'használatban', dev: 'fejlesztés alatt', idea: 'tervezett', v2: 'jövőkép' };
const KP_STATUS_DOT = { live: '●', dev: '◐', idea: '○', v2: '◌' };
const KP_ZOOM = { min: 0.05, max: 3, descOff: 0.5, cardsOff: 0.3, step: 1.25 };
const KP_LABEL_X = -24;

const kpBoard = {
  view: 'now', layers: {}, collapsed: [], expanded: [], focus: null,
  cam: { x: 0, y: 0, k: 1 }, layout: null, fitted: false
};

function kpBoardLoad() {
  kpBoard.view = kpStore.get('view', 'now') === 'vision' ? 'vision' : 'now';
  kpBoard.layers = Object.assign({ L1: true, L2: true, L3: true, L4: true, L5: true, L6: true }, kpStore.get('layers', {}));
  kpBoard.collapsed = kpStore.get('collapsed', []);
}

function kpBoardRender() {
  const topo = kpData.topology;
  const svg = document.getElementById('kpBoard');
  if (!topo) { svg.replaceChildren(); return; }
  let cols = kpVisible(kpResolveRefs(topo), kpBoard.view);
  if (kpBoard.focus) cols = cols.filter(c => c.dept.id === kpBoard.focus);
  const lay = kpLayout(cols, { layers: kpBoard.layers, collapsed: kpBoard.focus ? [] : kpBoard.collapsed, expanded: kpBoard.expanded, en: true });
  kpBoard.layout = lay;

  const g = kpEl('g', { id: 'kpCam' });
  const gEdges = kpEl('g', { class: 'kp-edges' });
  const gNodes = kpEl('g', { class: 'kp-nodes' });
  for (const e of lay.edges) gEdges.append(kpEdgeEl(e));
  for (const n of lay.nodes) gNodes.append(kpNodeEl(n));
  g.append(kpLayerLabels(lay), kpOverviewAreas(lay), gEdges, gNodes, kpEl('g', { id: 'kpOverview', class: 'kp-overview' }));
  svg.replaceChildren(g);
  kpRenderChrome();
  if (!kpBoard.fitted) { kpFit(); kpBoard.fitted = true; } else kpApplyCam();
}

function kpHue(h) { return 'hue-' + (h || 'gray'); }

function kpEdgeEl(e) {
  const [[x1, y1], [x2, y2]] = e.pts;
  const cls = 'kp-edge kp-edge-' + e.kind + ' ' + kpHue(e.hue);
  if (e.kind === 'curve') {
    const my = (y1 + y2) / 2;
    return kpEl('path', { class: cls, d: `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}` });
  }
  return kpEl('line', { class: cls, x1, y1, x2, y2 });
}

function kpText(x, y, lines, cls, lh) {
  const t = kpEl('text', { x, y, class: cls });
  lines.forEach((s, i) => t.append(kpEl('tspan', { x, dy: i ? lh : 0 }, s)));
  return t;
}

function kpNodeEl(n) {
  const L = KP_LAYOUT;
  const g = kpEl('g', { class: 'kp-node kp-' + n.kind + ' ' + kpHue(n.hue) + (n.status ? ' st-' + n.status : ''), 'data-id': n.id });
  if (n.full && n.full !== n.title.join(' ')) g.append(kpEl('title', {}, n.full));

  if (n.kind === 'origin') {
    g.append(kpEl('rect', { class: 'kp-card', x: n.x, y: n.y, width: n.w, height: n.h, rx: 10 }),
      kpEl('text', { class: 'kp-origin-t', x: n.x + n.w / 2, y: n.y + n.h / 2 + 6 }, 'VRG'));
    return g;
  }
  if (n.kind === 'dept') {
    const maxC = Math.max(8, Math.floor((n.w - 40) / 7.6));
    const t = kpWrap(n.title[0], maxC, 2);
    g.append(kpEl('rect', { class: 'kp-card', x: n.x, y: n.y, width: n.w, height: n.h, rx: 8 }),
      kpEl('rect', { class: 'kp-dept-bar', x: n.x, y: n.y, width: n.w, height: 4, rx: 2 }),
      kpText(n.x + 12, n.y + (t.length > 1 ? 20 : 27), t, 'kp-dept-t', 15),
      kpEl('text', { class: 'kp-dept-n', x: n.x + n.w - 10, y: n.y + 27 }, (n.collapsed ? '▸ ' : '▾ ') + n.count));
    g.addEventListener('click', () => kpHeaderClick(n.dept));
    g.addEventListener('dblclick', () => kpHeaderDbl(n.dept));
    return g;
  }
  if (n.kind === 'roadmap') {
    const cx = n.x - L.cardX + L.spineX;
    g.append(kpEl('circle', { class: 'kp-rm-dot', cx, cy: n.y + 8, r: 4 }),
      kpEl('text', { class: 'kp-rm-date', x: n.x, y: n.y + 12 }, kpFmtDate(n.date)),
      kpEl('text', { class: 'kp-rm-t', x: n.x, y: n.y + 26 }, n.title[0]));
    return g;
  }
  if (n.kind === 'band') {
    g.append(kpEl('rect', { class: 'kp-band-r', x: n.x, y: n.y, width: n.w, height: n.h, rx: 8 }),
      kpEl('text', { class: 'kp-band-t', x: n.x + 16, y: n.y + 26 }, (n.layer === 'L5' ? '★ ' : '📁 ') + n.layer + ' · ' + n.title[0]),
      kpEl('text', { class: 'kp-band-s', x: n.x + 16, y: n.y + 46 }, 'Csak te látod — még üres.'));
    return g;
  }
  if (n.kind === 'more') {
    g.append(kpEl('rect', { class: 'kp-chip', x: n.x, y: n.y, width: n.w, height: n.h, rx: n.h / 2 }),
      kpEl('text', { class: 'kp-chip-t', x: n.x + n.w / 2, y: n.y + 15 }, n.title[0]));
    g.addEventListener('click', () => { kpBoard.expanded.push(n.cell); kpBoardRender(); });
    return g;
  }

  // cards: program / summary / slot / folder / local / agent / go / git
  const big = n.kind === 'program' || n.kind === 'summary' || n.kind === 'slot';
  g.append(kpEl('rect', { class: 'kp-card' + (big ? '' : ' kp-sub'), x: n.x, y: n.y, width: n.w, height: n.h, rx: big ? 8 : 6 }));
  const icon = KP_ICON[n.kind] || '▣';
  if (big) {
    g.append(kpEl('text', { class: 'kp-icon', x: n.x + 10, y: n.y + 19 }, icon),
      kpText(n.x + 28, n.y + 19, n.title, 'kp-title', 15));
    if (n.status) {
      g.append(kpEl('text', { class: 'kp-status', x: n.x + 28, y: n.y + n.h - 9 }, KP_STATUS_DOT[n.status] + ' ' + KP_STATUS_HU[n.status]));
    }
  } else {
    g.append(kpEl('text', { class: 'kp-icon', x: n.x + 9, y: n.y + 21 }, icon),
      kpEl('text', { class: 'kp-sub-t', x: n.x + 28, y: n.y + 21 }, n.title[0]));
  }
  if (n.text) {
    const desc = kpEl('g', { class: 'kp-desc' });
    if (n.lines.length) desc.append(kpText(n.text.x, n.text.y + 11, n.lines, 'kp-d', L.lineH));
    if (n.en.length) desc.append(kpText(n.text.x, n.text.y + 11 + n.lines.length * L.lineH, n.en, 'kp-den', L.lineH));
    g.append(desc);
  }
  return g;
}

// Far out only the branches remain; each department becomes an area as tall as its content,
// with a label kept at screen size (kpOverviewLabels, redrawn on zoom).
function kpOverviewAreas(lay) {
  const g = kpEl('g', { class: 'kp-areas' });
  for (const h of lay.nodes.filter(n => n.kind === 'dept')) {
    const own = lay.nodes.filter(n => n.dept === h.dept && n.kind !== 'dept');
    const bottom = Math.max(h.y + h.h + 40, ...own.map(n => n.y + n.h + (n.text ? n.text.h + KP_LAYOUT.descGap : 0)));
    g.append(kpEl('rect', { class: 'kp-area ' + kpHue(h.hue), x: h.x, y: h.y, width: h.w, height: bottom - h.y, rx: 10, 'data-dept': h.dept }));
  }
  return g;
}

function kpOverviewLabels() {
  const g = document.getElementById('kpOverview');
  if (!g) return;
  const k = kpBoard.cam.k;
  if (k >= KP_ZOOM.cardsOff) { g.replaceChildren(); return; }
  const fs = 13 / k, lh = 16 / k, pad = 8 / k;
  const out = [];
  for (const r of document.querySelectorAll('#kpCam .kp-area')) {
    const x = +r.getAttribute('x'), y = +r.getAttribute('y'), w = +r.getAttribute('width'), h = +r.getAttribute('height');
    const d = kpBoard.layout.nodes.find(n => n.dept === r.dataset.dept && n.kind === 'dept');
    const name = d.title[0], count = d.count + ' program';
    const perLine = Math.floor((w * k - 16) / 7.4);
    if (perLine >= 12) {
      const lines = kpWrap(name, perLine, 3);
      out.push(kpText(x + pad, y + pad + fs, lines, 'kp-ov-t', lh), kpEl('text', { class: 'kp-ov-n', x: x + pad, y: y + pad + fs + lines.length * lh + 2 / k }, count));
      out[out.length - 2].setAttribute('font-size', fs); out[out.length - 1].setAttribute('font-size', fs * 0.85);
    } else {
      const t = kpEl('text', { class: 'kp-ov-t', 'font-size': fs, transform: 'translate(' + (x + w / 2 + fs * 0.35) + ',' + (y + pad) + ') rotate(90)' }, kpCut(name, Math.floor(((kpBoard.layout.height - y) * k - 16) / 7.4)));
      out.push(t);
    }
  }
  g.replaceChildren(...out);
}

function kpLayerLabels(lay) {
  const g = kpEl('g', { class: 'kp-layer-labels' });
  const add = (y, t) => g.append(kpEl('text', { class: 'kp-layer-l', x: KP_LABEL_X, y: y + 18 }, t));
  for (const l of ['L1', 'L2', 'L3', 'L4']) if (lay.rows[l]) add(lay.rows[l].y, l + ' · ' + KP_LAYER_NAMES[l]);
  if (lay.rows.roadmap && lay.rows.roadmap.h) add(lay.rows.roadmap.y, 'Ütemterv ↓');
  return g;
}

// ---- header click = collapse, double-click = focus (click waits so a double-click is not two toggles)
let kpClickTimer = null;
function kpHeaderClick(dept) {
  clearTimeout(kpClickTimer);
  kpClickTimer = setTimeout(() => {
    if (kpBoard.focus) return;
    const c = kpBoard.collapsed;
    kpBoard.collapsed = c.includes(dept) ? c.filter(d => d !== dept) : c.concat(dept);
    kpStore.set('collapsed', kpBoard.collapsed);
    kpBoardRender();
  }, 250);
}
function kpHeaderDbl(dept) {
  clearTimeout(kpClickTimer);
  kpBoard.focus = kpBoard.focus === dept ? null : dept;
  kpBoard.fitted = false;
  kpBoardRender();
}

// ---- chrome: rail, view toggle, focus note
function kpRenderChrome() {
  for (const b of document.querySelectorAll('#kpRail button')) b.classList.toggle('on', kpBoard.layers[b.dataset.layer] !== false);
  for (const b of document.querySelectorAll('#kpView button')) b.classList.toggle('on', b.dataset.view === kpBoard.view);
  const f = document.getElementById('kpFocus');
  if (kpBoard.focus) {
    const d = kpData.topology.departments.find(x => x.id === kpBoard.focus);
    f.textContent = 'Fókusz: ' + (d ? d.t : kpBoard.focus) + ' — Esc: vissza';
    f.hidden = false;
  } else f.hidden = true;
}

function kpSetView(v) {
  kpBoard.view = v;
  kpStore.set('view', v);
  kpBoard.fitted = false;
  kpBoardRender();
}

function kpToggleLayer(l) {
  kpBoard.layers[l] = kpBoard.layers[l] === false;
  kpStore.set('layers', kpBoard.layers);
  kpBoardRender();
}

// ---- camera
function kpApplyCam() {
  const c = kpBoard.cam;
  const g = document.getElementById('kpCam');
  if (g) g.setAttribute('transform', `translate(${c.x},${c.y}) scale(${c.k})`);
  const svg = document.getElementById('kpBoard');
  svg.classList.toggle('lod-desc', c.k < KP_ZOOM.descOff);
  svg.classList.toggle('lod-cards', c.k < KP_ZOOM.cardsOff);
  kpOverviewLabels();
}

function kpFit() {
  const lay = kpBoard.layout;
  const svg = document.getElementById('kpBoard');
  const r = svg.getBoundingClientRect();
  if (!lay || !r.width) return;
  const pad = 24, minX = KP_LABEL_X - 150;
  const w = lay.width - minX, h = lay.height;
  const k = Math.max(KP_ZOOM.min, Math.min(KP_ZOOM.max, Math.min((r.width - 2 * pad) / w, (r.height - 2 * pad) / h)));
  kpBoard.cam = { k, x: (r.width - w * k) / 2 - minX * k, y: pad };
  kpApplyCam();
}

function kpZoomAt(mx, my, factor) {
  const c = kpBoard.cam;
  const k = Math.max(KP_ZOOM.min, Math.min(KP_ZOOM.max, c.k * factor));
  kpBoard.cam = { k, x: mx - (mx - c.x) * k / c.k, y: my - (my - c.y) * k / c.k };
  kpApplyCam();
}

// put a board point at screen point (used by tests / later "jump to node")
function kpCenterOn(bx, by, k) {
  const r = document.getElementById('kpBoard').getBoundingClientRect();
  kpBoard.cam = { k, x: r.width / 2 - bx * k, y: r.height / 2 - by * k };
  kpApplyCam();
}

function kpBoardInit() {
  kpBoardLoad();
  const svg = document.getElementById('kpBoard');
  let drag = null, space = false;

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    kpZoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  svg.addEventListener('pointerdown', e => {
    if (e.button === 1 || (e.button === 0 && space)) {
      e.preventDefault();
      drag = { x: e.clientX, y: e.clientY, cx: kpBoard.cam.x, cy: kpBoard.cam.y };
      svg.setPointerCapture(e.pointerId);
      svg.classList.add('panning');
    }
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    kpBoard.cam.x = drag.cx + e.clientX - drag.x;
    kpBoard.cam.y = drag.cy + e.clientY - drag.y;
    kpApplyCam();
  });
  const end = () => { drag = null; svg.classList.remove('panning'); };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

  window.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const r = svg.getBoundingClientRect();
    if (e.code === 'Space') { space = true; svg.classList.add('space'); e.preventDefault(); }
    else if (e.key === '0') kpFit();
    else if (e.key === '+' || e.key === '=') kpZoomAt(r.width / 2, r.height / 2, KP_ZOOM.step);
    else if (e.key === '-') kpZoomAt(r.width / 2, r.height / 2, 1 / KP_ZOOM.step);
    else if (e.key === 'Escape' && kpBoard.focus) { kpBoard.focus = null; kpBoard.fitted = false; kpBoardRender(); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { space = false; svg.classList.remove('space'); } });
  window.addEventListener('resize', () => kpApplyCam());

  for (const b of document.querySelectorAll('#kpView button')) b.addEventListener('click', () => kpSetView(b.dataset.view));
  document.getElementById('kpFit').addEventListener('click', kpFit);
  kpBoardRender();
}

    toggled: c => kpFavs().includes(c.node.id), when: c => kpFavable(c.node), whyNot: 'Ezt nem lehet kedvencnek jelölni',
    run: c => kpFavToggle(c.node.id) },
  { id: 'edit', label: 'Szerkesztés…', g: 'edit', at: ['rco'], need: 'github', run: () => {} },
  { id: 'add', label: 'Új elem ide…', g: 'edit', at: ['rco'], need: 'github', run: () => {} }
];

// enabled + reason for one action in one context
function kpActState(a, c) {
  if (a.need && !kpCaps[a.need]) return { on: false, why: KP_WHY[a.need] };
  if (a.when && !a.when(c)) return { on: false, why: a.whyNot || '' };
  return { on: true, why: '' };
}

// ---- context: the layout node + its program / source record
function kpCtx(nodeId) {
  const node = kpBoard.layout && kpBoard.layout.nodes.find(n => n.id === nodeId);
  if (!node) return null;
  const prog = node.progId ? (kpData.topology.programs || []).find(p => p.id === node.progId) || null : null;
  return { node, prog, src: node.src || prog };
}

function kpRepoRoot() {
  const saved = kpStore.get('repoRoot', '');
  if (saved) return saved;
  if (typeof location !== 'undefined' && location.protocol === 'file:') {
    const p = decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, '$1');
    const i = p.toLowerCase().lastIndexOf('/hub/dist/');
    if (i > 0) return p.slice(0, i).replace(/\//g, '\\');
  }
  return '';
}
// 'local' paths in the topology are relative to the VRG-DE folder, the repo's parent
const kpLocalRoot = () => kpRepoRoot().replace(/[\\/][^\\/]+[\\/]?$/, '');

// what a click on this node reaches: {href, kind, path?}
function kpTarget(c) {
  const n = c.node, ctx = { repo: kpData.topology.repo, localRoot: kpLocalRoot() };
  if (n.kind === 'program') {
    const o = (c.prog && c.prog.open) || {};
    if (o.url) return { href: o.url, kind: 'url' };
    if (o.repo) {
      const gh = kpLinkFor({ repo: o.repo }, ctx);
      const root = kpRepoRoot();
      return { href: gh.href, kind: 'repo-tool', path: root ? root + '\\' + o.repo.replace(/\//g, '\\') : '', repo: o.repo };
    }
    if (o.local) return kpLinkFor({ local: o.local }, ctx);
    return {};
  }
  if (n.kind === 'folder' || n.kind === 'local') {
    const f = n.src || {};
    if (f.url) return { href: f.url, kind: 'url' };
    if (f.local) return kpLinkFor({ local: f.local }, ctx);
    return { kind: 'empty-folder' };
  }
  if (n.kind === 'agent' || n.kind === 'go') return n.src && n.src.repo ? kpLinkFor({ repo: n.src.repo }, ctx) : n.src && n.src.local ? kpLinkFor({ local: n.src.local }, ctx) : {};
  if (n.kind === 'git') {
    const p = ((n.src || {}).paths || [])[0];
    return p ? kpLinkFor({ repo: p }, ctx) : {};
  }
  return {};
}

function kpStartPrompt(c) {
  const p = c.prog;
  const docs = (p && p.agent) || [];
  const go = docs.find(a => a.go);
  if (go) return '`' + go.go + '` — olvasd el a `' + go.repo + '`-t és csináld, amit ír.';
  const first = docs.find(a => a.repo);
  const name = p ? p.t : c.node.title.join(' ');
  return first ? 'Olvasd el a `' + first.repo + '`-t, aztán dolgozzunk ezen: ' + name + '.' : 'Dolgozzunk ezen: ' + name + '.';
}

// ---- main action (click / Enter)
function kpMainAction(node) {
  const c = kpCtx(node.id);
  if (!c) return;
  if (node.kind === 'summary') { kpBoard.collapsed = kpBoard.collapsed.filter(d => d !== node.dept); kpStore.set('collapsed', kpBoard.collapsed); kpBoardRender(); return; }
  if (node.kind === 'roadmap' || node.kind === 'slot') { kpDrawerOpen(node.id, 'short'); return; }
  if (node.kind === 'go') { kpCopy(kpStartPrompt(c), 'Az indító prompt a vágólapon — illeszd be a Claude Code-ba'); return; }
  const t = kpTarget(c);
  if (t.kind === 'repo-tool') { kpToolPopover(node, t); return; }
  if (t.kind === 'local') { kpPathPopover(node, t.path, 'Helyi mappa — a Kapu segéd nélkül másold ki az útvonalat.'); return; }
  if (t.kind === 'empty-folder' || (node.kind === 'folder' && !t.href)) { kpToast('Még nincs megosztási link — Szerkesztés'); return; }
  if (t.href) { kpOpen(t.href); return; }
  kpDrawerOpen(node.id, 'short');
}

function kpOpen(href) { window.open(href, '_blank', 'noopener'); }

function kpCopy(text, msg) {
  const done = () => kpToast(msg || 'Másolva');
  try {
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => kpCopyOld(text, done)); return; }
  } catch (e) { /* fall through */ }
  kpCopyOld(text, done);
}
function kpCopyOld(text, done) {
  const ta = kpEl('textarea', { style: 'position:fixed;left:-9999px' });
  ta.value = text;
  document.body.append(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { kpToast('Nem sikerült másolni'); }
  ta.remove();
}

let kpToastTimer = null;
function kpToast(msg) {
  let t = document.getElementById('kpToast');
  if (!t) { t = kpEl('div', { id: 'kpToast', class: 'kp-toast', role: 'status' }); document.body.append(t); }

  t.classList.add('on');
  clearTimeout(kpToastTimer);
  kpToastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

// ---- 41-search.js
// Search: accent-insensitive over departments, programs and their layer nodes.

// lower case, accents off: "Árvíztűrő" -> "arvizturo"
function kpNorm(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

const KP_KIND_RANK = { program: 0, dept: 1, agent: 2, go: 2, folder: 3, local: 3, git: 4 };

// Every searchable thing, with the board node id it lands on.
function kpSearchItems(topo, view) {
  const items = [];
  const progs = (topo.programs || []).filter(p => view === 'vision' || p.status !== 'v2');
  let order = 0;
  for (const d of topo.departments || []) {
    items.push({ id: 'dept:' + d.id, kind: 'dept', dept: d.id, t: d.t, body: [d.tEn, d.d, d.dEn], long: '', order: order++ });
  }
  for (const p of progs) {
    items.push({ id: p.id + ':L1', kind: 'program', dept: p.dept, progId: p.id, t: p.t, body: [p.d, p.dEn], long: [p.long, p.longEn].join(' '), order: order++ });
    (p.folders || []).forEach((f, i) => items.push({ id: p.id + ':L2:f' + i, kind: f.local && !f.url && !f.ref ? 'local' : 'folder', dept: p.dept, progId: p.id,
      layer: 'L2', cell: p.id + ':L2', idx: i, t: f.t || f.path || f.ref, body: [f.d, f.dEn], long: '', order: order++ }));
    (p.agent || []).forEach((a, i) => items.push({ id: p.id + ':L3:a' + i, kind: a.go ? 'go' : 'agent', dept: p.dept, progId: p.id,
      layer: 'L3', cell: p.id + ':L3', idx: i, t: a.t, body: [a.d, a.dEn, a.go], long: '', order: order++ }));
    if (p.git) items.push({ id: p.id + ':L4:g', kind: 'git', dept: p.dept, progId: p.id, layer: 'L4', t: (p.git.paths || []).join(' '), body: [], long: '', order: order++ });
  }
  return items;
}

// Title hits first, then description, then long text; programs before departments before docs.
function kpSearch(topo, q, view) {
  const nq = kpNorm(q).trim();
  if (!nq) return [];
  const terms = nq.split(/\s+/);
  const hit = s => { const n = kpNorm(s); return terms.every(t => n.includes(t)); };
  const out = [];
  for (const it of kpSearchItems(topo, view)) {
    const tier = hit(it.t) ? 3 : hit(it.body.filter(Boolean).join(' ')) ? 2 : hit(it.long) ? 1 : 0;
    if (tier) out.push(Object.assign({ tier }, it));
  }
  return out.sort((a, b) => b.tier - a.tier || KP_KIND_RANK[a.kind] - KP_KIND_RANK[b.kind] || a.order - b.order);
}

// ---- UI: Ctrl+K panel
const KP_KIND_HU = { dept: 'részleg', program: 'program', folder: 'mappa', local: 'helyi mappa', agent: 'AI dokumentum', go: 'GO brief', git: 'git' };

function kpSearchOpen() {
  const root = document.getElementById('kpModal');
  const input = kpEl('input', { class: 'kp-search-in', type: 'search', placeholder: 'Keresés… (ékezet nélkül is)', 'aria-label': 'Keresés' });
  const list = kpEl('div', { class: 'kp-search-list', role: 'listbox' });
  const box = kpEl('div', { class: 'kp-search' }, input, list);
  const back = kpEl('div', { class: 'kp-backdrop', onclick: e => { if (e.target === back) close(); } }, box);
  let res = [], sel = 0;
  function close() { root.replaceChildren(); }
  function draw() {
    list.replaceChildren(...res.slice(0, 30).map((r, i) => kpEl('div', {
      class: 'kp-search-r' + (i === sel ? ' sel' : ''), role: 'option',
      onclick: () => { close(); kpFlyTo(r); }
    }, kpEl('span', { class: 'kp-search-t' }, r.t), kpEl('span', { class: 'kp-search-k' }, KP_KIND_HU[r.kind] || r.kind))));
    if (input.value.trim() && !res.length) list.append(kpEl('div', { class: 'kp-search-none' }, 'Nincs találat ebben a nézetben.'));
  }
  input.addEventListener('input', () => { res = kpSearch(kpResolveRefs(kpData.topology), input.value, kpBoard.view); sel = 0; draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, Math.max(0, Math.min(res.length, 30) - 1)); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && res[sel]) { close(); kpFlyTo(res[sel]); }
    else if (e.key === 'Escape') close();
    e.stopPropagation();
  });
  root.replaceChildren(back);
  input.focus();
}

// make the target drawable (focus, collapse, layer, stack), then centre on it and pulse
function kpFlyTo(r) {
  if (kpBoard.focus && kpBoard.focus !== r.dept) kpBoard.focus = null;
  kpBoard.collapsed = kpBoard.collapsed.filter(d => d !== r.dept);
  if (r.layer && kpBoard.layers[r.layer] === false) kpBoard.layers[r.layer] = true;
  if (r.cell && r.idx >= KP_LAYOUT.stackMax && !kpBoard.expanded.includes(r.cell)) kpBoard.expanded.push(r.cell);
  kpBoardRender();
  const n = kpBoard.layout.nodes.find(x => x.id === r.id);
  if (!n) return;
  kpCenterOn(n.x + n.w / 2, n.y + n.h / 2, Math.max(kpBoard.cam.k, 1));
  kpSetFocusNode(n.id);
  const g = document.querySelector('#kpCam [data-id="' + CSS.escape(n.id) + '"]');
  if (g) { g.classList.remove('kp-pulse'); void g.getBBox(); g.classList.add('kp-pulse'); }
}

// ---- 42-md.js
// Tiny markdown for node texts: headings, bold, italics, code, lists, links (http/https only).
// Everything is escaped first, so no HTML from the data ever reaches the page.

function kpMdInline(s) {
  const codes = [];
  let out = kpEsc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  out = out
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?![*\w])/g, '$1<em>$2</em>')
    .replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, '$1<em>$2</em>');
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
}

// One plain paragraph comes back inline (no <p>), so short texts drop into any element.
function kpMd(src) {
  const lines = String(src == null ? '' : src).replace(/\r/g, '').split('\n');
  const blocks = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { blocks.push({ k: 'p', t: para.join(' ') }); para = []; } };
  const flushList = () => { if (list) { blocks.push(list); list = null; } };
  for (const raw of lines) {
    const line = raw.trim();
    let m;
    if (!line) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushPara(); flushList(); blocks.push({ k: 'h', n: Math.min(m[1].length + 2, 6), t: m[2] }); continue; }
    if ((m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/))) {
      flushPara();
      const ordered = /^\d/.test(line);
      if (!list || list.ordered !== ordered) { flushList(); list = { k: 'l', ordered, items: [] }; }
      list.items.push(m[1]);
      continue;
    }
    flushList();
    para.push(line);
  }
  flushPara(); flushList();
  if (blocks.length === 1 && blocks[0].k === 'p') return kpMdInline(blocks[0].t);
  return blocks.map(b => b.k === 'p' ? '<p>' + kpMdInline(b.t) + '</p>'
    : b.k === 'h' ? '<h' + b.n + '>' + kpMdInline(b.t) + '</h' + b.n + '>'
    : '<' + (b.ordered ? 'ol' : 'ul') + '>' + b.items.map(i => '<li>' + kpMdInline(i) + '</li>').join('') + '</' + (b.ordered ? 'ol' : 'ul') + '>').join('');
}

function kpDrawerOpen(nodeId, tab) {

  const short = isProg ? [p.d, p.dEn] : n.kind === 'dept' ? [dept.d, dept.dEn] : n.kind === 'roadmap' ? [s.t, null] : [s.d, s.dEn];
  const long = isProg ? [p.long || p.d, p.longEn || (p.long ? null : p.dEn)] : short;

  const html = (hu, en) => {
    const box = kpEl('div', { class: 'kp-md' });
    box.innerHTML = (hu ? '<div class="kp-hu">' + kpMd(hu) + '</div>' : '<div class="kp-muted">Nincs leírás.</div>') +
      (en ? '<div class="kp-en">' + kpMd(en) + '</div>' : '');

  };
  const body = kpEl('div', { class: 'kp-drawer-body' });
  const tabs = kpEl('div', { class: 'kp-tabs', role: 'tablist' });
  const show = t => {
    for (const b of tabs.children) b.classList.toggle('on', b.dataset.tab === t);
    body.replaceChildren(t === 'long' ? html(long[0], long[1]) : html(short[0], short[1]));

  };
  tabs.append(
    kpEl('button', { role: 'tab', 'data-tab': 'short', onclick: () => show('short') }, 'Rövid'),
    kpEl('button', { role: 'tab', 'data-tab': 'long', onclick: () => show('long') }, 'Részletes'));

  const title = isProg ? p.t : n.kind === 'dept' ? dept.t : (n.full || n.title.join(' '));
  const meta = [KP_KIND_LABEL[n.kind] || n.kind, dept ? dept.t : null,
    isProg ? KP_STATUS_HU[p.status] : null, n.kind === 'roadmap' ? kpFmtDate(s.date) : null].filter(Boolean).join(' · ');

  const links = kpDrawerLinks(c);
  const claim = p && p.claim ? kpEl('div', { class: 'kp-claim' }, '⚑ ' + p.claim.by + ' foglalja ' + kpFmtDate(p.claim.until) + '-ig' + (p.claim.note ? ' — ' + p.claim.note : '')) : null;

  const d = document.getElementById('kpDrawer');
  d.replaceChildren(...[
    kpEl('div', { class: 'kp-drawer-head' },
      kpEl('div', {}, kpEl('div', { class: 'kp-drawer-t' }, title), kpEl('div', { class: 'kp-muted' }, meta)),
      kpEl('button', { class: 'kp-x', title: 'Bezárás (Esc)', onclick: kpDrawerClose }, '×')),
    claim, tabs, body, links].filter(Boolean));
  d.hidden = false;
  show(tab === 'long' ? 'long' : 'short');
}

function kpDrawerLinks(c) {
  const p = c.prog;
  const rows = [];
  const ctx = { repo: kpData.topology.repo, localRoot: kpLocalRoot() };
  const add = (label, href, path) => rows.push(href
    ? kpEl('li', {}, kpEl('a', { href, target: '_blank', rel: 'noopener' }, label))
    : kpEl('li', {}, label + ' — ', kpEl('code', { class: 'kp-path' }, path || 'nincs még link')));
  const t = kpTarget(c);
  if (t.href) add('Megnyitás' + (t.kind === 'repo-tool' ? ' a GitHubon' : ''), t.href);
  if (p && c.node.kind === 'program') {
    for (const f of kpResolveRefs(kpData.topology).programs.find(x => x.id === p.id).folders || []) {
      const l = f.url ? { href: f.url } : f.local ? kpLinkFor({ local: f.local }, ctx) : {};
      add('☁ ' + (f.t || f.path), l.href, l.path);
    }
    for (const a of p.agent || []) { const l = a.repo ? kpLinkFor({ repo: a.repo }, ctx) : {}; add('🤖 ' + a.t, l.href, a.local); }
    for (const g of (p.git && p.git.paths) || []) add('⎇ ' + g, kpLinkFor({ repo: g }, ctx).href);
  }
  if (!rows.length) return null;
  return kpEl('div', { class: 'kp-drawer-links' }, kpEl('div', { class: 'kp-drawer-sub' }, 'Linkek'), kpEl('ul', {}, ...rows));
}

// ---- 47-nav.js
// Pointer + keyboard on the board: click, right-click / long-press, arrow focus, tooltip, Ctrl+K.

const KP_LONGPRESS = 500, KP_TIP_DELAY = 400;
const KP_NOCLICK = ['origin', 'band', 'dept', 'more'];

function kpNodeAt(target) {
  const g = target.closest && target.closest('#kpCam .kp-node');
  return g ? g.dataset.id : null;
}

function kpSetFocusNode(id) {
  kpBoard.focusId = id;
  for (const g of document.querySelectorAll('#kpCam .kp-focused')) g.classList.remove('kp-focused');
  const g = id && document.querySelector('#kpCam [data-id="' + CSS.escape(id) + '"]');
  if (g) g.classList.add('kp-focused');
}

// nearest node in a direction: alignment cubed beats distance; half-plane fallback (as in MindMap)
function kpHop(dx, dy) {
  const nodes = kpBoard.layout.nodes.filter(n => !['origin', 'band'].includes(n.kind));
  let from = nodes.find(n => n.id === kpBoard.focusId);
  if (!from) { from = nodes.find(n => n.kind === 'program') || nodes[0]; kpSetFocusNode(from.id); kpKeepInView(from); return; }
  const cx = from.x + from.w / 2, cy = from.y + from.h / 2;
  let best = null, wide = null;
  for (const m of nodes) {
    if (m.id === from.id) continue;
    const vx = m.x + m.w / 2 - cx, vy = m.y + m.h / 2 - cy, d = Math.hypot(vx, vy);
    if (d < 1) continue;
    const cos = (vx * dx + vy * dy) / d;
    if (cos <= 0.08) continue;
    const score = d / Math.pow(Math.max(cos, 0.12), 3);
    if (!wide || score < wide.score) wide = { n: m, score };
    if (cos >= 0.5 && (!best || score < best.score)) best = { n: m, score };
  }
  const t = best || wide;
  if (!t) return;
  kpSetFocusNode(t.n.id);
  kpKeepInView(t.n);
}

function kpKeepInView(n) {
  const r = document.getElementById('kpBoard').getBoundingClientRect(), c = kpBoard.cam;
  const sx = n.x * c.k + c.x, sy = n.y * c.k + c.y;
  if (sx < 40 || sy < 40 || sx + n.w * c.k > r.width - 40 || sy + n.h * c.k > r.height - 40) kpCenterOn(n.x + n.w / 2, n.y + n.h / 2, Math.max(c.k, 0.6));
}

// ---- tooltip
let kpTipTimer = null;
function kpTipHide() { clearTimeout(kpTipTimer); const t = document.getElementById('kpTip'); if (t) t.remove(); }
function kpTipShow(id, x, y) {
  const c = kpCtx(id);
  if (!c || ['origin', 'band'].includes(c.node.kind)) return;
  const n = c.node, s = n.src || {};
  const text = n.kind === 'program' ? c.prog.d : n.kind === 'dept' ? (kpData.topology.departments.find(d => d.id === n.dept) || {}).d
    : n.kind === 'roadmap' ? s.t : s.d || n.full;
  const t = kpTarget(c);
  const where = t.href ? t.href.replace(/^https?:\/\//, '') : t.path || (n.kind === 'dept' ? 'kattintás: össze/kinyit · dupla: Fókusz' : '');
  const tip = kpEl('div', { id: 'kpTip', class: 'kp-tip', role: 'tooltip' },
    kpEl('div', { class: 'kp-tip-t' }, n.full || n.title.join(' ')), text ? kpEl('div', {}, text) : null,
    where ? kpEl('div', { class: 'kp-tip-w' }, '→ ' + where) : null);
  document.body.append(tip);
  tip.style.left = Math.min(x + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(y + 18, innerHeight - tip.offsetHeight - 8) + 'px';
}

function kpNavInit() {
  const svg = document.getElementById('kpBoard');
  let press = null, tipFor = null, moved = false, downAt = null;

  svg.addEventListener('pointerdown', e => {
    downAt = { x: e.clientX, y: e.clientY };
    moved = false;
    kpTipHide();
    if (e.pointerType === 'touch') {
      const id = kpNodeAt(e.target);
      if (id) press = setTimeout(() => { press = 'fired'; kpMenuOpen(id, e.clientX, e.clientY); }, KP_LONGPRESS);
    }
  });
  svg.addEventListener('pointermove', e => {
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) { moved = true; if (press && press !== 'fired') { clearTimeout(press); press = null; } }
    const id = kpNodeAt(e.target);
    if (id !== tipFor) {
      kpTipHide();
      tipFor = id;
      if (id && e.pointerType !== 'touch') kpTipTimer = setTimeout(() => kpTipShow(id, e.clientX, e.clientY), KP_TIP_DELAY);
    }
  });
  svg.addEventListener('pointerleave', () => { tipFor = null; kpTipHide(); });
  svg.addEventListener('pointerup', () => { if (press && press !== 'fired') clearTimeout(press); downAt = null; });

  svg.addEventListener('click', e => {
    if (press === 'fired') { press = null; return; }
    press = null;
    if (moved || e.button !== 0) return;
    const id = kpNodeAt(e.target);
    if (!id) { kpPopoverClose(); kpMenuClose(); return; }
    const n = kpBoard.layout.nodes.find(x => x.id === id);
    kpSetFocusNode(id);
    if (n && !KP_NOCLICK.includes(n.kind)) kpMainAction(n);
  });
  svg.addEventListener('contextmenu', e => {
    e.preventDefault();
    const id = kpNodeAt(e.target);
    kpTipHide();
    if (id) { kpSetFocusNode(id); kpMenuOpen(id, e.clientX, e.clientY); }
  });

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#kpMenu')) kpMenuClose();
    if (!e.target.closest('#kpPop') && !e.target.closest('#kpBoard')) kpPopoverClose();
  });

  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); kpSearchOpen(); return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const menu = document.getElementById('kpMenu');
    if (menu) { kpMenuKeys(e, menu); return; }
    if (e.key === 'Escape') {
      if (document.getElementById('kpPop')) { kpPopoverClose(); e.stopImmediatePropagation(); return; }
      if (!document.getElementById('kpDrawer').hidden) { kpDrawerClose(); e.stopImmediatePropagation(); return; }
    }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[e.key]) { e.preventDefault(); kpHop(...dirs[e.key]); return; }
    const n = kpBoard.focusId && kpBoard.layout.nodes.find(x => x.id === kpBoard.focusId);
    if (!n) return;
    if (e.key === 'Enter') { e.preventDefault(); if (n.kind === 'dept') kpHeaderClick(n.dept); else if (!KP_NOCLICK.includes(n.kind)) kpMainAction(n); }
    else if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) {
      e.preventDefault();
      const r = kpNodeScreenRect(n);
      kpMenuOpen(n.id, r.left + 12, r.bottom + 4);
    }
  }, true);
}

function kpMenuKeys(e, menu) {
  const items = [...menu.querySelectorAll(':scope > .kp-mi')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { kpMenuClose(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const step = e.key === 'ArrowDown' ? 1 : -1;
    let j = i;
    do { j = (j + step + items.length) % items.length; } while (items[j].classList.contains('off') && j !== i);
    items[j].focus();
  } else if (e.key === 'Enter' && i >= 0) items[i].click();
  else return;
  e.preventDefault();
  e.stopImmediatePropagation();
}

// ---- 99-boot.js
// Boot: theme, embedded data, shell. Later WPs hang their init off kpBoot.

const KP_THEMES = [['amber', '#e6a532'], ['light', '#f4efe6'], ['slate', '#4fb0d0'], ['green', '#57c07a']];
const KP_THEME_NAMES = { amber: 'Borostyán', light: 'Világos', slate: 'Pala', green: 'Zöld' };
const KP_LAYERS = ['L1', 'L2', 'L3', 'L4', 'L5', 'L6'];

const kpData = { topology: null, access: null, pubkey: null };

function kpSetTheme(t) {
  if (!KP_THEMES.some(([n]) => n === t)) t = 'amber';
  document.documentElement.setAttribute('data-theme', t);
  kpStore.set('theme', t);
  kpRenderThemes();
}

function kpRenderThemes() {
  const cur = document.documentElement.getAttribute('data-theme');
  const box = document.getElementById('kpThemes');
  box.replaceChildren(...KP_THEMES.map(([t, c]) => kpEl('button', {
    class: 'kp-swatch' + (t === cur ? ' sel' : ''), style: 'background:' + c,
    title: KP_THEME_NAMES[t], 'aria-label': KP_THEME_NAMES[t], 'data-t': t,
    onclick: () => kpSetTheme(t)
  })));
}

function kpRenderRail() {
  document.getElementById('kpRail').replaceChildren(...KP_LAYERS.map(l =>
    kpEl('button', { class: 'on', 'data-layer': l, title: l + ' · ' + KP_LAYER_NAMES[l] + ' — megjelenítés / elrejtés', onclick: () => kpToggleLayer(l) }, l)));
}

function kpBoot() {
  kpData.topology = kpEmbedded('kpTopology');
  kpData.access = kpEmbedded('kpAccess');
  kpData.pubkey = kpEmbedded('kpPubkey');
  kpSetTheme(kpStore.get('theme', 'amber'));
  kpRenderRail();
  kpBoardInit();
  kpNavInit();
  kpRenderStrip();
  document.getElementById('kpSearchBtn').addEventListener('click', kpSearchOpen);
  document.getElementById('kpBuild').textContent = 'build ' + KP_BUILD;
  document.getElementById('kpMode').textContent = kpStore.available() ? '' : 'csak linkek — a böngésző nem enged menteni';
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', kpBoot);
  else kpBoot();
}
</script>
