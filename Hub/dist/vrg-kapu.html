  const lock = n.kind === 'program' ? (kpL1Open() ? null : 'gate') : n.layer && n.kind !== 'roadmap' ? kpLayerLock(n.layer) : null;
  const tip = kpEl('div', { id: 'kpTip', class: 'kp-tip', role: 'tooltip' },
    kpEl('div', { class: 'kp-tip-t' }, n.full || n.title.join(' ')), text ? kpEl('div', {}, text) : null,
    where ? kpEl('div', { class: 'kp-tip-w' }, '→ ' + where) : null,
    lock === 'gate' ? kpEl('div', { class: 'kp-tip-lock' }, '⛔ ' + kpL1Why()) : lock ? kpEl('div', { class: 'kp-tip-lock' }, '🔒 Előbb lépj be: ' + lock) : null);
  document.body.append(tip);
  tip.style.left = Math.min(x + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(y + 18, innerHeight - tip.offsetHeight - 8) + 'px';
}

function kpNavInit() {
  const svg = document.getElementById('kpBoard');
  let press = null, tipFor = null, moved = false, downAt = null;

  svg.addEventListener('pointerdown', e => {
    downAt = { x: e.clientX, y: e.clientY };
    moved = false;
    kpTipHide();
    if (e.pointerType === 'touch') {
      const id = kpNodeAt(e.target);
      if (id) press = setTimeout(() => { press = 'fired'; kpMenuOpen(id, e.clientX, e.clientY); }, KP_LONGPRESS);
    }
  });
  svg.addEventListener('pointermove', e => {
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) { moved = true; if (press && press !== 'fired') { clearTimeout(press); press = null; } }
    const id = kpNodeAt(e.target);
    if (id !== tipFor) {
      kpTipHide();
      tipFor = id;
      if (id && e.pointerType !== 'touch') kpTipTimer = setTimeout(() => kpTipShow(id, e.clientX, e.clientY), KP_TIP_DELAY);
    }
  });
  svg.addEventListener('pointerleave', () => { tipFor = null; kpTipHide(); });
  svg.addEventListener('pointerup', () => { if (press && press !== 'fired') clearTimeout(press); downAt = null; });

  svg.addEventListener('click', e => {
    if (press === 'fired') { press = null; return; }
    press = null;
    if (moved || e.button !== 0) return;
    const id = kpNodeAt(e.target);
    if (!id) { kpPopoverClose(); kpMenuClose(); return; }
    const n = kpBoard.layout.nodes.find(x => x.id === id);
    kpSetFocusNode(id);
    if (n && !KP_NOCLICK.includes(n.kind)) kpMainAction(n);
  });
  svg.addEventListener('contextmenu', e => {
    e.preventDefault();
    const id = kpNodeAt(e.target);
    kpTipHide();
    if (id) { kpSetFocusNode(id); kpMenuOpen(id, e.clientX, e.clientY); }
  });

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#kpMenu')) kpMenuClose();
    if (!e.target.closest('#kpPop') && !e.target.closest('#kpBoard')) kpPopoverClose();
  });

  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); kpSearchOpen(); return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const menu = document.getElementById('kpMenu');
    if (menu) { kpMenuKeys(e, menu); return; }
    if (e.key === 'Escape') {
      if (document.getElementById('kpModal').children.length) { kpModalClose(); e.stopImmediatePropagation(); return; }
      if (document.getElementById('kpPop')) { kpPopoverClose(); e.stopImmediatePropagation(); return; }
      if (!document.getElementById('kpDrawer').hidden) { kpDrawerClose(); e.stopImmediatePropagation(); return; }
    }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[e.key]) { e.preventDefault(); kpHop(...dirs[e.key]); return; }
    const n = kpBoard.focusId && kpBoard.layout.nodes.find(x => x.id === kpBoard.focusId);
    if (!n) return;
    if (e.key === 'Enter') { e.preventDefault(); if (n.kind === 'dept') kpHeaderClick(n.dept); else if (!KP_NOCLICK.includes(n.kind)) kpMainAction(n); }
    else if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) {
      e.preventDefault();
      const r = kpNodeScreenRect(n);
      kpMenuOpen(n.id, r.left + 12, r.bottom + 4);
    }
  }, true);
}

function kpMenuKeys(e, menu) {
  const items = [...menu.querySelectorAll(':scope > .kp-mi')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { kpMenuClose(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const step = e.key === 'ArrowDown' ? 1 : -1;
    let j = i;
    do { j = (j + step + items.length) % items.length; } while (items[j].classList.contains('off') && j !== i);
    items[j].focus();
  } else if (e.key === 'Enter' && i >= 0) items[i].click();
  else return;
  e.preventDefault();
  e.stopImmediatePropagation();
}

// ---- 50-github.js
// GitHub: token, identity, API calls. The token lives only in this browser's storage and in memory;
// it is never logged, never put in an error text, never written anywhere else.

const KP_GH_API = 'https://api.github.com';
const KP_GH_TOKEN_RE = /^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/;
const KP_GH_ACCESS_HU = { write: 'írás', read: 'olvasás', none: 'nincs hozzáférés a repóhoz' };

const kpGh = { token: null, login: null, name: null, access: null, rate: null, error: null };
const kpGhCache = new Map();   // path -> { etag, body }

const kpGhTokenOk = t => KP_GH_TOKEN_RE.test(String(t || '').trim());

function kpGhLoad() {
  const t = kpStore.get('ghToken', null);
  if (kpGhTokenOk(t)) kpGh.token = t;
  const who = kpStore.get('ghWho', null);
  if (kpGh.token && who) Object.assign(kpGh, { login: who.login, name: who.name, access: who.access });
}

function kpGhSignOut(reason) {
  Object.assign(kpGh, { token: null, login: null, name: null, access: null, error: reason || null });
  kpGhCache.clear();
  kpStore.set('ghToken', null);
  kpStore.set('ghWho', null);
}

// -> { status, json | text, etag, rateRemaining, error? }. 304 answers come from the cache.
async function kpGhFetch(path, opts) {
  const o = opts || {};
  if (!kpGh.token) return { status: 0, error: 'Nincs GitHub belépés' };
  const headers = {
    Authorization: 'Bearer ' + kpGh.token,
    Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  const method = o.method || 'GET';
  const key = (o.raw ? 'raw:' : '') + path;
  const cached = method === 'GET' && !o.nocache ? kpGhCache.get(key) : null;
  const etag = method === 'GET' && !o.nocache ? o.etag || (cached && cached.etag) : null;
  if (etag) headers['If-None-Match'] = etag;
  const init = { method, headers, cache: 'no-store' };
  if (o.body !== undefined) { headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(o.body); }
  let res;
  try { res = await fetch(KP_GH_API + path, init); }
  catch (e) { return { status: 0, error: 'Nincs kapcsolat a GitHubbal' }; }
  const h = n => (res.headers && res.headers.get ? res.headers.get(n) : null);
  const rate = h('x-ratelimit-remaining'), limit = h('x-ratelimit-limit');
  if (rate != null) kpGh.rate = +rate;
  if (limit != null) kpGh.rateLimit = +limit;
  const out = { status: res.status, etag: h('etag'), rateRemaining: rate == null ? null : +rate };
  if (res.status === 401) { kpGhSignOut('A token lejárt vagy hibás'); out.error = kpGh.error; return out; }
  if (res.status === 304 && cached) return Object.assign(out, cached.body, { etag: cached.etag, fromCache: true });
  if (res.status >= 200 && res.status < 300) {
    const body = o.raw ? { text: await res.text() } : { json: await res.json() };
    if (out.etag && method === 'GET' && !o.nocache) kpGhCache.set(key, { etag: out.etag, body });
    return Object.assign(out, body);
  }
  try { out.json = await res.json(); } catch (e) { /* no body */ }
  return out;
}

// who is this token, and what may it do with the repo
async function kpGhIdentify(repo) {
  kpGh.error = null;
  const u = await kpGhFetch('/user');
  if (u.status !== 200) {
    if (u.status !== 401) kpGh.error = u.error || 'A GitHub nem válaszolt (' + u.status + ')';
    return kpGh;
  }
  kpGh.login = u.json.login;
  kpGh.name = u.json.name || null;
  const r = await kpGhFetch('/repos/' + repo.owner + '/' + repo.name);
  if (r.status === 401) return kpGh;
  kpGh.access = r.status === 200 ? (r.json.permissions && r.json.permissions.push ? 'write' : 'read') : r.status === 404 ? 'none' : null;
  if (!kpGh.access) kpGh.error = r.error || 'A repó nem ellenőrizhető (' + r.status + ')';
  kpStore.set('ghWho', { login: kpGh.login, name: kpGh.name, access: kpGh.access });
  return kpGh;
}

async function kpGhSetToken(t, repo) {
  t = String(t || '').trim();
  if (!kpGhTokenOk(t)) return { ok: false, error: 'Ez nem GitHub token formátum (github_pat_… vagy ghp_…)' };
  kpGhSignOut();
  kpGh.token = t;
  kpStore.set('ghToken', t);
  await kpGhIdentify(repo);
  if (!kpGh.token) return { ok: false, error: kpGh.error || 'A token lejárt vagy hibás' };
  return { ok: !!kpGh.login, error: kpGh.error };
}

const kpGhHasRepo = () => !!kpGh.login && (kpGh.access === 'write' || kpGh.access === 'read');

if (typeof module !== 'undefined') module.exports = { kpGh, kpGhFetch, kpGhIdentify, kpGhSetToken, kpGhTokenOk, kpGhSignOut, kpGhCache };

  if (kpIsFile() || !kpStore.available()) msgs.push(kpMdInline(KP_FILE_BANNER));
  if (kpAccess.state === 'invalid') msgs.push(kpEsc(KP_GATE_BADSIG));
  const last = kpStore.get('lastRefresh', null), live = kpStore.get('live', null);
  if (kpStore.get('stale', false) && last) msgs.push(kpEsc('Nincs internet — a ' + kpFmtDate(last) + ' állapotot látod.'));
  if (live && live.self && live.self !== KP_BUILD) msgs.push(kpEsc('Új Kapu verzió elérhető — frissíts: git pull (vagy a Kapu segéd), aztán nyisd meg újra.'));
  el.hidden = !msgs.length;
  el.innerHTML = msgs.join('<br>');
}

// ---- 57-refresh.js
// Frissítés: live topology, access list, roadmap commits, branches, decision files, own version.
// kpRefreshCore does the network part and returns plain data (testable in Node); kpRefresh applies
// it to the page. Everything fetched is ETag-cached in kpStore, so a second refresh is mostly 304s.

const KP_AUTO_REFRESH_MS = 10 * 60 * 1000;
const KP_COMMITS_PER = 8;
const KP_MAX_BRANCHES = 10;
const KP_DECISION_RE = /(^|\/)(DECISIONS[^/]*\.md|[^/]*-Q-[^/]*\.json)$/;
const KP_SELF_PATH = 'Hub/dist/vrg-kapu.html';

// seed entries + commits, newest first; a commit whose first line equals a seed text shows once
function kpMergeRoadmap(seed, commits) {
  const rows = (commits || []).slice();
  const texts = new Set(rows.map(c => c.t));
  for (const s of seed || []) if (!texts.has(s.t)) rows.push(s);
  return rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}

// decision files per program: the longest git path prefix wins
function kpDecisionCounts(topo, paths) {
  const progs = (topo.programs || []).flatMap(p => ((p.git && p.git.paths) || []).filter(Boolean).map(g => ({ id: p.id, pre: g.replace(/\/+$/, '') + '/' })));
  const out = Object.fromEntries((topo.programs || []).map(p => [p.id, 0]));
  for (const f of paths) {
    if (!KP_DECISION_RE.test(f)) continue;
    let best = null;
    for (const p of progs) if (f.startsWith(p.pre) && (!best || p.pre.length > best.pre.length)) best = p;
    if (best) out[best.id]++;
  }
  return out;
}

// one ETag-cached call; the derived value (not the raw body) is what persists in kpStore
async function kpGhCached(path, key, derive, opts, stats) {
  const sk = 'etag.' + key;
  const stored = kpStore.get(sk, null);
  stats.requests++;
  const r = await kpGhFetch(path, Object.assign({}, opts, { etag: stored && stored.etag }));
  if (r.status === 304 && stored) { stats.hits++; return { ok: true, value: stored.value, hit: true }; }
  if (r.status === 200) {
    stats.fresh++;
    const value = derive(r.json != null ? r.json : r.text);
    if (r.etag) kpStore.set(sk, { etag: r.etag, value });
    return { ok: true, value, hit: false };
  }
  if (r.status === 0) stats.offline = true;
  return { ok: false, status: r.status, value: stored ? stored.value : null };
}

const kpCommitRow = (c, repo) => ({
  date: ((c.commit && (c.commit.committer || c.commit.author) || {}).date || '').slice(0, 10),
  t: String((c.commit && c.commit.message) || '').split('\n')[0],
  author: (c.author && c.author.login) || ((c.commit && c.commit.author) || {}).name || '',
  sha: c.sha, url: 'https://github.com/' + repo.owner + '/' + repo.name + '/commit/' + c.sha
});

// -> { topology, access, live, status: [[label, text]], stats }
async function kpRefreshCore(topoNow, accessNow, pubkey, onStep) {
  const repo = topoNow.repo, base = '/repos/' + repo.owner + '/' + repo.name;
  const stats = { requests: 0, hits: 0, fresh: 0, offline: false };
  const status = [];
  const step = (label, text) => { status.push([label, text]); if (onStep) onStep(status.slice()); };
  let topology = topoNow, access = accessNow;

  // 1. topology: replace only when it validates
  const t = await kpGhCached(base + '/contents/Hub/data/topology.json?ref=main', 'topology', x => JSON.parse(x), { raw: true }, stats);
  if (t.ok && t.value) {
    const v = kpValidate(t.value);
    if (v.ok) { topology = t.value; step('Topológia', t.hit ? '✓ (változatlan)' : '✓'); }
    else step('Topológia', 'hibás, a régit mutatom');
  } else step('Topológia', stats.offline ? 'nincs kapcsolat' : 'nem elérhető (' + t.status + ')');

  // 2. access list: take it only when its signature verifies
  const a = await kpGhCached(base + '/contents/Hub/data/access.json?ref=main', 'access', x => JSON.parse(x), { raw: true }, stats);
  if (a.ok && a.value) {
    const chk = await kpAccessCheck(a.value, pubkey, null);
    if (chk.valid) { access = a.value; step('Engedélyezett lista', '✓'); }
    else step('Engedélyezett lista', 'aláírás érvénytelen, a régit tartom');
  } else step('Engedélyezett lista', 'nem elérhető');

  // 3. commits per visible program
  const live = { roadmap: {}, branches: {}, decisions: {}, at: new Date().toISOString(), self: null };
  const progs = (topology.programs || []).filter(p => p.status !== 'v2' && p.git);
  let n = 0;
  for (const p of progs) {
    const path = (p.git.paths || [])[0] || '';
    const q = '?sha=main&per_page=' + KP_COMMITS_PER + (path ? '&path=' + encodeURIComponent(path) : '');
    const c = await kpGhCached(base + '/commits' + q, 'commits.' + (path || '_root'), list => list.map(x => kpCommitRow(x, repo)), {}, stats);
    if (c.value) live.roadmap[p.id] = c.value;
    step('Ütemterv', ++n + '/' + progs.length);
  }

  // 4. branches touching a program path
  const br = await kpGhCached(base + '/branches?per_page=100', 'branches', list => list.map(b => ({ name: b.name, sha: b.commit && b.commit.sha })), {}, stats);
  const mainSha = ((br.value || []).find(b => b.name === 'main') || {}).sha;
  const others = (br.value || []).filter(b => b.name !== 'main').slice(0, KP_MAX_BRANCHES);
  for (const b of others) {
    const ck = 'cmp.' + b.name, prev = kpStore.get(ck, null);
    let files = prev && prev.main === mainSha && prev.head === b.sha ? prev.files : null;
    if (!files) {
      stats.requests++;
      const r = await kpGhFetch(base + '/compare/main...' + encodeURIComponent(b.name));
      if (r.status === 200) { stats.fresh++; files = (r.json.files || []).map(f => f.filename); kpStore.set(ck, { main: mainSha, head: b.sha, files }); }
    }
    for (const p of topology.programs || []) {
      const pre = ((p.git && p.git.paths) || []).filter(Boolean);
      if (files && pre.some(g => files.some(f => f.startsWith(g.replace(/\/+$/, '') + '/') || f === g))) (live.branches[p.id] = live.branches[p.id] || []).push(b.name);
    }
  }
  step('Ágak', br.ok ? others.length + ' fejlesztési ág' : 'nem elérhető');

  // 5. decision files
  const tr = await kpGhCached(base + '/git/trees/main?recursive=1', 'tree3', j => {
    const blobs = (j.tree || []).filter(x => x.type === 'blob');
    return { dec: blobs.filter(x => KP_DECISION_RE.test(x.path)).map(x => x.path), logs: blobs.filter(x => /^Hub\/logs\/[^/]+\.md$/.test(x.path)).map(x => x.path),
      all: (j.tree || []).map(x => x.path) };   // ~800 paths: what the link check tests repo links against
  }, {}, stats);
  if (tr.value) {
    live.decisions = kpDecisionCounts(topology, tr.value.dec);
    live.decisionFiles = tr.value.dec;
    live.repoPaths = tr.value.all || null;
  }
  step('Döntési fájlok', tr.value ? '✓' : 'nem elérhető');

  // 5b. the newest work log per user (the file name starts with date_login_)
  live.latest = {};
  const newest = {};
  for (const p of (tr.value && tr.value.logs) || []) {
    const m = p.match(/^Hub\/logs\/(\d{4}-\d{2}-\d{2})_([^_]+)_/);
    if (m && (!newest[m[2]] || p > newest[m[2]])) newest[m[2]] = p;
  }
  for (const [login, p] of Object.entries(newest)) {
    const l = await kpGhCached(base + '/contents/' + p.split('/').map(encodeURIComponent).join('/') + '?ref=main', 'log.' + login, x => ({ name: p.split('/').pop(), entry: kpMdToLog(x) }), { raw: true }, stats);
    if (l.value) live.latest[login] = l.value;
  }
  if (Object.keys(newest).length) step('Munkanaplók', Object.keys(live.latest).length + ' felhasználó');

  // 6. our own version
  const self = await kpGhCached(base + '/contents/' + KP_SELF_PATH + '?ref=main', 'self', x => ((String(x).match(/const KP_BUILD = "([0-9a-f]{12})"/) || [])[1] || null), { raw: true }, stats);
  live.self = self.value;
  step('Kapu verzió', self.value && typeof KP_BUILD !== 'undefined' && self.value !== KP_BUILD ? 'új verzió elérhető' : '✓');

  step('Kész', stats.offline ? 'nincs kapcsolat — a tárolt állapotot mutatom'
    : !stats.fresh ? 'minden friss (' + stats.requests + ' kérés, semmi új)' : stats.requests + ' kérés, ' + stats.fresh + ' újdonsággal');
  return { topology, access, live, status, stats };
}

// live data folded into a copy of the topology, so the layout stays pure
function kpApplyLive(topo, live) {
  if (!live) return topo;
  return Object.assign({}, topo, { programs: (topo.programs || []).map(p => Object.assign({}, p, {
    roadmap: kpMergeRoadmap(p.roadmap, live.roadmap[p.id]),
    branches: live.branches[p.id] || [],
    decisions: live.decisions[p.id] || 0
  })) });
}

// ---- page side
const kpLive = () => kpStore.get('live', null);
let kpRefreshing = false;

async function kpRefresh(opts) {
  if (kpRefreshing) return;
  if (!kpGh.token) { kpToast('A frissítéshez GitHub belépés kell — Belépések'); return; }
  kpRefreshing = true;
  const box = kpRefreshBox();
  try {
    const r = await kpRefreshCore(kpData.topology, kpData.access, kpData.pubkey, s => kpRefreshShow(box, s));
    if (r.stats.offline) { kpStore.set('stale', true); }
    else {
      kpData.topology = r.topology;
      kpData.access = r.access;
      kpStore.set('live', r.live);
      kpStore.set('topoCache', r.topology);
      kpStore.set('accessCache', r.access);
      kpStore.set('stale', false);
      kpStore.set('lastRefresh', r.live.at);
    }
    await kpSigninChanged();
    kpRenderRefreshBtn();
    setTimeout(() => box.remove(), opts && opts.keep ? 60000 : 5000);
    return r;
  } finally { kpRefreshing = false; }
}

// ---- 60-access.js
// The signed allowed list: verify with the embedded public key, find "me", gate layer 1.
// Honest scope: this decides what the Kapu opens. The real locks are GitHub and OneDrive.

const KP_ACCESS_SCHEMA = 'vrg-hub-access/1';
const KP_GATE_NO = 'Nem szerepelsz az engedélyezett listán — kérd a tulajdonost.';
const KP_GATE_BADSIG = 'A hozzáférési lista aláírása érvénytelen — a programok zárva maradnak.';
const KP_ACCESS_NOTE = 'A valódi zár a GitHub és a OneDrive jogosultság; ez a lista azt mutatja, kinek nyit a Kapu.';

const kpAccess = { state: 'none', valid: false, me: null, role: null, people: 0 };

function kpB64Bytes(b64) {
  const s = atob(b64);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

// -> { state: 'none'|'unsigned'|'invalid'|'nocrypto'|'valid', valid, me, role, people }
async function kpAccessCheck(access, pubkey, login) {
  const r = { state: 'none', valid: false, me: null, role: null, people: 0 };
  if (!access || access.schema !== KP_ACCESS_SCHEMA || !access.body) return r;
  if (!access.sig || !pubkey) return Object.assign(r, { state: 'unsigned' });
  const subtle = typeof crypto !== 'undefined' && crypto.subtle;
  if (!subtle) return Object.assign(r, { state: 'nocrypto' });
  let ok = false;
  try {
    const key = await subtle.importKey('jwk', { kty: pubkey.kty, crv: pubkey.crv, x: pubkey.x, y: pubkey.y }, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    ok = await subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, kpB64Bytes(access.sig), new TextEncoder().encode(kpCanon(access.body)));
  } catch (e) { ok = false; }
  if (!ok) return Object.assign(r, { state: 'invalid' });
  const people = access.body.people || [];
  const me = login ? people.find(p => String(p.github || '').toLowerCase() === String(login).toLowerCase()) || null : null;
  return { state: 'valid', valid: true, me, role: me ? me.role : null, people: people.length };
}

// may this browser's user open layer-1 things?
const kpL1Open = () => !!(kpAccess.valid && kpAccess.me && (kpAccess.me.layers || []).includes('L1'));
function kpL1Why() {
  if (kpAccess.state === 'invalid') return KP_GATE_BADSIG;
  if (kpAccess.state !== 'valid') return 'Még nincs aláírt engedélyezett lista — a programok zárva maradnak.';
  if (!kpGh.login) return 'Előbb lépj be: GitHub';
  return KP_GATE_NO;
}

async function kpAccessRefresh() {
  Object.assign(kpAccess, await kpAccessCheck(kpData.access, kpData.pubkey, kpGh.login));
}

if (typeof module !== 'undefined') module.exports = { kpAccessCheck, kpB64Bytes, KP_GATE_NO, KP_GATE_BADSIG };

// ---- 70-edit.js
// Editing: operations (not whole files) kept until saved, replayed on GitHub's current copy at save time.
//   {op:'set', id, field, value}   id = program id or 'dept:<ID>'; field may be dotted ('open.repo')
//   {op:'add', parent, node}       parent = 'dept:<ID>' (a program) | 'prog:<id>:folders' | 'prog:<id>:agent'
//   {op:'hide', id}                soft delete; restore with set hidden false
//   {op:'claim', id, claim|null}
//   {op:'replace', topo}           a JSON import
// The access list is never touched here; the editor has no field for it.

const KP_TOPO_PATH = 'Hub/data/topology.json';
const KP_CLAIM_DAYS = 3;
const KP_MSG_IDS = 5;
const KP_EDIT_FIELDS = [
  ['t', 'Név', 'input'], ['d', 'Rövid leírás (HU)', 'input'], ['dEn', 'Rövid leírás (EN)', 'input'],
  ['long', 'Részletes leírás (HU, markdown)', 'textarea'], ['longEn', 'Részletes leírás (EN)', 'textarea']
];

function kpToday(d) {
  const x = d || new Date();
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
const kpClone = v => JSON.parse(JSON.stringify(v));

function kpFindTarget(t, id) {
  if (String(id).startsWith('dept:')) return (t.departments || []).find(d => d.id === id.slice(5)) || null;
  return (t.programs || []).find(p => p.id === id) || null;
}

function kpSetPath(obj, field, value) {
  const parts = field.split('.');
  let o = obj;
  for (const k of parts.slice(0, -1)) o = o[k] && typeof o[k] === 'object' ? o[k] : (o[k] = {});
  const last = parts[parts.length - 1];
  if (value === '' || value == null) delete o[last]; else o[last] = value;
}

// pure: -> { topo, lost: ['elveszett célpont: <id>'], changed: Set<id> }
function kpApply(topo, ops, opts) {
  const o = opts || {};
  let t = kpClone(topo);
  const lost = [], changed = new Set();
  for (const op of ops || []) {
    if (op.op === 'replace') { t = kpClone(op.topo); continue; }
    if (op.op === 'add') {
      const m = String(op.parent).match(/^prog:(.+):(folders|agent)$/);
      if (String(op.parent).startsWith('dept:')) {
        const dept = op.parent.slice(5);
        if (!(t.departments || []).some(d => d.id === dept)) { lost.push('elveszett célpont: ' + op.parent); continue; }
        if ((t.programs || []).some(p => p.id === op.node.id)) { lost.push('már létező azonosító: ' + op.node.id); continue; }
        t.programs.push(Object.assign({}, op.node, { dept }));
        changed.add(op.node.id);
      } else if (m) {
        const p = kpFindTarget(t, m[1]);
        if (!p) { lost.push('elveszett célpont: ' + m[1]); continue; }
        (p[m[2]] = p[m[2]] || []).push(op.node);
        changed.add(p.id);
      } else lost.push('ismeretlen hely: ' + op.parent);
      continue;
    }
    const target = kpFindTarget(t, op.id);
    if (!target) { lost.push('elveszett célpont: ' + op.id); continue; }
    if (op.op === 'set') kpSetPath(target, op.field, op.value);
    else if (op.op === 'hide') target.hidden = true;
    else if (op.op === 'claim') { if (op.claim) target.claim = op.claim; else delete target.claim; }
    changed.add(op.id);
  }
  if (o.dropExpired) {
    const today = o.today || kpToday();
    for (const p of t.programs || []) if (p.claim && p.claim.until < today) delete p.claim;
  }
  return { topo: t, lost, changed };
}

// what the remote has that our base did not: for "A másik felhasználó közben mentett"
function kpTopoDiff(base, remote) {
  const out = [];
  const bp = new Map((base.programs || []).map(p => [p.id, p])), rp = new Map((remote.programs || []).map(p => [p.id, p]));
  for (const [id, p] of rp) {
    if (!bp.has(id)) out.push('új: ' + p.t);
    else if (kpCanon(bp.get(id)) !== kpCanon(p)) out.push('módosítva: ' + p.t);
  }
  for (const [id, p] of bp) if (!rp.has(id)) out.push('törölve: ' + p.t);
  if (kpCanon(base.departments) !== kpCanon(remote.departments)) out.push('részlegek módosítva');
  return out;
}

const kpOpIds = ops => [...new Set(ops.map(op => op.id || (op.node && op.node.id) || (op.op === 'replace' ? 'import' : op.parent)))];
function kpCommitMsg(login, ops) {
  const ids = kpOpIds(ops);
  return 'Kapu: ' + login + ' — ' + ops.length + ' változás (' + ids.slice(0, KP_MSG_IDS).join(', ') + (ids.length > KP_MSG_IDS ? ', …' : '') + ')';
}

// remote + pending -> the file to write, or the reasons it cannot be written
function kpSavePrep(remote, ops, login, today) {
  const r = kpApply(remote, ops, { dropExpired: true, today });
  const t = r.topo;
  t.rev = (remote.rev || 0) + 1;
  t.updated = today;
  t.updatedBy = login;
  const v = kpValidate(t);
  return { topo: t, lost: r.lost, errors: v.errors, ok: v.ok };
}

function kpB64Utf8(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const kpUtf8B64 = b64 => new TextDecoder().decode(kpB64Bytes(String(b64).replace(/\s+/g, '')));

// ---- page side: pending ops and the view
const kpPending = () => kpStore.get('pendingOps', []);
function kpPendingSet(ops) {
  kpStore.set('pendingOps', ops);
  kpBoardRender();
  kpRenderStrip();
}
function kpPendingAdd(op) { kpPendingSet(kpPending().concat(op)); }

let kpDirty = new Set();
function kpViewTopology() {
  const ops = kpPending();
  if (!ops.length) { kpDirty = new Set(); return kpData.topology; }
  const r = kpApply(kpData.topology, ops);
  kpDirty = r.changed;
  return r.topo;
}

function kpStripExtras() {
  const out = [];
  const topo = kpViewTopology();
  const today = kpToday();
  const claims = (topo.programs || []).filter(p => p.claim && p.claim.until >= today);
  const logs = typeof kpLogStrip === 'function' ? kpLogStrip() : [];
  if (claims.length || logs.length) out.push(kpEl('span', { class: 'kp-strip-l' }, 'Ki min dolgozik?'),
    ...claims.map(p => kpEl('span', { class: 'kp-claim-s' }, '⚑ ' + p.claim.by + ': ' + p.t + ' (' + p.claim.until.slice(5) + '-ig)')), ...logs, kpEl('span', { class: 'kp-strip-sep' }));
  const n = kpPending().length;
  if (n) out.push(kpEl('span', { class: 'kp-pending' }, '✎ ' + n + ' nem mentett változás'),
    kpEl('button', { class: 'kp-btn kp-primary', onclick: () => kpSave() }, 'Mentés GitHubra'),
    kpEl('button', { class: 'kp-btn', onclick: () => { if (confirm('Elveted a ' + n + ' nem mentett változást?')) kpPendingSet([]); } }, 'Elvetés'),
    kpEl('span', { class: 'kp-strip-sep' }));
  return out;
}

// ---- save
let kpSaving = false;
async function kpSave(confirmed) {
  const ops = kpPending();
  if (!ops.length || kpSaving) return;
  if (!kpCaps.ghWrite) { kpToast(KP_WHY.ghWrite); return; }
  kpSaving = true;
  try {
    const repo = kpData.topology.repo, path = '/repos/' + repo.owner + '/' + repo.name + '/contents/' + KP_TOPO_PATH;
    const g = await kpGhFetch(path + '?ref=main', { nocache: true });
    if (g.status !== 200) { kpToast('A GitHub nem adta ki a térképet (' + (g.status || 'nincs kapcsolat') + ') — semmi nem veszett el, próbáld újra'); return; }
    const remote = JSON.parse(kpUtf8B64(g.json.content));
    const theirs = kpTopoDiff(kpData.topology, remote);
    if (theirs.length && !confirmed) { kpConflictOpen(theirs, remote); return; }
    const prep = kpSavePrep(remote, ops, kpGh.login, kpToday());
    if (!prep.ok) { kpModalOpen('Nem menthető', kpEl('p', {}, 'A térkép így hibás lenne:'), kpEl('ul', {}, ...prep.errors.map(e => kpEl('li', {}, e)))); return; }
    const put = await kpGhFetch(path, { method: 'PUT', body: {
      message: kpCommitMsg(kpGh.login, ops), content: kpB64Utf8(JSON.stringify(prep.topo, null, 2) + '\n'), sha: g.json.sha, branch: 'main' } });
    if (put.status === 409 || put.status === 422) { kpSaving = false; return kpSave(false); }   // someone saved in between: reload, show, ask
    if (put.status !== 200 && put.status !== 201) { kpToast('Mentés sikertelen (' + put.status + ') — a változások megmaradtak'); return; }
    kpData.topology = prep.topo;
    kpStore.set('topoCache', prep.topo);
    kpStore.set('etag.topology', null);
    kpPendingSet([]);
    const sha = ((put.json || {}).commit || {}).sha || '';
    kpToast('Mentve a GitHubra' + (sha ? ' · ' + sha.slice(0, 7) : ''));
    if (prep.lost.length) kpModalOpen('Mentve — néhány változás nem talált célt', kpEl('ul', {}, ...prep.lost.map(l => kpEl('li', {}, l))));
  } finally { kpSaving = false; }
}

function kpConflictOpen(theirs, remote) {

// where "Új elem ide…" adds: L1 -> a program in the department, L2 -> a folder, L3 -> an AI doc
function kpAddTarget(c) {
  const n = c.node;
  if (n.kind === 'dept' || n.kind === 'slot' || n.kind === 'summary') return { kind: 'program', parent: 'dept:' + n.dept };
  if (n.layer === 'L1' && n.kind === 'program') return { kind: 'program', parent: 'dept:' + n.dept };
  if (n.layer === 'L2' && c.prog) return { kind: 'folder', parent: 'prog:' + c.prog.id + ':folders' };
  if (n.layer === 'L3' && c.prog) return { kind: 'agent', parent: 'prog:' + c.prog.id + ':agent' };
  return null;
}

function kpSlug(s, taken) {
  let b = kpNorm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'uj';
  let id = b, i = 2;
  while (taken.has(id)) id = b + '-' + i++;
  return id;
}

// Personal layers, never shared and never saved to GitHub:
//   L5 Saját linkek  — the user's own links, in kpStore ('l5'), export / import as a file
//   L6 Helyi célmappa — a folder on this PC (File System Access handle in IndexedDB) the hub can write to

const KP_L5_FILE = 'vrg-kapu-sajat-linkek.json';
const KP_L5_URL_RE = /^(https?:\/\/|file:\/\/\/)/i;
const KP_L6_NOAPI = 'Ez a böngésző nem engedi a mappa választást — a Munkanapló letöltéssel mentsd.';
const KP_L6_TESTFILE = 'vrg-kapu-teszt.txt';

const kpL5 = () => kpStore.get('l5', []);
const kpL5Ok = k => !!(k && k.id && k.t && KP_L5_URL_RE.test(String(k.url || '')));

// merge by id: -> { list, added, updated, rejected }
function kpL5Merge(existing, incoming) {
  const list = existing.slice();
  let added = 0, updated = 0, rejected = 0;
  for (const k of Array.isArray(incoming) ? incoming : []) {
    if (!kpL5Ok(k)) { rejected++; continue; }
    const clean = { id: String(k.id), t: String(k.t), url: String(k.url) };
    if (k.d) clean.d = String(k.d);
    if (k.attach) clean.attach = String(k.attach);
    const i = list.findIndex(x => x.id === clean.id);
    if (i >= 0) { list[i] = clean; updated++; } else { list.push(clean); added++; }
  }
  return { list, added, updated, rejected };
}
const kpL5Report = r => r.added + ' új, ' + r.updated + ' frissített' + (r.rejected ? ', ' + r.rejected + ' elutasítva (csak http(s) és file:/// link)' : '');

// ---- L6: the target folder (kpDest; the WP called it kpTarget, a name the click target already has)
const KP_IDB = { db: 'vrgKapu', store: 'handles', key: 'dest' };

function kpIdb(mode, fn) {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(KP_IDB.db, 1); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => req.result.createObjectStore(KP_IDB.store);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const tx = req.result.transaction(KP_IDB.store, mode);
      const r = fn(tx.objectStore(KP_IDB.store));
      tx.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
      tx.onerror = () => reject(tx.error);
    };
  });
}

const kpDest = {
  supported: () => typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function',
  async handle() { try { return await kpIdb('readonly', s => s.get(KP_IDB.key)); } catch (e) { return null; } },
  async set(h, path) {
    await kpIdb('readwrite', s => s.put(h, KP_IDB.key));
    kpStore.set('l6', { name: h.name, path: path || (kpStore.get('l6', {}) || {}).path || '' });
  },
  async pick() {
    if (!kpDest.supported()) { kpToast(KP_L6_NOAPI); return null; }
    try {
      const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'vrg-kapu-dest' });
      await kpDest.set(h);
      kpBoardRender();
      kpToast('Célmappa: ' + h.name);
      return h;
    } catch (e) { if (e.name !== 'AbortError') kpToast(KP_L6_NOAPI); return null; }
  },
  // the browser forgets the grant between visits; ask again on use (needs a click)
  async writable() {
    const h = await kpDest.handle();
    if (!h) return null;
    const opt = { mode: 'readwrite' };
    if (h.queryPermission && (await h.queryPermission(opt)) !== 'granted') {
      if (!h.requestPermission || (await h.requestPermission(opt)) !== 'granted') return null;
    }
    return h;
  },
  async write(name, text) {
    const h = await kpDest.writable();
    if (!h) return { ok: false, error: kpStore.get('l6', null) ? 'A böngésző nem adott írási engedélyt a mappára' : 'Nincs célmappa — ☰ Helyi célmappa…' };
    try {
      const f = await h.getFileHandle(name, { create: true });
      const w = await f.createWritable();
      await w.write(text);
      await w.close();
      return { ok: true, name: h.name + '/' + name };
    } catch (e) { return { ok: false, error: 'Írás sikertelen: ' + e.message }; }
  },
  // Future entry point for AI / session exports into this folder. Deliberately empty until that
  // gets its own decision (WP-H8 out of scope): it must not write anything today.
  inbox() { return null; }
};

// ---- 90-log.js
// Munkanapló: a form -> a markdown file in the fixed template (03_UI §6), and back.
// Outputs: download · target folder (L6) · GitHub Hub/logs/ · the shared OneDrive folder.

const KP_LOG_TYPE = 'vrg-munkanaplo/1';
const KP_LOG_DIR = 'Hub/logs';
const KP_LOG_EMPTY = '—';
const KP_LOG_DRAFT_MS = 5000;
const KP_LOG_SECTIONS = [['did', 'Mit csináltam'], ['open', 'Félkész / nyitott'], ['next', 'Következő lépés'], ['questions', 'Kérdések'], ['links', 'Linkek']];

// entry: { date, by, programs: [id], did, open, next, questions, links, extra: [{ h, text }] }
function kpLogToMd(e) {
  const sec = (h, text) => '## ' + h + '\n' + (String(text || '').trim() || KP_LOG_EMPTY) + '\n';
  return '---\ntype: ' + KP_LOG_TYPE + '\ndate: ' + e.date + '\nby: ' + e.by + '\nprograms: [' + (e.programs || []).join(', ') + ']\n---\n' +
    '# Munkanapló — ' + e.date + ' — ' + e.by + '\n\n' +
    KP_LOG_SECTIONS.map(([k, h]) => sec(h, e[k])).join('') +
    (e.extra || []).map(x => sec(x.h, x.text)).join('');
}

function kpMdToLog(text) {
  const src = String(text).replace(/\r/g, '');
  const fm = src.match(/^---\n([\s\S]*?)\n---\n/);
  const meta = {};
  if (fm) for (const line of fm[1].split('\n')) { const m = line.match(/^(\w+):\s*(.*)$/); if (m) meta[m[1]] = m[2]; }
  const e = { date: meta.date || '', by: meta.by || '',
    programs: (meta.programs || '').replace(/^\[|\]$/g, '').split(',').map(s => s.trim()).filter(Boolean) };
  for (const [k] of KP_LOG_SECTIONS) e[k] = '';
  e.extra = [];
  const body = fm ? src.slice(fm[0].length) : src;
  const parts = body.split(/^## /m).slice(1);
  for (const p of parts) {
    const nl = p.indexOf('\n');
    const h = (nl < 0 ? p : p.slice(0, nl)).trim();
    let t = (nl < 0 ? '' : p.slice(nl + 1)).replace(/\n+$/, '');
    if (t === KP_LOG_EMPTY) t = '';
    const known = KP_LOG_SECTIONS.find(([, title]) => title === h);
    if (known) e[known[0]] = t; else e.extra.push({ h, text: t });
  }
  return e;
}

// "Födém toll finomítása a CLA nappaliban" -> "fodem-toll-finomitasa-a-cla"
function kpLogSlug(text) {
  const words = kpNorm(text).replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean).slice(0, 5);
  return words.join('-') || 'naplo';
}
function kpLogName(e, existing) {
  const base = e.date + '_' + e.by + '_' + kpLogSlug(e.did);
  const taken = new Set(existing || []);
  let name = base + '.md', i = 2;
  while (taken.has(name)) name = base + '-' + i++ + '.md';
  return name;
}

// "ma" / "tegnap" / "3 napja"
function kpRelDay(date, today) {
  const d = Math.round((Date.parse(today) - Date.parse(date)) / 864e5);
  return d <= 0 ? 'ma' : d === 1 ? 'tegnap' : d + ' napja';
}

// ---- page side
const kpLogs = () => kpStore.get('logs', []);   // imported: [{ name, entry }]

function kpLogBlank(progId) {
  return { date: kpToday(), by: kpGh.login || '', programs: progId ? [progId] : [], did: '', open: '', next: '', questions: '', links: '', extra: [] };
}

let kpLogTimer = null;
function kpLogOpen(progId) {
  const draft = kpStore.get('logDraft', null);
  const e = draft && (!progId || draft.programs.includes(progId)) ? draft : Object.assign(kpLogBlank(progId), draft && progId ? { programs: [progId] } : {});
  if (progId && !e.programs.includes(progId)) e.programs.push(progId);
  const by = kpEl('input', { class: 'kp-in', value: e.by, placeholder: 'GitHub név' });
  const date = kpEl('input', { class: 'kp-in', type: 'date', value: e.date });
  const progs = (kpViewTopology().programs || []).filter(p => !p.hidden && p.status !== 'v2');
  const ticks = kpEl('div', { class: 'kp-log-progs' }, ...progs.map(p => kpEl('label', {}, kpEl('input', { type: 'checkbox', value: p.id, checked: e.programs.includes(p.id) }), ' ' + p.t)));
  const areas = {};
  const rows = KP_LOG_SECTIONS.map(([k, h]) => { areas[k] = kpEl('textarea', { class: 'kp-in kp-ta', rows: k === 'did' ? 4 : 2 }); areas[k].value = e[k] || '';
    return kpEl('label', { class: 'kp-ed-row' }, kpEl('span', { class: 'kp-ed-l' }, h), areas[k]); });
  const read = () => {
    const x = { date: date.value || kpToday(), by: by.value.trim() || 'ismeretlen', programs: [...ticks.querySelectorAll('input:checked')].map(i => i.value), extra: e.extra || [] };
    for (const [k] of KP_LOG_SECTIONS) x[k] = areas[k].value;
    return x;
  };
  let discard = false;   // set once the entry is uploaded or thrown away: closing must not bring the draft back
  const saveDraft = () => { if (!discard) kpStore.set('logDraft', read()); };
  const drop = () => { discard = true; kpStore.set('logDraft', null); };
  clearInterval(kpLogTimer);
  kpLogTimer = setInterval(() => { if (!document.querySelector('.kp-log')) { clearInterval(kpLogTimer); return; } saveDraft(); }, KP_LOG_DRAFT_MS);
  const od = ((kpData.topology.onedrive || {}).folders || []).find(f => f.id === 'od-logs');
  const box = kpModalOpen('📝 Munkanapló',
    kpEl('div', { class: 'kp-pop-row' }, kpEl('span', { class: 'kp-ed-l' }, 'Ki'), by, kpEl('span', { class: 'kp-ed-l' }, 'Dátum'), date),
    kpEl('div', { class: 'kp-ed-l' }, 'Programok'), ticks, ...rows,
    kpEl('div', { class: 'kp-pop-row kp-wrap' },
      kpEl('button', { class: 'kp-btn', onclick: () => { const x = read(); kpDownload(kpLogName(x), kpLogToMd(x), 'text/markdown'); } }, 'Letöltés .md'),
      kpEl('button', { class: 'kp-btn', onclick: async () => { const x = read(); const r = await kpDest.write(kpLogName(x), kpLogToMd(x)); kpToast(r.ok ? 'Mentve: ' + r.name : r.error); } }, 'Mentés a célmappába'),
      kpEl('button', { class: 'kp-btn kp-primary', onclick: async () => { const r = await kpLogUpload(read()); if (r.ok) { drop(); kpModalClose(); } } }, 'Feltöltés GitHubra'),
      kpEl('button', { class: 'kp-btn', onclick: () => od && od.url ? kpOpen(od.url) : kpToast('Még nincs megosztási link — Szerkesztés') }, 'OneDrive mappa'),
      kpEl('button', { class: 'kp-btn', onclick: kpLogImport }, 'Importálás…'),
      kpEl('button', { class: 'kp-btn', onclick: () => { drop(); kpModalClose(); } }, 'Piszkozat törlése')));
  box.classList.add('kp-log');
  // closing in any way keeps the draft
  const root = document.getElementById('kpModal');
  const obs = new MutationObserver(() => { if (!root.contains(box)) { saveDraft(); obs.disconnect(); clearInterval(kpLogTimer); } });
  obs.observe(root, { childList: true, subtree: true });
  areas.did.focus();
}

function kpDownload(name, text, type) {
  const a = kpEl('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function kpLogUpload(e) {
  if (!kpCaps.ghWrite) { kpToast(KP_WHY.ghWrite); return { ok: false }; }
  const repo = kpData.topology.repo, base = '/repos/' + repo.owner + '/' + repo.name + '/contents/' + KP_LOG_DIR;
  const ls = await kpGhFetch(base + '?ref=main', { nocache: true });
  const names = ls.status === 200 && Array.isArray(ls.json) ? ls.json.map(f => f.name) : [];
  for (let tries = 0; tries < 3; tries++) {
    const name = kpLogName(e, names);
    const put = await kpGhFetch(base + '/' + encodeURIComponent(name), { method: 'PUT', body: {
      message: 'Munkanapló: ' + e.by + ' — ' + e.date + ' (' + (e.programs.join(', ') || '—') + ')', content: kpB64Utf8(kpLogToMd(e)), branch: 'main' } });
    if (put.status === 201 || put.status === 200) { kpToast('Feltöltve: ' + KP_LOG_DIR + '/' + name); return { ok: true, name }; }
    if (put.status === 422) { names.push(name); continue; }   // the name appeared in between
    kpToast('Feltöltés sikertelen (' + put.status + ') — a piszkozat megmaradt'); return { ok: false };
  }
  kpToast('Feltöltés sikertelen — a piszkozat megmaradt'); return { ok: false };
}

function kpLogImport() {
  const inp = kpEl('input', { type: 'file', accept: '.md,text/markdown', multiple: true });
  inp.addEventListener('change', async () => {
    const got = [];
    for (const f of inp.files) {
      const entry = kpMdToLog(await f.text());
      if (entry.date) got.push({ name: f.name, entry });
    }
    const merged = kpLogs().filter(l => !got.some(g => g.name === l.name)).concat(got);
    kpStore.set('logs', merged);
    kpRenderStrip();
    kpToast(got.length + ' napló beolvasva' + (got.length < inp.files.length ? ' (' + (inp.files.length - got.length) + ' nem napló formátumú)' : ''));
  });
  inp.click();
}

// logs that name a program, newest first: imported ones + the newest per user from GitHub
function kpLogsFor(progId) {
  const live = kpLive();
  const remote = live && live.latest ? Object.values(live.latest).map(x => ({ name: x.name, entry: x.entry, remote: true })) : [];
  return kpLogs().concat(remote).filter(l => l.entry.programs.includes(progId)).sort((a, b) => b.entry.date.localeCompare(a.entry.date));
}

// "Ki min dolgozik?": the newest log per user
function kpLogStrip() {
  const live = kpLive();
  const per = {};
  const consider = l => { const p = per[l.entry.by]; if (!p || l.entry.date > p.entry.date) per[l.entry.by] = l; };
  kpLogs().forEach(consider);
  if (live && live.latest) Object.values(live.latest).forEach(consider);
  const today = kpToday();
  const titles = Object.fromEntries((kpData.topology.programs || []).map(p => [p.id, p.t]));
  return Object.values(per).map(l => {
    const e = l.entry;
    const next = String(e.next || '').split('\n')[0];
    return kpEl('span', { class: 'kp-claim-s', title: next }, e.by + ': ' + (e.programs.map(id => titles[id] || id).join(', ') || '—') +
      (next ? ' — ' + kpCut(next, 40) : '') + ' (' + kpRelDay(e.date, today) + ')');
  });
}

function kpLogInit() {
  kpCaps.log = true;
  document.getElementById('kpLogBtn').addEventListener('click', () => kpLogOpen(null));
}

// ---- 92-companion.js
// The page side of the Kapu segéd: present only when the page is served by Hub/companion/server.js
// (which injects window.KP_COMPANION = {token, port}). Without it every action here stays greyed.

const kpComp = { on: false, status: null };

async function kpCompCall(action, body) {
  const c = typeof window !== 'undefined' && window.KP_COMPANION;
  if (!c) return { status: 0, json: { error: 'Kapu segéd nélkül' } };
  try {
    const r = await fetch('/api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Kapu-Token': c.token }, body: JSON.stringify(body) });
    return { status: r.status, json: await r.json() };
  } catch (e) { return { status: 0, json: { error: 'A Kapu segéd nem válaszol' } }; }
}

async function kpCompStatus() {
  if (!window.KP_COMPANION) return null;
  try { const r = await fetch('/api/status'); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

// the repo-relative folder a node stands for ('.' = repo root); 'local' paths live next to the repo
function kpNodeDir(c) {
  const n = c.node, p = c.prog, s = n.src || {};
  const dirOf = f => f.split('/').slice(0, -1).join('/') || '.';
  if (n.kind === 'folder' || n.kind === 'local') return s.local ? '../' + s.local : null;
  if (n.kind === 'agent' || n.kind === 'go') return s.repo ? dirOf(s.repo) : s.local ? '../' + s.local : null;
  if (n.kind === 'git') return (s.paths || [])[0] || '.';
  if (n.kind === 'l6folder') return s && s.path ? s.path : null;
  if (p) {
    const g = ((p.git && p.git.paths) || [])[0];
    if (g) return /\.[A-Za-z0-9]+$/.test(g) ? dirOf(g) : g;
    if (p.open && p.open.repo) return dirOf(p.open.repo);
    if (p.open && p.open.local) return '../' + p.open.local;
  }
  return '.';
}

function kpCompDone(r, ok) {
  if (r.status === 200) kpToast(r.json && r.json.dryRun ? 'Próba: ' + r.json.exe + ' ' + (r.json.args || []).join(' ') + (r.json.cwd ? ' @ ' + r.json.cwd : '') : ok);
  else if (r.status === 403) kpToast('Ez a mappa nincs az engedélyezettek között (Hub/companion/config.json → roots)');
  else kpToast((r.json && r.json.error) || 'A Kapu segéd hibát jelzett (' + r.status + ')');
  return r;
}
const kpCompFolder = dir => kpCompCall('open-folder', { dir }).then(r => kpCompDone(r, 'Mappa megnyitva'));
const kpCompTerminal = dir => kpCompCall('open-terminal', { dir }).then(r => kpCompDone(r, 'Terminál megnyitva'));
const kpCompClaude = dir => kpCompCall('open-claude', { dir }).then(r => kpCompDone(r, 'Claude Code indul'));
const kpCompTool = path => kpCompCall('open-tool', { path }).then(r => kpCompDone(r, 'Megnyitva, ahogy a START.cmd nyitja'));

async function kpCompPull() {
  const box = kpModalOpen('Frissítés a GitHubról', kpEl('p', { class: 'kp-muted' }, 'git pull --ff-only fut…'));
  const r = await kpCompCall('git', { cmd: 'pull' });

  box.replaceChildren(box.firstChild,
    kpEl('p', {}, r.status === 200 && r.json.ok ? 'Kész.' : 'Nem sikerült — lehet, hogy helyi változás akadályozza. A kimenet:'),
    kpEl('pre', { class: 'kp-pre' }, out || (r.json && r.json.error) || ''),

  if (!kpComp.on) return ['nem fut', kpEl('button', { class: 'kp-btn', onclick: () => kpToast('Indítsd a Hub\\VRG Kapu.cmd-vel (START.cmd: H) — a Kapu ekkor a localhost:8795 címen nyílik') }, 'Hogyan indítom?')];

// ---- glossary
const kpGloss = () => ((kpData.glossary || {}).entries) || [];

// the first occurrence of each term (or one of its alt forms) in an HTML string gets a dotted
// underline + tooltip; text inside tags and links is never touched; Hungarian suffixes may follow
function kpGlossMark(html, entries) {
  const seen = new Set();
  const forms = [];
  for (const e of entries) for (const f of [e.t].concat(e.alt || [])) forms.push({ f, e });
  forms.sort((a, b) => b.f.length - a.f.length);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(?<![\\p{L}\\d])(' + forms.map(x => esc(kpEsc(x.f))).join('|') + ')(?=-?\\p{Ll}{0,6}(?![\\p{L}\\d]))', 'giu');
  const byForm = new Map(forms.map(x => [kpEsc(x.f).toLowerCase(), x.e]));
  let inLink = 0;
  return html.split(/(<[^>]+>)/).map(part => {
    if (part.startsWith('<')) { if (/^<a[\s>]/i.test(part)) inLink++; else if (/^<\/a>/i.test(part)) inLink--; return part; }
    if (inLink) return part;
    return part.replace(re, m => {
      const e = byForm.get(m.toLowerCase());
      if (!e || seen.has(e.id)) return m;
      seen.add(e.id);
      return '<abbr class="kp-gl" title="' + kpEsc(e.d) + '">' + m + '</abbr>';
    });
  }).join('');
}

function kpGlossOpen(q) {
  const input = kpEl('input', { class: 'kp-in', type: 'search', placeholder: 'Keresés a szótárban…', value: q || '' });
  const list = kpEl('dl', { class: 'kp-gloss' });
  const draw = () => {
    const nq = kpNorm(input.value);
    list.replaceChildren(...kpGloss().filter(e => !nq || kpNorm([e.t].concat(e.alt || [], e.d, e.dEn).join(' ')).includes(nq))
      .flatMap(e => [kpEl('dt', {}, e.t + ((e.alt || []).length ? ' (' + e.alt.join(', ') + ')' : '')), kpEl('dd', {}, e.d, kpEl('div', { class: 'kp-en' }, e.dEn))]));
  };
  input.addEventListener('input', draw);
  input.addEventListener('keydown', e => e.stopPropagation());
  kpModalOpen('Szótár', input, list);
  draw();
  input.focus();
}

function kpTourStart() {
  const root = document.getElementById('kpModal');
  let i = 0;
  const end = () => { root.replaceChildren(); kpStore.set('tourDone', true); };
  const step = () => {
    const [sel, text] = KP_TOUR[i];
    // step 1 needs headers AND program cards readable: a mid zoom over the design department
    if (i === 0) { const d = kpBoard.layout.nodes.find(x => x.id === 'dept:TERV'); if (d) kpCenterOn(d.x + d.w / 2, d.y + 260, 0.55); }
    if (i === 1) { const n = kpBoard.layout.nodes.find(x => x.id === 'planner:L1'); if (n) kpCenterOn(n.x + n.w / 2, n.y + 60, 1); }
    const el = document.querySelector(sel);
    const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2 - 100, top: innerHeight / 2 - 40, width: 200, height: 80 };
    const pad = 6;
    const hole = kpEl('div', { class: 'kp-tour-hole', style: 'left:' + (r.left - pad) + 'px;top:' + (r.top - pad) + 'px;width:' + (r.width + 2 * pad) + 'px;height:' + (r.height + 2 * pad) + 'px' });
    const bubble = kpEl('div', { class: 'kp-tour-bubble', role: 'dialog', 'aria-label': 'Első lépések' },
      kpEl('div', { class: 'kp-muted' }, 'Első lépések · ' + (i + 1) + ' / ' + KP_TOUR.length), kpEl('p', {}, text),
      kpEl('div', { class: 'kp-pop-row' },
        kpEl('button', { class: 'kp-btn', onclick: end }, 'Kihagyás'),
        kpEl('button', { class: 'kp-btn kp-primary', onclick: () => { i++; if (i < KP_TOUR.length) step(); else end(); } }, i < KP_TOUR.length - 1 ? 'Tovább' : 'Kész')));
    root.replaceChildren(kpEl('div', { class: 'kp-tour' }, hole, bubble));
    // the bubble sits below the highlight when there is room, else above; always on screen
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    const below = r.top + r.height + pad + 12;
    const top = r.height > innerHeight * 0.6 ? innerHeight / 2 - bh / 2 : below + bh < innerHeight - 8 ? below : Math.max(8, r.top - pad - 12 - bh);
    bubble.style.left = Math.max(8, Math.min(r.left, innerWidth - bw - 8)) + 'px';
    bubble.style.top = top + 'px';
    bubble.querySelector('.kp-primary').focus();
  };
  step();
}

// ---- link check: repo paths against the last GitHub tree, local paths through the companion,
// URLs only for being empty (a page cannot test another site's link)
function kpLinkRefs(topo) {
  const out = [];
  for (const p of topo.programs || []) {
    if (p.hidden) continue;
    const o = p.open || {};
    if (o.repo) out.push({ id: p.id + ':L1', t: p.t, kind: 'repo', path: o.repo });
    if ('url' in o && !o.url && !o.repo && !o.local) out.push({ id: p.id + ':L1', t: p.t, kind: 'empty' });
    if (o.local) out.push({ id: p.id + ':L1', t: p.t, kind: 'local', path: '../' + o.local });
    (p.folders || []).forEach((f, i) => {
      const id = p.id + ':L2:f' + i, t = p.t + ' · ' + (f.t || f.ref);
      if (f.local) out.push({ id, t, kind: 'local', path: '../' + f.local });
      else if (f.ref) { const r = ((topo.onedrive || {}).folders || []).find(x => x.id === f.ref); if (r && !r.url) out.push({ id, t, kind: 'empty' }); }
      else if (!f.url) out.push({ id, t, kind: 'empty' });
    });
    (p.agent || []).forEach((a, i) => { if (a.repo) out.push({ id: p.id + ':L3:a' + i, t: p.t + ' · ' + a.t, kind: 'repo', path: a.repo }); });
    ((p.git && p.git.paths) || []).filter(Boolean).forEach(g => out.push({ id: p.id + ':L4:g', t: p.t + ' · git', kind: 'repo', path: g }));
  }
  return out;
}

async function kpLinkCheck() {
  const box = kpModalOpen('Linkellenőrzés', kpEl('p', { class: 'kp-muted' }, 'Ellenőrzés…'));
  const refs = kpLinkRefs(kpData.topology);
  const live = kpLive();
  const known = live && live.repoPaths ? new Set(live.repoPaths) : null;
  const dead = [], unknown = [];
  for (const r of refs.filter(r => r.kind === 'repo')) {
    if (!known) { unknown.push(r); continue; }
    if (!known.has(r.path.replace(/\/+$/, ''))) dead.push(Object.assign({ why: 'nincs a GitHubon (main)' }, r));
  }
  const locals = refs.filter(r => r.kind === 'local');
  if (kpCaps.companion && locals.length) {
    const c = await kpCompCall('check-paths', { paths: locals.map(r => r.path) });
    if (c.status === 200) for (const r of locals) if (!c.json[r.path]) dead.push(Object.assign({ why: 'nincs meg ezen a gépen' }, r));
  } else unknown.push(...locals);
  for (const r of refs.filter(r => r.kind === 'empty')) dead.push(Object.assign({ why: 'üres link' }, r));
  kpStore.set('deadLinks', [...new Set(dead.map(d => d.id))]);
  kpBoardRender();
  box.replaceChildren(box.firstChild,
    kpEl('p', {}, refs.length + ' link · ' + dead.length + ' hibás vagy üres' + (unknown.length ? ' · ' + unknown.length + ' nem ellenőrizhető most' : '')),
    dead.length ? kpEl('ul', { class: 'kp-dead-list' }, ...dead.map(d => kpEl('li', {}, kpEl('a', { href: '#', onclick: e => { e.preventDefault(); kpModalClose();
      const it = kpSearchItems(kpResolveRefs(kpData.topology), 'vision').find(x => x.id === d.id); if (it) kpFlyTo(it); } }, d.t), ' — ' + d.why + (d.path ? ' · ' + d.path : '')))) : null,
    unknown.length ? kpEl('p', { class: 'kp-muted' }, (known ? '' : 'A repó útvonalakhoz előbb Frissíts (⟳). ') + (kpCaps.companion ? '' : 'A helyi mappákhoz a Kapu segéd kell.')) : null);
}
const kpDead = () => new Set(kpStore.get('deadLinks', []));

// ---- export: the whole board as PNG, theme colours inlined so it looks the same outside the page
const KP_PNG_PROPS = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'font-size', 'font-weight', 'font-style', 'font-family', 'text-anchor', 'display'];
async function kpExportPng(download) {
  const lay = kpBoard.layout, src = document.getElementById('kpBoard');
  const minX = KP_LABEL_X - 160, pad = 24, w = Math.ceil(lay.width - minX + 2 * pad), h = Math.ceil(lay.height + 2 * pad);
  const klass = src.getAttribute('class');
  src.setAttribute('class', 'kp-board');   // full detail: no level-of-detail classes
  const cam = src.querySelector('#kpCam'), camT = cam.getAttribute('transform');
  cam.setAttribute('transform', 'translate(' + (pad - minX) + ',' + pad + ')');
  const clone = src.cloneNode(true);
  const a = src.querySelectorAll('*'), b = clone.querySelectorAll('*');
  for (let i = 0; i < a.length; i++) {
    const cs = getComputedStyle(a[i]);
    b[i].setAttribute('style', KP_PNG_PROPS.map(p => p + ':' + cs.getPropertyValue(p)).join(';'));
    b[i].removeAttribute('class');
  }
  cam.setAttribute('transform', camT);
  src.setAttribute('class', klass);
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  clone.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  clone.insertBefore(kpEl('rect', { x: 0, y: 0, width: w, height: h, style: 'fill:' + getComputedStyle(document.body).backgroundColor }), clone.firstChild);
  const svgText = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0);
  URL.revokeObjectURL(url);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  if (download !== false) kpDownloadBlob('vrg-kapu-' + kpToday() + '.png', blob);
  return blob;
}
function kpDownloadBlob(name, blob) {
  const a = kpEl('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// print: every department open, the whole board on the page; restored afterwards
let kpPrintSaved = null;
function kpPrintPrep() {
  kpPrintSaved = { collapsed: kpBoard.collapsed, focus: kpBoard.focus, cam: Object.assign({}, kpBoard.cam) };
  kpBoard.collapsed = []; kpBoard.focus = null;
  kpBoardRender(); kpFit();
}
function kpPrintDone() {
  if (!kpPrintSaved) return;
  Object.assign(kpBoard, { collapsed: kpPrintSaved.collapsed, focus: kpPrintSaved.focus });
  kpBoardRender();
  kpBoard.cam = kpPrintSaved.cam; kpApplyCam();
  kpPrintSaved = null;
}

    kpEl('button', { class: 'kp-btn', onclick: () => { kpSetTheme(t); kpModalClose(); } }, kpEl('span', { class: 'kp-sw', style: 'background:' + c }), ' ' + KP_THEME_NAMES[t]))));

function kpAboutOpen() {
  const r = kpData.topology.repo, gh = 'https://github.com/' + r.owner + '/' + r.name + '/tree/main/';
  kpModalOpen('Névjegy',
    kpEl('p', {}, kpEl('b', {}, 'VRG Kapu'), ' — a VRG eszközök közös térképe.'),
    kpEl('p', { class: 'kp-muted' }, 'Build ' + KP_BUILD + ' · térkép rev ' + (kpData.topology.rev || '?') + ', ' + kpFmtDate(kpData.topology.updated) + (kpData.topology.updatedBy ? ' · ' + kpData.topology.updatedBy : '')),
    kpEl('ul', {}, kpEl('li', {}, kpEl('a', { href: gh + 'docs/hub', target: '_blank', rel: 'noopener' }, 'A terv (docs/hub)')),
      kpEl('li', {}, kpEl('a', { href: gh + 'Hub', target: '_blank', rel: 'noopener' }, 'A forrás (Hub)'))));
}

function kpQuestionsOpen() {
  const live = kpLive();
  if (!live || !live.decisionFiles) { kpModalOpen('Nyitott kérdések', kpEl('p', {}, 'Frissíts (⟳), hogy a GitHubon lévő döntési fájlok listája betöltődjön.')); return; }
  const r = kpData.topology.repo, base = 'https://github.com/' + r.owner + '/' + r.name + '/blob/main/';
  const progs = (kpData.topology.programs || []).flatMap(p => ((p.git && p.git.paths) || []).filter(Boolean).map(g => ({ p, pre: g.replace(/\/+$/, '') + '/' })));
  const groups = new Map();
  for (const f of live.decisionFiles) {
    let best = null;
    for (const x of progs) if (f.startsWith(x.pre) && (!best || x.pre.length > best.pre.length)) best = x;
    const k = best ? best.p.t : 'Egyéb';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(f);
  }
  kpModalOpen('Nyitott kérdések — döntési fájlok', kpEl('p', { class: 'kp-muted' }, live.decisionFiles.length + ' fájl. A megválaszolatlan kérdések számlálása v2.'),
    ...[...groups].map(([t, files]) => kpEl('div', { class: 'kp-ch' }, kpEl('b', {}, t),
      kpEl('ul', {}, ...files.map(f => kpEl('li', {}, kpEl('a', { href: base + f, target: '_blank', rel: 'noopener' }, f)))))));
}

function kpExtrasInit() {
  KP_MAIN_MENU.push(
    { label: 'Első lépések', run: kpTourStart },
    { label: 'Szótár', run: () => kpGlossOpen() },
    { label: 'Telepítők', run: kpInstallers },
    { label: 'Nyitott kérdések', run: kpQuestionsOpen },
    { label: 'Linkellenőrzés', run: kpLinkCheck },
    { label: 'Export: kép (PNG)', run: () => kpExportPng() },
    { label: 'Nyomtatás', run: () => window.print() },
    { label: 'Téma', run: kpThemeOpen },
    { label: 'Helyi repó mappa…', run: kpRepoRootOpen },
    { label: 'Névjegy', run: kpAboutOpen });
  window.addEventListener('beforeprint', kpPrintPrep);
  window.addEventListener('afterprint', kpPrintDone);
  // first visit in this browser: the tour (automated checks open the page with ?notour). Not from file://:
  // the "csak linkek" banner says settings are not kept, so "tour done" would not be either (it is in ☰)
  if (!kpStore.get('tourDone', false) && kpStore.available() && location.protocol !== 'file:' && !/[?&]notour\b/.test(location.search)) setTimeout(kpTourStart, 600);
}

// ---- 99-boot.js
// Boot: theme, embedded data, shell. Later WPs hang their init off kpBoot.

const KP_THEMES = [['amber', '#e6a532'], ['light', '#f4efe6'], ['slate', '#4fb0d0'], ['green', '#57c07a']];
const KP_THEME_NAMES = { amber: 'Borostyán', light: 'Világos', slate: 'Pala', green: 'Zöld' };
const KP_LAYERS = ['L1', 'L2', 'L3', 'L4', 'L5', 'L6'];

const kpData = { topology: null, access: null, pubkey: null };

function kpSetTheme(t) {
  if (!KP_THEMES.some(([n]) => n === t)) t = 'amber';
  document.documentElement.setAttribute('data-theme', t);
  kpStore.set('theme', t);
  kpRenderThemes();
}

function kpRenderThemes() {
  const cur = document.documentElement.getAttribute('data-theme');
  const box = document.getElementById('kpThemes');
  box.replaceChildren(...KP_THEMES.map(([t, c]) => kpEl('button', {
    class: 'kp-swatch' + (t === cur ? ' sel' : ''), style: 'background:' + c,
    title: KP_THEME_NAMES[t], 'aria-label': KP_THEME_NAMES[t], 'data-t': t,
    onclick: () => kpSetTheme(t)
  })));
}

function kpRenderRail() {
  document.getElementById('kpRail').replaceChildren(...KP_LAYERS.map(l =>
    kpEl('button', { class: 'on', 'data-layer': l, title: l + ' · ' + KP_LAYER_NAMES[l] + ' — megjelenítés / elrejtés', onclick: () => kpToggleLayer(l) }, l)));
}

function kpBoot() {
  kpData.topology = kpEmbedded('kpTopology');
  kpData.access = kpEmbedded('kpAccess');
  kpData.pubkey = kpEmbedded('kpPubkey');
  kpData.glossary = kpEmbedded('kpGlossary');
  kpSetTheme(kpStore.get('theme', 'amber'));
  kpRenderRail();
  kpGhLoad();
  kpRefreshRestore();
  kpBoardInit();
  kpNavInit();
  kpCompInit().then(kpSigninInit).then(kpRefreshBoot);
  kpRenderStrip();
  kpMainMenuInit();
  kpLogInit();
  kpExtrasInit();
  document.getElementById('kpSearchBtn').addEventListener('click', kpSearchOpen);
  document.getElementById('kpBuild').textContent = 'build ' + KP_BUILD;
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', kpBoot);
  else kpBoot();
}
