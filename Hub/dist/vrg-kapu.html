<script>
"use strict";
const KP_BUILD = "82f5be87e091";
// ---- 00-core.js
// Core helpers shared by every module. Pure where possible, so Hub/test can run them in Node.

const KP_PREFIX = 'vrgKapu.';

// Every storage access goes through here: file:// and locked-down profiles throw on
// localStorage, and the page must still render ("csak linkek" mode).
const kpStore = {
  available() {
    try { const k = KP_PREFIX + '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  },
  get(key, def) {
    try {
      const v = localStorage.getItem(KP_PREFIX + key);
      return v == null ? def : JSON.parse(v);
    } catch (e) { return def; }
  },
  set(key, value) {
    try { localStorage.setItem(KP_PREFIX + key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
};

const KP_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function kpEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => KP_ESC[c]);
}

// kpEl('button', { class: 'x', onclick: fn }, 'text', childNode)
function kpEl(tag, attrs, ...kids) {
  const svg = ['svg', 'g', 'path', 'rect', 'circle', 'line', 'text', 'tspan'].includes(tag);
  const el = svg ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// "2026-10-21" or a Date -> "2026. 10. 21." (Hungarian order); bad input -> ''
function kpFmtDate(d) {
  const m = typeof d === 'string' ? d.match(/^(\d{4})-(\d{2})-(\d{2})/) : null;
  if (m) return m[1] + '. ' + m[2] + '. ' + m[3] + '.';
  if (d instanceof Date && !isNaN(d)) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '. ' + p(d.getMonth() + 1) + '. ' + p(d.getDate()) + '.';
  }
  return '';
}

// The JSON blocks the build bakes in; null when a file did not exist at build time.
function kpEmbedded(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}

// 4912 -> "4 912" (Hungarian grouping, also for four digits)
function kpGroup(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

// ---- 10-tools.js
// The START.cmd tool registry, baked in by tools/build-hub.js from Planner/START.cmd:

const KP_REPO = { owner: 'webagoly-work', name: 'vrg-toolset' };

// ---- 50-github.js
// GitHub: token, identity, API calls. The token lives only in this browser's storage and in memory;
// it is never logged, never put in an error text, never written anywhere else.

const KP_GH_API = 'https://api.github.com';
const KP_GH_TOKEN_RE = /^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/;
const KP_GH_ACCESS_HU = { write: 'írás', read: 'olvasás', none: 'nincs hozzáférés a repóhoz' };

const kpGh = { token: null, login: null, name: null, access: null, rate: null, error: null };
const kpGhCache = new Map();   // path -> { etag, body }

const kpGhTokenOk = t => KP_GH_TOKEN_RE.test(String(t || '').trim());

function kpGhLoad() {
  const t = kpStore.get('ghToken', null);
  if (kpGhTokenOk(t)) kpGh.token = t;
  const who = kpStore.get('ghWho', null);
  if (kpGh.token && who) Object.assign(kpGh, { login: who.login, name: who.name, access: who.access });
}

function kpGhSignOut(reason) {
  Object.assign(kpGh, { token: null, login: null, name: null, access: null, error: reason || null });
  kpGhCache.clear();
  kpStore.set('ghToken', null);
  kpStore.set('ghWho', null);
}

// -> { status, json | text, etag, rateRemaining, error? }. 304 answers come from the cache.
async function kpGhFetch(path, opts) {
  const o = opts || {};
  if (!kpGh.token) return { status: 0, error: 'Nincs GitHub belépés' };
  const headers = {
    Authorization: 'Bearer ' + kpGh.token,
    Accept: o.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  const method = o.method || 'GET';
  const key = (o.raw ? 'raw:' : '') + path;
  const cached = method === 'GET' && !o.nocache ? kpGhCache.get(key) : null;
  const etag = method === 'GET' && !o.nocache ? o.etag || (cached && cached.etag) : null;
  if (etag) headers['If-None-Match'] = etag;
  const init = { method, headers, cache: 'no-store' };
  if (o.body !== undefined) { headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(o.body); }
  let res;
  try { res = await fetch(KP_GH_API + path, init); }
  catch (e) { return { status: 0, error: 'Nincs kapcsolat a GitHubbal' }; }
  const h = n => (res.headers && res.headers.get ? res.headers.get(n) : null);
  const rate = h('x-ratelimit-remaining'), limit = h('x-ratelimit-limit');
  if (rate != null) kpGh.rate = +rate;
  if (limit != null) kpGh.rateLimit = +limit;
  const out = { status: res.status, etag: h('etag'), rateRemaining: rate == null ? null : +rate };
  if (res.status === 401) { kpGhSignOut('A token lejárt vagy hibás'); out.error = kpGh.error; return out; }
  if (res.status === 304 && cached) return Object.assign(out, cached.body, { etag: cached.etag, fromCache: true });
  if (res.status >= 200 && res.status < 300) {
    const body = o.raw ? { text: await res.text() } : { json: await res.json() };
    if (out.etag && method === 'GET' && !o.nocache) kpGhCache.set(key, { etag: out.etag, body });
    return Object.assign(out, body);
  }
  try { out.json = await res.json(); } catch (e) { /* no body */ }
  return out;
}

// who is this token, and what may it do with the repo
async function kpGhIdentify(repo) {
  kpGh.error = null;
  const u = await kpGhFetch('/user');
  if (u.status !== 200) {
    if (u.status !== 401) kpGh.error = u.error || 'A GitHub nem válaszolt (' + u.status + ')';
    return kpGh;
  }
  kpGh.login = u.json.login;
  kpGh.name = u.json.name || null;
  const r = await kpGhFetch('/repos/' + repo.owner + '/' + repo.name);
  if (r.status === 401) return kpGh;
  kpGh.access = r.status === 200 ? (r.json.permissions && r.json.permissions.push ? 'write' : 'read') : r.status === 404 ? 'none' : null;
  if (!kpGh.access) kpGh.error = r.error || 'A repó nem ellenőrizhető (' + r.status + ')';
  kpStore.set('ghWho', { login: kpGh.login, name: kpGh.name, access: kpGh.access });
  return kpGh;
}

async function kpGhSetToken(t, repo) {
  t = String(t || '').trim();
  if (!kpGhTokenOk(t)) return { ok: false, error: 'Ez nem GitHub token formátum (github_pat_… vagy ghp_…)' };
  kpGhSignOut();
  kpGh.token = t;
  kpStore.set('ghToken', t);
  await kpGhIdentify(repo);
  if (!kpGh.token) return { ok: false, error: kpGh.error || 'A token lejárt vagy hibás' };
  return { ok: !!kpGh.login, error: kpGh.error };
}

const kpGhHasRepo = () => !!kpGh.login && (kpGh.access === 'write' || kpGh.access === 'read');

if (typeof module !== 'undefined') module.exports = { kpGh, kpGhFetch, kpGhIdentify, kpGhSetToken, kpGhTokenOk, kpGhSignOut, kpGhCache };

// ---- 60-access.js
// The signed allowed list: verify with the embedded public key, find "me", gate layer 1.
// Honest scope: this decides what the Kapu opens. The real locks are GitHub and OneDrive.

const KP_ACCESS_SCHEMA = 'vrg-hub-access/1';
const KP_GATE_NO = 'Nem szerepelsz az engedélyezett listán — kérd a tulajdonost.';
const KP_GATE_BADSIG = 'A hozzáférési lista aláírása érvénytelen — a programok zárva maradnak.';
const KP_ACCESS_NOTE = 'A valódi zár a GitHub és a OneDrive jogosultság; ez a lista azt mutatja, kinek nyit a Kapu.';

// Canonical JSON: keys sorted at every level, no whitespace. The one form that gets signed
// (tools/hub-sign.js) and verified (the page) — both use this function.
function kpCanon(v) {
  if (Array.isArray(v)) return '[' + v.map(kpCanon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + kpCanon(v[k])).join(',') + '}';
  return JSON.stringify(v);
}

const kpAccess = { state: 'none', valid: false, me: null, role: null, people: 0 };

function kpB64Bytes(b64) {
  const s = atob(b64);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

// -> { state: 'none'|'unsigned'|'invalid'|'nocrypto'|'valid', valid, me, role, people }
async function kpAccessCheck(access, pubkey, login) {
  const r = { state: 'none', valid: false, me: null, role: null, people: 0 };
  if (!access || access.schema !== KP_ACCESS_SCHEMA || !access.body) return r;
  if (!access.sig || !pubkey) return Object.assign(r, { state: 'unsigned' });
  const subtle = typeof crypto !== 'undefined' && crypto.subtle;
  if (!subtle) return Object.assign(r, { state: 'nocrypto' });
  let ok = false;
  try {
    const key = await subtle.importKey('jwk', { kty: pubkey.kty, crv: pubkey.crv, x: pubkey.x, y: pubkey.y }, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    ok = await subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, kpB64Bytes(access.sig), new TextEncoder().encode(kpCanon(access.body)));
  } catch (e) { ok = false; }
  if (!ok) return Object.assign(r, { state: 'invalid' });
  const people = access.body.people || [];
  const me = login ? people.find(p => String(p.github || '').toLowerCase() === String(login).toLowerCase()) || null : null;
  return { state: 'valid', valid: true, me, role: me ? me.role : null, people: people.length };
}

// may this browser's user open layer-1 things?
const kpL1Open = () => !!(kpAccess.valid && kpAccess.me && (kpAccess.me.layers || []).includes('L1'));
function kpL1Why() {
  if (kpAccess.state === 'invalid') return KP_GATE_BADSIG;
  if (kpAccess.state !== 'valid') return 'Még nincs aláírt engedélyezett lista — a programok zárva maradnak.';
  if (!kpGh.login) return 'Előbb lépj be: GitHub';
  return KP_GATE_NO;
}

async function kpAccessRefresh() {
  Object.assign(kpAccess, await kpAccessCheck(kpData.access, kpData.pubkey, kpGh.login));
}

if (typeof module !== 'undefined') module.exports = { kpCanon, kpAccessCheck, kpB64Bytes, KP_GATE_NO, KP_GATE_BADSIG };

// ---- 80-companion.js
// The page side of the Kapu segéd: present only when the page is served by Hub/companion/server.js
// (which injects window.KP_COMPANION = {token, port}). Without it the buttons that start
// something stay greyed and the tool links open as plain files.

const kpComp = { on: false, status: null };

async function kpCompCall(action, body) {
  const c = typeof window !== 'undefined' && window.KP_COMPANION;
  if (!c) return { status: 0, json: { error: 'Kapu segéd nélkül' } };
  try {
    const r = await fetch('/api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Kapu-Token': c.token }, body: JSON.stringify(body) });
    return { status: r.status, json: await r.json() };
  } catch (e) { return { status: 0, json: { error: 'A Kapu segéd nem válaszol' } }; }
}

async function kpCompStatus() {
  if (typeof window === 'undefined' || !window.KP_COMPANION) return null;
  try { const r = await fetch('/api/status'); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

function kpCompDone(r, ok) {
  if (r.status === 200) kpToast(r.json && r.json.dryRun ? 'Próba: ' + r.json.exe + ' ' + (r.json.args || []).join(' ') + (r.json.cwd ? ' @ ' + r.json.cwd : '') : ok);
  else if (r.status === 403) kpToast('Ez a mappa nincs az engedélyezettek között (Hub/companion/config.json → roots)');
  else kpToast((r.json && r.json.error) || 'A Kapu segéd hibát jelzett (' + r.status + ')');
  return r;
}
const kpCompStart = () => kpCompCall('open-start', {}).then(r => kpCompDone(r, 'A START.cmd új ablakban indul'));
const kpCompTool = path => kpCompCall('open-tool', { path }).then(r => kpCompDone(r, 'Megnyitva, ahogy a START.cmd nyitja'));
const kpCompFolder = dir => kpCompCall('open-folder', { dir }).then(r => kpCompDone(r, 'Mappa megnyitva'));

// ---- 90-gate.js
// The access page: sign in with GitHub, check the signed allowed list, then hand over to
// START.cmd — the front door until the dashboard exists.

const KP_LOGIN = {
  github: 'https://github.com/login',
  ghToken: 'https://github.com/settings/personal-access-tokens/new'
};
const KP_FILE_BANNER = 'Csak linkek mód — a belépés nem marad meg, és a Kapu nem indít programot. Teljes mód: Hub\\VRG Kapu.cmd (START.cmd: H).';
const KP_TOKEN_NOTE = 'A token csak ebben a böngészőben marad. Ne küldd el senkinek, ne tedd fájlba.';
const KP_NO_COMP = 'Ehhez a Kapu segéd kell: indítsd a Kaput a Hub\\VRG Kapu.cmd-vel (START.cmd: H).';
const KP_WIZARD = [
  ['Nyisd meg a GitHubot, és lépj be a saját fiókoddal.', 'github.com → jobb felül a profilképed → Settings'],
  ['Bal oldalt, legalul: Developer settings.', 'Personal access tokens → Fine-grained tokens → Generate new token'],
  ['Adj nevet (pl. „VRG Kapu”), lejárat: 90 nap.', 'Repository access: Only select repositories → vrg-toolset'],
  ['Jogosultságok a repóhoz:', 'Permissions → Contents: Read-only · Metadata: Read-only'],
  ['Generate token → másold ki, és illeszd be ide.', 'A token egyszer látszik — ha elveszik, csinálj újat']
];

const kpIsFile = () => typeof location !== 'undefined' && location.protocol === 'file:';
function kpOpen(href) { window.open(href, '_blank', 'noopener'); }

let kpToastTimer = null;
function kpToast(msg) {
  const el = document.getElementById('kpToast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(kpToastTimer);
  kpToastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}

// 'login' (no identity yet) · 'checking' (token, no answer yet) · 'closed' (not on the list) · 'open'
function kpGateState() {
  if (!kpGh.token) return 'login';
  if (!kpGh.login) return kpGh.error ? 'login' : 'checking';
  return kpL1Open() ? 'open' : 'closed';
}

const kpCard = (cls, title, ...body) => kpEl('section', { class: 'kp-card' + (cls ? ' ' + cls : '') }, kpEl('h2', {}, title), ...body);
const kpBtn = (label, onclick, cls, title) => kpEl('button', { class: 'kp-btn' + (cls ? ' ' + cls : ''), onclick, title }, label);

async function kpSignOut() {
  kpGhSignOut();
  await kpAccessRefresh();
  kpRender();
}

function kpLoginCard() {
  const input = kpEl('input', { class: 'kp-in', type: 'password', autocomplete: 'off', spellcheck: 'false', placeholder: 'github_pat_…', 'aria-label': 'GitHub token' });
  const msg = kpEl('p', { class: 'kp-bad', role: 'status' }, kpGh.error || '');
  const go = kpBtn('Belépés', null, 'kp-primary');
  go.addEventListener('click', async () => {
    go.disabled = true;
    msg.className = 'kp-muted';
    msg.textContent = 'Ellenőrzés a GitHubon…';
    const r = await kpGhSetToken(input.value, KP_REPO);
    input.value = '';
    go.disabled = false;
    if (!r.ok) { msg.className = 'kp-bad'; msg.textContent = r.error; return; }
    await kpAccessRefresh();
    kpRender();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
  setTimeout(() => input.focus(), 0);
  return kpCard('', 'Belépés',
    kpEl('p', {}, 'A Kapu a GitHub-fiókoddal azonosít, és az aláírt engedélyezett listán nézi meg, hogy neked nyit-e. Jelszót nem tárol.'),
    kpEl('div', { class: 'kp-row' }, input, go),
    msg,
    kpEl('div', { class: 'kp-row' }, kpBtn('Token oldal megnyitása (új ablak)', () => kpOpen(KP_LOGIN.ghToken))),
    kpEl('details', { class: 'kp-wiz' }, kpEl('summary', {}, 'Hogyan kapok tokent? (5 lépés)'),
      kpEl('ol', {}, ...KP_WIZARD.map(([a, b]) => kpEl('li', {}, a, kpEl('div', { class: 'kp-muted' }, b))))),
    kpEl('p', { class: 'kp-note' }, KP_TOKEN_NOTE, ' ', KP_ACCESS_NOTE));
}

function kpClosedCard() {
  return kpCard('', 'Nincs hozzáférés',
    kpEl('p', { class: 'kp-bad' }, kpL1Why()),
    kpEl('p', { class: 'kp-muted' }, 'Belépve: ' + kpGh.login),
    kpEl('div', { class: 'kp-row' }, kpBtn('Kijelentkezés', kpSignOut)));
}

function kpToolRow(t) {
  const open = kpComp.on
    ? kpBtn('Megnyitás', () => kpCompTool(t.path))
    : kpEl('a', { class: 'kp-btn', href: kpToolHref(t), target: '_blank', rel: 'noopener' }, 'Megnyitás');
  const folder = kpComp.on ? kpBtn('Mappa', () => kpCompFolder(t.dir), '', t.dir) : kpBtn('Mappa', () => kpToast(KP_NO_COMP), 'off', KP_NO_COMP);
  return kpEl('li', { class: 'kp-tool' }, kpEl('span', { class: 'kp-key', title: 'Billentyű a START.cmd-ben' }, t.key),
    kpEl('div', { class: 'kp-tool-t' }, kpEl('div', {}, t.name), kpEl('div', {}, t.path)), open, folder);
}

function kpOpenCards() {
  const start = kpComp.on
    ? kpBtn('▶ START.cmd indítása', kpCompStart, 'kp-primary big')
    : kpBtn('▶ START.cmd indítása', () => kpToast(KP_NO_COMP), 'kp-primary big off', KP_NO_COMP);
  return [
    kpCard('soon', 'Irányítópult — készül',
      kpEl('p', {}, 'Ide jön a közös irányítópult. Addig a START.cmd a kapu: minden program, build, teszt és mappa onnan érhető el.')),
    kpCard('', 'START.cmd — az indítópult',
      kpEl('p', {}, 'Új parancssor-ablakban nyílik; a számok és betűk ugyanazok, mint eddig. Minden eszköznél a böngészőválasztóban van „Mappa megnyitása” is.'),
      kpEl('div', { class: 'kp-row' }, start, kpComp.on ? kpBtn('Planner mappa', () => kpCompFolder('Planner')) : null),
      kpComp.on ? null : kpEl('p', { class: 'kp-muted' }, KP_NO_COMP + ' Vagy indítsd közvetlenül: Planner\\START.cmd.')),
    kpCard('', 'Eszközök',
      kpEl('p', { class: 'kp-muted' }, 'A START.cmd eszközlistája, ugyanazokkal a billentyűkkel.'),
      kpData.tools.length ? kpEl('ul', { class: 'kp-tools' }, ...kpData.tools.map(kpToolRow)) : kpEl('p', { class: 'kp-bad' }, 'A build nem találta a START.cmd eszközlistáját.'))
  ];
}

function kpRender() {
  const state = kpGateState();
  const main = document.getElementById('kpMain');
  if (state === 'login') main.replaceChildren(kpLoginCard());
  else if (state === 'checking') main.replaceChildren(kpCard('', 'Belépés', kpEl('p', { class: 'kp-muted' }, 'Ellenőrzés a GitHubon…')));
  else if (state === 'closed') main.replaceChildren(kpClosedCard());
  else main.replaceChildren(...kpOpenCards());

  const who = document.getElementById('kpWho');
  who.replaceChildren(...(kpGh.login ? [kpGh.login + (kpAccess.role ? ' · ' + (kpAccess.role === 'owner' ? 'Tulajdonos' : 'tag') : '') + ' ',
    kpEl('a', { href: '#', onclick: e => { e.preventDefault(); kpSignOut(); } }, 'Kijelentkezés')] : []));

  const msgs = [];
  if (kpIsFile() || !kpStore.available()) msgs.push(KP_FILE_BANNER);
  if (kpAccess.state === 'invalid') msgs.push(KP_GATE_BADSIG);
  if (kpGh.login && kpGh.error) msgs.push('Nincs kapcsolat a GitHubbal — a legutóbbi belépéssel nyílt a Kapu.');
  const b = document.getElementById('kpBanner');
  b.hidden = !msgs.length;
  b.replaceChildren(...msgs.flatMap((m, i) => (i ? [kpEl('br'), m] : [m])));
  document.getElementById('kpMode').textContent = kpComp.on ? 'teljes mód · Kapu segéd: localhost:' + window.KP_COMPANION.port : 'csak linkek mód';
}

// ---- 99-boot.js
// Boot: theme, embedded data, then the gate. The page renders at once from what this browser
// remembers and re-renders after the companion and GitHub have answered.

const KP_THEMES = [['amber', '#e6a532'], ['light', '#f4efe6'], ['slate', '#4fb0d0'], ['green', '#57c07a']];
const KP_THEME_NAMES = { amber: 'Borostyán', light: 'Világos', slate: 'Pala', green: 'Zöld' };

const kpData = { access: null, pubkey: null, tools: [] };

function kpSetTheme(t) {
  if (!KP_THEMES.some(([n]) => n === t)) t = 'amber';
  document.documentElement.setAttribute('data-theme', t);
  kpStore.set('theme', t);
  document.getElementById('kpThemes').replaceChildren(...KP_THEMES.map(([n, c]) => kpEl('button', {
    class: 'kp-swatch' + (n === t ? ' sel' : ''), style: 'background:' + c,
    title: KP_THEME_NAMES[n], 'aria-label': KP_THEME_NAMES[n], onclick: () => kpSetTheme(n)
  })));
}

async function kpBoot() {
  kpData.access = kpEmbedded('kpAccess');
  kpData.pubkey = kpEmbedded('kpPubkey');
  kpData.tools = kpEmbedded('kpTools') || [];
  kpSetTheme(kpStore.get('theme', 'amber'));
  document.getElementById('kpBuild').textContent = 'build ' + KP_BUILD;
  kpGhLoad();
  await kpAccessRefresh();
  kpRender();
  kpComp.status = await kpCompStatus();
  kpComp.on = !!(kpComp.status && kpComp.status.ok);
  kpRender();
  if (kpGh.token) {
    await kpGhIdentify(KP_REPO);
    await kpAccessRefresh();
    kpRender();
  }
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', kpBoot);
  else kpBoot();
}
</script>
</body>
</html>
