<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRG Sketcher — Asztal</title>
<style>
/* VRG Sketcher Desktop — dark, calm; tokens after shared/vrg-ui-kit theme-melyviz (inlined, no external URLs). */
:root {
  --bg: #0a141c; --sunk: #071017; --s1: #121c24; --s2: #17232c; --s3: #1d2a34;
  --line: rgba(232, 240, 246, .15); --line2: rgba(232, 240, 246, .34);
  --text: #e8f0f6; --muted: #a6afb7; --faint: #646d74;
  --accent: #93d3e6; --activity: #e8a873; --ok: #8bcca1; --warn: #e3be7b; --crit: #e4877d;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
#root { display: flex; flex-direction: column; height: 100%; }
#hdr { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: var(--s1); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.brand { font: 600 15px var(--sans); letter-spacing: .04em; color: var(--accent); white-space: nowrap; }
.brand span { font-size: 18px; }
.hinfo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.hinfo .nm { font-weight: 600; }
.hinfo .ad { color: var(--muted); font-size: 12.5px; }
.grow { flex: 1; }
.btn { font: 13px var(--sans); color: var(--text); background: var(--s2); border: 1px solid var(--border, #6c7880); padding: 5px 12px; cursor: pointer; display: inline-block; }
.btn:hover { background: var(--s3); border-color: var(--accent); }
.btn.primary { color: #071318; background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { background: #b9e3f0; }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn.on { border-color: var(--c, var(--accent)); color: var(--c, var(--accent)); }
.btn.dim { color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#body { flex: 1; display: flex; min-height: 0; }
#rail { flex: none; width: 66px; background: var(--sunk); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 4px 0; overflow-y: auto; }
.rb { position: relative; background: none; border: 0; border-left: 3px solid transparent; color: var(--c, var(--muted)); padding: 6px 2px 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-family: var(--sans); }
.rb:hover { background: var(--s2); }
.rb.act { background: var(--s2); border-left-color: var(--c, var(--accent)); }
.rb .sym { font-size: 24px; line-height: 1.1; }
.rb .cap { font-size: 10px; color: var(--muted); margin-top: 1px; }
.rb.act .cap { color: var(--text); }
.badge { position: absolute; top: 2px; right: 6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--s3); border: 1px solid var(--line2); color: var(--text); font: 600 11px/16px var(--mono); text-align: center; }
.badge.new { background: var(--c, #e8641c); border-color: var(--c, #e8641c); color: #071318; }
.sep { height: 1px; background: var(--line); margin: 4px 8px; }
#main { flex: 1; overflow: auto; padding: 14px 18px 40px; min-width: 0; }
h2 { font: 600 17px var(--sans); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .sym { font-size: 22px; color: var(--c); }
h3 { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
.card { background: var(--s1); border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 10px; }
.card.fresh { border-left: 3px solid #e8641c; }
.card.later { opacity: .8; border-left: 3px dashed var(--faint); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; } .mono { font-family: var(--mono); }
.empty { color: var(--muted); padding: 30px 10px; text-align: center; border: 1px dashed var(--line2); }
.pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--c, var(--line2)); color: var(--c, var(--text)); background: color-mix(in srgb, var(--c, #888) 13%, transparent); padding: 2px 9px; margin: 0 5px 5px 0; font: 13px var(--sans); cursor: default; }
.pill i { font-style: normal; font-size: 15px; }
button.pill { cursor: pointer; }
button.pill:hover { background: color-mix(in srgb, var(--c, #888) 28%, transparent); }
button.pill.sel { background: var(--c, var(--accent)); color: #071318; }
.pill.off { color: var(--muted); border-color: var(--line); background: none; }
.pill.ghost { border-style: dashed; }
.pill .x { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 0 0 4px; font-size: 14px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; font-size: 13px; }
.kv b { color: var(--muted); font-weight: 400; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--c, var(--line2)); margin: 0 5px 5px 0; background: color-mix(in srgb, var(--c, #888) 13%, transparent); }
.stepper .nm { padding: 2px 8px; color: var(--c); } .stepper .nm i { font-style: normal; font-size: 15px; margin-right: 4px; }
.stepper button { background: var(--s3); color: var(--text); border: 0; width: 26px; height: 26px; cursor: pointer; font-size: 15px; }
.stepper button:hover { background: var(--s2); }
.stepper .q { min-width: 28px; text-align: center; font: 600 13px var(--mono); }
textarea, input[type=text], input[type=number], select { background: var(--sunk); color: var(--text); border: 1px solid var(--line2); padding: 5px 8px; font: 13.5px var(--sans); width: 100%; }
textarea { resize: vertical; min-height: 56px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qcard .qt { font-weight: 600; margin-bottom: 6px; }
.qcard .acts { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: 11px var(--mono); padding: 1px 6px; border: 1px solid var(--line2); color: var(--muted); margin-left: 6px; }
.tag.new { color: #e8641c; border-color: #e8641c; }
.tl { border-left: 2px solid var(--line2); margin-left: 6px; padding-left: 12px; }
.ent { position: relative; margin-bottom: 10px; }
.ent::before { content: ""; position: absolute; left: -17px; top: 6px; width: 8px; height: 8px; background: var(--c, var(--accent)); }
.ent .meta { font: 12px var(--mono); color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ent.open .txt { border-left: 3px solid #d64545; padding-left: 6px; }
.flag { background: none; border: 0; cursor: pointer; color: var(--faint); font-size: 15px; }
.flag.on { color: #d64545; }
.shotrow { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); }
.shotrow .ck { width: 20px; text-align: center; font-weight: 700; }
.shotrow.done .ck { color: var(--ok); }
.thumb { width: 96px; height: 72px; object-fit: cover; border: 1px solid var(--line2); background: var(--sunk); display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 11px; flex: none; }
.cap-card { display: flex; gap: 10px; }
.svgwrap { background: var(--sunk); border: 1px solid var(--line); }
.svgwrap svg { display: block; width: 100%; height: min(62vh, 560px); }
svg .fl { fill: #e9e5da; fill-opacity: .08; }
svg .edge { stroke: #cfd8de; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-width: 2; }
svg .est { stroke: #e8641c; stroke-width: 2.5; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; }
svg .lbl { fill: #cfd8de; font-family: var(--sans); text-anchor: middle; }
svg .lbl.e { fill: #e8641c; font-family: var(--mono); }
svg .dev.meglevo { fill: #d9a441; } svg .dev.tervezett { fill: #27c2b0; } svg .dev { stroke: #071017; stroke-width: 1; vector-effect: non-scaling-stroke; }
svg .wedge { stroke: #2a8cdb; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
svg .wedge.shot { fill: #2a8cdb; fill-opacity: .55; } svg .wedge.noshot { fill: none; stroke-dasharray: 3 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 4px; vertical-align: -1px; }
.le { display: flex; gap: 8px; padding: 5px 8px; cursor: pointer; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; color: var(--text); width: 100%; text-align: left; font: 13px var(--sans); }
.le:hover { background: var(--s2); }
.le .k { color: var(--c); width: 18px; text-align: center; }
iframe.map { width: 100%; height: 420px; border: 1px solid var(--line2); background: var(--sunk); }
a { color: var(--accent); }
code { font: 12.5px var(--mono); background: var(--sunk); padding: 1px 5px; border: 1px solid var(--line); }
#drop { position: fixed; inset: 0; background: rgba(4, 9, 13, .8); display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px dashed var(--accent); color: var(--accent); z-index: 9; }
#drop[hidden] { display: none; }
.msg { padding: 6px 10px; margin-bottom: 10px; border: 1px solid var(--warn); color: var(--warn); font-size: 13px; }
.msg.err { border-color: var(--crit); color: var(--crit); }
.msg.ok { border-color: var(--ok); color: var(--ok); }
@media (max-width: 960px) { #main { padding: 10px 10px 40px; } .kv { grid-template-columns: 100px 1fr; } .grid { grid-template-columns: 1fr; } }
/* Kamera 2 */
.cap-card video.thumb { object-fit: cover; }
.card.pair { display: flex; gap: 10px; flex-wrap: wrap; }
.card.pair figure { margin: 0; flex: 1 1 220px; }
.pairimg { width: 100%; max-height: 260px; object-fit: contain; border: 1px solid var(--line2); background: var(--sunk); }
.sigimg { display: block; max-width: 320px; width: 100%; margin-top: 6px; background: #fff; border: 1px solid var(--line2); }
.tag.warn, .warn { color: var(--crit); }
.tag.ok { color: var(--ok); }
.tag.dim { opacity: .5; text-decoration: line-through; }
.ocr { margin-top: 3px; }
/* F1: the sketch on the building */
svg.siteplace { width: 100%; max-height: 320px; background: var(--sunk); border: 1px solid var(--line2); border-radius: 6px; margin-bottom: 6px; }
svg.siteplace .so { fill: rgba(138, 92, 214, 0.10); stroke: #8a5cd6; stroke-dasharray: 0.6 0.3; }
svg.siteplace .sp { fill: rgba(39, 194, 176, 0.28); stroke: #137d72; }
svg.siteplace .sb { stroke: #d64545; }
svg.siteplace text { fill: var(--muted, #888); }
#siteplace .ok { color: #3dae5a; } #siteplace .bad { color: #d64545; }
/* the Munkakör lap (takeoff, docs/sketcher/TAKEOFF.md) */
.tk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 12px; margin: 8px 0; }
.tk-item { display: flex; gap: 6px; align-items: baseline; padding: 2px 4px; border-left: 3px solid #3dae5a; }
.tk-item .sym { width: 1.4em; text-align: center; }
.tk-item .lb { flex: 1; }
.tk-item .q { font-variant-numeric: tabular-nums; font-weight: 600; }
.tk-item .fl { width: 1em; color: #d64545; }
.tk-item.est { border-left-color: #e8641c; }
.tk-item.est .q { color: #e8641c; }
.tk-item.keep { opacity: .6; border-left-color: #a6afb7; }
.tk-dec { margin: 4px 0; }
/* F4 (WP M49): the client's wants by room */
.stepper .here { color: var(--c); font-size: 10px; }
.card.wants { margin-top: 6px; } .card.wants .wrow { margin-top: 5px; } .card.wants .wrow b { margin-right: 6px; }
.card.wants .pill .x { margin-left: 4px; }

</style>
</head>

  const levelOf = s => LEVELS.includes(s.level) ? s.level : 'ground';
  const typeOf = p => (FK.POINT_TYPES.includes(p.type) ? p.type : 'pont');
  const levelH = (rules, level) => { const l = (rules.levels || []).find(x => x[0] === level) || (rules.levels || []).find(x => x[0] === 'ground'); return l ? l[1] : 2700; };
  const ptRule = (rules, type) => (rules.points || []).find(p => p.id === type) || (rules.points || []).find(p => p.id === 'pont');
  function roomKinds(s, r) {
    const k = (r.kinds || []).slice();
    FK.tagsOf(s, r.id).forEach(t => { if (t.preset && t.preset.startsWith('kind:')) k.push(t.preset.slice(5)); });
    return k.filter((x, i) => k.indexOf(x) === i);
  }
  // no solved plan (a bare survey file): the sketch at the default scale, everything a guess
  function planRaw(s, rules) {
    const k = rules.cable.rawScaleMm, R = v => Math.round(v * k), ceil = levelH(rules, levelOf(s));
    const rooms = (s.rooms || []).filter(r => (r.poly || []).length >= 3).map(r => ({ id: r.id, name: r.name || '', kinds: roomKinds(s, r),
      poly: r.poly.map(p => [R(p[0]), R(p[1])]), est: true }));
    const pts = {};
    (s.points || []).forEach(p => {
      const pr = ptRule(rules, typeOf(p)), onWall = p.room != null && p.edge != null && p.t != null;
      pts[p.id] = { x: R(p.at[0]), y: R(p.at[1]), h: pr.ceiling && !onWall ? ceil : pr.h };
    });
    const routes = {};
    (s.routes || []).forEach(r => { if ((r.pts || []).length >= 2) routes[r.id] = r.pts.map(p => [R(p[0]), R(p[1])]); });
    return { solved: false, rooms, pts, routes };
  }

  // ---- helpers over the survey ------------------------------------------------------------------------------------
  const tagHit = (tags, spec) => !!spec && tags.some(t => (spec.presets || []).includes(t.preset) || (spec.names || []).includes(FK.fold(t.name)));
  function actionOf(s, rules, p) {
    const tags = FK.tagsOf(s, p.id);
    if (tagHit(tags, rules.removeTags)) return 'bontas';
    if (tagHit(tags, rules.replaceTags)) return 'csere';
    return (p.st || 'tervezett') === 'meglevo' ? 'marad' : 'uj';
  }
  const scopeQ = (s, id) => { const v = (s.scope || {})[id]; return typeof v === 'number' && v > 0 ? v : 0; };
  const answered = (s, q) => { const a = (s.answers || {})[q]; return a && (a.state || 'answered') === 'answered' ? a : null; };
  const scopeItem = (kit, id) => kit.scope.find(x => x.id === id) || null;
  const roomTitle = r => r.name || r.kinds.join(' + ') || r.id;
  const stemOf = s => (FK.fold(s.name || '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'vazlat').slice(0, 40);

  function item(id, cat, label, sym, unit, qty, o) {
    o = o || {};
    return { id, cat, label, sym, unit, qty, est: !!o.est, work: o.work !== false, open: [], note: o.note || '', refs: o.refs || [] };
  }

  // ---- the takeoff ------------------------------------------------------------------------------------------------
  // opts: {now, endReserveMm, looseEndMm}
  function build(kit, rules, s, plan, opts) {
    opts = opts || {};
    plan = plan || planRaw(s, rules);
    const now = opts.now == null ? Date.now() : opts.now;
    const reserve = opts.endReserveMm == null ? rules.cable.endReserveMm : opts.endReserveMm;
    const loose = opts.looseEndMm == null ? rules.cable.looseEndMm : opts.looseEndMm;
    const ceil = levelH(rules, levelOf(s));
    const A = {}; (rules.actions || []).forEach(a => { A[a.id] = a; });
    const items = [], checks = [];
    const points = s.points || [], circuits = (s.circuits || []).filter(c => (c.members || []).length > 0);

    // points by type and action; the Igények counts reconcile with what is drawn
    let fixedDrawn = 0;
    (rules.points || []).filter(t => t.id !== 'board').forEach(t => {
      const of = points.filter(p => typeOf(p) === t.id);
      const want = (rules.scopePoints || []).filter(x => x[1] === t.id).reduce((n, x) => n + scopeQ(s, x[0]), 0);
      (rules.actions || []).forEach(a => {
        const list = of.filter(p => actionOf(s, rules, p) === a.id), drawn = list.length;
        if (t.id === 'fixed' && (a.id === 'uj' || a.id === 'csere')) fixedDrawn += drawn;
        const isNew = a.id === 'uj', qty = isNew ? Math.max(drawn, want) : drawn;
        if (qty <= 0) return;
        const note = isNew && want > 0 && want !== drawn ? 'Munkakör: ' + want + ', vázlat: ' + drawn : '';
        items.push(item('pont.' + t.id + '.' + a.id, 'pont', t.label + ' — ' + a.label, t.sym, 'db', qty,
          { est: (isNew && want > drawn) || t.id === 'pont', work: a.id !== 'marad', note, refs: list.map(p => p.id) }));
      });
    });

    // machines (gépbekötés) from the scope
    let machines = 0, implied = 0;
    (rules.machines || []).forEach(m => {
      const q = scopeQ(s, m.id); if (!q) return;
      const k = scopeItem(kit, m.id) || { label: m.id, sym: '⊗' };
      machines += q; implied += q * (m.dedicated || 0);
      items.push(item('gep.' + m.id, 'gep', k.label, k.sym, 'db', q, { refs: [] }));
    });
    if (machines > 0 && fixedDrawn > 0 && machines !== fixedDrawn) checks.push('Gépbekötés a Munkakörben: ' + machines + ', fix bekötés a vázlaton: ' + fixedDrawn);

    // systems from the scope; a count from its answer where the rules name one
    const sysItems = [];
    (rules.systems || []).forEach(y => {
      if (!scopeQ(s, y.id)) return;
      const k = scopeItem(kit, y.id) || { label: y.id, sym: '◈' };
      let qty = 1, est = false, note = '';
      if (y.qtyQ) {
        const a = answered(s, y.qtyQ), hit = a && (y.qtyMap || []).find(x => (a.options || []).includes(x[0]));
        if (hit) { qty = hit[1]; est = (y.qtyEst || []).includes(hit[0]); }
        else { est = true; note = 'a darabszám még nincs meg'; }
      }
      implied += qty * (y.dedicated || 0);
      sysItems.push(item('rendszer.' + y.id, 'rendszer', k.label, k.sym, 'db', qty, { est, note }));
    });

    // circuits: drawn ones, and the dedicated circuits the machines and systems imply
    const dedOf = c => !!c.ded || tagHit(FK.tagsOf(s, c.id), rules.dedicatedTags) || (c.members || []).some(m => tagHit(FK.tagsOf(s, m), rules.dedicatedTags));
    const ded = circuits.filter(dedOf), gen = circuits.filter(c => !dedOf(c));
    if (gen.length) items.push(item('aramkor.altalanos', 'aramkor', 'Áramkör — általános', '◌', 'db', gen.length, { refs: gen.map(c => c.id) }));
    const dq = Math.max(ded.length, implied);
    if (dq > 0) items.push(item('aramkor.dedikalt', 'aramkor', 'Áramkör — dedikált', '◉', 'db', dq, { est: implied > ded.length,
      note: implied > 0 && implied !== ded.length ? 'gépek, rendszerek szerint: ' + implied + ', vázlat: ' + ded.length : '', refs: ded.map(c => c.id) }));

    // boards: the one feeding most circuits is the main one, the others are taken for sub-boards (≈)
    const boards = points.filter(p => typeOf(p) === 'board');
    const fed = b => (s.circuits || []).filter(c => c.board === b.id).length;
    let main = null; boards.forEach(b => { if (main === null || fed(b) > fed(main)) main = b; });
    const bAct = b => { const a = actionOf(s, rules, b); return b === main && a === 'marad' && scopeQ(s, rules.boardScope) > 0 ? 'csere' : a; };
    ['eloszto', 'aleloszto'].forEach(role => (rules.actions || []).forEach(a => {
      const list = boards.filter(b => (b === main ? 'eloszto' : 'aleloszto') === role && bAct(b) === a.id);
      if (!list.length) return;
      items.push(item(role + '.' + a.id, role, (role === 'eloszto' ? 'Elosztó' : 'Alelosztó') + ' — ' + a.label, '▣', 'db', list.length,
        { est: role === 'aleloszto', work: a.id !== 'marad', note: role === 'aleloszto' ? 'alelosztónak vettük' : '', refs: list.map(b => b.id) }));
    }));
    if (!boards.length && scopeQ(s, rules.boardScope) > 0)
      items.push(item('eloszto.csere', 'eloszto', 'Elosztó — ' + A.csere.label, '▣', 'db', 1, { est: true, note: 'a vázlaton nincs elosztó' }));
    const nb = answered(s, rules.newBoardQ);
    if (nb && (nb.options || []).includes(rules.newBoardOpt) && !items.some(x => x.id === 'eloszto.uj')) {
      const q = kit.questions.find(x => x.id === rules.newBoardQ);
      items.push(item('eloszto.uj', 'eloszto', 'Elosztó — ' + A.uj.label, '▣', 'db', 1, { est: true, note: 'a válasz szerint: ' + (q ? q.q : rules.newBoardQ) }));
    }

    // cable: every route (its solved length + a drop at each end), then the home runs nobody drew (≈)
    const drop = id => { const p = id != null ? plan.pts[id] : null; return p ? Math.max(0, ceil - p.h) + reserve : loose; };
    const inEst = pt => plan.rooms.some(r => r.est && (() => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      r.poly.forEach(q => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); });
      return pt[0] >= x0 - 1 && pt[0] <= x1 + 1 && pt[1] >= y0 - 1 && pt[1] <= y1 + 1; })());
    const cname = id => { const c = (s.circuits || []).find(x => x.id === id); return c ? c.name || c.id : ''; };
    let rtot = 0, rest = false; const rparts = [], rrefs = [];
    (s.routes || []).forEach(r => {
      const P = plan.routes[r.id]; if (!P) return;
      let len = 0; for (let i = 1; i < P.length; i++) len += seg(P[i - 1], P[i]);
      const mm = Math.round(len) + drop(r.a) + drop(r.b);
      rtot += mm; rrefs.push(r.id);
      if (!plan.solved || P.some(inEst)) rest = true;
      rparts.push({ ref: r.id, label: cname(r.circuit), m: m1(mm) });
    });
    if (rrefs.length) { const it = item('kabel.nyomvonal', 'kabel', 'Kábel a nyomvonalon', '〰', 'm', m1(rtot), { est: rest, refs: rrefs,
      note: 'nyomvonal + végenként ' + fmt(reserve / 1000) + ' m tartalék és a függőleges szakasz' }); it.parts = rparts; items.push(it); }
    let htot = 0; const hparts = [], hrefs = [];
    circuits.forEach(c => {
      const b = c.board != null ? plan.pts[c.board] : null; if (!b) return;
      const mem = c.members || [];
      if ((s.routes || []).some(r => plan.routes[r.id] && (r.circuit === c.id || mem.includes(r.a) || mem.includes(r.b)))) return;
      let best = null, bd = Infinity;
      mem.forEach(id => { const p = plan.pts[id]; if (!p) return; const d = Math.abs(p.x - b.x) + Math.abs(p.y - b.y); if (d < bd) { bd = d; best = id; } });
      if (best === null) return;
      const mm = bd + drop(c.board) + drop(best);
      htot += mm; hrefs.push(c.id); hparts.push({ ref: c.id, label: c.name || c.id, m: m1(mm) });
    });
    if (hrefs.length) { const it = item('kabel.bekotes', 'kabel', 'Kábel az elosztótól (rajzolatlan)', '⚡', 'm', m1(htot), { est: true, refs: hrefs,
      note: 'az elosztótól a legközelebbi pontig, derékszögben' }); it.parts = hparts; items.push(it); }
    if (scopeQ(s, 'ev')) {
      const a = answered(s, rules.cable.evCableQ), hit = a && (rules.cable.evCableM || []).find(x => (a.options || []).includes(x[0]));
      items.push(item('kabel.ev', 'kabel', 'Kábel az e-autó töltőhöz', '⚡', 'm', hit ? hit[1] : 0, { est: true, note: hit ? 'a válasz szerint' : 'a távolság még nincs meg' }));
    }

    sysItems.forEach(x => items.push(x));

    // the other countable wants
    const covered = new Set((rules.scopePoints || []).map(x => x[0]).concat((rules.machines || []).map(m => m.id)));
    kit.scope.filter(k => k.group === 'igeny' && k.qty && !covered.has(k.id) && scopeQ(s, k.id)).forEach(k =>
      items.push(item('igeny.' + k.id, 'igeny', k.label, k.sym, 'db', scopeQ(s, k.id))));

    // the open decisions that change a quantity (⚑)
    const f = FK.facts(kit, s), shadow = FK.questions(kit, s, f, now);
    const hits = (id, p) => id === p || id.startsWith(p + '.');
    const decisions = [];
    (rules.decisions || []).forEach(d => {
      const x = shadow.find(y => y.q.id === d.q); if (!x || x.done) return;
      const aff = items.filter(it => d.affects.some(p => hits(it.id, p))).map(it => it.id);
      aff.forEach(id => items.find(it => it.id === id).open.push(d.q));
      decisions.push({ q: d.q, label: x.q.q, who: x.q.who, state: x.later ? 'later' : 'open', affects: aff });
    });

    // the intake as it is
    const order = new Map(kit.questions.map((q, i) => [q.id, i]));
    const optLabel = (q, o) => { const p = (q.options || []).find(x => x.id === o); return p ? p.label : o; };
    const questions = shadow.slice().sort((a, b) => order.get(a.q.id) - order.get(b.q.id)).map(x => ({ q: x.q.id, label: x.q.q, who: x.q.who,
      state: x.done ? 'answered' : x.later ? 'later' : 'open', options: (x.answer ? x.answer.options || [] : []).map(o => optLabel(x.q, o)), text: x.answer ? x.answer.text || '' : '' }));
    const chipLabel = c => { const k = kit.chips.find(x => x.id === c); return k ? k.label : c; };
    const roomName = id => { if (!id) return ''; const r = plan.rooms.find(x => x.id === id); if (r) return roomTitle(r); const q = (s.rooms || []).find(x => x.id === id); return q ? q.name || id : id; };
    const notes = (s.entries || []).map(e => ({ id: e.id, text: e.text || '', chips: (e.chips || []).map(chipLabel), room: roomName(e.room), open: !!e.open }));
    const memos = (s.memos || []).map(m => ({ id: m.id, text: m.text || '' }));
    const stem = stemOf(s), caps = s.captures || [], photos = [];
    const purposeIds = kit.purposes.map(p => p.id);
    caps.forEach(c => { const p = c.purpose || 'egyeb'; if (!purposeIds.includes(p)) purposeIds.push(p); });
    const roomShots = (s.photos || []).reduce((n, p) => n + (p.shots || []).length, 0);
    purposeIds.forEach(id => {
      const list = caps.filter(c => (c.purpose || 'egyeb') === id), n = list.length + (id === 'szoba' ? roomShots : 0);
      if (!n) return;
      const k = kit.purposes.find(p => p.id === id) || { label: id, sym: '◉' };
      photos.push({ purpose: id, label: k.label, sym: k.sym, n, files: list.map(c => stem + '_' + c.id + '_' + (c.purpose || 'egyeb') + '.jpg') });
    });
    // F4 (WP M49): the client's wants a room holds (roomScope), only on a room that has some
    const roomWants = id => kit.scope.filter(k => k.qty && (((s.roomScope || {})[id] || {})[k.id] || 0) > 0)
      .map(k => ({ id: k.id, label: k.label, sym: k.sym, qty: s.roomScope[id][k.id] }));
    const rooms = plan.rooms.map(r => { const o = { id: r.id, name: roomTitle(r), kinds: r.kinds.slice(), areaM2: a1(area(r.poly)), est: r.est }, w = roomWants(r.id); if (w.length) o.wants = w; return o; });
    const scope = GROUPS.map(([g, label]) => ({ group: g, label, items: kit.scope.filter(k => k.group === g && scopeQ(s, k.id)).map(k => ({ id: k.id, label: k.label, sym: k.sym, qty: scopeQ(s, k.id) })) }))
      .filter(g => g.items.length);

    const totalArea = a1(plan.rooms.reduce((t, r) => t + area(r.poly), 0));
    return {
      kind: KIND, v: V, made: now,
      source: { name: s.name || '', id: s.id || '', level: levelOf(s), plan: plan.solved ? 'megoldott' : 'nyers',
        variant: s.variantOn && s.variant ? s.variant : '' },
      config: { endReserveMm: reserve, looseEndMm: loose, ceilingMm: ceil },
      counts: { items: items.length, work: items.filter(x => x.work).length, est: items.filter(x => x.est).length, open: items.filter(x => x.open.length).length,
        decisions: decisions.length, tisztazando: notes.filter(n => n.open).length,
        answered: questions.filter(q => q.state === 'answered').length, questionsOpen: questions.filter(q => q.state !== 'answered').length,
        rooms: rooms.length, areaM2: totalArea, photos: photos.reduce((t, p) => t + p.n, 0) },
      scope, items, decisions, checks, questions, notes, memos, photos, rooms,
    };
  }

  // ---- the readable summary (Hungarian) ----------------------------------------------------------------------------
  function markdown(t) {
    const L = [], cell = x => String(x).replace(/\|/g, '/').replace(/\n/g, ' ');
    const flags = it => (it.est ? '≈' : '') + (it.open.length ? (it.est ? ' ' : '') + '⚑' : '');
    L.push('# Munkakör lap — ' + (t.source.name || 'Felmérés'));
    L.push('');
    L.push('*' + KIND + ' v' + t.v + ' · felmérés ' + t.source.id + ' · terv: ' + t.source.plan + (t.source.variant ? ' · variáns: ' + t.source.variant : '') +
      ' · ' + t.counts.rooms + ' helyiség, ' + fmt(t.counts.areaM2) + ' m²*');
    L.push('');
    L.push('≈ = becsült, ⚑ = nyitott döntés változtathat rajta. Árat nem tartalmaz: az árazás a Varler Workflow Kit dolga.');
    if (t.scope.length) {
      L.push(''); L.push('## Munkakör'); L.push('');
      t.scope.forEach(g => L.push('- **' + g.label + ':** ' + g.items.map(i => i.label + (i.qty > 1 ? ' ×' + i.qty : '')).join(', ')));
    }
    L.push(''); L.push('## Tételek'); L.push('');
    if (!t.items.length) L.push('Még nincs tétel.');
    else {
      L.push('| | Tétel | Mennyiség | | Megjegyzés |'); L.push('|---|---|---|---|---|');
      t.items.forEach(it => L.push('| ' + it.sym + ' | ' + cell(it.label) + ' | ' + fmt(it.qty) + ' ' + it.unit + ' | ' + flags(it) + ' | ' + cell(it.note) + ' |'));
      const parts = t.items.filter(it => it.parts && it.parts.length);
      parts.forEach(it => { L.push(''); L.push('**' + it.label + '** szakaszonként: ' + it.parts.map(p => (p.label || p.ref) + ' ' + fmt(p.m) + ' m').join(', ')); });
    }
    if (t.decisions.length) {
      L.push(''); L.push('## Döntésre vár ⚑'); L.push('');
      const lab = id => { const it = t.items.find(x => x.id === id); return it ? it.label : id; };
      t.decisions.forEach(d => L.push('- ' + (d.state === 'later' ? '⏱ ' : '') + d.label + (d.affects.length ? ' → ' + d.affects.map(lab).join(', ') : '')));
    }
    if (t.checks.length) { L.push(''); L.push('## Ellenőrizni'); L.push(''); t.checks.forEach(c => L.push('- ' + c)); }
    const qs = t.questions;
    if (qs.length) {
      L.push(''); L.push('## Kérdések (' + t.counts.answered + ' megválaszolva, ' + t.counts.questionsOpen + ' nyitott)'); L.push('');
      qs.forEach(q => L.push('- ' + (q.state === 'answered' ? '✓' : q.state === 'later' ? '⏱' : '○') + ' ' + q.label +
        (q.options.length ? ' — ' + q.options.join(', ') : '') + (q.text ? ' — „' + q.text + '”' : '')));
    }
    if (t.notes.length || t.memos.length) {
      L.push(''); L.push('## Jegyzetek'); L.push('');
      t.notes.forEach(n => L.push('- ' + (n.open ? '⚑ Tisztázandó: ' : '') + (n.text || '(csak címke)') + (n.chips.length ? ' [' + n.chips.join(', ') + ']' : '') + (n.room ? ' · ' + n.room : '')));
      t.memos.forEach(m => L.push('- ✎ ' + m.text));
    }
    if (t.photos.length) { L.push(''); L.push('## Fotók'); L.push(''); t.photos.forEach(p => L.push('- ' + p.sym + ' ' + p.label + ': ' + p.n)); }
    if (t.rooms.length) { L.push(''); L.push('## Helyiségek'); L.push(''); t.rooms.forEach(r => L.push('- ' + r.name + ': ' + (r.est ? '≈ ' : '') + fmt(r.areaM2) + ' m²' + (r.wants ? ' — ' + r.wants.map(w => w.label + ' ×' + w.qty).join(', ') : ''))); }
    return L.join('\n') + '\n';
  }

  // a package or a bare survey file → {sketch, plan}
  function input(o) {
    if (o && o.kind === 'vrg-sketch' && o.sketch && o.sketch.kind === FK.SKETCH_KIND) return { sketch: o.sketch, plan: planFromPackage(o) };
    if (o && o.kind === FK.SKETCH_KIND) return { sketch: o, plan: null };
    throw new Error('Ismeretlen fájl (kind: ' + (o && o.kind) + ') — vrg-sketch vagy vrg-vazlat kell.');
  }

  return { KIND, V, RULES_KIND, GROUPS, parseRules, planFromPackage, planRaw, build, markdown, input, fmt, m1, stemOf };
});

<script>
// Sketcher/lib/report.js — the Felmérési jegyzőkönyv (WP M50, F5): one printable Hungarian document of a field survey.
//
// The Desktop Sketcher page builds it from the open survey at run time (nothing of it is stored or committed: the
// client's data stays in the user's file); the browser's print dialog makes the PDF. It is the takeoff
// (Sketcher/lib/takeoff.js: scope, work items, decisions, questions, notes, rooms with their wants) plus what only the
// page has: the photos it was given (object URLs, never saved), the drawing and the site as SVG, the client's contact.
//
// Style: Varler Papír (shared/varler-doc/varler-doc.css, docs/research/2026-11-06_varler-document-style.md): warm ink,
// no area darker than the wash, one red accent (here: ⚑ open / Tisztázandó), hanging section numerals, hairline tables,
// Bahnschrift for figures. Unlike the Költségvetési Tervezet the length is not known in advance, so the browser
// paginates (A4, 14 mm margins, no fixed footers to overlap: D-78), sections and photos never split.

    for (let i = 0; i < poly.length; i++) d = Math.min(d, segDist(p, poly[i], poly[(i + 1) % poly.length]));
    return d;
  }

  function extent(pts, a) {

    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const q of pts) { const x = q[0] * c + q[1] * s, y = -q[0] * s + q[1] * c; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { a, x0, x1, y0, y1, area: (x1 - x0) * (y1 - y0) };

  /**
   * The smallest-area box over [pts]: centre, long side w, short side d and the long side's direction (degrees
   * clockwise from east, 0..180). Searched in 0.5° steps, then refined in 0.05° steps.
   */
  function obox(pts) {

  }

  /** The plan's rooms ({name, poly: [[x, y] m]}) placed in the local frame of (lat0, lon0). */
  function placed(rooms, place, lat0, lon0) {
    const pb = obox([].concat(...rooms.map(r => r.poly)));
    if (!pb || !place) return [];
    const at = local(lat0, lon0, place.lat, place.lon);
    return rooms.map(r => ({ name: r.name, poly: r.poly.map(p => { const q = turn([p[0] - pb.cx, p[1] - pb.cy], place.rot); return [q[0] + at[0], q[1] + at[1]]; }) }));
  }
  /** The same, as [lon, lat] rings for the map. */
  function placedLngLat(rooms, place) {

    return placed(rooms, place, place.lat, place.lon).map(r => ({ name: r.name, ring: r.poly.map(p => { const ll = toLatLon(place.lat, place.lon, p[0], p[1]); return [ll[1], ll[0]]; }) }));
  }

  const ref = outline => [outline.reduce((a, p) => a + p[0], 0) / outline.length, outline.reduce((a, p) => a + p[1], 0) / outline.length];

  function samples(a, b, step) {
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step)), out = [];
    for (let i = 0; i <= n; i++) out.push([a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n]);

  }
  /** Sum of how far the placed walls stick out of the outline (a fit score: lower is better). */
  function stickScore(rooms, poly) {
    let s = 0;
    for (const r of rooms) for (let i = 0; i < r.poly.length; i++) for (const q of samples(r.poly[i], r.poly[(i + 1) % r.poly.length], 0.25)) s += outside(q, poly);
    return s;
  }

   * The first placement: the plan turned to the building's walls (4 candidates, a quarter turn apart) and centred on
   * the building's box; the candidate whose walls stick out least wins, a smaller turn on a tie.
   */
  function autoFit(rooms, outline) {
    if (!rooms.length || !outline || outline.length < 3) return null;
    const [lat0, lon0] = ref(outline), poly = outline.map(p => local(lat0, lon0, p[0], p[1]));
    const fb = obox(poly), pb = obox([].concat(...rooms.map(r => r.poly)));
    if (!fb || !pb) return null;
    const at = toLatLon(lat0, lon0, fb.cx, fb.cy);

    for (let k = 0; k < 4; k++) {
      const rot = round(norm180(fb.axis - pb.axis + k * 90), 100);

      const score = round(stickScore(placed(rooms, place, lat0, lon0), poly), 1000);

    }

  }

  }

  const m1 = v => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
  const ADJ = Object.fromEntries(DIRS);
  /** The report in the field's words (the phone shows the same lines). */
  function reportLines(r) {

    const out = [];

      r.verdict === 'elforgatva' ? 'A vázlat falai ' + m1(Math.abs(r.turn)) + '°-kal elfordulnak az épületéhez képest.' :
      r.verdict === 'eltolva' ? 'A vázlat a körvonalon belül van, de nem középen.' : 'A vázlat ' + r.walls.length + ' fala kilóg a körvonalból.');

    r.walls.slice(0, 8).forEach(w => out.push('· ' + (w.name || 'Helyiség') + ', ' + ADJ[w.dir] + ' fal: ' + m1(w.out) + ' m-rel kilóg'));
    if (r.walls.length > 8) out.push('· … és még ' + (r.walls.length - 8));

  }

  /** The building's oriented size from a lat/lon outline (= SiteMath.footprint on the phone). */
  function footprint(outline) {

    for (let i = 0; i < poly.length; i++) { const q = poly[(i + 1) % poly.length]; a += poly[i][0] * q[1] - q[0] * poly[i][1]; }
    return { w: round(b.w, 100), d: round(b.d, 100), area: round(Math.abs(a) / 2, 10), axis: round(b.axis, 10) };
  }

  /** The solved plan's rooms in metres from the Planner package's floors (mm) or a sketch's solved rooms. */
  const roomsFromMm = list => (list || []).filter(r => r.poly && r.poly.length >= 3).map(r => ({ name: r.name || '', poly: r.poly.map(p => [p[0] / 1000, p[1] / 1000]) }));

});

    const fp = si.footprint;
    let size = '';
    if (fl.length) { const b = bbox([].concat(...fl.map(f => f.poly || []))); size = f1((b[2] - b[0]) / 1000) + ' × ' + f1((b[3] - b[1]) / 1000) + ' m'; }
    if (fp || size) h += '<div class="card"><div class="kv">' + (fp ? '<b>Épület (térkép)</b><span>' + f1(fp.w) + ' × ' + f1(fp.d) + ' m · ' + f1(fp.area) + ' m²</span>' : '') + (size ? '<b>Terv teljes mérete</b><span>' + size + '</span>' : '') + '</div></div>';
    // F5 (WP M50, D-79): the client's contact; the address is the site's. Personal: it stays in this file and the report
    const cl = S.client || {};
    h += '<h3>👤 Ügyfél</h3><div class="card" id="client"><div class="kv"><b>Név</b><input type="text" data-client="name" value="' + esc(cl.name) + '">' +
      '<b>Telefon</b><input type="text" data-client="phone" value="' + esc(cl.phone) + '"><b>E-mail</b><input type="text" data-client="email" value="' + esc(cl.email) + '">' +
      '<b></b><label class="small"><input type="checkbox" data-client="keep"' + (cl.keep ? ' checked' : '') + '> a telefon kiadott csomagjában is marad</label></div>' +
      '<div class="small muted">Személyes adat: a felmérés fájljában és a jegyzőkönyvben van; variáns-kérésbe soha nem kerül, Gitbe sem.</div></div>';
    h += sitePlaceCard();
    const q = si.lat != null && si.lon != null && si.lat !== '' ? '#18/' + si.lat + '/' + si.lon + '/0/50' : '';
    const url = 'http://localhost:8802/vrg-terkep.html?embed=1' + (q ? q : '&q=' + encodeURIComponent(si.address || ''));
    return h + '<p class="small muted">A térképhez a START <b>H</b> szervere (VRG Térkép) kell, hogy fusson. A <b>🗺 Szerkesztés a térképen</b> a körvonalat és a vázlatot a lenti térképre teszi; ott ✓ Kész hozza vissza.</p><iframe class="map" id="mapframe" src="' + esc(url) + '" title="VRG Térkép"></iframe>';
  }

  // ---- F1: the sketch on the building (Map/lib/site-math.js, the same maths as the phone and the map page) --------
  const SM = window.VrgSiteMath;
  const siteRooms = () => SM ? SM.roomsFromMm(floors()) : [];
  function sitePlaceCard() {
    const si = S.site || {}, out = si.outline || [], rooms = siteRooms();
    let h = '<h3>A vázlat az épületen</h3><div class="card" id="siteplace">';
    if (!SM) return h + '<p class="small muted">(a helyszín számítása hiányzik a lapból)</p></div>';
    const acts = '<div class="acts" style="margin-top:6px"><button class="btn sm" data-act="sitemap">🗺 Szerkesztés a térképen</button>' +
      (out.length >= 3 && rooms.length ? '<button class="btn sm" data-act="sitefit">⤢ Illesztés</button>' : '') +
      (si.place ? '<button class="btn sm" data-act="siteclear">✕ Elhelyezés</button>' : '') + '</div>';
    if (out.length < 3) return h + '<p class="small muted">Még nincs körvonal: a telefon Helyszínén (OSM vagy rajz a térképen), vagy itt a térképen rajzolva.</p>' + acts + '</div>';
    if (!rooms.length) return h + '<p class="small muted">A csomagban nincs megoldott terv (a telefon Rendezés → csomag): a vázlat nem helyezhető el.</p>' + acts + '</div>';
    const rep = si.place ? SM.report(rooms, out, si.place) : null;
    h += sitePlaceSvg(out, rooms, si.place, rep);
    h += rep ? SM.reportLines(rep).map((l, i) => '<div class="' + (i === 0 ? (rep.verdict === 'rendben' ? 'ok' : 'bad') : 'small') + '">' + esc(l) + '</div>').join('')
      : '<p class="small muted">Még nincs elhelyezve: ⤢ Illesztés, vagy a térképen.</p>';
    if (si.place) h += '<div class="small muted">Elforgatás ' + f1(si.place.rot) + '°' + (si.place.auto ? ' (automatikus)' : ' (kézzel igazítva)') + '</div>';
    return h + acts + '</div>';
  }
  function sitePlaceSvg(out, rooms, place, rep) {
    const lat0 = out.reduce((a, p) => a + p[0], 0) / out.length, lon0 = out.reduce((a, p) => a + p[1], 0) / out.length;
    const poly = out.map(p => SM.local(lat0, lon0, p[0], p[1])), pr = place ? SM.placed(rooms, place, lat0, lon0) : [];
    const pts = poly.concat(...pr.map(r => r.poly)); let b = bbox(pts); const ext = Math.max(b[2] - b[0], b[3] - b[1], 1), pad = ext * 0.1;
    b = [b[0] - pad, b[1] - pad, b[2] + pad, b[3] + pad];
    const P = p => p.map(q => q[0].toFixed(2) + ',' + q[1].toFixed(2)).join(' '), sw = ext / 150;
    let svg = '<svg class="siteplace" viewBox="' + b[0] + ' ' + b[1] + ' ' + (b[2] - b[0]) + ' ' + (b[3] - b[1]) + '" xmlns="http://www.w3.org/2000/svg">' +
      '<polygon class="so" points="' + P(poly) + '" stroke-width="' + sw * 2 + '"/>';
    pr.forEach(r => { svg += '<polygon class="sp" points="' + P(r.poly) + '" stroke-width="' + sw + '"/>'; });
    (rep ? rep.walls : []).forEach(w => { const r = pr[w.room].poly, a = r[w.edge], c = r[(w.edge + 1) % r.length];
      svg += '<line class="sb" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + c[0] + '" y2="' + c[1] + '" stroke-width="' + sw * 3 + '"/>'; });
    return svg + '<text x="' + (b[0] + pad * 0.3) + '" y="' + (b[1] + pad * 0.8) + '" font-size="' + ext * 0.05 + '">É ↑</text></svg>';
  }
  function siteApply(r) {
    if (!r || r.kind !== 'vrg-site-result' || r.cancelled || !S) return;
    commit(() => {
      const si = Object.assign({ address: '', source: 'kezi' }, S.site), now = stamp();
      if (Array.isArray(r.center) && r.center.length === 2) { si.lat = r.center[0]; si.lon = r.center[1]; si.source = 'terkep'; }
      if (Array.isArray(r.outline)) {
        if (r.outline.length >= 3) {
          const fp = SM.footprint(r.outline), src = ['osm', 'rajz', 'muhold'].includes(r.outlineSrc) ? r.outlineSrc : 'rajz';
          si.outline = r.outline; si.footprint = { w: fp.w, d: fp.d, area: fp.area, angle: Math.round((fp.axis % 90) * 10) / 10, src, at: now };
          if (si.lat == null) { si.lat = r.outline.reduce((a, p) => a + p[0], 0) / r.outline.length; si.lon = r.outline.reduce((a, p) => a + p[1], 0) / r.outline.length; si.source = 'terkep'; }
        } else { delete si.outline; delete si.footprint; }
      }
      if (r.place) si.place = { lat: r.place.lat, lon: r.place.lon, rot: r.place.rot, auto: !!r.place.auto, at: now }; else if (r.place === null) delete si.place;
      S.site = si;
    });
    flash('A térkép változásai átvéve (Mentés: a frissített fájl).', 'ok'); render();
  }
  function siteSend() {
    const f = $('mapframe'); if (!f || !f.contentWindow) { flash('Nincs térkép a lapon.', 'warn'); render(); return; }
    const si = S.site || {};
    f.contentWindow.postMessage({ kind: 'vrg-site', v: 1, id: S.id || 'asztal', name: S.name || '', lat: typeof si.lat === 'number' ? si.lat : undefined,
      lon: typeof si.lon === 'number' ? si.lon : undefined, outline: si.outline || [], outlineSrc: si.footprint && si.footprint.src || '', place: si.place || null, rooms: siteRooms() }, 'http://localhost:8802');
  }
  window.addEventListener('message', e => {
    const f = $('mapframe'); if (!f || e.source !== f.contentWindow || !e.data) return;
    if (e.data.kind === 'vrg-site-result') siteApply(e.data);
  });

  function vNyitott(d) {
    if (!d.open.length) return '<div class="empty">Nincs nyitott szál — minden rendben.</div>';
    return BASE.fronts.map(f => { const l = d.open.filter(o => o.front === f.id); if (!l.length) return '';
      return '<h3 style="color:' + esc(f.color) + '">' + esc(f.sym) + ' ' + esc(f.label) + ' (' + l.length + ')</h3>' + l.map(leHtml).join(''); }).join('');
  }

  // F4 (WP M49): what the variant tunes in the phone's drawing tools (sketch-core DrawTune.describe, same words)
  function drawLine(v) {
    const d = v.draw; if (!d) return '';
    const n = x => String(x).replace('.', ','), out = [];
    if (d.snapAngle > 0) out.push('Vonal: ' + d.snapAngle + '°-os lépés');
    if (d.snapGrid > 0) out.push('Rács: ' + n(d.snapGrid) + ' m');
    if (d.defaultRoom) out.push('Koppintás = ' + n(d.defaultRoom.w) + ' × ' + n(d.defaultRoom.d) + ' m szoba');
    if (d.measureFirst) out.push('Új szoba: rögtön a méret');
    if (d.pointSnap === 'free') out.push('Pont: nem ugrik a falra');
    return out.length ? '<div class="small draw" data-draw="' + esc(v.id) + '">✎ ' + out.map(esc).join(' · ') + '</div>' : '';
  }
  function vVariansok() {
    return '<div class="grid">' + VARIANTS.map(v => '<div class="card" style="border-left:3px solid ' + esc(v.color) + '"><div style="font-size:18px;color:' + esc(v.color) + '">' + esc(v.sym) + ' <b>' + esc(v.name) + '</b>' +
      (S.variant === v.id ? ' <span class="tag">aktív</span>' : '') + '</div><div class="small">' + esc(v.premise) + '</div><div class="small muted">' + (v.topics || []).map(esc).join(' · ') + '</div>' + drawLine(v) +
      '<div class="acts" style="margin-top:6px"><button class="btn sm" data-act="vpick" data-id="' + esc(v.id) + '">Használat ebben a felmérésben</button></div></div>').join('') + '</div>' +
      '<h3>Új variáns</h3><div class="card"><p class="small">Új variáns kérése: kodszó <code>GO VARIANT</code>, a menet a <code>Sketcher/variants/PROTOCOL.md</code>-ben van. Írd le egy-három mondatban, milyen munkához kell:</p>' +
      '<textarea id="vprem" placeholder="pl. társasházi felszálló csere, lépcsőházi mérőhelyek">' + esc(starter) + '</textarea><div class="acts" style="margin-top:6px"><button class="btn" data-act="vcopy">Másolás</button><span class="small muted" id="vprev">GO VARIANT — ' + esc(starter || '…') + '</span></div></div>';
  }

  // ---- rendering -------------------------------------------------------------------------------------------------
  function renderHeader() {
    const h = $('hinfo'); if (!h) return;
    if (!S) { h.innerHTML = '<span class="muted">Nincs megnyitott felmérés</span>'; return; }
    const v = VARIANTS.find(x => x.id === S.variant);
    h.innerHTML = '<span class="nm">' + esc(S.name || fileName || 'Névtelen felmérés') + '</span><span class="ad">' + esc(S.site && S.site.address || '') + '</span>' +
      (S.variant ? '<button class="btn sm ' + (S.variantOn ? 'on' : 'dim') + '" id="vtoggle" data-act="vtoggle" style="--c:' + esc(v ? v.color : '#93d3e6') + '" title="Variáns: ' + esc(v ? v.name : S.variant) + '">◐ ' + esc(v ? v.name : S.variant) + '</button>' : '');
  }
  function railItem(f, badge, isNew) {
    return '<button class="rb' + (cur === f.id ? ' act' : '') + '" data-act="front" data-front="' + f.id + '" title="' + esc(f.label) + '" style="--c:' + esc(f.color) + '"><span class="sym">' + esc(f.sym) + '</span><span class="cap">' + esc(f.label) + '</span>' +
      (badge ? '<span class="badge' + (isNew ? ' new' : '') + '" data-badge="' + f.id + '">' + badge + '</span>' : '') + '</button>';
  }
  function badges(d) {
    if (!d) return {};
    const oq = d.qs.filter(x => !x.done);
    return { kerdes: [oq.length, oq.some(x => x.fresh)], nyitott: [d.open.length, false], kamera: [d.shots.filter(x => !x.done).length, false] };
  }
  function renderRail() {
    const r = $('rail'); if (!r) return;
    const b = S ? badges(derived()) : {}, one = f => railItem(f, b[f.id] && b[f.id][0], b[f.id] && b[f.id][1]);
    r.innerHTML = one(EXTRA.attekintes) + '<div class="sep"></div>' + BASE.fronts.map(one).join('') + '<div class="sep"></div>' + one(EXTRA.variansok);
  }
  const VIEWS = { attekintes: vAttekintes, vazlat: vVazlat, jegyzet: vJegyzet, munkakor: vMunkakor, kerdes: vKerdes, kamera: vKamera, helyszin: vHelyszin, nyitott: vNyitott, variansok: vVariansok };

  function render() {
    renderHeader(); renderRail();
    const m = $('main'); if (!m) return;
    if (!S) { m.innerHTML = '<div class="empty">Nyiss meg egy felmérést (Megnyitás vagy húzd ide a .vsketch.json fájlt).</div>'; return; }
    const f = frontOf(cur) || EXTRA.attekintes;
    let body;
    try {
      const d = derived();
      if (cur === 'kerdes') {                        // first appearance of each shadow question
        const un = FK.unseen(d.k, S, d.f);
        if (un.length) { const t = stamp(); S.seen = Object.assign({}, S.seen || {}); un.forEach(id => { S.seen[id] = t; }); persist(); }
      }
      body = VIEWS[cur](d);
    } catch (e) { body = '<div class="msg err">Hiba a nézet építésekor: ' + esc(e.message) + '</div>'; }
    m.innerHTML = '<h2 style="--c:' + esc(f.color) + '"><span class="sym">' + esc(f.sym) + '</span>' + esc(f.label) + '</h2>' +
      (msg ? '<div class="msg ' + msg.cls + '">' + esc(msg.text) + '</div>' : '') + '<div id="view" data-front="' + cur + '">' + body + '</div>';
  }
  function front(id) { if (!VIEWS[id]) return false; cur = id; render(); return true; }

  // ---- actions ---------------------------------------------------------------------------------------------------
  const setAnswer = (q, a) => { S.answers = Object.assign({}, S.answers || {}); if (a) S.answers[q] = a; else delete S.answers[q]; };
  const answerOf = q => (S.answers || {})[q];
  function chooseOption(qid, oid) {
    const k = kit(), q = k.questions.find(x => x.id === qid); if (!q) return;
    const old = answerOf(qid), cur0 = old && old.state === 'answered' ? old.options.slice() : [];
    const on = cur0.includes(oid), opts = q.multi ? (on ? cur0.filter(x => x !== oid) : cur0.concat([oid])) : (on ? [] : [oid]);
    const now = stamp(), text = old ? old.text || '' : '';
    if (!opts.length && !text) setAnswer(qid, null); else setAnswer(qid, { options: opts, text, at: now, state: 'answered' });
    if (!on) { const o = q.options.find(x => x.id === oid); if (o && o.sets) S = FK.apply(k, o.sets, S, now); }
  }
  function onClick(ev) {
    const t = ev.target.closest('[data-act]'); if (!t || !S && t.dataset.act !== 'save') return;
    const a = t.dataset.act, id = t.dataset.id, q = t.dataset.q, k = () => kit();
    switch (a) {
      case 'front': front(t.dataset.front); break;
      case 'sitemap': siteSend(); break;
      case 'sitefit': { const p = SM.autoFit(siteRooms(), S.site.outline); if (p) commit(() => { S.site = Object.assign({}, S.site, { place: Object.assign(p, { at: stamp() }) }); }); break; }
      case 'siteclear': commit(() => { const si = Object.assign({}, S.site); delete si.place; S.site = si; }); break;
      case 'jump': front(t.dataset.front); break;
      case 'tkexport': { const r = exportTakeoff(); if (r) { flash('Takeoff: ' + stem() + '.takeoff.json + .md (' + r.takeoff.counts.items + ' tétel)', 'ok'); render(); } break; }
      case 'report': { if (S) { openReport(); render(); } break; }
      case 'save': { if (S) { const txt = save(); flash('Mentve: ' + stem() + '.vsketch.json (' + txt.length + ' bájt)', 'ok'); render(); } break; }
      case 'vtoggle': commit(s => { S.variantOn = !S.variantOn; }); break;
      case 'vpick': commit(() => { S.variant = id; S.variantOn = true; }); break;
      case 'vcopy': copy('GO VARIANT — ' + starter); break;
      case 'nchip': syncNote(); note.chips.has(id) ? note.chips.delete(id) : note.chips.add(id); render(); break;
      case 'nadd': addNote(); break;
      case 'eopen': commit(() => { S.entries = S.entries.map(e => e.id === id ? Object.assign({}, e, { open: !e.open }) : e); }); break;
      case 'sugok': { const g = FK.suggestions(k(), S).find(x => x.id === id); if (g) commit(() => { S = FK.apply(k(), g.effect, S, stamp()); }); break; }
      case 'sugno': commit(() => { S.dismissed = (S.dismissed || []).concat([id]); }); break;
      case 'stoggle': commit(() => { if (S.scope && S.scope[id] > 0) S = FK.trimWant(S, id, 0); else { S.scope = Object.assign({}, S.scope); S.scope[id] = 1; } }); break;
      case 'sinc': commit(() => { S = FK.addWant(S, id, wantRoom || null, +1); }); break;   // F4: into the room chosen under Hová
      case 'sdec': commit(() => { const r = wantRoom || null, n = FK.addWant(S, id, r, -1); S = n === S && !r ? FK.trimWant(S, id, FK.wantTotal(S, id) - 1) : n; }); break;
      case 'wmove': commit(() => { const from = t.dataset.from || null; S = FK.moveWant(S, id, from, from ? null : wantRoom || null, 1); }); break;
      case 'qopt': commit(() => chooseOption(q, t.dataset.o)); break;
      case 'qlater': case 'qskip': commit(() => { const old = answerOf(q); setAnswer(q, { options: old ? old.options : [], text: old ? old.text || '' : '', at: stamp(), state: a === 'qlater' ? 'later' : 'skip' }); }); break;
      case 'qclear': commit(() => setAnswer(q, null)); break;
      case 'qunskip': commit(() => { S.answers = Object.assign({}, S.answers); Object.keys(S.answers).forEach(x => { if (S.answers[x].state === 'skip') delete S.answers[x]; }); }); break;
    }
  }
  function syncNote() { const t = $('ntext'); if (t) note.text = t.value; const o = $('nopen'); if (o) note.open = o.checked; const r = $('nroom'); if (r) note.room = r.value; }
  function addNote() {
    syncNote();
    const text = note.text.trim(), chips = Array.from(note.chips); if (!text && !chips.length) return;
    const k = kit();
    commit(() => {
      const e = { id: nextId('E'), at: stamp(), text, chips };
      if (note.room) e.room = note.room;
      if (note.open || chips.some(c => (k.chips.find(x => x.id === c) || {}).open)) e.open = true;
      S.entries = (S.entries || []).concat([e]);
      chips.forEach(c => { const ch = k.chips.find(x => x.id === c); if (ch && ch.sets) S = FK.apply(k, ch.sets, S, e.at); });
    });
    note = { text: '', chips: new Set(), open: false, room: note.room }; render();
  }
  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'fopen') { openFiles(t.files); t.value = ''; return; }
    if (t.id === 'fphotos') { if (S) attach(t.files); t.value = ''; return; }
    if (t.id === 'wroom') { wantRoom = t.value; render(); return; }
    if (!S) return;
    if (t.dataset.qtext) {                           // store silently, so a following click is not eaten by a re-render
      const q = t.dataset.qtext, old = answerOf(q), text = t.value;
      commit(() => { if (old && old.state === 'answered') setAnswer(q, Object.assign({}, old, { text, at: stamp() })); else if (text.trim()) setAnswer(q, { options: old ? old.options : [], text, at: stamp(), state: 'answered' }); }, false);
    } else if (t.dataset.site) {
      commit(() => {
        const si = Object.assign({ address: '', source: 'kezi' }, S.site), key = t.dataset.site;
        if (key === 'address') si.address = t.value;
        else if (t.value.trim() === '') delete si[key]; else if (!isNaN(parseFloat(t.value.replace(',', '.')))) si[key] = parseFloat(t.value.replace(',', '.'));
        S.site = si;
      }, false);
      if (cur === 'helyszin') render();
    } else if (t.dataset.client) {                    // F5 (WP M50, D-79): the client's contact, personal (sketch-core ClientInfo)
      commit(() => {
        const c = Object.assign({ name: '', phone: '', email: '' }, S.client), key = t.dataset.client;
        if (key === 'keep') c.keep = t.checked; else c[key] = t.value.trim();
        if (!c.keep) delete c.keep;
        if (!c.name && !c.phone && !c.email) delete S.client; else S.client = c;
      }, false);
      if (cur === 'helyszin') render();
    } else if (t.id === 'ntext' || t.id === 'nopen' || t.id === 'nroom') syncNote();
  }
  function onInput(ev) {
    if (ev.target.id === 'ntext') note.text = ev.target.value;
    if (ev.target.id === 'vprem') { starter = ev.target.value; const p = $('vprev'); if (p) p.textContent = 'GO VARIANT — ' + (starter || '…'); }
  }
  function copy(text) {
    const done = () => { flash('Kimásolva: ' + text, 'ok'); render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e) { /* nothing more to try */ } t.remove(); done();
  }

  // ---- start -----------------------------------------------------------------------------------------------------
  function start() {
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    let depth = 0; const drop = $('drop');
    window.addEventListener('dragenter', e => { e.preventDefault(); depth++; drop.hidden = false; });
    window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) drop.hidden = true; });
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => { e.preventDefault(); depth = 0; drop.hidden = true; if (e.dataTransfer) openFiles(e.dataTransfer.files); });
    let last = null;
    try { last = localStorage.getItem(LAST_KEY); } catch (e) { /* no storage */ }
    if (last) { try { load(JSON.parse(last), 'utolsó'); return; } catch (e) { /* stale: ignore */ } }
    render();
  }
  window.__sketcher = { load, state: () => S, save, front, output, render, siteApply, takeoff, exportTakeoff, reportHtml, openReport };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
