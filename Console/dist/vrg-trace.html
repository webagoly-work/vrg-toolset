/* Varler Console frame. Charcoal chrome (top bar, page bar, approval dialogs) around slate pages;
   Home is an empty charcoal canvas. Touch targets come from --target, set larger in glove mode. */
:root {
  --target: 48px;
  --target-primary: 56px;
  --stroke: 1px;
  --sheet: var(--charcoal);
  --sheet-row: var(--charcoal-800);
  --sheet-line: var(--charcoal-600);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
:root[data-glove] { --target: 64px; --target-primary: 72px; }
:root[data-theme="sun"] {
  --stroke: 2px;
  --sheet: var(--panel);
  --sheet-row: var(--ground);
  --sheet-line: var(--line);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--charcoal-900);
  color: var(--fg);
  font: 400 15px/22px var(--f-body);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
[data-theme="sun"] body { font-weight: 500; }
button, input { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }

.chrome { color: var(--fg); }
.app { height: 100%; display: flex; flex-direction: column; }

/* matte metal: flat fill, one sheen edge, no gloss */
.bar, .foot {
  flex: none;
  background: var(--charcoal);
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.bar {
  border-bottom: 1px solid var(--charcoal-950);
  box-shadow: inset 0 1px 0 var(--charcoal-sheen);
  padding-top: max(4px, env(safe-area-inset-top, 0px));
  padding-bottom: var(--space-2);
}
.bar-row { display: flex; align-items: center; gap: var(--space-2); min-height: var(--target); }
.mark { font: 600 18px/1 var(--f-display); letter-spacing: .14em; color: var(--charcoal-sheen); text-transform: uppercase; white-space: nowrap; }
.mark b { color: var(--fg); font-weight: 600; }
.ptitle {
  flex: 1; min-width: 0; padding-left: var(--space-2); display: flex; align-items: baseline; gap: var(--space-2);
  font: 500 17px/20px var(--f-display); letter-spacing: .12em; text-transform: uppercase;
  white-space: nowrap;
}
.ptitle small { flex: none; font: 12px var(--f-mono); letter-spacing: 0; color: var(--fg); }
.ptname { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .mark-b { display: none; } }
@media (max-width: 430px) { .mark { display: none; } .ptitle { padding-left: 0; } }

.presets { display: flex; gap: var(--space-2); }
.preset, .preset-add {
  min-height: var(--target); min-width: var(--target);
  background: var(--charcoal-800); border: 1px solid var(--charcoal-600); border-radius: var(--radius-1);
  color: var(--fg); cursor: pointer;
  font: 500 15px/18px var(--f-display); letter-spacing: .08em; text-transform: uppercase;
}
.preset { flex: 1 1 0; min-width: 0; padding: 0 var(--space-1); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preset-add { flex: none; display: grid; place-items: center; }
.preset[aria-pressed="true"] { background: var(--charcoal-950); border-color: var(--cyan); color: var(--cyan); box-shadow: inset 0 -4px 0 var(--cyan); }


.foot {
  display: flex; align-items: center; gap: var(--space-1);
  border-top: 1px solid var(--charcoal-950);
  box-shadow: inset 0 1px 0 var(--charcoal-sheen);
  padding-top: var(--space-1);
  padding-bottom: max(4px, env(safe-area-inset-bottom, 0px));
}
.dots { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
.dots::-webkit-scrollbar { display: none; }
.dot { flex: none; width: var(--target); height: var(--target); display: grid; place-items: center; padding: 0; background: none; border: 0; cursor: pointer; }
.dot i { display: block; width: 16px; height: 3px; background: var(--charcoal-sheen); transition: width .2s; }
.dot[aria-current="true"] i { background: var(--cyan); width: 28px; height: 5px; }

.ico {
  flex: none; width: var(--target); height: var(--target); display: grid; place-items: center; padding: 0;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-1); color: var(--fg); cursor: pointer;
}
.ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.ico:hover:not(:disabled) { background: var(--sheet-row); }
.ico:disabled { opacity: .4; cursor: default; }

:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* carousel: two slots at most, the current page and the one sliding in */
.view { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: pan-y; }
.page {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: var(--d-pad) var(--gutter-r) var(--d-pad) var(--gutter-l);
  background: var(--ground);
}
.page.anim { transition: transform .28s cubic-bezier(.2, .7, .2, 1); }
.page.home { background: var(--charcoal-900); }

.page { --d-pad: 20px; --d-gap: 20px; --d-title: 28px; --d-text: 15px; --d-line: 22px; }
.page[data-density="glance"] { --d-pad: 28px; --d-gap: 28px; --d-title: 36px; --d-text: 18px; --d-line: 26px; }
.page[data-density="dense"] { --d-pad: 12px; --d-gap: 12px; --d-title: 22px; --d-text: 13px; --d-line: 18px; }

/* empty state */
.empty { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--d-gap); }
.empty h2 { font: 600 var(--d-title)/1.1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
